 [build-system]
 requires = ["setuptools>=61", "wheel"]
 build-backend = "setuptools.build_meta"

[project]
name = "pulse-sdk"
version = "0.6.0"
description = "Idiomatic, type-safe Python client for the Pulse REST API"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name="Researchwise AI", email="dev@researchwiseai.com" }
]
maintainers = [
    { name="Researchwise AI", email="dev@researchwiseai.com" }
]
requires-python = ">=3.8"
keywords = [
    "ai", "nlp", "text-analysis", "machine-learning", "api-client",
    "sentiment-analysis", "embeddings", "clustering", "summarization"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "httpx",
    "pydantic>=2.0",
    "numpy",
    "pandas",
    "scikit-learn>=1.4",
    "diskcache",
    "tqdm",
    "typing-extensions",
    "matplotlib",
    "textblob",
    "seaborn"
]

[project.urls]
Homepage = "https://github.com/researchwiseai/pulse-py#readme"
Repository = "https://github.com/researchwiseai/pulse-py"
Documentation = "https://researchwiseai.github.io/pulse-py/"
Changelog = "https://github.com/researchwiseai/pulse-py/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/researchwiseai/pulse-py/issues"
"Security Policy" = "https://github.com/researchwiseai/pulse-py/blob/main/SECURITY.md"
Funding = "https://github.com/sponsors/researchwiseai"

[tool.setuptools.packages.find]
# Limit package discovery to the library code and avoid picking up
# MkDocs build output in `site/` as a top-level package.
include = ["pulse*"]
exclude = [
    "tests*",
    "site*",
    "docs*",
    "build*",
    "examples*",
    "venv*",
    ".venv*",
]

 [tool.black]
 line-length = 88
 target-version = ['py38']
 include = '\.pyi?$'
 exclude = '''
 /(
   \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
 )/
 '''

 [tool.ruff]
 line-length = 88
 target-version = "py38"
 extend-select = ["E501"]

 [tool.pytest.ini_options]
 minversion = "6.0"
addopts = "-ra -q --cov=pulse --cov-report=html --cov-report=json --cov-report=term-missing --cov-fail-under=90"
markers = ["vcr: mark the test to use pytest-vcr for HTTP request recording"]
 testpaths = ["tests"]

[tool.coverage.run]
source = ["pulse"]
relative_files = true
omit = [
    "tests/*",
    "examples/*",
    "docs/*",
    "site/*",
    "build/*",
    "pulse/__pycache__/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "venv/*",
    ".venv/*"
]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.coverage.html]
directory = "htmlcov"
title = "Pulse SDK Coverage Report"

[tool.coverage.json]
output = "coverage.json"

[tool.bandit]
exclude_dirs = ["tests", "examples", "docs", "site", "build", ".venv", "venv", ".ipynb_checkpoints"]
# Skip specific security checks that are false positives for this codebase:
# B101: assert_used - used for runtime validation in client code
# B110: try_except_pass - used for cleanup operations
# B105: hardcoded_password_string - these are public OAuth endpoints
# B311: random - used for sampling, not cryptographic purposes
# B403: pickle import - used for cache key generation only
# B601: shell=True (may be needed for subprocess)
skips = ["B101", "B110", "B105", "B311", "B403", "B601"]
severity = "medium"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-mock",
    "pytest-vcr",
    "pytest-cov>=4.0.0",
    "black==25.1.0",
    "nbqa",
    "ruff",
    "pre-commit>=2.9.2",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.6.0",
]
