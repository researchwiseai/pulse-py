      Many Adventures of Winnie the Pooh                                      Fantasyland                          Fast
      Pass                                                              Honey For
      Pooh                                                                                                                                                                                                      Fast
      Pass","Brilliant is the only word i can use to describe this place and you would
      probably need to create a new word to describe my kids feelings. We went first
      thing on a thursday and caught the shuttle bus over from the Hollywood Hotel
      which takes approx 5 mins. We walked straight in as there was hardly a que and
      stayed until the fireworks at 7.30. Being a thursday we hardly had to wait for
      any rides, got front row for the parade, were able to get into the shows easily
      and got a seat when we ate. We got through about 70% of the park on the first
      day with a 5 and 10 year old. We returned on friday and checked out what we
      hadn''t seen the previous day and returned to the kids favourite rides. It was
      busier but still comfortable enough that we stayed until about 5. We were totally
      amazed by the value (of admission,food and merchandise), the quality, atmosphere
      and practically everything. Highly recommended","the good: friendly, English
      speaking staff, not so tiring to go around, many food restos and toilets, some
      fans to dissipate the heat  the not so good: so hot and humid this time of the
      year, and when you start lining up in the heat, its...More","Visit early when
      the park opens and get to the popular rides first. We managed 2 3 goes on each
      ride. It''s smaller than other Disneys but easy to get around and perfect for
      my kids (9 & 11). We left after the parade at 3, went back to the Disney hotel
      for a few hours then went back for the light show at 8pm and fireworks at 9   both
      are amazing and highly recommended!","It is small but nice generally.   There
      are many programmes and shows planned with schedule.   The firework is amazing.","It
      was the best 2 days in Hong Kong . Very nice ambiance lovely interiors . The
      fireworks was spectacular . Very good restaurants and the games were so good
      . it took me back to my child hood we all enjoyed it so much . Very easy communications
      on the map to follow with clear directions . The performance was very good .
      Shops to buy souvenirs . Over all experience was great .","Not normally a theme
      park fan but really enjoyed the visit here. Really easy to get to the park on
      the MTR with the last bit on a specially themed Disney train complete with Mickey
      Mouse shaped windows. Plenty to see and do. Souvenirs are relatively expensive
      but pretty normal for a theme park. Huge selection of food. We enjoyed staying
      for the light parade and fireworks display at night."," Too experience to visit
      ,for over $600 Hk , every things so crazy , waiting time for any ride well over
      one hours ! washroom is closed to one and half hours wait ,poor ladies 1,the
      foods is so pricey ever Micky would not buy it ,people ,people ,people ! it
      is a small kingdom with no local want to come ,no wonder they lost money every
      year ,better off save time and moneys do some things else ,you will thank me
      for it !","The Disneyland in HK was open many years ago but I was there only
      last year and it was the first ever Disneyland I''ve stepped into. Though not
      the only theme park I''ve been to, it was one of the most organized park with
      some really friendly and helpful crews around. As usual, there were tons of
      cash waddling tourists and squeaking kids in almost every corner of the park.
      The were the usual adrenaline pumping rides and really cutesy ones too. But
      the most memorable find in HK Disneyland was the food. Yes, the food was great
      and considering it is a world franchised theme park, it''s even better! We had
      braised beef noodles and HK roast rice with succulent pieces of steamed chicken
      and roast duck. The noodles was fantastic with tasty broth and firm hand made
      noodles with lovely pieces of braised beef. Totally unexpected but definitely
      worth it.","Part of our Hong Kong and Macau tour package is a 1 day pass to
      Disneyland. I''ve been wanting to go there since I was in high school.The place
      is magical, especially at night when all the lights are on! Lines can be quite
      long though, so be patient!!!! Food and water can be pretty expensive. The same
      goes for the souvenirs. A 500ml bottle of water cost us HKD $28. A bowl of rice
      topped with beef each cost the three of us HKD $109 (HKD $112 for our friend).Loved
      the fireworks!!!! It showed almost all of my favorite Disney characters. Yey!
      : D"]}'
