interactions:
- request:
    body: '{"minThemes":2,"maxThemes":50,"inputs":["A fabulous place to visit....
      the magical world of Disney! Highlights for us (kids aged 8, 10, 13) were Space
      Mountain (though the 8 year old was absolutely terrified   so ensure the kids
      aren''t too little or too fearful!), the 3D film Mickey''s PhilHarMagic, Buzz
      Lightyear Astro Blasters, and Mystic Manor.","A very nice park. This is one
      of the smaller parks in the Disney group. It can be finished in one day if you
      rush it but we took out a two day pass and took our time. Staying at the Disney
      hotel helped.The kids absolutely loved this place. The food is very pricey but
      what to do?!! The waiting times were not too long. I think the longest we waited
      was about twenty mins.Grizzle Gulch the newest area of the park and boy what
      a fun roller coaster.They are adding another area to the park due to open next
      year I think. Its good that they are expanding.Will definitely come here again
      as its a good size and not too big so the kids won''t get tired walking so much.","There
      was fantastic experience when I visited HK Disney, I and my family had a happy
      day because there lots of amazing and beautiful shows ride, the value is worthed
      for a whole day long, even if you want to watch or reride the game, and the
      price is include for 1 meal!! The parade in the afternoon is funny and cheer
      us, the fireworks in the last was very beautifull. I might to be back there
      again!","The Park was great, the family loved the experience however we really
      loved the shops and amazing variety in Disney items we could purchase. We probably
      spent more time in there than the actual park. The kids loved the air conditioned
      or fans in the waiting lines as it was a very warm day that we visited. The
      park copes well with a lot of park visitors and waiting time in lines for all
      rides were kept to a minimum.","The Hong Kong Disneyland is quite small, there
      are too many people and the waiting line is long. it took average one hour or
      more in the line. however, the transit Disneyland tram is very nice, very impressive!","Visited
      Disneyland HK on 24th December. It was very crowded but tickets were easy and
      quick to buy at counters there.There were helpful staff. A staff member even
      advised us on how to proceed visiting the park as it was our first visit there.I
      tried to do as many activities as I could in around 6hrs. But I guess you need
      more than one day to enjoy them all.  It''s a small world ,   Iron Man experience  and  Hyperspace
      mountain  among others are activities I liked. Some activities had many people
      waiting in long queues. So much patience was required.I really enjoyed my visit
      there. Hope to visit it again in the future.","Spotlessly  clean, uncrowded
      with short wait times for most rides, fun for us and for our 14 year old granddaughter.  Just
      like any other Disneyland, but with more Chinese visitors than Caucasian visitors.","We
      enjoyed all the rides and it was great that nearly all of them our son was allowed
      on (just the roller coaster that he was too small for).  Get the Fast Pass on
      some of the rides and go back later on when your...More","Last October 30 was
      my first time to enter a Disneyland theme park, my friends and I went on a weekday
      to avoid the long lines. Although we tried to avoid the long lines, it was raining
      when we went there. But the rain didn''t dampen our moods as my friend guided
      me through the different covered attractions. We went to watch the shows first,
      when the rain stopped a little bit, we went on to ride some of the roller coaster
      rides. We stayed until the fireworks show at Sleeping Beauty''s castle which
      was splendid! I really enjoyed my stay at Disneyland, hopefully I will be able
      to come back again. I just hope that they''ll put more covered areas in the
      park.","Hong Kong Disneyland is good. It''s a good place for both kids and adults.
      If you buy the packet tickets you will have the discount for food in Disneyland,
      and you can have small gift from the shop. Kids love this place.","The maxpass,
      disneyapp and smartphone are essential to enjoy Disneyland at peak times. Fortunately
      we had all three and a smart phone wiz to schedule all the maxpass rides. Walking
      past all the folks in the  stand by  (ie everyone without maxpass fastpass)
      I couldn''t help but think Disney is making it very tough for those folks.We
      were stuck on two rides: on Roger Rabbit we had to be escorted out of the tunnel;
      on Radiator Springs (California Adventure Park) racers we we stuck for ~ 10
      minutes and then ride resumed. Splash Mountain was closed as we neared the entry,
      it closed several times over two days but we did find a window to take the ride.
      Several other rides were closed temporarily for technical difficulties during
      the two days   be prepared to alter your route through the park. Fireworks were
      cancelled one night due to winds.We found the staff ( cast members ) to be very
      helpful and the park was clean despite the large crowds.Good salads at Plaza
      Cafe.Typically you have to wait in line to meet the characters who are moving
      throughout the park. If you can do it a great but not inexpensive way to have
      the kids meet a bunch of characters is to have dinner at Goofy''s Kitchen at
      the Disneyland Hotel.Overall, basically you''ve got to go here, but the value
      for more than one visit is questionable   it is pricey. Kids of course had a
      great time.","HK Disneyland is treat! The two day pass (for those with the time
      to spare) is really the way to go, given it''s not that much more expensive
      than a single entry ticket, and does not need to be used on consecutive days,
      just within a seven day period of time. Given the weather when we visited (one
      day hot & the other rain with storm warnings) it was great to have the comfort
      of a second visit so that we did not feel pushed to cover every attraction in
      one visit. It is certainly possible to view the entire park in one day if that''s
      all you''ve got however. The lion king stage show is marvelous  don''t miss
      it! Fast pass the astro blaster ride & space mountain roller coaster to save
      time. AND don''t miss the newly opened Mystic Manour attraction   an absolute
      delight if special effects & whimsy. A real treat!Be aware that when a storm
      or lightning warning is issued, outside attractions will be closed down for
      a period of time & parades cancelled. In short Love it!","Hong Kong Disneyland
      is amazing! The best Disneyland I have been to! It isn   t that big and the
      lines for the rides aren   t that long. I was there for 5 hours, we did 7 rides
      and met 2 characters. It was however week day so it was quieter! Weekend might
      be abit more busy. The rides are excellent! Definitely recommend a day at Hong
      king dinsey. Oh and the parades are amazing too!","Living in Orlando, I''ve
      had many opportunities to visit Disney here so when I had a chance to visit
      Hong Kong Disneyland, I had to take advantage of it. The park had a very similar
      feel to the Magic Kingdom here in Orlando. Many of the same attractions, shops,
      etc but some that are unique to Hong Kong Disneyland. Although I was warned
      about how much smaller Cinderella''s castle is at the Hong Kong park, I was
      really surprised at just how small it really is. The park is much smaller than
      the Orlando version as well. The park was very clean and the service throughout
      was in line with the Disney quality you come to expect. When walking through
      the park, the smells were were quite different from what I''m used to at home.
      Instead of french fries, turkey legs and lots of different sweets, I smelled
      so many other smells that are native to the Hong Kong China area. It was fun
      to see how Disney was done on the other side of the world and if you''ve got
      a chance to visit, you should certainly do so.","Well. it;s too bad , if you
      haven''t been to any disney land..!! I mean its not just for children.. I went
      there , after completing my MBA and I loved every bit of it..!! So, even adults
      would love it.. and yes, you can''t see it all in 1 day..so better gear up for
      2 3 days..!! Must go..!!","Says that it''s a very small place. But as for me
      that was enough for the whole day. Great place to visit alone or with friends,
      or family!","Had a great time at the HK Disney. Although its supposed to be
      one of the smallest ones (compared to the other global Disney parks); its very
      well laid out.Given that we were visiting it with 2 children   we took a 2 day
      ticket. It turned out to be a very good investment as one day is not enough
      to do justice (and the two day ticket is quite reasonable) and the kids tend
      to get tired due to the long walks. Bought the tickets at Hong Kong MTR station.
      Another thing which worked for us, visited the park in 2nd half on both days
      (since most of the parades take place after 3 PM). Food and drinks not allowed
      inside (and its expensive inside); bags are checked at the entry gate.Once inside,
      its important to time yourself as different attractions close at different times.
      Get hold of the schedule and figure out the shows   parades   events and plan
      accordingly. Try to split stuff over 2 days to really enjoy yourself.Also, while
      the park closing is at 9 PM, they will start shutting down at 8 PM and post
      the fireworks at Disney castle (8:30 PM), they will just usher you out.The time
      between 6:30 to 7:45 is the best to catch a number of shows   attractions as
      the crowd moves to Disney Castle for fireworks and one can use that time to
      enjoy the almost non existent queues at other attractions. In fact post 7 PM,
      on a non local holiday, you can do the same rides over and over.","I have been
      to Disneyland, Anaheim multiple times, plus also to Disneyworld, Florida twice.
      I was worried the HK Disneyland wasn''t going to be up to standard or have the
      Disney feel I love, but I was wrong. It''s really beautifully done. The MTR
      ride to the park started the Disney feel with Mickey windows in the train! The
      Christmas decorations were even more beautiful than in Anaheim last year. Sure,
      it''s a smaller park but two new areas have recently been added and soon there
      will be a new Ironman attraction, which can''t be built at the US parks due
      to franchising issues with Universal. Newer areas: Toy Story land   great for
      smaller children, and Mystic Manor   Glitter Gulch. The Mine train type ride
      (similar to Big Thunder Mountain) was fantastic and also had a backwards second!
      Mystic Manor is a cross between the Haunted Mansion and Indiana Jones. Food
      was typical of a Disney park. They were popping caramel corn all over the park
      so everywhere smelled like sweet caramel...lovely. The live shows were all excellent
      as was the afternoon parade and the fireworks. Unfortunately due to two spots
      of rain (literally two spots only) they cancelled the evening Paint the Night
      parade. Can highly recommend this park   also seniors over 65 only pay HKD 100
      entry (about AUD 20.00) Nice for extended families.","It was a short trip as
      we were in Hongkong for only 4 days . There was no long queues due to perhaps
      China Disneyland Just opened.  Weather was also unfortunately too hot","If you
      are young at heart, then this is the right place for you! A must see place when
      travelling in hongkong. The shows is really entertaining and amazing! I was
      amazed with Disney characters live parade! Try the jungle river cruise.. Oh
      there''s also Tarzan''s tree house! Picture perfect in fantasy garden! I also
      tried  it''s a small world  ride and also disneyland rail road, train going
      around... Overall, it''s a wonderful show and amazing place to see.. Definitely
      will come back with my family.!","Only down falls not enough sitting area, shaded
      areas and drinks are very expensive. (Day was extremely hot.) Tuesday seemed
      to be an excellent day as we never waited longer than 10 min for anything.","Definitely
      get a fast pass. We went in holiday period of China was crazy busy and certainly
      no manners with some tourists alot of cutting and pushing..can do it all in
      one day...staff friendly and helpful...very hot in the park...if like us your
      children are tall take a copy of their passport we were spoken to so rudely
      because our children aged 11 and 9 are extremely tall they accused us of lying
      about their ages (was a bit of a dampener at the beginning)..The parades are
      great and the fireworks amazing...","There are at least a couple of points about
      HK Disney, that rate it above its'' sister parks. Granted it is the smallest,
      and may not have the complete experience of the original; but for children aged
      from 3 15, it is just fine.Firstly, the location, on Lantau Island, is very
      easy to reach, via the MTR.Secondly, the lack of queues is amazing. We had a
      5 minute wait for Space Mountain. Even at the peak of the day, the wait time
      was no longer than 30 minutes. The longest wait my kids had, was 30 minutes
      for Autopia.Otherwise, the Disney experience is replicated very well at the
      Hong Kong location. Excellent food, merchandising, service; all trademarks of
      the Kingdom of the Mouse.","I think this is the cheapest Disneyland as far as
      ticket prices go? It is a cute little mini version, but only has maybe 4 rides
      for kids who love the fast ones. My kids are 6 & 7 and were bored to tears by
      the slow rides. We ended up going on Space mountain 4 times, Grizzly Gulch twice,
      etc. We would have gone more if the lines weren''t 30  minutes long. As a previous
      poster mentioned, the crowds here are extremely rude, and not above shoving
      little kids in crowded areas. I can see why some of the workers might be a little
      crabby. Take a patience pill before you walk in the gates.","A great day out
      and a really cute mini version of a Disney park, no where near the size of Florida
      but a very nice park all the same.  Check what is open during their off season","This
      place made me feel like a kid again. It was like I stepped into the stories
      I''ve read and watch when I was a child. I love the grizzly, space mountain,
      philharmagic and the lion show. The fireworks was stunning. I will definitely
      go back with my family. PS: I missed the parade as I was not able to take note
      of the schedule.","Great amusement park.. the parade is fantastic.. everybody
      work there is so helpful for foreigners.. the character of disney is well performed..","My
      girls and I, took a few days and went on a trip to Disneyland. We had pictures
      while on a wild water fall ride was the best! Gift shopping for the ones back
      home was fun too.I highly recommend Disneyland to all ages! Fun, fun, fun!","Easy
      enough to get to via MTR (with Mickey Mouse windows on the last train), we had
      a great day in HK Disneyland. You will notice the rides are more aimed at smaller
      children, but my two teenagers will had a great day out. Don''t miss Lion King
      show, and the best fish n chips at the ''wild west'' area. It is very much like
      California''s parks, easy enough to walk around without getting too tired but
      still with good spaces between areas. There is a  pirate boat  type ride, based
      on the car from toy story, a ''run away'' train and space mountain for the orders
      kids, but I still love Buzz Lightyear! Some shows have different times for different
      languages. For the Disney Pin collectors, yes, they do swaps here too! The castle
      was a lot smaller, but the fireworks magnificent! Tickets can be purchased on
      line, with some travel agents offering small discounts. Then there are at booths
      to swap internet tickets to full tickets before you go in. It is also possible
      to come out of the park to go via MTR to the outlets mall and then come back
      should you want. Don''t forget the umbrella for shade, and we weren''t stopped
      taking water in (there are some water stations around, but not many). Drinks
      about HK$40 in the park, meals ranged from HK$40  95 ish.","We enjoyed the day
      and loved the rides. Toy Story land was the kids favourite with my six year
      old taking the challenge of Andy''s toy car. Very scary.  Don''t think she will
      do that again in a hurry.   Thanks for great day out.","Like Disneyland Hotel...a
      true 5 star property. Recommend it to everybody who would like to have a good
      family time... Must go hotel.","A magical place! You would want to repeat each
      attraction you visit but hold your self because you know there so much more
      to see on the next!Among my favorites are the  festival of the lion king ,  jungle
      river cruise ,  mystic manor ,  mickey''s phillharmonic ,  the golden mickey
      ,   stitch encounter  ,  buzz astroblaster ,  grizzly mine cars  &  space mountain
      . Ofcourse, the grand parade & the fireworks display is worth the wait. Don''t
      forget to take pictures with you''re favorite character, some of them would
      be at the fantasy garden waiting for you.Make sure to grab a map & event schedule
      at the entrance to know where and when things happen. This would help you organized
      & see everything you want, from shows to photo opt with yours favorite disney
      character. Also, know the use of fastpass. This could help you yo save your
      time.","This place is HUGE! Definately need more than one day. We had 3 children
      aged 11, 9 & 6 and they loved it. A great variety of rides and attractions for
      all ages. Food options were fantastic with 3D models of what you were ordering.
      Staff were fantastic, very helpful. An awesome family experience.","It was pouring
      the day we visited, which took some fun out of the Disneyland experience. However,
      we managed to watch the shows and do indoor activities while waiting for the
      rain to stop. The staff in hk Disneyland seemed to be rather brusque, characteristic
      of the hong kong people''s working style. That marred the Disneyland experience
      a little.","You can''t go wrong with Disneyland! We had a great time here. It''s
      smaller than other locations we''ve visited, but we still had a lot of fun.
      It''s a great one day trip. Train stop begins and departs a short walking distance
      from the entrance. It wasn''t overly crowded and we never had to wait long for
      any of the rides. Food was excellent for a theme park! Parade was fun, but too
      long to stand in the hot sun and heat. Hong Kong is very hot and humid. Our
      tour guide on the Jungle River Cruise was hilarious and made the ride fun. Our
      favorite ride was the Big Grizzly Mountain Runaway Mine Cars. Some restaurants
      and rides were closed, but it didn''t spoil our fun.","It is a small park comparing
      to Paris one or a US one. The different is that everything is decorated is chinese
      style and the food is multiculture. The park itself is quite standard as other
      Disney parks with lots of people, noise but with lots of fun for kids as well","Despite
      all the negative comments I spent two fantastic days here.Yes, it''s small no
      doubt compared to other Disneylands but I still filled the day in without any
      trouble at all.By the time you take in the brilliant live shows and they really
      are worth watching   about 30 minutes each, enjoy all the shops, the rides,
      watch the street parade the day has flown.Best advice is to get there at 10
      a.m. when they open because the park tends to get crowded after lunch.I was
      very surprised at how cheap the food drink was inside and also the souvenirs.
      I used a couple of theme parks here in Australia as a comparison and Disneyland
      was excellent value for money.The staff are very enthusiastic and friendly and
      the entire place takes on such a happy atmosphere.Yes I''d go there again and
      have every intention of doing so when I return to Hong Kong.","Buzz light year
      ride great fun as is Space Mountain but hold on tight!","Twas a great trip with
      nieces and 3 nephews .   Hongkong disneyland was enjoyable due to the Halloween
      atmosphere.    So much fun. The weather was good and not too sunny.","This is
      our go to vacation every year. Makes us all happy and we can   t stop talking
      about going. Everyone is friendly and the rides are awesome. Can be a bit crowded
      but we   ve managed to figure out times that works best for us.","A great place
      for fun especially for younger kids. Visit during the winter time is much better
      than the summer time. Had fun with all the rides. A must visit when going to
      Hong Kong","A totally kids place but hey, who doesn''t like Disneyland! It was
      fun pretending to be kids once more and go onto the kiddy rides!","Was quite
      disappointed with the park and should have done some research. We were mostly
      disappointed about the small size of the park and lack of rides compared to
      its North American and even EuroDisney counterparts. It''s quite far from HK
      but easy to get to by MTR although you will need to transfer a couple of time.
      It doesn''t need more than 1 day to get through it. We bought 2 day tickets
      but actually did not regret it as the heat in August is oppressive and we could
      only stay for a few hours at a time. Favourite rides were the Grizzly Gulch
      train and Mystic Manor (as it was air conditioned). Hyperspace mountain was
      OK   Star Wars themed now but pretty tame coaster compared to the updated Space
      Mountains in other parks. Meet and greet with the Star Wars characters was also
      a highlight though. On the 2nd day, it rained a little and all the outdoor rides
      closed. Also all the food vendors shut down as well. Can''t imagine what we
      would have done if we bought the food voucher. If you''ve been to other Disney
      parks, prepare to be disappointed. If this is your first time to Disney, you
      get a taste of what the original is like so you will likely have much more fun.","Disneyland
      around the world still gives off a magical vibes despite the size! Sleeping
      Beauty''s castle was cordoned off for maintenance so that was a bummer but apart
      from that, all rides are open. I went in during the opening time and I left
      before 3pm after finishing all the rides I wanted to take (which is the adult
      ish rides)Around 2pm, queues were forming so if you guys wna spend half a day
      in Disneyland, just head there early.Also, HK Disneyland has a mobile app which
      is very convenient so you don''t have to hold on to the park map. That app tells
      you the waiting time of the attractions, entertainment, dining and shopping
      etc. Pls download it!","I have never been to any Disney Land and this was my
      first visit. I do not know who was more excited, my daughter or I !! The place
      was VERY crowded and everything was super expensive. Most of the rides were
      childish, but I did enjoy some. Queues were too long for some. What else to
      expect from such a popular destination? The evening parade was excellent!! Enjoyed
      myself thoroughly.","Hong Kong Disneyland is tiny but yet costly.Very few selection
      of rides and need to queue for quite some time.In order to spend time more efficiently,
      I suggest going there after lunch or even later in the afternoon for following
      reasons (if you won''t go for all the rides):1. Avoid overhead sun2. Save money
      on food and drinks in the park3. Do not need to wait for hours for the night
      parade4. Great sunset","one day is not enough to visit this place as it was
      crowded with so many main land Chinese tourists.we have waited for 1 hour and
      more for most the rides.Shopping in souvenir shops was expensive.for lunch we
      have waited for one hour in long ques with minimal food menus.Overall good place
      to visit,especially do not miss 4d show of mickey mouse.","We have an 8 year
      old who would find a lot of the rides a bit boring. We focused on the rides
      with  big drops  (see HK DLand website)    Grizzly, Hyperspace, RC Racer, and
      Iron Man    and they were all fun rides. We rode the Grizzly 5 times, as the
      wait was less than 5 minutes (lucky considering it was a Sunday afternoon?).
      We also rode the Toy Soldier Parachute drop, which was fun, but way too short
      (less than 60 seconds) considering the long wait (25 minutes). There are 2 parades
      everyday    one at 3pm and one at 7:30pm. They are different, and both are fun
      to watch.Two things I would recommend everyone do. One, get the HK Disneyland
      app on your smartphone. It shows the wait time on each ride, so it helps planning
      on which ride to go to next. Two, eat before or after your visit, and bring
      a big bottle of water. I did not think the food was that great, and things are
      pricey inside the park.","Disneyland Hong Kong.My husband and I visited Disney
      on a Sunday; the whole of Hong Kong must have been there. Starting with the
      Disney Mtr, there where queues.The Disney touch started on the MTR with Mickey
      shaped windows and brass effect Disney characters in glass domes. You need to
      get there early to avoid the queues. You get your bags searched on your way
      in, though you can bring a bottle of water in with you, and there are water
      fountains to refill your bottle. You can pick up park maps upon entrance in
      Main Street. Upon entrance to the Park it is set out just like the one in Florida,
      Main Street USA which has the street of old fashioned looking shop fronts, selling
      Disney goods. A short walk along the street and you see the Sleeping Beauty
      Castle and the road leading to the different lands. The park has all the old
      favourites, Small World, Space Mountain, Mad Hatters Teapots etc.The new land
      Grizzly Gulch has just opened, its very small but has a good ride called Big
      Grizzly Mountain Runaway Mine Cars, which when we got there didn   t have a
      queue and we got on straight away, and we enjoyed the ride. We also enjoyed
      the jungle river cruise in Adventureland, and make sure you don   t miss Mickey   s
      Phihamagic the 3d adventure.Check the guide to find out the time of the parades
      and if you are not planning on watching all of it, make sure you are not around
      the route of the parade because you cannot get through the path way until it
      has passed. Don   t forget to use the fast track feature of your tickets; this
      will enable you to enjoy some of the rides without having to spend all of your
      time in a queue. There are quite a few places to eat at the park and we found
      the prices ok. I have read many review of the Park before we came saying about
      people pushing in front in the queues, but we didn   t find it a problem in
      Disney. You can get around this park in a day, but probably best not to go at
      the weekend. We found that the park was very busy with families and couples
      of many ages.Did I enjoy the park, yes, am I a Disney fan yes.","We have always
      loved Disneyland and this Park is one of them. In Asia, this is one of the most
      accessible and easy one to go to. I think it is the smallest though compared
      to all other DisneyParks but the fun is just the same!","I noticed that Disneyland
      caters more to kids 10 years old and above. The rides are mostly fast and  roller
      coaster like . My son is just 8 and he was scared when he rode the RC ride in
      Toy story. After that ride, he didnt like to ride anymore of the others because
      he got scared. He just rode the Buzz Light Year after. There were also so many
      people from mainland China even if it was a weekday. the park was crowded. it
      was the wrong time to go because it was after Chinese New Year.","Liked Disneyland.Though
      its more of a place for small kids than teenagers. There are hardly any rides
      for the teens...more for the kids.Like the Disney train...with everything made
      up as a disney character.The various areas have been nicely done & photo ops
      are many. The parade is good ,so are the fireworks.Good for a first Disneyland
      trip.Nov 12","We spent 3 days at Disney with our 4 kids, hoping that they   d
      enjoy it as much as I had as a kid. Unfortunately the greed of Disney has destroyed
      some of the magic.The Monday was so busy that we almost left. I made a complaint
      about the overcrowding and was told to join a queue to complain!Some of the
      rides are 50 years old and need to be retired. My kids laughed at many of them.
      The fast pass system is poor (go to universal and see a proper fastpass system
      in action).Our next two days were much better   it was a shame that the first
      day left such a bad taste in the mouth. This was my 5th time at Disney and I
      think it   s my last.","Having read so much bad publicity I was expecting a
      very bad Disneyland. So I wasn''t disappointed, but not pleasantly surprised
      either. I went in the morning and as everyone has said, each queue was at least
      1 2 hours long. The fastpass isn''t very useful either. For my first fastpass
      I could go back within 1 hour but my second fastpass I obtained before 1pm allowed
      me to take the ride only at 6:30! The rides are mostly boring. There''s only
      1 rollercoaster ish ride, which is the space mountain. Its quite good but isn''t
      really THAT exciting. I''ve tried better at less known themeparks. But objectively
      its enjoyeable, really.If you (or your kids) like the disney characters, it
      might be nice to see them walking around or buy the disney merchandise but as
      I''m not really a fan its no big deal to me.The queue cutting wasn''t that bad.
      There are some people shamelessly walking past us to get to their friends who
      booked a place in the queue for them in front but you just have to put your
      feet down and tell them off. I had this person shamelessly saying  excuse me  when
      I blocked her way as she was trying to go to the front of the queue but its
      really not as common as some of the people here make it sound. There are probably
      such people everywhere, no reason to point fingers at mainlanders and say that
      they have no social etiquette.Some things that are well done include the 3D
      animation mickey show, forgot what its name is. Shall not reveal the reason
      why its so good, the surprise element is part of the fun. The fireworks performance
      at night is also really amazing.A recommendation   Go in the evening if you
      have to, the queues have eased up by then so you''ll probably complete the same
      number of rides with less frustration than if you start in the day and spend
      most of the time in queue. And you won''t miss the fireworks.","Some of the
      reviews for Disneyland talk about queue jumpers and people pushing past to get
      to the front of the line. We didn''t experience this behaviour at all. An early
      start is advisable. We took the train to Sunny Bay, where you change to the
      Disney Train, the kids will love this train.We had pre purchased our tickets
      at China Travel Service, so we didn''t have to line up at the entrance. A quick
      bag check at the front gate and were in. Note: don''t take cans or bottles they
      will be confiscated. The people in front of us had their cans of soft drink
      taken, read the conditions of entry before you go at: http:  park.hongkongdisneyland.com
      hkdl en US general termsOfUseDetail?name ParkRulesPage.)We went on just about
      all the rides, I think we missed only a few of the more kid friendly rides and
      the longest we waited was 20 minutes for Space Mountain, because we decided
      to go on it just after the grand parade and so did others. On the Grizzly Gulch
      we didn''t have to wait and got off at the end walked straight back to the start
      and got on, no waiting. There is a wait for the Lion King show, only because
      the crowd builds up quickly and if you want a good seat at the front, start
      lining up at least 30 minutes before the show starts. The show is about 30 minutes
      long and was really good. The food hall was busy and I have noted a lot of reviewers
      talking about the mainland Chinese being rude, the rudest people we experienced
      were tourists from another western country, I won''t mention where from, who
      decided that they wanted to custom order there burgers and hold up the line
      for 10 minutes and the teenage girl told the staff member she was useless. Really,
      just take the tomato out if you don''t want it. I have read reviews that say
      it is poor compared to others. This is the only Disneyland I have visited, so
      I don''t have anything to compare it with. It was clean and I saw saw kids having
      fun, what else do you want.","Fantastic place, did the two days, kids had a
      ball...i know others have reviewed it as too small etc and can see it in a day..i
      think you need the two days..food is expensive, but clothes and souvenirs funny
      enough quite cheap, plenty of deals.....","I have visited most Disney parks
      and this is a good one, although not as large as the US or Paris parks. There
      are a good selection of rides and we particularly enjoyed the Iron Man simulator.
      The choice of food in the park seemed limited with many of the concession stands
      closed. It was not too busy on a Sunday in May so the queues were not too long.
      We managed to get on most of the rides during our 6 hour visit.Transport to
      the park was very easy, we took the MTR and the Disney line by the park was
      very cute, with mouse shaped windows!","My trip to hongkong together with my
      husband and daughter includes a day in Hongkong Disneyland. We arrived by tourist
      bus at about 10 am on a rainy day. Upon alighting the bus, we have to walk about
      100 meters to the main entrance. Walking around, I can see miniature stores
      within a city. We toured Tomorrowland and rode on a high speed roller coaster
      at Space mountain. The ride is inclusive in our entrance ticket. We came to
      Adventureland where we were transferred to Tarzan Island using a raft to Tarzan''s
      treehouse. We toured the house where we can see wax statue of Tarzan and Lion.
      We also tried the Jungle River Cruise where several exciting attractions were
      seen along the way. Lastly, we tried the Grizzly Mountain Runaway Mine Cars
      where riders experience a thrilling ride into a mountain using mine cars. At
      7pm, we ended our visit and took the bus to the airport and flew back to manila.","Been
      to Florida Disneyland as a teen,but I''m grateful for this smaller and more
      manageable version,as a parent.Perhaps,I shouldn''t compare...In its own entirety,its
      a wonderful experience.The rides and shows all have that special Disney magic,so
      whatever your age,regardless,its bound to bring out the child in you to build
      special memories with your family.If you go early,you''ll definitely finish
      it in a day,especially on weekdays.","I had no expectation going to Disneyland
      because I was essentially taking my daughter. Within minutes of arrival I realized
      I was going to have a great time and I did! The rides, Disney characters the
      whole place was magical!! Even my fianc   had fun. The food at the corner cafe
      on main street was amazing!! I also loved the fact that there are photographers
      all over the place to ensure that you take your memories home! The souvenir
      shop at the exit has the cutest memorabilia!!! The entrance fee is worth every
      penny!!!!!","It was the great place.... I enjoyed each and every ride and felt
      very good.. There it was the shops where we can purchase lots of stuff... I
      purchased lots of things.the parade and the fireworks over there was amazing.the
      castle was looking so amazing that felt like in some wonderland.really enjoyed
      it and request the people to please visit..","There was no Disney experience
      from the astaff at Hong Kong Disneyland. The food at Plaza Inn was disgusting
      and the service was none existent.The staff all around the complex had sour
      faces and no time for patrons.Save your money and visit the NGONG PING much
      friendlier people.","Since I brought an 8 year old son in this Hongkong trip,
      Disneyland Hongkong is a place not to be missed out. It already rained since
      morning, but we braved our hearts to go. This was our 2nd time to Disneyland,
      therefore we already knew how to get there. Taking the cute Disneyland train
      was still a fun experience for younger kids. When we reached there, the entrance
      queue was short, in fact no queue at all as few people want to come during rainy
      and cold weather. Anyways, we went in and took the rides that we had not rode
      on before in our previous trip. A thumbs up to Disneyland. All the rides operated
      though visitors were few and it rained quite heavily. I could see all the Disney
      staff wearing raincoats, taking time to smile and greeted us happily. It was
      good as children felt welcomed. The photo session and parade also went on as
      normal. However, fireworks was cancelled due to bad weather. We enjoyed our
      rides in the rain. We had equipped ourselves with raincoats and umbrellas. They
      also sold raincoats with Disneyland figures, and it was bestseller on that day!
      We had lunch consisting of chicken, pork and duck rice. The food was good and
      of big portion, price was expensive! The sitting place was soaked with rain...there
      was no shelter, only a few big umbrellas overshadowing us and still we could
      get wet. We did not choose a closed space restaurant as it was the closest to
      us. I think this could be improved by the management. On our way back, we bought
      a few souvenirs from the Disney shops. Overall a fun and memorable experience.
      We would surely go back again, but during a much weather friendly season.","This
      was my first experience in Disneyland. I would say it was alritel. The atmosphere
      and design was so amazing! The little shops on Main Street USA was decorated
      beautifully with plenty of little souvenirs to buy. The rides that we got onto
      (Parachute thingo at Toy Story land, buzzlight year thingo and its a small world)
      was nice, unfortunately the whole park was packed out! took us 40   minutes
      to line up, We gave up and decided to just shop for toys and souvenirs.Next
      time, I''ll be sure to remember to use the fast pass and come earlier! Got to
      try the RC coaster, magic mountain and the Gulch ride!","For those who have
      been to the original Disneyland in California you know that special feeling
      it has. This park is modelled very closely to that park and you almost get that
      feel. It has some great attractions and an amazing location surrounded by lush
      green mountains.","excellent we realy enjoyed our day there, lots to do and
      see and the carnival was very disney and excitable, we loved it","HK Disneyland
      is a must see if you are travelling to HK. It will take a full day so do not
      be rushed. weekends are to be avoided but mid week is fantastic. Train is the
      way to get there","The title says it all but what else can you say?  Disneyland
      is still the same and we all had a great time.","Yes this Disneyland is small
      but it enables you to ride everything and you can meet all characters. Fantasy
      Gardens is the 1st of its kind in the world where all Disney characters are
      situated at their own spot and you can line up to meet greet photograph with
      them.","Enjoyed ourselves immensely. We did this in the last days of our holiday
      and I''m glad we ended up going. The ride out in the special train is a thing!
      And once you get on the Disneyland train you leave all reality behind. As a
      Disneyland Virgin, I thought this was a blast. We did the photos with Mickey,
      bought some souvenirs and walked our feet off. It''s not huge, but don''t be
      fooled by its size. We had fun, which is what it''s all meant to be about :)","Easy
      to get there, only need to take the subway, inside the subway there is also
      disney decoration so can take pictures while heading there. Very convenience
      and clean. Inside the disney park, there are lots of cute sounveir shops, area
      is clean, people are friendly. Lots of disney characters to take pic with, not
      that long line up, it depends on the time and month you go. Although its not
      a big disney but you can still spend a whole day there. If you like cute stuff,
      hongkong disney is a must go. You will buy lots there.","If you are a Disney
      fanatic, this is good for the Disney aspect. There are a few good rides, but
      compared to any American six flags the ride selection and quality are inferior.
      Younger kids would still have a great time. It   s smaller than American theme
      parks. I do not recommend the meal voucher. A lot of places don   t accept it","the
      Hong Kong Disneyland is really small compared to other Disneyland and with not
      too many attractions. I think there are far better amusement parks and we did
      not feel the real Disney spirit there as well. When being in Hong Kong there
      are better things to do....","Hong Kong Disneyland is fantastic! It captures
      all of the traditional Disney elements whilst also putting it''s own spin on
      things. The park is incredibly easy to navigate and well set out.Waits times
      are sooooooo much less here than at other Disneyland Resorts around the World.
      Definitely if you want short queues and be able to experience all that Disneyland
      has to offer then the best bet would be to make a trip to Hong Kong Disneyland
      you won''t be disappointed!!","Awesome, different from the old dated Disneylands
      of the west.  Expecting that it''s quite small, we took our own sweet time and
      visited most shops and went on most rides, however pretty soon ran out of time!","This
      is my 1st Disneyland theme park, overall Hk Disneyland is wonderful place and
      its totally magical. The characters meet n greet is gorgeous too, we don''t
      need to catch up the time for getting a photo with Disney characters, since
      they provide many time slot for character''s meet and greet. The attractions
      are good, especially the fireworks show. It''s so magical and beautiful. HK
      Disneyland fireworks show is the best fireworks show that I ever seen. Overall,
      the admission fee is totally worth with the experience.","Bring out the kids
      in me! The Disney mascot are there whole day to take photo with u! Rides mostly
      see children friendly So bring your children there! The fireworks at the end
      of the day is awesome,stay to watch that!","It started with the train. We took
      MTR train to the resort from sunny bay stop. The train is in mickey shape. MTR
      stop is in the park itself. the shows : Lion king, 3D show, golden mickey, parades,
      and the boat ride are excellent....More","I went there with my sisters. More
      things than I expected, the transportation is quite convenient. Not very busy
      when J was there so I didn   t need to queue so long. So sad, I got sick after
      a few ride but I was fine at the end. The waffle is very cute, you shouldn   t
      miss it.","First of all, please be advised that I''m not a really thriller seeker
      type of person and therefore, I only took ride that will not cause my adrenaline
      boost to the max :D.. I visited the HK Disneyland on 17 Dec 2015 and I have
      to say this is the first time in my life that I really thought that Disneyland
      entrance ticket is very cheap. There was no queuing (max 10 mins) so that my
      family could finished each attracting within 8 hours.. It might be caused by
      the fact that 17 Dec 2015 is quite cold and I believe the school in HK was not
      (yet) in holiday season.. While HK Disneyland is relatively small (new attraction:
      Iron Man is currently built and expected to be completed sometime in 2016),
      but my family really loves the merchandise sold in the stores. In our opinion,
      it is much nicer compare to the goods sold in Japan Disneyland (depend on your
      preference). Last but not least, the restaurant inside the theme park is relatively
      reasonable (in price) and good (in taste)..","We loved the whole experience
      and the kids were over the moon to meet most of the characters. Quite full so
      go prepared for long waits but totally worth it. Stay till after 7 pm to see
      the night parade and at 9 for the fireworks show","Disneyland is indeed the
      happiest place on earth and we come here every year. Our children are always
      looking forward to new attractions and sadly, we were too early to catch the
      Iron Man Experience. However, we enjoyed the new attraction, Fairy Tale Forest
      by Pandora.","Disneyland is everything you thought it would be and then some.
      This place has turned entertainment into a fine art.Our whole family had the
      best time and cannot fault it in any way. It brought the kid out of us all.A
      place we WILL revisit!","Disneyland can be very crowded if you''re planning
      to visit on weekends or holidays. Which in turn makes the waiting time so much
      longer. Be sure not to miss the fireworks at night because it''s really magical!
      If you can, stay one night at Disneyland''s hotel to also enjoy the view of
      the fireworks! But please be sure to enquire the hotel staff for the view. There''s
      also many shops inside selling many souvenirs which is what I like the most
      about! However, you can''t bring certain things inside such as beer etc etc.
      (They will check your bag before you can make your entrance, which is a bit
      troublesome.) But there''s a locker service just beside it just for a small
      fee! It''s easily accessible.","We have been to two other Disney parks (Orlando
      and Tokyo), and based on our observation the staff in Hong Kong Disneyland are
      not as friendly and attentive as those we have come across before in the other
      two Disneyland parks.The crowds in Hong Kong are out of control. The crowds
      are a little bit uncivilised     cut queue. While I was sitting on the bench
      to watch the parade suddenly two youngsters came and stand on the bench next
      to me   I felt annoyed. Their shops sell high quality souvenirs but quite pricey.Nevertheless
      we really enjoyed the Lion King Show and also boat ride in Adventureland!","It
      was an amazing place which can be enjoyed by a person of any age.It is definitely
      the best place I have ever visited.It was a dream come true.","What more can
      I say   Disneyland is truly the happiest place on earth! Despite being opened
      for more than a decade, the place is still really well kept. The fast pass made
      our visit a whole lot more efficient and convenient. Queue times were short
      (except maybe for the phototaking with the characters). Hugeeee variety in the
      stores which kept us shopping non stop! Rides were fantastic as well. Character
      interactions were superb. And of course the best part was the parade. We caught
      the day and night parades and both were fantastically great!","Disneyland Hong
      Kong has been around for a while now and is frustrating slow at growing the
      park. The present Disneyland is regularly overcrowded and the focus on Mainland
      Chinese means that in providing services there is a heavy focus on staff with
      Mandarin. It can be frustrating communicating as frequently there is miscommunication.
      Disneyland is not cheap but for regular park users it is a sound investment
      to buy an annual pass. A tip for overseas visitors is Disneyland Hong Kong offers
      a significant discount for senior citizens over 65 years of age. Much like other
      Disneyland properties around the world on busy days (most days) there are delays
      in getting on rides. It makes sense to take in your own food and water (permitted)
      as food and drink sold inside Disneyland is not inexpensive. While Disneyland
      is a fun place and enjoyable when not crowded, unfortunately more often than
      not this is not the case.","For the Name Disneyland, this place falls short
      on expectations. Rides like Winnie the Poo was a disappointment. Except for
      a few ones like the Iron Man, the 3D Show & the Indoor roller coaster, rest
      of which were pretty much ordinary. Overpriced food and rude agents keeps them
      going. No sign of disneyland''s experience...Felt Sad..","Slightly expensive
      but its great for kids below 12 13. Plenty of rides and attractions. Good infrastructure.
      Go early mornings by 9.30 and leave by 5 or so. Crowd gets more after noon.
      Can''t really explain more since Disney is a world famous brand and people already
      know what to expect. Not much for adults though,","Took kids for their birthday.
      Have been to Disneyland in the USA and Paris and it was lame compared to those
      experiences. Much prefer Oceans Park.   The queues were annoying. I mean why
      would grown adults want to go on a ride obviously designed for...More","I knew
      this park was small. I had low expectations...   It''s not as good as Disneyland
      Anaheim CA, but I did like it more than Euro Disney.  We spent a full day here.
      I hope I''ll be able to visit again!","Hong kong Disneyland is such an awesome
      experience. i have been in winter and summer and found it not to crowded. kids
      love it and its perfect for younger kids as its not to big. i have stayed in
      both hotels and loved both but the Hollywood hotel is best. the cast members
      are awesome and i can''t wait for my next trip! i recommend three days to see
      all the show go on rides and have second goes. i found things to be surprising
      reasonable to buy.","I think Disneyland is for kids. The most of attraction
      are not made me excited. But I really like the  fireworks huge show at castle.
