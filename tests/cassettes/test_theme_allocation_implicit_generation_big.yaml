interactions:
- request:
    body: '{"minThemes":2,"maxThemes":50,"inputs":["I''ve just been back home from
      this place. Very hot weather summer. It is small, compare to Tokyo Disney, one
      day visit you can play all games. Enjoy...","Our visit to Disneyland was great,
      the weather was perfect. Disneyland''s Christmas celebration was still going
      on, all the Christmas decorations where still up and the holiday parades where
      still going.","Hong Kong Disney Land if you have never been to another is fantastic!
      If you have been in America you will most likely be very disappointed as it
      is small and hot.For kids upto 15 it can be fun as they relive the adventures
      of Mickey and Minne, ride and sing It''s a Small World Afterall and enjoy hanging
      out together. I seriously advise checking the weather forecast for the evening
      as we waited in the best spot  in front of the castle and circular garden  for
      the night parade for 2 hours only to be told it was cancelled, then they did
      not move the time of the fireworks earlier, so rather than wait for a total
      of 5 hours we left at 2000. So check with staff that it going ahead or be prepared
      to miss it. I really recommend visiting the animation studio where they teach
      you to draw Disney Characters really easily in air conditioned comfort. Please
      note the train does not do a full circle tour, even though it announces that
      it does you have to get off and then line up again at halfway, disappointing
      when you just want to rest and have a breeze!!","First of all, I have to mention
      that I always use a crowd predictor calendar to plan my visits and will not
      go to the park when the crowds are expected to be high because it''s not fun
      waiting in line all day. My family prefers to wait less than 20 minutes for
      rides. This is doable if you go on a slow day and utilize fast passes and single
      rider lines. We last visited in March close to spring break and the lines were
      a bit longer than we usually like, but went anyway since we were meeting friends.
      The line for the Matterhorn was 90 min but I was able to ride it twice in 10
      minutes thanks to the single rider line. Disney has stepped up their food game
      lately and it shows! The Food and Wine festival at DCA is nothing compared to
      what is offered at Epcot in Florida, but it''s nice trying different items.
      The new Tropical Hideaway next to the Tiki Room is very well done and the treats
      are excellent. I appreciate seeing more vegetarian and vegan options throughout
      the park. I would LOVE to see Disney stop using artificial food colors in their
      foods; more organic options would be nice.","January is cold in this part of
      the country, which can be also an advantage as you walk the whole day to the
      park & conclude it at night with the fireworks at castle. Better book early
      if you want to stay in their hotels, it easily get full specially during this
      season. The place offers lots of of interest point for all ages (as long as
      you fit to walk) and it even have some free drinking fountain in some points.","Same
      Disneyland with Orient Culture   food was fantastic and different from the American
      Resorts. Expensive but definetly worth it!","Visited in March 2018 on a Sunday.
      Due to weekend, there were too many visitors and long queue for all the rides   attractions.
      Had to skip several rides due to their long waiting time. However, whatever
      rides we took, most of these were not that thrilling. There were 2 parades on
      that day, one in the afternoon and one in the evening. Both were fun to watch,
      especially the evening parade with illumination was very attractive. There were
      no closing fireworks, told that it had been discontinued. There are restaurants
      inside the park, however foods were expensive and average in taste. It is an
      expensive affair; entry tickets, inside food etc. all are overpriced. Though
      at the end it was tiring, but overall it was a fun filling day spent at HK Disney
      Land.","Felt like a kid again. My daughter loved the food and the rides. She
      can appreciate everything now since she is 8yrs old.","The best close up fireworks
      I''ve ever seen in my travels.ONE thing to do here is to stay till 8.30 pm to
      watch fireworks! There are so many attractions and rides to play and see. I
      simply love watching the parades. Try going for all of them. Take a map and
      schedule of the shows with you or else you won''t be able to catch up with time.
      Queues for the ride I''d say moderate given that I went on a Saturday afternoon.
      Don''t expect too much for the indoor roller coaster rides. In my opinion, they
      were anti climax. I was expecting a slow ascend and quick drop  ( So I recommend
      going for all of the performances including the parades, Lion King, Stitch and
      etc.","Disneyland is beautiful, magical, enjoyable!!! u relive ur childhood
      here...fantastic rides, great plays really staged well. The evening parade is
      just simply awesome.","We visited Hong Kong Disneyland as group of family on
      1st January of 2019. We thought that the park will be packed since is the holiday
      season but luckily the park is moderately packed.My thought about this place
      is a great place to spend your day in your HK trip. The park is very nice and
      it was smaller than your typical Disney park. Compared to other Disney park
      I''ve ever visited, this theme park has shortest waiting time especially for
      thrill seeker attraction and of course no need to check all the fast pass.You
      can download the apps beforehand to check the schedule for the parade, map,
      and waiting time for each attraction. Unfortunately in our visit, the Sleeping
      Beauty castle is still under construction but we managed to enjoy Disney Christmas
      Celebration.In our visit, We managed to enjoy 6 rides, 1 parade, 2 shows in
      our 4 hours of visit. If You''re a thrill seeker, don''t forget to enjoy the
      two attractions exclusive in HK Disneyland, Big Grizzly Mountain Runaway Mine
      Cars and Mystic Manor. For a magical time of great fun, you can   t go wrong
      with Hong Kong Disneyland!","I would say, I enjoyed the place more than my 9
      year old! We had kept the last day of our HK trip to cover Disneyland and that
      was just not enough. You need to spend a good two days if keen on covering all
      the sections and enjoy most of the rides! The Lion King show was spectacular
      and so was Mickey''s Philharmonic show.","Lots of fun attractions, short ride
      waits, easy MTR acess, food and drink is very expensive. A good day for young
      and old.","Me and my family went to Hong Kong Disneyland for an overdue vacation.
      It was an experience of a lifetime. I felt like I was a child again, and I can
      safely say that I wasn''t the only one who did. My brother had a smile that
      I had never seen for the past God knows how long. My cousins are extremely happy
      and on top of that, my grandfather was with us and he really enjoyed the trip.Getting
      there was a breeze, considering that the place where we stayed, Harbour Plaza
      Metropolis, is right across the Hung Hom MTR station. The commute to DL is part
      of the experience. The Disney themed train is really cute, it had Mickey Mouse
      windows, replicas of Disney characters and Mickey Handrails.HKDL resort was
      everything I imagined it to be. Magical. From the rides, to good food, from
      the Golden Mickeys show and The Festival of Lion King to the Philar Magic, it
      was spectacular. I won''t be telling stuff bit by bit because it would probably
      take me 3 entries just to share how wonderful my DL experience was. The highlight
      for me however, was the  Flights of Fantasy  Parade. We were eating our late
      lunch (around 3:30) when it started and my cousin Jia hurriedly ran to the main
      street with me and Timmy. At first i thought only kids will enjoy the parade.
      But I have to admit I really had fun watching it. Every performer had a really
      good smile while dancing to a catchy parade song. Considering that majority
      of the performers were my kababayans, it made me feel proud how good of an entertainer
      Pinoys are.You should definitely see the fireworks at night!","We enjoyed our
      grown up day at Disney.  The weather wasn''t good which made it perfect for
      us. It was not crowded and most attractions had almost no lines.  We enjoyed
      the food. A bunch of construction work is happening which is not great...","We
      took a day and went to Disney in HK, just to have an escape. Easy to get to
      on the MTR. Very clean. Buy tickets at the Hong Kong station of the MTR and
      save one queue for tickets at Disney. Go early and the lines everywhere are
      minimal. (We did go on Thursday, so I can''t speak to weekend lines.) Definitely
      smaller and less to do than at the U.S. Disneys. I thought the Mine Car ride
      was great! So we''re the shows; especially the Lion King show.","This was my
      second Disney visit the first one was Tokyo. Well, what can I say? I didn''t
      really enjoy this as much as the Tokyo one. This was smaller. And the manners
      of the locals were so appalling that I would never come back again. Some kids
      were peeing in the middle of the square.. It''s like the culture of the land
      is that you''re allowed to be rude, disgusting and the road is your personal
      toilet. Would not come again..","A trip to the Disneyland at Hong Kong is a
      MUST.One of the 3 existing around the Globe, it is a full day of experiencing
      the creative genius of Walt Disney while marveling at the power of incredible
      marketing. An experience which is an education in itself. And dont forget to
      click pictures with your favourite Disney characters.We owe it to the child
      in us !!","The services compare with the opening period is totally different.1  Guide
      and map is not easy for traveller organize they own plan as the date before.
      It   s must be spend more time for the whole trip. 2  The show (Lion king my
      favorites show) not such carrying the same feelings. Less actress and not monumental
      anymore.3  The souvenirs quality honestly really    China   , such like the
      things you can find in Mongkok market.Hope its will help you somehow. Thank
      you.","The park is situated in wooded countryside with mountain backdrop. Very
      inexpensive compared to USA parks but smaller and quieter. Some good rides,
      especially Grizzly Gulch and Space Mountain but the car ride was very disappointing
      and not worth the long wait of half and hour. Mystic Mansion was an unusual
      and clever attraction and the 3D film was worth a visit. Sandwiches and coffee
      at the bakery were expensive and poor quality. Although regulations specify
      ''no food, alcoholic beverages and beverages in cans or bottles'' many people
      had brought their own bottles of water which were not confiscated at check in.
      There are water fountains around the park for fillups. A very pleasant day''s
      outing for children and adults alike.","compared to paris disneyland   very
      chinese, mostly in a good way, people were not too rude, attractions were not
      too simple, foods were GREAT. was a bit sad as the castle was under construnction   also
      very hong kong. very pleasant experience to spend a day with a friend.","Great
      experience. The whole experience is done so well from the music and sounds to
      all the attractions. The place is ultra clean as well which is very nice. Sometimes
      there is a wait for some rides but most of them get through the line ups quite
      quickly. Eat the Asian food rather then the western food as it is much nicer!","I
      took my 5 year old daughter to Disneyland and this was the first park she has
      gone. It was good, but I was expecting more, after being visited the Magic Kingdom
      in Orlando, which is a better park for me. Disneyland is smaller, so you can
      go easily over the whole park in one day, but the lines were huge! It has almost
      the same rides you have in Orlando and we had so much fun here. If you live
      closer to Disneyland, the visit is totally worth it, but if you can choose,
      go to Orlando.","There are plenty of attractions that we''re not able to visit
      because of the queue. Our queue to take a separate photo with minnie and mickey
      mouse have consumed our two hours already.For this reason, we are coming back
      again to see all attractions. Disneyland was celebrating it''s 10th anniversary
      when we visited.","Very good, very big, lots of things to do, loads of attractions,
      shows, character meetings points, etc etc etc... but strongly advice to avoid
      this place on weekends and holidays, it is jam packed on weekends and holidays,
      everything has long queues, the better the attraction the longer queue, and
      plus the staff over some rides is very very very rude. really rude. it happend
      to me, in one of the shows, the waiting queue was long so they stopped new people
      from joining the queue saying that the exact no of people are waiting in queue
      as the no of seats are there in the show, ok cool, understood, then just in
      front of me, a group of people who were last in the queue left the queue (for
      whatever reasons) so i go running to the queue and again i was not allowed to
      join the queue. so its so obvious that these people are not efficient and understanding
      as well as rude. really rude staff.You will need the entire day to complete
      this place, even that is less, and food inside is costly","After buying tickets
      via trip advisor to find that we had to go on a defined day, we went on the
      day when there was a typhoon warning so the vast majority of the attractions
      were not open   in fact all of the outside attractions!! We had a lovely very
      day but sooo disappointed that the sun was out but so few rides were available","it
      was a brilliant place to visit with family. also the characters there are nice
      and the you can watch 3d shows.","If you have one theme park day to give then
      go for Ocean Park over Disney land. It''s closer to the city, 35% cheaper tickets,
      cheaper prices at stores, better views from cable car.Disney has the brand (although
      surprised why some shows are in pure Cantonese when they are franchise of a
      US brand) and the characters which your kids can identify. Some of its rides
      are fab too. It''s stylish and classier than ocean park.But kids can be equally
      happy anywhere so my vote goes to OP if you have to choose one.","I have never
      been to a Disneyland before but having ducked out of the 3 hour wait for a bus
      to the Big Buddha, Disneyland beckoned. With its own railway link from airport
      line, the venue is easy to get to. The park was not too crowded on the day of
      the visit and it was easy to navigate. The venue is focussed on experiences
      for small children and as my wife and I are not in that category, there were
      a limited number of attractions that we wanted to participate in. We were however
      pleased to have visited the site and enjoyed the trip.","DisneyLand in Lantau
      island is a cool place for fun and intertainment. There are, I believe 3 different
      zones there and the rides are pretty cool and fun. Food is available everywhere
      and access by train and taxi is easy. SpaceRide is particularly good...","We
      simply had the best day at Hong Kong Disney. I had read some negative reviews
      but they proved to be untrue. We visited in mid November and the park was decorated
      for Christmas which made it even more special. It was my wife and I and our
      20 year old daughter who went. The rides were excellent. The lines were pretty
      short (we were there on a Monday), the longest we waited was 20 minutes but
      some rides we just walked on. The shows and parades were pretty good. Except
      the snow show at 6:15pm. Not worth waiting around for. The park was clean, the
      toilets were clean, plenty of food stores (overpriced but that goes with the
      territory)Best rides were Mystic Manor, Grizzly Gulch and the Iron Man one in
      Tomorrow Land. My daughter said the only negative was that there were no thrill
      rides like a major roller coaster. Getting there via the MTR was super easy.
      If you bought the tickets online you have to go to Guest Relations on the left
      of the main gate to pick up your actual tickets. If this has been helpful please
      give me a helpful vote.","It was in June when I visited with my senior citizen
      parents. it was indeed very hot but we enjoyed the Lion King Show the most among
      other shows and the magnificent fireworks at night. Well, its not really for
      elders because they have the queue up for a very long time to watch the musical
      show. I wish they have a special lane for elders.","We were in HK DL for five
      days at the end of may and it was great. We stayed in the kingdom club at the
      disneyland hotel and it was brilliant. The staff were great and played with
      my children aged 1, 3 and 8 while I was able to relax with them in my sight.
      They read them stories, played chasie and even danced to the orchestra with
      them.The read them a bedtime story every night in their PJs in the club at 9pm.The
      hotel has a kids program where they have scavenger hunts in the maze, colouring
      in competions, football games and show disney movies etc   if you want to you
      can leave the kids at the club and go and enjoy the hotel (or the spa which
      was lovely) or stay with them. The pool is fantastic, large and supervised   completed
      with a medim sized waterslide and a fantastic outdoor jacuzzi.The food in the
      hotel was lovely, western and traditional and cheap   fish and chip $HKD88.
      The rooms were really comfortable, very large and had absoluetly everything.We
      actually would have had a great time without even going to the park. The park
      was great and enough for my family to have a great time, all the characters
      are there   and do as good a job as thise in LA. Saturday was very busy in comparison
      to the other days which we were there. We walked   about 10 mins from the hotel
      to the park everyday and used disneyland prams which are free of charge of you
      stay in the hotel   but you have to get one from the hotel reception not the
      park.As there was so much to do at the hotel we did not spend all park at the
      park   around 4 hours per day was enough and the kids were ready to go back
      to the hotel.We watched the fireworks every night from the balcony of the club   during
      the two hour drinks session (included in the price).We loved it and managed
      to have a really good break there   with so many staff to entertain the kids
      and with the smaller park there was not the pressure of LA to spend all day
      there.I was really concerned having read the reviews on this site before I went
      but my kids loved it and will always remember it and my husband and I had a
      really good break   totally recommendedWe are returning in six months time!!","Had
      the 4 day pass, spent 3 at DL and one at CA. Great place to visit. We will be
      back. Saw a lot in those days, but there is more that we missed, and more we
      want to see again.","My family and I had a long layover in Hong Kong en route
      back to the US from the Philippines, so my eight year old asked if we could
      visit Disneyland.As others have said, the park is VERY small. We walked around
      the whole thing in a matter of a couple hours. The rides aren''t the greatest,
      but there are some fun ones to hit, especially Mystic Manor! The Tarzan area
      was closed when we visited, so sadly we did not get to explore that. The gardens
      were super cute though and my daughter loved the green army men ride in Toy
      Story Land!","We cant get over the excitement and joy from all the rides and
      wonderful view of the different attractions. We enjoyed the parade and most
      of all the fireworks display.","Went there last week and my did we have a blast.
      we took a two day ticket to Disneyland and still didn''t have enough time to
      experience all the rides there. they even have halal food in the park for muslim
      tourists.","Hong Kong Disney is fabulous ! It''s smaller than other parks but
      less busy and we got on every ride ! The longest we waited was 15 minutes. I
      met Tinkerbell and Elsa and they were perfect. It was rainy to start so no one
      else was there but the weather cleared up and we walked the entire park 3 times.
      The food was delicious I had butter chicken and it was amazing !!","Brilliant,
      much better than Paris however quite a bit smaller. Much preferred the rides
      here than those of Ocean Park.","Now the second time I visit the HK Disneyland.
      Worth it in every way, except for the pricing. Along with wife and 6 year old
      son, we spent an entire day playing, rafting (2 times as per my son''s request,
      boating (also 2 times) in the  It''s a small world  world tour. A memorable
      place always. In addition, I was quite surprised by the quality of the meals
      we had at the Main Street Corner Cafe. Much better than @ Ocean Park.Have dinner
      around 7:00 and watch then get out to see the fireworks @ 9:00 on Saturdays
      and @ 8:00 other days. One day could easily be stretch to two. It is so much
      fun. Renew yourself and be a  Kid  again.","I enjoyed their parade so much.
      It was a magical experience. The fireworks display was superb. Felt like a kid
      again.","For our 18th wedding anniversary, I decided to keep us local and to
      take my husband and our 2 teens to Disneyland. In the past we''ve gone to Macau
      for the weekend. We''ve lived here in Hong Kong for over 10 years and had never
      been to Disneyland, so it was well over due.I splurged on connecting rooms in
      the nicest resort, and they did not disappoint. The view, the spaciousness,
      the service, all Top notch!We were very well taken care of in the Kingdom Club,
      though the resort did not cater to relaxing adult time. If we wanted to have
      a cocktail before dinner, we had to sit in our room. The Sea Breeze lounge by
      the pool was closed the whole weekend, and so drinks by the poolside meant going
      through room service and it took 30 minutes. And ordering drinks at dinner,
      including Cokes for the kids, needed to be very strategic as it could take upwards
      of 15 20 minutes. The whole resort seems very accustomed to a mainland Chinese
      clientele, but we could tell the manager was looking after us to make sure we
      were enjoying our meals. The sense of playfulness and whimsy about the place
      is infectious, so we all really did enjoy our time there.All in all, I''m glad
      we went, but for the price, we could have gone to Thailand, to be honest. We
      had a lovely time, everybody was very nice, and the hotel and our rooms were
      gorgeous, but there''s no desire by either of us to go back again.","My kids
      enjoyed the park. We were luckily that there weren''t too much people that day,
      didnt spent too much time on q ing. However do note that food are very expensive.
      The night parade was good!","We are probably spoilt having been to both the
      USA resorts.We found this very small and very limited. It took us only half
      a day to go round this resort.On the positive side the resort was very clean
      and tidy. What they have done was done well. The staff were very friendly and
      helpful.Not value for money at 450 HK$ each.","It   s always so much fun to
      go to Disney and this time was not an exception. It   s a small park (in comparison
      to Orlando) but still there were all the great parades, street performances,
      rides and shows you find at Disney. Prices were a bit    Hong Kong    like but
      that was expected. There was however problem with the WiFi. That did not help
      if you wanted to use the app (which usually had wrong queue times). We enjoyed
      the fact that we could go there with the MTR and it   s a relatively quick ride
      from HongKong island.","Since noon time 12 I reach to front door Disney land
      , until 6 pm , I only can visit 5 game stations , it is really big land and
      long queuing for many places , the food choice only fast food inside , expensive
      but not good taste , near by main door the chineses resteraunt must wait 1 hour
      to get seat , next time I will bring own water and sandwich carry to there ,
      the most game I like is iron man , and mystery house among the games that I
      play ; they close at 9 , if you bring you kids go there better prepare some
      water and snacks also going to there a bit ealier morning .","It was a very
      nice December morning, that we went to the Hong Kong Disneyland, we had a two
      day ticket to explore all areas of Disneyland, even if this was my third time,
      I still enjoyed it to the max! the weather is still autumn and is the best weather
      to explore disneyland. The highlight is the fireworks, it is the best! I recommend
      2 day ticket for this adventure to the happiest place on earth.","Heard many
      commented HK Disneyland is the smallest among all Disney theme park. However,
      we still cannot finish all the ride from 10.30am to 9pm.....children having
      lots of fun although some complaint due to long queue for certain rides.","went
      there with my husband and daughter may 2011, my daughter had fun, lots of fun...
      it''s quite small, we went for 2 days, but realistically, you can cover it within
      an afternoon, but kids love it.:) personally, i felt that the mascots were not
      as friendly as they were in Florida Disneyland or even Tokyo...still, Disneyland
      is a fantasyland for kids and we''re looking forward to Shanghai Disneyland
      which will open on 2016 (Phase 1)...","Celebrated my daughter''s bday there.
      Out of the world experience. The best place. Amazing shows : Lion King was the
      show stealer!!!!","I visited Disneyland solo & while it doesn''t compare to
      Anaheim, I still really enjoyed myself, even the rain didn''t dampen my spirits!
      There were a few rides, and the longest I stood in line was 15 minutes. Don''t
      miss Mystic Manor or the Jungle River Cruise. Festival of the Lion King is also
      one not to miss! You could should probably skip Tarzan''s Treehouse as the best
      thing about it was the 30 second raft ride over there. Sadly, the main parade
      was cancelled due to the weather, but the Electric Light Parade (goes by a different
      name in HK) made up for it! It was spectacular! The only down point was being
      served a Mickey Waffle (which in itself was amazing) by an extremely rude staff
      member, who really didn''t embody the ''Disney Spirit'' at all! Other than that,
      an awesome day out in Hong Kong!","Second time to visit. Additional attraction
      in Toy Story.My mother and sister (including her family) enjoyed very much.
      It is advisable to let kids rest from time to time because they get very tired
      seeing all the attractions","The park is separated from the rest of Hong Kong
      so I recommend staying on site if you can. It is also probably the cheapest
      Disneyland for both tickets and accommodation.But it   s not lacking in attractions.
      We visited during Halloween, the Villains night time parade was spectacular,
      the temporary haunted house was great, but probably for bigger kids.Highlights
      included the IronMan Experience, Hyperspace Mountain, Jedi Training, and Grizzly
      Gulch. Other attractions are still great, though the long line for the Winnie
      the Pooh is somewhat weird, I recommend using he fast pass system for that one.Food
      was good, thankfully, as there are no breakfast other options. We had a quick
      service at tomorrow land which was filling and great Value at HK$99 for a meal.
      And a nice meal in the Main Street Restaurant which was pricey HK$660 for two
      but still very nice.It is warm during the day, but most lines are in the shade
      or air conditioned except for the smaller rides eg Orbitron and Dumbo. And It   s
      a small World is always worth the effort.We got a free fast pass for staying
      at the hotel. Nice perk.English is not everyone   s first language, the cast
      do a great job communicating though.The cast members are impeccable they take
      their role seriously, especially in the Jedi training.","Our time at Disney
      was memorable there''s lots of queues but they are moving. The R1000 entry ticket
      was worth it even though it''s their lunch at the restaurant is a bit pricey.
      The souvenir shops are reasonable although selling similar things.","Park is
      quite small with many zones. Not so many rides which make the queue super long,
      better plan ahead on which ride has fast pass or which zone you wanna go first.
      We were there with no kids, so nothing excite us. What I don''t like is park
      seem lack of staff, especially information staff that normally will be around
      in the park. We only found few of them. Understand that it''s a lot of Chinese
      visitors which make even more difficult to queue   line up but I would expect
      more management from the park on this.","This may be the smallest Disneyland
      but it is not wanting in attractions, shows, rides and things to do. The kids
      enjoyed the river cruise with a fiery ending, It''s a small world ride, and
      the Lion King Show. We were able to snap pictures with many of the Disney Characters
      such as Buzz, Mickey, Minnie, Pluto, Goofy. We stayed until the fireworks display
      during closing time.","Hong Kong is hot in the summer and very humid. Queuing
      up 45 minutes with two young children is not fun. And that is just to get in!
      Queue for tickets, queue for baggage search, queue to get in. If that how it
      is on the outside you can imagine what is like once inside. A 45 minute queue
      for a 60 second ride is not my idea of fun although some people may not mind
      this. Also, paying $285 for a 3 year old who cannot go on quite a few rides
      is just a rip off. The day is also marred by overpriced rubbish food and drinks,
      rude people pushing in the queues, jumping over barriers etc. whilst emplyees
      look on. This is not the first time I have been there but will certainly be
      the last for sometime. An hour there and back too just compounds the whole bad
      experience. Save your money and go to Ocean Park!","Disney is magical. It''s
      hard to give anything less than 100 100 because Disney is magical and magic
      comes with a price. I wish food was cheaper but still, Disney is magical.","One
      of the must go place in Hong Kong, specially when you travel with family. Need
      one full day trip if during the high seasons.","Really love this place Disneyland
      so much although ticket is quite expensive but really worth it. Food also can
      be expensive inside. All the rides is so fun! Coming back again this year end.","If
      you have been to the real deal (in the USA) then Hong Kong Disney will be disappointing
      unless you except that it is a much smaller version. Its very easy to get to
      HK Disney by Train and the crowds are no where like the USA version, in fact,
      the longest you wait for any ride is only about 20 minutes!. The park itself
      is catering towards the younger children, with only two scary rides (Space Moutin
      and Grissly grouch). The grounds are lovely and very clean and the disney parade
      is worth seeing.The costs are not great, so if you have some free days in Hong
      Kong, and some small children, then its worth the visit .","I visited with my
      wife after my son said to see the lion king show. We arrived just after 10am
      and after a bag check purchased tickets and went straight in . The park was
      everything you needed. Very clean lots of food choices and restrooms. My son
      was right the lion king show was awesome . As was the Mickeys story book. We
      stayed until the Christmas light turn on at 630pm .It was fantastic. We didn''t
      stay for the fireworks because I was worn out . On leaving the park we noticed
      lots of people were just turning up. Probably for the fireworks. Hong Kong Disney
      is much smaller than Orlando but it was more enjoyable. All the staff in HK
      were excellent while the staff in Orlando seemed bored and rude.","great Disneyland   very
      family friendly, esp if you have kids under 10. Try to go on a weekday   much
      less crowded than the weekend. Get there early (it opens at 10am)   we found
      the wait for the rides around 10mins or so before 11am and then again after
      6pm. Otherwise the wait times are around 30 40mins on average (some less some
      more). If you''re not overly keen on rides, start lining up at the gazebo to
      have your pic with both Mickey and Minnie. (later they''ll head over to the
      garden bit near the dumbo ride where the other characters are, but Mickey and
      Minnie are separate then) Bring your own water and snacks fruit   our kids got
      hungry with all the walking about and although the food is reasonable, it can
      get quite exxy by the end of the day. They have water fountains about the park
      also. Definitely try and catch the afternoon parade and the 7pm light parade   kids
      LOVED it. The shows are good also. For the FROZEN fans   there is a reservation
      system to have your photos with ana and elsa   when the park opens at 10am   head
      to fantasy land (go towards the castle, just before you go through the entry
      to the castle, take the path that veers left) Near the frozen stage you will
      find staff handing out passes to have pictures with Elsa and Ana. You''ll need
      to show your ticket again to get the pass. They run out pretty quickly and once
      they''re gone, they''re gone   no frozen pics! If you think that you might do
      two days or more then consider getting an annual pass   for the entry level
      one (silver) it''s the same as two separate day entries (though you can''t use
      it most weekends) although there is also a two day pass (which is slightly cheaper)
      you have to use it on consecutive days.   I hope that makes sense : ) Also if
      your kids like stickers   make sure to ask the staff at the rides   most have
      stickers in their pockets that they hand out if you ask. Hope that helps   have
      fun.","Awesome attractions that blew my mind away. The attraction is filled
      with amazing rides and entertainment. There are also halal food that definitely
      cater to my needs. Glad to be able to meet Mickey and friends.","We had 2 day
      tickets travelling with 11 year old and 6 year old, staying at Explorers Lodge
      resort. First day we arrived at opening time and was exhausted by 5pm, in part
      due to the heat. Next day we split our day up and did morning and evening, utilising
      hotel shuttle buses. Wish we stayed an extra day or two and split it up from
      beginning. Food was reasonable compared to what we see in Australia. The vans
      outside the park on way to train station was fab as was look vouchers for lunches.
      Great value despite contrary advice","Went to HK Disney with my 4 year. He loved
      it. I can only compare it to Tokyo Disneyland but to me it seemed aimed at the
      little ones (not many adult themed rides there). So its perfect for families
      with children. That being said it is surprising the amount of independent adults
      there alone on the children rides. Must have shows for us were the parade, the
      lion king show and the mickey mouse 3D show. We got there bang on 10am and were
      able to do the teacups and the Cinderella carousal with minimum queuing. Would
      recommend you go straight to the Winnie the pooh ride and get the fast track
      ticket (we only had to wait 5minutes with this). The dumbo ride is also worth
      doing and the slinky dog roller coaster although their waiting times were close
      to an hour. The buzz light year ride and jungle cruise are also good but could
      be scary for some children. We found the food choices slim   mainly Asian themed
      or really large meals and ended up eating a hot dog for lunch which was pretty
      good. Overall really good value for money and a great family day. We also did
      the enchanted garden buffet dinner so got a lot of photo ops at that. My 4yr
      old was done after that but you could do the early sitting of the buffet and
      then go back to Disneyland (be sure to get your hand stamped) for the light
      show at 730pm.","I wasn''t expecting much out of  HK Disneyland and it turned
      out to be a pleasant surprise! The train that brings us into Disneyland station
      was Mickey inspired and I really do feel that I am entering another world.   I
      went on just 1 ride...More","We spent a half day there earlier this week ( we
      had been planning a full day but left early because it was so boring). Having
      been to all the other Disneys (with the exception of Japan) I was looking forward
      to another great experience. I was expecting a smaller park ( something like
      EuroDisney) but was REALLY disappointed by just how little there was to do in
      the Hong Kong offering. It looks as though they have just taken all their  baby  rides
      from the other resorts and tried to pass them off as the full Disney experience.
      As an adult couple the only rides worth taking were Space Mountain, The run
      away mine cart and Mystic Manor. We queued for over an hour for  Autopia  only
      to find that the ride consisted of driving an electric pedal car around a railed
      track at a maximum speed of about 3km  hour. BORING!!!!!!!!!!!! There were none
      of the usual aatractions Pirates of the Caribbean, Indiana Jones, Small World,
      Peter Pan, singing bears etc etc  basically, if you enjoyed it at the other
      Disneys you won''t find it here. If you are travelling as an adult couple and
      don''t have kids under 10 you should go to Ocean Park instead. We are now planning
      to spend the last day of our trip there as I''ve heard they really cater for
      the adult market  lots of roller coasters etc. it seems Hong Kong Disney has
      decided to focus on the toddler end of the market  which is OK if they don''t
      mind warning customers before they pay out $400 HKD !!! I am sure even kids
      around 10 years old would get very bored here after an hour or so. I''m very
      sorry to say that Disney have really missed the boat with this one.","Return
      visit. Smaller than Paris one but ok for a day. Went on a weekend but longest
      we queued was 30 mins and we also made use of free fast pass for 2 rides. The
      parades were great and viewing easy if there 15 20 mins early. Free water fountains
      by toilet areas but we bought bottled, about 12 70ml over the day (4 of us sharing)
      as sooooo humid and hot. Not great for adrenaline junkies as only 2 3 big rides
      but out 11&13 yr olds still enjoyed. Queued to meet one princess but Donne there
      early as only out in the heat for about 15 mins at a time. Not supposed to take
      food in but we took fruit and was searched and ok''d. With a fast good lunch
      of fish and chips   40 ish plus Micky waffles   5 each (big) and water throughout
      day we spent approx   90 but that''s so much cheaper than the Paris one. Disney
      does it well and we had s great but very hot day. Didn''t stay for fireworks
      as too tired. Travelled from city on metro and used a day ticket for approx   6
      per adult. 45mins hotel to park!","I don''t really like theme parks very much
      but my child like hubby was looking forward to this so we spent a day at Disney
      and took a few rides, endured the long lines and posed with Mickey. It was a
      fun quick fix. Their shops sell high quality souvenirs but quite pricey. I would
      just go to Mongkok for giveaways to friends.","We hope you will have a magical
      day. That is true. This place is full of magic. Fireworks are great and Disney
      characters are live in this theme park. Definitely will come again to this place.
      September is Halloween theme in here. Will arrange different month to see other
      themes.","When I was a kid, I dream of going to LA Disney land cause I like
      Walt Disney Characters. So when I had the chance to take my vacation in Hong
      Kong, I never think twice to visit Disneyland. It''s so cool... got a photopass
      so I could retrieve all my photos in the Disney website. It''s fun... I had
      a great time... only disappointment, I didn''t saw Mickey Mouse... Good for
      Family trip....","Nice experience using the special Disney MTR to get there.  Small
      but good for young children so they can walk all around the park.  Download
      the app to get wait time info is a good idea to plan the visit.","All in all,
      January is a good time to visit Disneyland. While the property seemed quite
      crowded, ride wait times were no longer than 45 minutes, with many just 20 minutes.
      The Fantasmic show in Frontierland is a must see. It''s simply amazing! If you
      are planning to ride Splash Mountain, do so early or wait until it''s warmer.
      We got absolutely soaked, and had to find a restroom hand dryer to dry our coats
      and shoes. Unlike Disney World, there are is no free parking on site. Be prepared
      to pay at least $25 to park.","A good effort but doesn   t really get close
      to the real deal. We visited out of curiosity but were a bit disappointed. Not
      really that entertaining for couples or families alike if you have experienced
      the real USA version.","This is just for kids only. Very small in comparison
      to Disneyland, in USA. Most of the animals were just toys; not real animals.  Anyhow
      a good start is made !!","its every child dream to meet mickey and minnie and
      the rest of the disney family...well mine came after 32 yrs and hy husbands
      after 37 yrs...we were just in bliss and we just turned into a child when we
      were there.....it was so exciting...rides were good (milder than ocean park)activities
      were good...the parade was fantastic...the fire works at the sleeping beauty
      castle was excellent...","A beautiful place that can be enjoyed any time of
      the year. However, I strongly recommend proper planning to make the best of
      the day here. Do take the FASTPASS and make the most of it. I did most of my
      rides through this and saved a lot of time. Start with Space Mountain. It is
      the most popular ride (and rightly so) and the line gets progressively longer
      in the day. Follow that up with Matterhorn Bobsleds and then all the other rides.    It   s
      a small world    is a beautifully made ride and must not be missed. Too many
      roller coasters became a bit repetitive but it was fun. The theatre performance
      and the parades are a must watch as well. So watch out for the timings for these.
      The MaxPass is not worth it at all. Very few options for pictures in Disneyland.
      May as well pay 10 dollars for select pics and use your phone elsewhere. Have
      fun!","This is a must do if in Hong Kong! If possible, buy your tickets from
      the airport as they''re even cheaper than Klook! I definitely recommend buying
      the meal coupon from Klook which costs $88; it works out that you get three
      drinks for free and when soft drinks are $30 each, you save quite a bit!We arrived
      by MTR and the Disney Resort line is just superb   Disney are spot on when it
      comes to detail. The train windows were in the shape of Mickey Mouse as were
      the hand rails   see photos attached. I believe the MTR cost us $45 from Tsim
      Shau Shu one way.We arrived at 9.45am and the park opened at 10am. The ''lands''
      don''t open until 10.30am so the first 30 mins is for exploring Main Street
      and having photos with characters. For some bizarre reason, they stagger the
      land openings with half opening at 10.30 and the other half opening at 11.There
      were plenty of characters about to have photos with with waiting times of 10
      15 min which isn''t much if you''ve been to Orlando! We did all the rides but
      the top attraction for us was definitely the Geyser Gulch! There are FastPasses
      available for Winnie the Pooh and Hyperspace Mountain which you should take
      advantage of to skip the queues   speaking of queues, as we went during the
      week, we didn''t wait longer than 15 min for any ride show. We did all the shows
      but the best show had to be Mickey''s PhilharMagic.We stayed and watched the
      Night Parade and Firework display which were both magical. A full day is needed
      to make the most of it!","I visited Disneyland Hong Kong with a friend. Seriously,
      this was beyond my expectation. I did not know I would have so much fun in here!
      I bought the ticket on traveloka, which was cheaper and also food included.
      Honestly, the food was a bit disappointing. but the rides..amazing! I don''t
      have favorite, because I love all of them. The fireworks part was the best fireworks
      I have ever seen. If you are Muslim and need a place to prayer, there is an
      asian restaurant with a cozy Musholla and they will let you pray there even
      you don''t buy food from them. I am so looking forward to visit Disneyland again.","Our
      whole family went to this place at the end of June 2014. Primary goal of our
      vacation to Hong Kong is playing in this park. We went by MTR from Jordan Kowloon
      heading to disneyland. Disney themed MTR is very interesting and full of families
      with young children. We had not buy a ticket online so had to queue up first.
      The queue was not too long, only 10 people, but spend 20 minutes to wait. We
      had a great time playing and watching a variety of shows here. There is one
      game that needs special attention is Space Mountain. It was not made clear that
      this is a Roller Coaster, and since the location is inside a building it looks
      like a normal train game, so many are not vigilant. If you are indeed ready,
      healthy and strong please try. In the queuing time, there is a special entrance
      for those who are not able to continue. There were souvenir shops everywhere.
      Sell       goods at a price that needs serious consideration, the price is relatively
      expensive. There are restaurants everywhere, providing Disneyland themed menu.
      Performances of Disney Characters Parade starts around 14:30. Should come to
      the Main Street location a bit early in order to get a good position. The game
      ended in a fireworks show with background Casle Sleeping Beauty (if not mistaken).
      After completion of the entire event at Disneyland, no need to rush, many vehicles
      available, especially the Disney MTR available each less than 5 minutes. Enjoyable
      experience but not going here twice...","all the age group can have fun at this
      place. good time spend. enjoy a lot. good time pass. i feel one day is inf.","Even
      though it was raining the entire day and we were wet pretty much throughout
      we thoroughly enjoyed the experience. A bonus to the rain was that there were
      no queues anywhere so we could go on all the rides as often as we wanted unfortunately
      the parade was cancelled and I doubt they could have the fireworks but those
      aren''t needed for a fun day out. It''s a beautiful park and it was made especially
      magical because of the Christmas decorations. Unfortunately the food was overpriced
      and not great but it was still so much fun I didn''t really care.","HK Disney
      is a lot disappointing as you don''t get the character interaction of the others
      and there are limited rides, etc around the park.","But Orlando Disneyworld
      this is NOT.  A great place for young kids to get some open space to run in
      HK, but the rides and park are all very small.  A perfect place for the you
      ones. And don''t miss the character breakfast each morning,...More","every time
      i went to Hong Kong, i went to Disney.and the last time i went was disappointing.The
      staff were very rude, i think 80 percent the staff were rude, they did not only
      rude with me, but with my sons, nephew, sister, parents and with the other customer.I
      know it was very hot in July, but they must have some standard to take care
      of that matter.Many other customer don''t like to queuing","You can go around
      the park, ride all the rides in a day but plan it wel. Go to the farthest area
      first (toy story land) and ride all the rides first while there arent that many
      people. We rode mine train first then the new ride in the haunted mansion with
      the monkey then toy story land. When the chinese tourists start arriving, the
      queues get really long","Not so good as it is publicised. You have to wait in
      a queue to get clicked with the disney characters which can be hours long. Rides
      are good enjoyed a lot. Waited for the special disney parade but it was cancelled
      due to rain. overall not so good experience.","So it is every child''s dream!
      Enjoyed the Mickey Mouse and the Lion King show! Loved the parade! Make sure
      you check the park''s sched ahead of time so you can greet and meet your Disney
      favorites. :)","We went there on the 31st December 2008 (New year eve). To go
      there, it is easily accessible via train, bus, taxi and travel agent. The cost
      of getting inside the park is around HK$300 . At the main entrance, we were
      given a 3 Dimensional specs to be used after dark. Four main parks: 1. Main
      Street: The place is tremendous, beautiful, full of shops selling Disneyland
      goodies, restaurants and the main route for the parade. We have a lot of pictures
      with mickey and other cartoon character.2. Tommorrowland: Spacelike place such
      as space mountain, buzzyear, space diner and so on. Unable to enter the stitch
      performance due to high queue up.3. Fantasyland: Suitable for young ages.4.
      Adventureland: My favourite part is the jungle cruise where we saw a lot of
      fake animal but trust me, it looks real and FUN. The tour guide for the cruise
      was funny and friendly. We watched the Lion King Festival  one of the kind,
      very well peformed, thumbs up. Very recommended. But i lost my spectacles..Haha5.
      Firework at 9.00pm were excellent but short while. It could be longer than that.
      We went back at 10.00pm. Very tiring but AMAZE by the park.","As a big Disney
      fan I had to tick Disney Hong Kong off my list, having done Florida, California
      and Paris I kinda knew what to expect, but surprisingly some things were different
      which was good.Firstly the train to get you into the parks wowed me, all the
      windows are mickey mouse heads and the hand holders are shaped like Mickey mouse
      heads and along the carriages are figures of the characters. The park is on
      a much smaller scale to any of the others but that made it so easy to get around
      in such a short space of time, we arrived around 1030 and were finished by 2pm
      but waited until 3 for the Halloween parade. The rides which I have been on
      before in the other parks were slightly different which was really good as you
      don''t know whats coming. The day we went queues were not long at all on average
      15 min waits. It was the Halloween festival while we were there so lots of things
      going on, there were people dressed up giving out free candy.The parade was
      a Halloween themed one which was really good. They had plenty of shops and restaurants
      around the park and the food was not badly priced considering its Disney.","Amazing
      Experience   we visited on Christmas eveWe witnessed the Tree Lighting Ceremony,
      the Magical Disney Parade and Fireworks DisplayQuite busy during that time   i
      would suggest 2 days during if you are visiting over Christmas The queues to
      get on to the rides were quite long   you could be waiting in line from 45 to
      50 mins at a time   so if you want to get the most during that time   2 days
      a must and perhaps staying at the park might be an option tooTry to get a photo
      pass so you can capture all of the best memories of your visit there   we regretted
      not doing thatlots of eating places and rest roomsUnforgettable Experience for
      us all","Been there with a friend of mine in November 2016. We really enjoyed
      the rides and had a super great time there. Amazing night parade and fire works
      show. Felt like a child all over again!!","Having seen Disney LA and Florida,
      the Disney setup in HongKong might slight not match up to the standards. You
      had the IronMan meet and greet which my son enjoyed. The only plus was since
      the setup was not as big, we could easily cover the entire attraction in a single
      day. Overall,my kids enjoyed and had a blast.","My wife is a Disney addict and
      I like a bit of Mickey Mouse myself even though we are in our fifties. We enjoyed
      HK Disneyland four years ago and probably liked it even more this time. We saw
      the day time big parade and the evening light imbued parade, both were great.
      We did the new Grisley Gulch mountain ride which I found terrifying. My wife
      was a legend at the Buzz Light year shoot out ride   have a go, it is fun. The
      food in the Hawaiian eatery was quite reasonable but the Main St Cafe was very
      ordinary. It is great to see how much the Asian culture gets into Disney, middle
      aged men sang the old M I C K E Y theme as the parades were conducted. It is
      a lovely day out with no adult themes, violence or unpleasant themes which plague
      so much of our entertainment these days.","Part of our Hong Kong and Macau tour
      package is a 1 day pass to Disneyland. I''ve been wanting to go there since
      I was in high school.The place is magical, especially at night when all the
      lights are on! Lines can be quite long though, so be patient!!!! Food and water
      can be pretty expensive. The same goes for the souvenirs. A 500ml bottle of
      water cost us HKD $28. A bowl of rice topped with beef each cost the three of
      us HKD $109 (HKD $112 for our friend).Loved the fireworks!!!! It showed almost
      all of my favorite Disney characters. Yey! : D","HK Disney is very small and
      lines for the big attractions are long. We did enjoy our day and took in a few
      attractions and the Lion King Show. We really enjoyed the Philharmagic 3 D movie!","It
      is indeed one of the happiest places on Earth though the rides are not as thrilling
      as the rides of Ocean Park HK. This park entertains its children audience visitors
      than young adults so if you''re a solo traveler, Ocean Park HK I think would
      suit you.If you''re going to watch some shows or presentations, you have to
      run around the park so expect to have feet soar lolNo fireworks display when
      I went but the parade would entertain you for sure!Overall, it''s very good
      and you''ll certainly feel like a kid after visiting this park","Whatever you
      do take the train to Disneyland as it is all part of the experience. The park
      is clean and staff are friendly and organised. I was a little disappointed there
      wasn''t more of a Chinese theme given to the park and it pretty much reflected
      a very small version of Disneyland in California. Tokyo Disney and Disney Sea
      both have a real Japanese flavour which in my mind really adds flavour to the
      visit.","We went to Disney as a big family trip and we ended up leaving the
      place at 3PM.All the major spots were too crowded. I had to wait for at least
      20 minutes for each attraction. The kids was tried after 2 3 rides. They should
      limit visitors per day or try to build more rides. I''ve been to Universal Orlando
      before and had such a better experience.Anyway, don''t forget to use fastpass,
      at least it can help you go through the line a bit faster.","It''s my second
      time to visit this place and it remains as magical as my first visit. Still
      enjoyed Space Mountain and Mickey''s PhilharMagic. The attractions are basically
      the same from a few years ago but the dream like atmosphere, the Disney characters
      and the nice staff make it an attraction not to be missed.","A heads up for
      anyone who buy the ticket online or using any platform with credit card, you
      have to bring the credit card along with you. If you dont bring the credit card,
      the staff wouldnt issued your tickets but, well, the ticket is available for
      several months (6 months if i''m not mistaken) so you might come in the future
      with the credit card. But overall Disneyland is beyond amazing and well managed.
      No matter how old are you, everybody deserves one Disneyland trip in their life
      :)","So many things were missing from this park. The castle is so small it is
      embarrassing and I did not find the American experience translated well. Food
      prices are obscene   $5 for a bottle of water   so bring your own water if nothing
      else. There are water fountains but the water is burning hot   really   and
      I was hesitant to drink it. Mystic Point was a great addition to the park as
      was Hyperspace Mountain. Strange hours   opening at 10 and closing at 9pm. Also,
      the train stopped at 6pm which was super disappointing! Why?? Really overall
      it seemed like a money grab and while the day was enjoyable, as someone in our
      party (who is a HUGE Disney fan) commented, the place  Is missing the magic
      . And I agree. Not a bad amusement park   the rides were fun   but the prices...
      .OUCH! Easy to get to though and the train there is fantastic. Also, a very
      nice train station at the park so that I highly recommend.","Was a great winters
      day in Hong Kong on xmas eve. We did not wait long for a ride and stayed until
      the end for the fireworks which was a bit of a letdown but other than that a
      great day was jad by all","Full with visitors..the worst part when a lot of
      people with no manners whatsoever jumped queue in the pretext not to be separated
      with their group. So what when the ride could only accommodate 2 persons. Get
      in line like other people coz everyone paid the ticket. They need to checked
      on this.Anyway weather was good...clear with cool breeze. Availability of new
      halal food outlet really helpful for muslims. A little bit pricey but guess
      what..it''s Disneyland. Newly opened Grizzly Gulch was awesome while other rides
      were equally good as well i.e space mountain, river cruise, small world etc.
      Parade of Disney characters were held at 12.30 & 3.30pm in front of Fantasyland.
      Was unable to watch fireworks display at 9pm. Very clean & well maintained.
      Overall, it was a wonderful experience even for someone in thirties.","Went
      disneyland with my 20 year old son. Reached there at 9.45am and bought our tickets
      at counter. Rides only starts at 10.30am even though entrance opens at 10am.
      Anyhow, we spent our time taking photos with some characters. Fast pass are
      available at two booths only; winnie the pooh and space mountains. We took most
      of the rides, watched the fun parades and left only after the spectacular display
      of fireworks at 8pm.","We decided to visit HK Disney on our honeymoon. The day
      we chose to go here it was raining very heavily. We were informed on the door
      that all outdoor attractions were closed and there would be no discounted tickets
      due to this which is highly disappointing considering over 90% of the attractions
      were outside! anyway... we decided to go in as we had made the journey all the
      way from Kowloon and we were really looking forward to our day out in Disney.
      I would say that it is not value for money at 530HKD, purely due to the fact
      that it is so much smaller than other Disney resorts. We enjoyed the magic of
      Disney anyway and had a great day after the rain had stopped and attractions
      had reopened!","There are more people here than the other themepark but this
      one is small and not much rides attractions. It is only because of the name
      that people flock this place. There are other countries with good Disney park
      but not this one.","Ok. So the smallest Disney park. Yes. Some  attractions  are
      just statues. However tickets are cheap (full price were about $60 Australian.
      Bargain!) and some of the rides are unique to this park and awesome. Phantom
      Mannor (a updated and less  horror driven  version of the haunted mansion),
      Grizzly Gulch and Iron Man are all unique and very well done. Space Mountain
      is excellent here and has a great Star Wars theme applied. Very quiet when we
      visited, it might be less enjoyable if very busy but overal worth the few hours
      time to experience a genuine Disney quality attraction for a lower cost than
      in the US or Europe","Though entrance fee is steep, everyone should experience
      it at least once. 1 whole day here should be sufficient. Do not miss the Flight
      of Fantasy Parade (once or twice daily) and the closing fireworks at 8pm daily.
      Disneyland Park is easily accessible via MTR from Hong Kong Island or Kowloon.","Our
      4th time at Disneyland Anaheim, My wife and I have been fortunate to visit every
      Disneyland Park on the planet and when asked which is our favourite, we always
      reply, Anaheim the original. It''s called the Magic kingdom and I can see why!","If
      you havent been to HK Disneyland, its all exciting and fun. But usually its
      not a place for return visit unless after the new Iron Man Ride is out. Don''t
      go during school holidays and public holidays if you want to avoid the crowd.
      The caramel popcorn was the best! We bought our tickets on Qoo10 and they included
      a free meal where you can pick from a few restaurants and pick your own meal.
      We went to Tomorrowland''s and had some yummy StarWars burger.Fireworks are
      mostly at 8PM   Preferred to come in at about 2 3PM if you are only in for the
      rides and some popular shows, you''ll have more than enough time for all of
      them plus a meal.If you''re in for a full exploration, photo taking with mascots
      and an extensive meal shopping, come at 12PM or earlier.Bring along your passport
      for ticket purchase redemption! And don''t forget to try the Mickey Face Shaped
      Waffles near the entrance of the park along the streets! Its extremely fresh
      and tasty!","Great day out in Disney Hong Kong, but was very very busy!! So
      be prepared to que que que!! Great rides & shows & the food is excellent there!","We
      took the MTR to reach Disneyland. Its the cheapest way to reach Disneyland.
      However, the MTR is crowded from Sunny Bay and you get sense of the rush   crowd
      that one would experience at DisneyLand. Getting the tickets was also a long
      wait. However, once you are in, you start liking the place. We went straight
      to fantasy land with the kids. It was enjoyable with several rides for the kids.
      Highlight was Winnie the pooh (less wait due to fast pass), Mickeys Phillar
      magic 4D show. Then we went to adventureland. The tarzan treehouse was disappointing.
      But enjoyed the jungle river cruise. The best attraction was liki tiki''s   it
      was splashing   sprinkling water   which provided much respite from the heat
      during the day. We missed the Lion King show twice so cannot comment. Off we
      went to see the parade at 4pm. This was very good and kids loved it. This was
      followed by visit to tomorrowland. The highligh here was astro blasters. This
      place had one ride for adults   space mountain. Great thriller. Overall, a decent
      experience. Much has already been said about it being small compared to other
      disneyland so no need to speak more about it. Kids would probably want to go
      again so will post more about that soon","Well if you are an adult this will
      definitely revive all your child hood memories .of mickey minnie pluto pooh
      lion king etc etc.Its a truly magical experience with all the wonderful memories.
      A must go for everyone.The only thing I could have wished for is more thrilling
      rides","Visit early when the park opens and get to the popular rides first.
      We managed 2 3 goes on each ride. It''s smaller than other Disneys but easy
      to get around and perfect for my kids (9 & 11). We left after the parade at
      3, went back to the Disney hotel for a few hours then went back for the light
      show at 8pm and fireworks at 9   both are amazing and highly recommended!","The
      entrance and facilities , crowd control , ticket facility, commuting is well
      planned and appreciable. Inside the park the sections and it''s details for
      all categories of ages are well planned and well maintained.  The parade and
      fireworks is a world class feature worth going for again n again. Kids will
      enjoy and thank their parents for the visit.  The food stalls and it''s contents
      should be planned for all types of crowd as people around the world visit this
      park to enjoy.All types of cusines can be included in menu as far as possible.  Soveniour
      stalls are appreciable. Overall a classic place . Visit worth remembering for
      a lifetime.","My 6 and 4 years old spent great time in Disneyland. It is beautiful,
      colorful and magical park. The only bad experience we had its in Frozen village.
      You need to wait 2 hours in a queue and it does not worth it.The show is awful.
      You will see some songs from the Frozen move and in the end 2 meters hight Elsa
      will  sing  the main song. Ridiculous! My kids were disappointed.","I''ve been
      in both Disney parks in America and this is the smallest but it has the same
      magic and enviroment. Some of the attractions are different worth them to see,
      the parades, the fireworks are just the same quality, Disney quality, sometimes
      you forget you are in China. If you love Disney parks and have spare time you
      will not be dissapointed at all. We had a great day there!","Every kid love
      Disneyland , but this is nothing for kids , not here in Hong Kong. Yes we all
      know it   s crowded but you just need to line up for everything , just to make
      a picture with Mickey and Minnie , my wife and me has to line up 3 hours in
      exchange , my little daughter can   t wait that long by 37 degree in the sun.
      After 3 hours lining up , lunch time , another 1,5 hour , just to get something
      to eat.... beside that   s the food was totally over priced ( that   s OK ,
      we knew where we are ) the taste was disgusting. All in all , my 4 years old
      Baby girl seen Mickey and Minnie for 40 sec after waiting 3 hours , got a mickey
      Balloon for 25 bucks had seen Goofy passing thru and then at 3 pm we left after
      in total being there for just 6 hours....All in all an wasted day in Hong Kong....","We
      are Disneyland fans and were excited to get to visit the one in Hong Kong. We
      loved that you take a disney train to the park with all the disney details like
      windows shaped like Mickey, it helped build up the excitement for our children
      for our big day.It definitaley caters to the asian market and focus''s more
      on shows than it does on rides. They have autotopia and space mountain but since
      many of the people thought that Space mountain would be too scary of a ride
      we were able to ride it 4 times without any lines. The longest line was for
      Pooh''s adventure and we had to utilize the fast pass feature to ride that one.
      The shows are amazing and done with disney style. If you are from America just
      plan on a completely different disney experience, but one still filled with
      all the Disney magic.","It''s small, and the Space Mountain doesn''t compare
      to Paris. The park was clean, but some of the staff spoke limited English, which
      made it difficult for me when I speak very little, almost no Chinese. It''s
      well worth the price of admission, and it still provides that Disney magic.
      Take your time, and enjoy your day. It''s a great place to spend a day!","They
      moan and groan every year and seem to constantly lose money. Yet their key attractions
      are closed for upkeep, it seems all the time. Food outlets are disgusting unhealthy
      rubbish fast greasy food. Full of junk shops and baby rides. When comparing
      this miserable place to Ocean Park its absolutely  no contest . Someone needs
      to be fired from management (n oxymoron in this case). Best skip it is my advice.","It
      was a heavy rainy Sunday but due to tight schedule, it was the only possible
      day we could visit, in the afternoon.Surprisingly, no need to spend hours to
      line up for the game, some even empty. It was a pleasure enjoy the not so crowd
      Disney Hong Kong.","It was a lot smaller, less crowded and also a lot less expensive
      then both US Disney''s. It was a nice park, laid out well and although I''m
      not a big theme park fan, we had two very nice days here. We were there on weekdays
      while local school was still in session so there were no lines for any attractions
      and that''s what made it such a nice experience (the longest line we waited
      on was for lunch   which was a bit expensive as usual but the food was surprisingly
      better then expected). The performances were all big production numbers   get
      your tickets early in the day to avoid being shut out. You can easily do the
      park in one day if stretched for time (at least during off peak times) but we
      did two days, took a very relaxed pace and did multiple rides for all attractions.
      Two day passes here cost about $85 USD which is substantially less then a one
      day pass to US Disney so take advantage of it and say you did it. TIP   all
      the employees carry different stickers of characters that they give you for
      free (when does Disney give you anything for free?!) so if you have kids, or
      just like stickers, ask for them.","This park had it all to give us another
      taste of Disney. Our last Disney trip was 30 years ago in LA and the fun started
      once again. We now have the Disney bug and will head for Japan to experience
      it again on our next tripDont wait, let the kid out in you once again in the
      clean organised Hong Kong fun park. We went during the week and had enough time
      in one day to see it all with the longest wait only 10 minutes","The park is
      very small and can be done in a half a day. It''s not like the giant Orlando
      and California sister parks. However it was so easy to get to and was worth
      the experience of being able to say I''ve been to Disneyland in HK! The Disney
      line of the mrt is decorated in all Disney items and made getting to the park
      so easy. The park is very clean and new. It really is beautiful!","Start at
      Toy Story Land then Adventure Land in the morning. Have lunch. Watch Lion King
      at 2pm. Go to Tomorrowland in the afternoon. Watch the parade at 3pm. More rides.
      Then take away food for dinner. Save a good spot at 6:30 near the castle to
      watch fireworks.","Great park, well it has to be as it has Disney stamped all
      over it. Lots of rides for the younger kids as well as the older ones, plenty
      places to eat, and it will always be busy. So plan for the whole day and stay
      till the end for the fireworks","The hardwork put by the staff is shown in each
      and every corner of Disneyland. Truly stands up to its name of giving us all
      a magical experience. The place even has a baby care center where a nanny is
      deployed full time. The parade is just unbelievable. Lots of efforts are taken
      by each of the performers and definitely worth a lot of kudos !!!","Really enjoyed
      our day here. It is a small Disneyland but that has the advantage in that you
      can do this in a day if you are only In HK for a short visit as we were. We
      only had to queue for a short while on some of the rides our longest wait was
      for the cable car Its a bit hilly so be prepared and wear suitable shoes...
      high heels are not a good idea !! We ate lunch there and while it was not gourmet
      food it was ok for fast food and the staff are well organised so your not waiting
      too long to get served.. The parade at the end of the day was really lovely
      and worth staying to watch .. our granddaughter was so excited to see all of
      the characters and dancing etc., It was easy to get to on the subway Disney
      Train and not expensive. Worth spending the whole day there, the prices of food
      snacks drinks is slighty more expensive than outside of the theme park but not
      too bad ..but if your on a budget take plenty of drinks and snacks with you.","If
      you want to relive your childhood memories, please visit the Disneyland at Hong
      Kong.. We had a amazing time it was just out of the world experience. All the
      rides, shows and specially the fireworks at the end of the day is just awesome.
      They don''t have much scary rides as its majorly for kids, but adults can also
      enjoy the rides. Connectivity for the park is awesome you have free shuttles
      service if you are staying at Hollywood Hotel or Disneyland Hotel. If you are
      staying in Hong Kong City then you also have MTR station just outside the park
      and even bus services are available.We recently visited in Jan 2015 and stayed
      for a day at Disneyland, but we all felt we should have spent some more time
      and enjoyed it.We all would definitely plan another visit to the place.","First
      time to any Disney Park. Was expecting it to be magical but we found the place
      somewhat muted.Maybe it was the crowd. We even saw a kid peeing at the sidewalk.
      It wasn   t as crowded as we thought but it may be even worse during peak season.Food
      was horrendous. Keep bumping into the smoking corners as well.","It''s Disney,
      always fun everytime you go :) sadly the day we arrived a typhoon was looming
      around hong kong, so the outdoors attractions were closed for the day :  but
      was still a great day none the less :)","Visited for the day during a 6 day
      visit to Hong Kong, to meet up with our grand daughter, who is just four years
      old, along with the rest of the family. Experience for her was terrific, which
      was the intent.This was her first time to experience Disney at any of the Disneyland
      resorts, so it was very much worth the visit to see her enjoy the attractions.
      As grand parents we have visited both Orlando and Anaheim ourselves, so we did
      feel that it was a bit lacking for the whole family visit.For us the experience
      was great, not in the resort, but in the reaction and interaction of our grand
      daughter","Visited in early Jun with family. It''s too much hyped, though few
      things like parades and shows are good. Taking photo with Characters are really
      frustrating and that to in hot sun. You have to wait for hours. They should
      have few more characters roaming around for photo pose.2 rides in tomorrow land
      and the roller coaster in adventure land were closed.","Super time spent with
      family. Tickets were pre booked (advisable for all tourists else there are long
      queues for tickets). Be prepared for long walks....can be tiring but its very
      well maintained and has a nice touch to it. Kids will freak out on all the fun
      activities...plenty of options for snacks and meals. A bit over priced though
      !!! You may want to carry your own snacks. Carry plenty of water.","The last
      time I was here, the area Disney''s California Adventure now occupies was the
      parking lot; it was magical then and through the years and changes, the magic
      remains. This was the first visit for my wife and daughters and they thoroughly
      enjoyed themselves. I could go every year and never get tired of it (I understand
      why some people opt to get annual passes)!To guard against disappointments;
      research, research, research. I cannot stress that enough. If there is an attraction
      that you have your heart set on experiencing, check multiple sources to see
      if it is undergoing a refurbishment and what the timeline for said refurbishment
      could be. I knew castle would be encased in scaffolding and would not be visible
      during our visit. However, it did not detract from our experience. If you have
      friends and or family members who recently went, hit them up for advice and
      learn from their experiences.Another thing, expect crowds regardless of what
      time of year it is. Granted, some times of the year can be busier than others.
      We were fortunate that the time we were here, crowds were not overwhelming,
      fastpass return times were reasonable, and we didn''t have to wait too long
      on the rides where everyone rides standby.Use the app; it will really, really
      help you;seeing standby times and fastpass return times can help you adjust
      your plan to how things are at the moment or help you decide what to do next.
      It will also help you locate where specific characters are and when they will
      be there.Lastly, I highly recommend seeing Mickey''s Soundsatonal Parade from
      start to finish. I also highly recommend seeing both night shows (Fantasmic
      & Mickey''s Mix Magic). If you want to catch the earlier Fantasmic show, you
      should probably go get your fastpasses for it right after rope drop as the earlier
      show will likely go fast. By the time I went to get our passes, only the later
      showing was available.","As a child, I have dreamed of going to Disneyland and
      when I got the chance to, I was somewhat, underwhelmed. It was smaller than
      expected, Ocean Park was way larger when it comes to the vastness of the park
      itself. It was also quiet and that''s a good thing, I think. I only enjoyed
      the souvenir shops and will probably visit again if given a chance.","After
      growing up in the USA and traveling to both Disneyland and Disney World, you
      have to go if you are in Asia!  Much smaller those in the US, but still all
      the charm and fun!","Me, hubby and our 3 year old bought a 2 day pass for less
      then the price of a one day ticket at Disney World. It was a wonderful experience.
      We came at Thanksgiving week and on both days there were very short lines. We
      were able to get on and off rides again which was great with a 3 year old :).
      The first day we spent in Fantasyland and the second we spent in the rest of
      the park. We saw both the day and night parade and they were both amazing. We
      saw the Frozen Christmas Tree lighting and then it actually snowed (not sure
      how they made it snow but it was cool). The people were very nice. The fireworks
      display was great. We visited Disney World last year and it was very big and
      crowded and very long lines. I''d rather come to Disneyland Hong Kong any day.
      Recommendations: get the 2 day pass, great value. Buy the photo pass, the photographers
      spend more time posing you and they are everywhere. We got a ton of pictures!","Hongkong
      Disneyland is the smallest Disneyland i have ever been. The overview of the
      theme park is for children and girls. But for men playthings is not any funny
      at all except on or two of them in the place. For me only grizzly mountain and
      space mountain was better than i has expected.","First time here in Hong Kong
      Disneyland... my kids had lots of fun here especially the Mystic Manor and the
      Toy Story Parachute Ride... The place is huge but because it is too pack during
      the time we go, so we wasted lots of time is queing for rides and even for foods.
      There lots of stuffs in there   they evenhave Starwars and Ironman ride in there...
      my kids loved it... Met Mickey & Minie, Goofy, Chipmunks, Donald Duck and Ironman
      too...","We traveled from the CENTRAL Train Station direct to Disneyland by
      trains and in my opinion this is the fastest way to get there as the train drops
      you at the front gates of Disneyland. It is recommended that you do arrive nice
      and early so you have time to see all the shows, ride all the rides, partake
      in photo opportunity''s with the Disney characters. I also recommend that you
      purchase the 2 day pass as then you can see everything you missed out on the
      first time. Please take lots of money with you of a fully loaded credit card
      as there is so many opportunity''s to purchase souvenirs from the many shops
      as well as photos from the Characters and rides. I found the fireworks OK but
      maybe not worth the hour long wait to see them.","Unless you''re a big fan of
      Disney, this HK Disney park is not really that fun.The shows are quite good,
      but the rides and other things to do are not really something worth spending
      money and half a day for. Fireworks were good, but not that amazing.It''s not
      that terrible, we just felt that we should''ve stayed in the city proper and
      explored there instead, afterall, we came to HK for the uniques HK culture,
      sights and food. The park did not really show the uniqueness of Hong Kong, so
      you can just go to other amusement parks, especially if you''re not travelling
      with kids. Enjoyed Ocean Park way more.Don''t think I''m coming back here.","I
      don''t like Disneyland...Said NO ONE ever! It''s just the best place to recapture
      your youth and forget all your troubles. I try to go at least 1X year. More
      if I can afford it!","Queueing actually need half an hour to one hour so best
      to go on weekday since the crowd is not as horrible as on weekend.","Having
      been to a couple of other Disney parks (Florida and Paris) I had high expectations
      for this one, and boy were they met. Though it is not as good as its American
      cousins, and it can undoubtedly be experienced fully in just one day, I had
      a fantastic time and would thoroughly recommend it to anyone, whether travelling
      with kids or not. Be sure to stick around for the fireworks   they are understated
      but still very entertaining","If you have a kid with you, you would have her
      or his eyes feast on all the attractions here. It isn''t as big as Ocean park
      but it is good for those who have been wanting to see Micky Mouse in person.
      Sadly the time I was here is when the castle was renovated.","The kids had a
      brilliant time here! For young children, it''s probably the best theme park
      I''ve been too   there was only one ride that my 4.5 year old was too short
      to go on. Definitely stay for the night parade, the boys loved it!","Recently
      visited Disneyland HK with 8 year old in tow. Entry price seemed high but prepared
      to pay for the experience. Unfortunately the experience didn''t live up to expectations.
      It didn''t take long for waiting times on all rides to be 1 hour and access
      to eateries limited due to crowd numbers. When we did finally get to eat the
      prices were outrageous  I guess that''s what you can get away with when you
      have a captive audience! We did really enjoy the Lion King show and the parade
      was great, so not all bad. Overall I thought the target audience was very much
      around the 4 to 8 year old, nothing much for older kids. For much better value
      we also visited ocean world HK where price was cheaper, rides and experiences
      much more appealing. My advice  skip Disneyland and spend your money at ocean
      world !","Hong Kong Disneyland is good. It''s a good place for both kids and
      adults. If you buy the packet tickets you will have the discount for food in
      Disneyland, and you can have small gift from the shop. Kids love this place.","I''ll
      start by reminding you that all Disney properties are clean, efficient, well
      maintained, family freindly, staffed by friendly and helpful people, and have
      lots and lots of Disney magic. All that being said, I found Disneyland Hong
      Kong to be my least favorite of the four I''ve visited. Maybe my expectations
      were a bit too great, but I found that it''s a little small feeling, and it
      seems like there are fewer attractions and definitely fewer shows than other
      Disney properties. The things that they do have are really good, but we were
      pretty well done before the sun went down on our one day visit. If it''s your
      only Disney opportunity, definitely go. If you love Disney definitely go. Just
      know what to expect.","You would need more than one day to explore the place,
      and enjoyed all the rides.Avoid summer days at all cost, blazing HOT!!! Visited
      in mid July, I skipped the Tomorrowland, and left the place early because it''s
      simply too HOT. Bought at least 5 6 bottles of iced cool soda drinks and stay
      within air con gift shops during most of the day, to beat the heat.Avoid June
      July, unless you like it hot.","From the gates at the entrance to the Golden
      Mickey''s at the other edge of the park, Dosneyland was truely a place of magic
      for our 19 month old and 5 year old. We were there for 2 days in the rain (definately
      get the plastic rain ponchos as it keeps your bum dry on the rides) but this
      meant the lines were reasonably short and it wasn''t as hot. A lot cheaper to
      get into than LA and the gift stores cheaper as well. My daughter (19 months)
      loved the carrosel and both kids lived Winnie the Pooh and It''s a Small World.
      Mystic Manor was great and the Buzz Lightyear interactive ride was great, you
      shoot targets and it keeps your score as you go! Definity use the fastpass system
      as it saves lits of time. We used it for Winnie the Pooh, Buzz Lightyear, and
      though they don''t advertise it you can use it on the Lion King performance
      too I noticed. The performaces and 3D show were great and a nice break to sit
      down! A fair number of meal choices and lots of drink carts around. Over the
      2 days we met and got autographs from Mickey, Minnie, Pooh Bear, Goofy, Pluto,
      Tinkerbell, Buzz Lightyear, Sleeping Beauty, and Rapunzel. You can but autograph
      books in any of the stores. We bought coloured felt pens as well as we thought
      it would look nicer in the book. We brought our own stroller but the ones for
      rent there were nice and had rain covers available (but didnt recline so wouldnt
      work for a newborn or little one needing to lie down to sleep). Our kids were
      given lits of Disney stickers by staff as we made our way through the park.
      The Waterworks show was fun as well and worth seeing. You can see almost everything
      in 2 days with young kids but a third day would make sure you saw everything
      and were able to get to your favourites again. We all loved it!","Spend almost
      half a day here. Bought the tickets to KLOOK app as it was way cheaper. Hence
      we skip the line and head to the machine where we exchange the print out voucher
      to Disneyland tickets. Not much adult rides however it just bring me back to
      my childhood days, revealing there is still a kid in me. Hehehe.","Enjoyed trip
      very much. Except that the Space Mountain area were not working that week. We
      left earlier than usual because rains were to hard! Not sure if night parade
      or fireworks pushed thru. Looks like they will put in new star wars theme rides
      soon...You should not miss storybook show. I was surprised by the production!Put
      on mosquito repellent; By the time I got home, I noticed large welts on my legs.","Had
      visited on 18th and 19th April with family. Awesome! If you are travelling from
      a hotel in city, go to GongKong station to catch train to Disney. You need to
      change at Sunny Bay. Taxi from Disney to Honkong island is around 220 HkD.Food
      in Disney is expensive. Try carrying snacks. Veg option is there.","A very nice
      park. This is one of the smaller parks in the Disney group. It can be finished
      in one day if you rush it but we took out a two day pass and took our time.
      Staying at the Disney hotel helped.The kids absolutely loved this place. The
      food is very pricey but what to do?!! The waiting times were not too long. I
      think the longest we waited was about twenty mins.Grizzle Gulch the newest area
      of the park and boy what a fun roller coaster.They are adding another area to
      the park due to open next year I think. Its good that they are expanding.Will
      definitely come here again as its a good size and not too big so the kids won''t
      get tired walking so much.","A fun space for all age groups... The creativity
      and the beautiful attractions for kids is totally commendable. The rides are
      all good . 5 stars for the time managemnt at the shows and rides.... Praiseworthy.
      We had a lovely time with our kids and they both enjoyed it to the core.","I
      spent 5 hours here and was left feeling a little dissapointed. This was my first
      time at any Disneyland and I had high hopes of ''magic'' and thrills, but only
      really found these at the live shows which are exceptional and definitely not
      to be missed. Watching the ''Festival of the Lion King'' bought a tear to my
      eye and ''Mickey and the Wondrous Book'' was also excellent, although slightly
      marred by the technical glitch during the performance. These very talented performers
      made the entrance price seem reasonable. I also appreciated the Valet service
      for left luggage, and parcel delivery at the gate to save carrying parcels around
      with you On the down side the supposed ''world famous'' Jungle River Cruise
      was certainly not worth queuing up for 20 minutes for, and somewhat underwhelming
      despite our excellent guide Eric''s enthusiasm. The ''It''s a Small World''
      ride was awful in my opinion, probably only suitable for very small children.
      Tarzan tree house is not worth it either sadly. Next time I will bring my children,
      and stay for the night parade and fireworks display where I''m sure is sprinkled
      with magic. Also I will purchase from the Disney store at the airport rather
      than queuing to buy here.","This was our first time visiting Hong Kong Disneyland.
      We have been to Disneyland Anaheim & Disney world in Orlando so we did notice
      a significant difference in size. None the less, Disney does not disappoint.
      There at some great rides here which are not at the other parks, Grizzly Gulch
      & Mystic Manner to nam a few. It would be good if they had some water rides
      as they are always good fun & were missed here. The Disney classic rides are
      all there to be enjoyed as well as some fantastic shows, the Festival of the
      Lion King was awesome. The street parade did not disappoint, it was full of
      colour, Disney characters & music. The night time fireworks are amazing too.
      Anyone who loves Disney will enjoy Hong Kong Disneyland","This is a much smaller
      Disneyland than the resort in Anaheim. However, that is part of its charm and
      advantage. If you go during the week (as opposed to a weekend, or holiday),
      there are relatively few people, and you can get on the rides with very short
      waiting times. Explore the Web site carefully. There are not that many attractions,
      and you will want to plan your time. Seniors are a particular bargain: only
      $100 HK. Food at most places in the park is very expensive, even by Disney standards.
      However, there is a terrace (with indoor places to sit) in Tomorrow Land where
      you can get hamburgers and similar food at somewhat reasonable prices. Be sure
      to consult the schedule folder that you can pick up from the kiosk just inside
      the entrance. Many attractions do not open until well after (an hour or more)
      the park opens, and many places (including some of the more interesting and
      reasonably priced) restaurants are simply not open on many days. Mystic Manor
      is a ride that is unique to this park, and the gift shop adjacent to it also
      has some unique items, including pins. If you have any physical limitations
      (including a problem standing in lines for a long time, or going up or down
      stairs), be sure to stop at Guest Services (I believe it is inside the City
      Hall) at the entrance to Main Street, and get a card indicating you need special
      assistance (there is name for this card, but I forget what it is). This card
      will get you special seating at shows, and special access in lines to attractions.When
      you arrive at Hong Kong Disneyland via the MTR, stop and purchase your return
      MTR ticket before entering the park. If you stay for the fireworks and then
      leave when everyone else does, you won''t be caught in a long line to purchase
      the return ticket then.","small disney and only 1 day is good enough. good for
      small kids, won''t feel too tired to play a disney like this.","Went there as
      it''s my girl''s birthday. Nothing exciting as has been here many times. Staff
      at the ticket booth not friendly n feel agitated when dealing with customers
      unlike the first time when we visit when they were newly opened. Now there is
      express ticket counter where we can get n need not wait for long g time however
      we did not try this as park was not crowded. Lion King show is fantastic. They
      have only one new ride.","If going to Hong Kong worth a visit as a Disneyland
      visit never disappoints stay in one of the Disneyland hotels to get the most
      out of the theme park experience","This was the third time i visited the place
      and i should say the park still amazed me. Seeing Disney princesses and Disney
      characters brought me back to my childhood stage. I will never be bored going
      back again to this place. We visited during the Chinese New Year week and there''s
      a lot of people. I guess if you want to try all the rides, don''t ever go during
      their holiday season to avoid long queues.","recently went to disneyland hongkong
      and was everything i could have wanted. I have been to america and this is just
      as good. You arrive there by a disneyland train all decked out with mickey mouse
      ear windows right to the entrance of the resort.Waiting for rides was not an
      issue the average was 10 minutes with the bigger roller coasters being even
      less.Found the park to be very clean considering the amount of people that go
      through it daily, would recommend a visit there","I was not expecting much,
      just an average experience because this park is the smallest of all the Disneylands.
      But thank God I was pleasantly surprised. My son was so happy to see Mickey
      Mouse & his friends live! He thoroughly enjoyed the Paint the Night Parade,
      especially the car carrier Mac & Lightning Mcqueen himself! The robot like dancers
      were very good also they danced right in front of us! (we were seated to the
      left if you''re facing Sleeping Beauty''s castle in front of the food stand.)
      Best to watch this on a weekend night at the energy is higher. We watched on
      a Sunday night and a Monday night and the former was sooooo much better! The
      park is less crowded on weekdays though & its best to come early to avoid long
      lines at the rides & gift shop cashiers. The fireworks was also very nice to
      watch but impossible to find a seat so reserve yours early. People don''t leave
      after the Paint the Night parade.The park is too big to cover in one day so
      best to buy a 2 day ticket. This is especially true if you''re staying in one
      of the two nearby hotels: rest in your hotel in the hot afternoons & come back
      late afternoon. Wouldn''t recommend the Space Mountain to young kids as its
      quite scary even for adults like myself. Food & drinks are plentiful but pricey.
      Recommend the bottled orange juice at hk$15 with a meal or hk$30 solo. Its cheaper
      than bottled water at hk$38. It can get quite hot & humid midday so you''ll
      need lots of liquids.Desserts are very cute with Olaf on ca!kes & Mickey Mouse
      ears everywhere even if you''re not a Disney fan it will be rather difficult
      to stop you''re inner child from surfacing & having a great time! One dampener
      on our Disney experience was the very rude employee at the bakery though. She
      was very rude & impatient to my mother (who is a senior already) but I think
      she''s the exception because others were very helpful & smiling.","Not only
      did my grandchild enjoyed Disney, we all did! We stayed until closing time and
      it was worth it. Love the parafe and fireworks!","We went on a Monday, there
      was no line longer than 30 minutes. Compared to the Disney''s in the US, it
      was much smaller, but worth the price. We bought our tickets on the mobile device
      the hotel provided and saved about $20 total. It''s very clean and we really
      did have a great time as a couple.","place is easy to get to by MTR and switching
      lines at the Sunny Day station, we went to the most upscale hotel that looks
      like the grand Floridian. we were very impressed by the vibe and the relaxed
      pace at the hotel   spacious, clean, all disney themes.","Hong Kong Disneyland
      is really amazing. It is compact enough to be enjoyed with little toddle packed
      with Disney magical atmosphere . Halal food available in the park. I highly
      recommend it.","We loved visiting Disneyland! I went there with my partner and
      it was the first time for both of us to visit any Disneyland and we really enjoyed
      all the rides and seeing all the characters walking around. We stayed there
      all day and really enjoyed the firework show on the night!","if you ever go
      to any Disneyland anywhere in the world go to this one !   Staff are friendly,
      all is clean and everything is organised to the minute for a great day out for
      all ages.","I really enjoyed the recently completed  It''s a small world'' ride,
      and the Winnie the Pooh ride   those were a blast from the past and are great
      retro fun. I was surprised at how much fun I had with the Buzz Aldrin ride   how
      can you not with a first person shooter ride. Space Mountain was worth a couple
      of repeat visits too. But I think the overall highlight, as an adult Westerner,
      was the surreal experience of being at a Disneyland world in Asia. In particular,
      watching Asians marvel over American culture is both entertaining and perplexing.
      I went in the summer of 2007, but had to leave prematurely due to a typhoon
      (level 8)warning. The worst of the storm ended up bypassing Hong Kong. I managed
      to get a free pass for a future visit as a result, so I went again the following
      summer. I got to experience an actual level 8 typhoon in the summer of 2008   but
      not while I was at Disneyland :)","It would be unfair to compare it to the ones
      in Florida and LA. But its not a bad alternative if you live in the Austral
      Asia region. Has all the usual. One thing that struck us was the number of adults
      visiting there from Mainland...More","I''m not a big Disney fan but my husband
      is (been dragged along to many Disney sites). HK Disney is my favorite site
      for the small, manageable size i.e. not exhausting. I even caught myself enjoying
      the night time atmosphere. Day time is also pleasant as the location is set
      between mountains and sea. It''s possible to spend the whole day but half a
      day is sufficient to cover most activities using express passes (excluding eating
      and shopping time).","I had went to Disney land in 2012 june it was a really
      a great experience all the rides and 3d,4d shows are wonderfull  it was not
      easy to see it in one  day  it is amazing","What a magical time! The whole place
      is perfectly run, with friendly helpful staff, and virtually no cues. The most
      we cued up for was to see Micky and Mini mouse at the begining for 20 mins;
      a fraction of time compared to any ride in the US. Although there were not as
      many action packed rides, we still did not have time to go round the whole venue.
      Well worth a trip   close to Hong Kong island, and also very cheap for Disney.
      In all a must if your out there.","My partner and I (who hasn''t been to a Disney
      park before) went for the day. This was plenty of time (we arrived early) and
      got to see all the attractions. We queued for 15 minutes at max for any of the
      rides. Only disappointment was the lack of choice of food and also that a few
      rides were closed for maintenance. Otherwise, a fun day and lots of different
      attractions.","It''s my first time to visit Disneyland. I''m with my friends
      at that time for our tour. We had so much fun!! From the amazing rides, parades
      and disney characters up to the wonderful fireworks display at night! It was
      such indeed a magical day that until now, I can still feel that spark whenever
      I hear   a whole new world.  :)","expectations where high as i thought it will
      be better than euro disney...but by far is Hong Kong DL an smaller and really
      boring park. We went there on an monday out of season an i can just imagine
      how people will lay on eachother on an chinese new year or other peak days....my
      godness never again!!","Magical places for imagination. 1 day is not enough.
      You probably need at least 2 days to explore and enjoy everything. Join activity
      with your kids. The late activity was superb. kids love the parade and the main
      attraction for us is the fireworks, full of colors and imagination. Excellent
      !!!!","Everything is impressive for our kids 2 and 7 years old except the weather
      that so hot and the food that quiet pricey. We definitely visit there again.","We
      loved it. What else can I say, its Disneyland. I heard it was really for younger
      kids but our 8, 9 and 11 year old as well as mum and dad loved it. Allow 2 days
      to cover everything at a more leisurely pace.","We got the train in early so
      went straight in at ten. The queues were better than expected and for the first
      couple of hours we didn''t wait longer than five or ten minutes. Only a few
      bigger rides, but a nice enjoyable day out. Perfect for the younger kids. We
      really enjoyed the parade and the sun shone all day.","I have been to Disney
      in Florida, California, Tokyo, and Hong Kong. This one is on par with all of
      them, it does seem a little smaller. From the start they have a train line,
      you get to the park. If you wish to use public transportation, and not drive.
      The cast members where outstanding, the ones I talked to spoke very good English.","It''s
      Disneyland, so it''s great to experience and typically it''s crowded and there
      are lines and therein lies the problem with a  Disneyland  in China: many people
      in the region fail to fully understand the concept of  lines  and respecting
      other people''s personal space. We politely observed behavior that at Disneyland
      Anaheim would have immediately been shouted down, but towards the end of each
      day, our patience ran thin with all the pushing, jostling, and line cutting
      and we found ourselves   elbows and dirty looks out   defending our space and
      place in line and feeling it was time to go home.","It is much smaller, but
      it may be even better than the one in Florida! The rides are longer, and the
      lines are shorter. The longest line I saw was 50 minutes. At the Disney park
      based in Florida you can wait 3 hours in line! There are different rides, I
      like them more in Hong Kong Disney. I would HIGHLY recommend it! If you go here
      are the rides you should hit first.Mystic Manor: Best ride out of all of the
      Disneys!Space Mountain: STARWARS    You should try to do most of the rides because
      all of them are absolutely astonishing!NOTE: Toy Story land gets crowded when
      the weather is good.*Wish they had fast passes for more than 2 rides *","Although
      much smaller than its counterparts, Hong Kong Disney is still a fun day out.
      They do sell multi day passes but you definitely don''t need more than a day
      to see it all if you plan your day well. Highlights: space mountain is better
      than others, and in place of the haunted mansion is Mystic Mansion with a magical
      rather than ghostly theme. Food is very expensive, not great, and few Western
      options. Staff were all very helpful and polite.","Great fun and at this time
      of the year (start of November) there were not that many queues. While this
      time of the year makes the weather perfect and the crowds much smaller, the
      open times are not long enough and ride that need a refurb are done at this
      time. The RC Racer was closed and the Autopia was gone, I assume to make room
      for the new Stark Ironman ride. Gates don''t open until 10:30am and it closes
      at 7:30pm so it made it difficult to have dinner and continue on the rides.","Small
      and dated. Poor facilities. Young children will enjoy the place. The food is
      very expensive...","We took two day ticket from klook   and let me tell you
      it''s never enough.. We went during Halloween   time so everything was decked
      up Halloween style Day 1 was a bit hectic with the late check in and long flight
      yet we managed to squeeze in few attraction leaving plays and parade for the
      next day. All the attractions were so much fun the kids loved it and then coming
      to parades disneyland night time   Halloween theme villan nights out   parade
      was simply magical!   We managed to catch up with festival of the lion king
      show which was   spectacular. We were not so lucky with meet and greet disney
      characters.. We did manage to get few snaps of various disney   characters   but
      missed quite a few tooo... The disneyland park did serve halal food so dining
      was pleasant experience. We booked our ticket through klook which included a
      voucher food voucher   so incase you are looking for halal restaurant you can
      visit Hk disneyland website for further detail on designated halal eatery anyway
      we ended our disney journey with a magical extravagant show of fireworks its
      was a perfect end to our magical journey Overall.. DISNEYLAND lived up to its
      tag line **where dream comes true *happiest place on earth**","We definitely
      had fun but we did not have enough time to enjoy all the rides. As expected,
      the line queue steals 1 2 hours from our time, even with picture taking with
      the characters. It''s nice that the characters are out in the grounds before
      the fireworks started so we were able to grab a few shots with them before heading
      home. We also missed some of the rides because of long queue lines, but we enjoyed
      our time.The crew are generally courteous, it''s the other Chinese (can''t tell
      f they are from Mainland) people who are rude, jumping into lines. One Chinese
      lady kept asking me something and looking somewhat annoyed but I can''t understand
      because she keeps talking in Chinese, even after a number of my attempts asking
      her to speak in English. The restaurants inside cannot accommodate large groups
      since they have limited seating, so we were not able to sample their food.If
      you are heading out to Hong Kong Disneyland, make sure you get there in the
      morning (we arrived early afternoon) so you can get the most out of your money.","Fulfilled
      all expectations. Although not as big as Anaheim it is such a mini version of.
      It is definitely a very full day and night. Recommend seeing the day and night
      Main Street parades. Follow the map and do land by land. Very clean and worth
      a visit at any age.","We had an impromptu trip to Disneyland on a weekday. I
      love the trip because there is no wait time or at least 15minutes wait time
      for the rides. Limited restaurants though because maybe it   s a weekday? The
      bad part though is that the castle is under renovation and there are on going
      construction in the park.","Not very impressed by Disneyland Hong Kong. This
      park did not feel like Disney at all. Atmosphere felt so sterile and cast members
      were rude unhelpful and unobliging.There is lack of shad ed areas throughout
      park and it got very hot out there. Food outlets very average","While smaller
      than other Disneyland resorts, it HK Disneyland still has that same Disneyland
      feeling and many of your favourite rides. Queues are normally much shorter than
      the other Disneyland resorts (if you steer clear of China HK school holidays).
      Good for 2 days if your first visit or 1 day for    old times sake   .","HK
      Disneyland has a typical disneyland layout and quality standards, but is missing
      (1) Pirates of the Carribean, (2) Thunder Mountain, (3) Haunted House, (4) Bear
      Singing Review, (5) Tiki Birds Singing, (6) Star Wars Tours, and (7) Peter Pan.
      Furthermore, Small World was closed for renovation. They substituted live shows
      such as Lion King, Mickey Review and a 3 D film    essentially replacing machinery
      with low cost Chinese labor. There is also a strange Toy Story area. For a small
      child''s first Disney experience, it is okay; for anyone else it is unsatisfying.","First
      time in Disney and I can say it was a great experience for both adults and kids.
      we enjoyed the whole time, even if the que for rides are unbelievable and foods
      are extremely pricey. It didn''t stop us from having the best time ever. Unforgettable
      indeed.","This is the second time visit Disneyland HK. 1st visit in Summer and
      now in Winter. The christmas decoration is very beautiful. Big christmas tree
      with colourful light at 6.30pm. The disney paint the night parade start at 7.30,
      this is the best parade in Disneyland.","Kids go crazy here!! Plenty of restaurants
      & snack stalls. A good place to spend your day with family. Lots of shopping
      as well.  What I liked   Iron Man 4D shows.","We enjoyed HK Disneyland over
      3 days, breaking it up as we were staying close by at the Disneyland Hollywood
      Hotel   a useful combination! We tried to avoid the weekend and busier times,
      as it gets too crowded and the waiting too long at these times. We did visit
      one night for a special Halloween evening, but the crowds and waiting made it
      another so great evening.At other times, we had a very enjoyable visit, and
      enjoyed the ride sand the refreshments.I only rated it. Less than a maximum
      because Disney is a big franchise and you pay good money to visit, so the expectations
      are very high. On the negative, several rides were closed on more than one occasion,
      which was a little disappointing. Also, on those big nights, they let too many
      people in, and it thus clogs everywhere you go in the park!Would still recommend
      it, and would love to go again, just recommend multi day passes and pick your
      time   we enjoyed coming back to the hotel and having a refreshing swim and
      relax before returning to the park later in the day."," This Disneyland is much
      smaller than one in Los Angeles but nevertheless fun. The rides are different
      and creative. Highly recommend to come during a weekday and avoid possible wait.
      We came on a Tuesday, and the longest wait we had was 30 minutes most rides
      had a waiting time of 5 10 minutes. Check out the Mystic mansion ride, which
      shares a similar concept of the haunted mansion in the LA park but with a twist
      (more fun). It is my fav ride. Toy Story Land has a thrill ride called the RC
      rider, and it is U shaped coaster (not like a coaster but like the traditional
      pirate boat ride on a rail). For younger children, Pooh''s house is a fun ride
      to check out! Do note that in May 2016, the Space Maintain is closed, and the
      Grizzly Mine car was on a two day maintenance when we visited on May 31st. Many
      Disneyland character showed up during our visit, and families and children can
      take pictures with them with ones'' own phone or have professional picture taken.
      Food is expensive in general. Though about the same price as in LA Disneyland,
      they are still expensive overall   about HK $135 (~  US $20) a set of meal,
      HK $35 50 a snack (Micky shaped ice cream is HK $35), and HK $35 a bottle of
      water or soda. A key chain goes between HK $65 $135 depending on the material
      (plastic vs metal vs stuffed animal) and quality. Disneyland cookies and chocolate
      goes between HK $80 $198 depending on the flavor and quantity. A box of 16 butter
      cookies costs HK $88 but a box of mixed flavor cookies in an anniversary souvenir
      box goes up to HK $198.","With our son, we had an unforgettable experience in
      the amusement park Disney Land. We were on the many attractions and we saw the
      passage of fairy tale characters","Smaller than the original but still just
      as much fun.  Fair way to travel but can be reached by train from HK Central.","This
      is our second Disneyland, first being Anaheim. Everyone told me it would have
      not compared to the ones in States but to my surprise, we found it enjoyable
      especially my 7 and 10 year old girls. Of course, it wasn''t as large or well
      organized as Disney Anaheim but I guess if you consider it being in Asia and
      within reach for most families. Its has served its purpose. The rides are good
      and queue''s moved pretty fast, food available was mostly Asian so it satisfied
      us Asians who are not accustomed to greasy fast food. Getting there was easy
      as the MTR goes directly to its doorstep. You must also consider we went during
      winter so it was cool when we had to wait for rides as I am not sure if would
      be as comfortable waiting when its during summer.Its Disneyland and it had its
      magical moments for us and the kids...","Having said that you are in Hong Kong.Much
      more of an expensive place than the states.Water, ice creams, meals etc overpriced
      but so is Paris, Tokyo,Having taken my children to them all over the years,
      if I see mickey mouse I might have to kill him..Bottom line, kids love it Disney
      know how to put on a parade and if i was still six i''d probably stay all week
      instead of being dragged round Kowloon by my dad.","I''ve been to the Disneylands
      in Tokyo, California, France and Hong Kong. In terms of the grandness of the
      four, HK comes in last. In terms of queue time , shortest. In term of friendliness,
      bottom two. You don''t really see the staff smiling here...to me, that is a
      pre requisite. It''s Disneyland and staff are supposed to be warm and smiling
      and.... U get my drift. Lots of mainland Chinese who love to cut queue but there''s
      nothing much u can do except to tell them off. Was also disappointed that the
      classic theme '' when you wish upon a star'' was non existent at the entrance.
      That always prep my mood when I enter all Disneylands. Of all the castles, this
      one is the simplest and shortest as well.","Disney land is part of our planned
      itinerary. My friend bought the e ticket from other agent which inclusive of
      meals and the price is cheaper than its original website. I am very impressed
      with all the 3D animation, sound system of all the performances there. Different
      theme parks have different attraction. Some suitable for kids below 8 years
      old like Fantasyland. Some suitable for teenages and above like Grizzly gulch.
      I never expected the roller coaster would run backwards with high speed! I also
      thought the fireworks was those normal fireworks show at night. But, alot of
      audience started fill up the place in front of the Sleeping Beauty castle 1
      hour before the performance and the whole place was even full after the night
      parade. I also noticed that this theme park not only full of kids and parents
      but, old people and old couples were enjoying themselves too. I am a bit disappointed
      on the souvenirs shop as I was looking for some Disney land famous cartoon CDs,
      sound track or storybooks for my niece and nephews. But, there is no where can
      be found.","Third time in HK Disneyland. We had a two day ticket this time.
      The first day was there from 1000 2000, five items enjoyed. We wanted to watch
      Mickey and the wondrous book, for two sessions we missed the opportunity. The
      staff told us that if we wait there 45 minutes before the session, we can definitely
      get into the 1000 seats. So going there last minute doesn   t help.We have priority
      pass for Festive of the lion king, moreover unless you are there 30 min before,
      the pass will not be helpful.At heavy rain times, most rides continue, it might
      worth getting a rain coat and keep going.We had priority admission for the Iron
      Man experience, but it is expected to be 102cm for this.","Hong Kong Disneyland
      is a recommended day trip out for anyone, no matter what age you are! I took
      the bus there which was very cheap for a ticket.Theme park tickets are $390.
      HKD for a day pass. Great attractions to see. I recommend the Stitch show, which
      was brilliant! Interactive technology! :) If you have time, go and see the Lion
      King show also, that was pretty cool too.There are various places to eat & drink,
      lots to choose from. And a great fireworks display in the evening just before
      they close.You can get the MTR direct to the theme park also, on the ''Disney''
      train! ;)","This was by far the most memorable trip for my daughter..worth every
      penny..we were there on 01 Jan 18, the last day of the fireworks before it was
      closing for an year..the rides and the character meetings are top class..a very
      compact and well maintained park","I''ve enjoyed the shops, shows and the place,
      however there''s no many activities and games for adults","We went here for
      the day it was a great day for all adults and kids alike. It has good mixture
      of rides and shows everyone enjoyed the day.","Hong Kong Disneyland was my childhood
      which I really want to go. When I was young, the most exciting was hearing my
      family that wanted to take to visit and play Hong Kong Disneyland. In Hong Kong
      Disneyland, you can find that it was actually princess life. It was because
      that there are play an ancient house, roads and even had a castle. Additional,
      it also had the roller coaster, it was so exciting. However, Before, whether
      went to Hong Kong Disneyland that was determined by my family choice. But now,
      that was my choice. I would like to date my friends and nephew and niece to
      play. It was because that in my view, no matter adult or child, they still had
      right to play. According this view, in December 2015, I date my family to go
      Disney, the weather was great, sunshine when we started to play. However, it
      suddenly raining and brainstorm. Therefore, I suggest you that before you go
      Disney, you must check the weather conditions.","We flew to Hong Kong on our
      way to the Philippines. Since we''ve never been, we decided to spend a few days
      in Hong Kong. While part of the family went to Macau, the rest of us decided
      to go to Disney. I bought our tickets before leaving for Hong Kong. We were
      staying at the Marco Polo Gateway Hotel. I was a little nervous taking the subway,
      because it was just me and my two teenage daughters and I knew we would be coming
      home late. The concierge assured me it was safe. We were about two blocks from
      the subway station. Note: Don''t buy your subway tickets in advance   they are
      only good the day of purchase! Anyway, this was the easiest cleanest and very
      safe feeling subway, I''ve ridden! We studied our map and made our way to Disneyland
      in no time. So I would highly recommend it...it certainly was cheaper than taking
      a taxi or buying your tickets thru a  tour ! Disneyland opened later than we
      were used to. Since I was unsure about the subway, we arrived quite early (about
      9:00am)...10:00 am Main Street opened and 10:30 the rest of the park opened.
      I don''t know if we hit the right time of the year (Sept 14), but it seemed
      we had the whole park to ourselves! It took longer to walk thru the que than
      it did to wait for the actual ride. The only down side, not all the restaurants
      were open and the Jungle Cruise happened to be closed the day we were there.
      We basically finished all the rides we wanted by 3:00! So we did some things
      we don''t have  time  to do at the Florida park. Sit and enjoy a cold treat
      on this hot day...reride rides...and enjoy the daytime parade and not having
      to stake out our spot an hours ahead of time. We stayed until the night time
      parade and the night time fireworks. I would recommend buying your subway ticket
      for the ride home, before entering the park...the subways come quickly, so our
      wait was very minimal. No, it wasn''t like the Florida park, but we weren''t
      expecting it to be. The Lion KIng show was top notch and might have been a little
      better than Florida, except they didn''t have the flying monkeys. The  Frozen  exhibit
      was a little bizzare but we were able to take our picture with Olaf. The food
      was a little odd, but my picky eaters were able to find something  American
      ish. The bathrooms were up to the usual Disney standard (very clean). For $180
      for the three of us (2 adults 1 child) plus the food and souveniers, I was glad
      we did it. How many of our friends can say they visited  Hong Kong Disneyland
      ? Also...Hong Kong charges 50 cents for shopping bags, so I would recommed buying
      your souveniers at the end or bring your own bag! :)","Absolute fun to visit
      the Disneyland. All rides are fabulous, not to be missed is the evening parade
      followed with fire works. We booked on klook with meal option so could save
      on the regular price at the stand. Also buying online saves time by not standing
      in queues. One can also buy priority pass. Those who are staying in a Disney
      hotel nearby gets 2 complimentary pass as part of the package. Disneyland Hong
      Kong is well connected with MTR, with its own station. Those who stay in Disney
      hotel nearby can board the shuttle every 10 minutes.","Disneyland HKG   been
      here several times over the years and we were back again today   the rides are
      still good and especially the updated ones BUT the cast look miserable and it
      has a huge impact on the whole experience. The staff need to know ''smiling''
      is the most important part of their job!!","We went with our 2 year old and
      found HK Disneyland was great. We wished that we had booked a night at their
      hotel (despite it costing more than our hotel back in Sai Yin Pun). It would
      have meant that we could spend more time at Disneyland and get to stay for the
      fireworks at night. We went on a relatively quiet day, but the lines were still
      too long to bother getting photos with the characters that made random appearances
      throughout the day. Lines were good for the rides that were age appropriate
      for our 2 year old and we still managed to spend the whole day there, but not
      see everything. If we had another opportunity to go back, we would invest the
      few extra dollars to stay at the Disneyland hotel and therefore spend more time
      there. Cost is to be expected going to a theme park, and they had a lot of Chinese
      food available for lunch. Either that or expensive Mickey Mouse shaped waffles.
      The train that takes you to Disneyland from Sunny Bay was Disney themed and
      pretty cool. We actually went several years ago, not in March 2018, but was
      worth the belated review.","This park is quite small compared to Anaheim. Go
      early as we had a maximum wait of 10 mins for space mountain and walked onto
      most other rides until about 12.30pm. Lines still weren''t massive after this.
      We went Wednesday.Still has the disneyland feel but don''t expect to spend all
      day there. Good for younger children or if you have a day to kill. Took a cab
      for convenience $180hkd one way.","We visited Disneyland over a few days as
      three generations of the one family as our first visit. Queues for popular rides
      routinely run at 40   60 minutes so it is definitely worth getting a Fast Pass
      (which we had included as part of our four day tickets). Be aware however, that
      once you get a Fast Pass reservation, you are prevented from getting another
      one for a period   either until the first one expires, or about an hour or so
      before it expires. We got a reservation for a popular ride that was four hours
      in advance of when we took it, and the stand by queue was then only 60 minutes,
      so consider your tactics. We were glad to visit over multiple days as otherwise
      we would have felt that we spent our time queuing instead of riding.","We went
      to Disneyland Hong Kong for one day in February 2018. We took the MRT from Kowloon
      and very easy to navigate. Had a good time, but must let any American travelers
      coming to Disneyland Hong Kong know that it is much smaller than the American
      version. Currently a lot of construction going on and part of the park is closed.
      Easy for an American to navigate as most everything is in English and Chinese.
      Glad I did it,but probably would not do it again.","its an amazing place for
      kids. i have been to paris disney too but this is good too.an advise for the
      disneyland admin: kindly flash the info of availablity of indian food. it will
      be very convenient for indian vegan tourists. go there early around 11 am or
      so and be there till 10 pm. evening parade and night fireworks are awesome.","As
      name suggests disneyland is just awesome being in my 20s still this place reminded
      me of my childhood. Evening parade is so much fun. No words to describe. A must
      visit place if you are in hong kong. Reach early hours so you can spend whole
      day.","My first Disney, so if you have been before you may not agree. I loved
      it. Staff at rides and shops etc were extremely helpful. The queues moved quickly.
      Food was expensive and quite good quality. The only issue I have is I wanted
      to get photo''s with characters but didn''t see one, which was disappointing,
      and we read the park brochure but there was very little information about where
      they were positioned during the day. I think you need more than one day, as
      we only had a short amount of time.","I had been to the U.S. Disney Parks over
      25 times, so to get to go to Hong Kong Disneyland was a treat. Getting there
      via the MTR from Kowloon was easy. Go early. We were there before the gates
      opened. It gave us time to take in the promenade leading to the entrance, and
      the crowds were not bad yet. This park is much smaller in scale than the U.S.
      parks, especially Disney World, so if you are there early, you can get through
      the whole park in a day. There were virtually no line ups early in the morning.
      It got busy mid day and then as it got to be later afternoon, the crowds tapered
      off again.I enjoyed the little differences between this park and the U.S. parks,
      whether cultural or otherwise. There are fewer rides and attractions in this
      park, but they are still expanding it too. The entrance fee is also quite a
      bit lower than the U.S. parks (for a single day entry ticket).","getting there
      is so simple with the train, & for seniors the price to go to Disneyland is
      terrific..a cheap day out!","I''ve been to most of the Disney parks and this
      one is by far and way the smallest of them. It''s quite easy to do most of the
      park in the morning if you get their early, after an 1.5hr we had done most
      of the main rides. Entry seems to be a very muddled affair with none of the
      gates moving fast, however when you are in everything works well.They open the
      different lands at different times which seems very strange. The Mystic Manor
      is definitely well worth going into.The park has the magic of the Disney parks
      and is well worth going to. I really am at a loss why you would need 2 days
      there, but I guess if you have small children it takes a longer to get from
      place to place.Plenty of different food options to choose from with a good mix
      of Asian and Western to choose from (prices are Hong Kong Prices so expensive).The
      parades get very crowded so well worth picking a good spot in the shade before
      it starts.","We were in Hong Kong for a few days and decided to visit HK Disneyland,
      although I could only convince my husband to go for for half a day (he''s decidedly
      not a Disney fan). I will put it up front that we didn''t have to pay for tickets,
      as a family member works for Disney and gave us his comp tickets.It was an incredibly
      hot early September day, and we just melted in the heat. I pulled out my umbrella
      to try to shade myself but it didn''t really help. I''m talking sweat dripping
      down your face and back, clothing sticking to you, eager to wait in a line indoors
      just for the AC. I love Disney, but I was actually fine to leave around 3pm
      as it was that miserably hot outside. If you can, try to go on a day where it''s
      a bit cooler!HK Disneyland seems much smaller than Disneyland and Disney World,
      but it is still magical. There were not that many Westerners there, first off,
      but everyone does speak English (you could easily get around otherwise, even
      if they did not). The park was a bit crowded but not that bad, and we rode everything
      we wanted to with average waits, although the longest line was for Mystic Manor,
      but thankfully most of that was inside with AC. Everyone was friendly and helpful   it''s
      Disney, after all!If you have the time, definitely stop by and spend a day or
      two in the park (two, if it''s super busy). Absolutely make sure to ride Mystic
      Manor, one of the greatest Disney rides in ANY park, as well as Grizzly Gulch
      (a mix of Expedition Everest and Big Thunder Mountain).Try not to compare to
      Disneyland or Disney World   it''s not either of those, Hong Kong Disney is
      its own park, with its own charm, and should be appreciated for those merits!
      Definitely worth a day trip from Hong Kong proper, especially with the incredibly
      convenient MTR.","There are limited rides compared to the one in Japan. The
      park is small and crowded. However, most queues are relatively short if you
      go on a weekday. Expect to wait about 20mins. If you had never been to Disneyland,
      then this will be a good one to start.","Happy happy place for kids... It''s
      beautiful and fun... So many things to enjoy and so little time... One day is
      not enough.. Fantasy land, toy story land, adventure land, tomorrow land, etc
      etc... Much more to explore... But do expect long queues everywhere... Spoils
      the fun...","I am barely qualified to gauge the quality of this or any other
      Disneyland: I don''t have kids, and have not been to a Disney theme park since
      the 1980s. But Ladyfriend and I decided not long after we moved here to spend
      the weekend on Lantau, and so here we are. And to be frank, I enjoyed HK Disneyland.
      It''s really small, as I am sure other reviewers have mentioned, which means
      that it''s doable in two or three hours (maybe longer if you have kids?), and
      although it is missing (m)any of the thrill rides that other Disney properties
      feature (you''ll have to go to Ocean Park for that...), it''s a nice way to
      spend an afternoon.I''m not going to explain what Disneyland is. But I do have
      some tips.   Go on a weekday. I have never been on a weekend, but am sure it
      gets crowded. We didn''t hit a single line on a Tuesday  They don''t start serving
      booze until early evening. I don''t know what my advice is on this front other
      than maybe  go later,  but I will say a propos of nothing that there is very
      little stopping one from hitting the 7 11 beforehand and bringing some roadies.  Lunch
      options are few, so same as above, although once you''re in it''s definitely
      not as expensive as other Disney parks in terms of food. There''s a multinational,
      cafeteria style restaurant that is not great, but certainly gets the job done
      is doesn''t break the bank.Note: I shouldn''t have to even write this, but if
      you are visiting HK and looking for an  authentic  HK experience, do NOT go
      to Disneyland. Stick to the main island and to Kowloon, where there are a million
      awesome things to do and see. But if you have kids, or like rides, or need to
      check this Disney experience off of your bucket list, or have some sort of personal
      Disney thing such that you are all but mandated by your therapist or something
      to spend as much time as possible in the happiest place on earth, I won''t try
      to dissuade you. Again, it''s small enough that you can spend the morning doing
      actual HK stuff, and then spend the afternoon here, or vice versa. It''s also
      pretty close to the action; if you''re taking public, expect about a 90 minute
      ride from Central, but the nice thing is that Disneyland has a dedicated MTR
      line, complete with Mickey''s head shaped windows and straps.Finally, here are
      the rides you want to go on, at least as an adult, as agreed upon by Ladyfriend
      and myself:1. Hyperspace Mountain (a very small scale Star Wars themed ride
      that piggy backs on the Space Mountain concept). It''s less scary than an actual
      roller coaster, but there are some stomach drops. If I were big brothering a
      kid who was very frightened of roller coasters, I would make him go on this
      to build his confidence. There are a couple of cool SW tie ins as well.2. Big
      Grizzly Mountain Runaway Mine Cars. It''s all there in the name, and it''s a
      fun little ride.3. RC Racer. This is their version of the big, swinging pirate
      ship ride that many of us grew up with. Stomach drops galore.4. Toy Soldier
      Parachute Drop. Your bench seat is hoisted way up high (affording one of the
      best views all day), and then... you drop. 5. Iron Man Experience. This is a
      VR experience that is several notches above seeing an action film in 4DX. It''s
      OK for adults, but I suspect elementary aged kids would love it.","This was
      our first family trip to Disney as a family (hubby and I have been to LA before
      we had kids). We left the hotel at 8.30 am even though the park didn   t open
      until 10.30. I   m glad we did as it took a little while to get there and get
      tickets etc. We bought the Priority line pass for an extra HKD$299 but it was
      a big waste of money as the park wasn   t busy and we only had to wait once
      for a ride. As the park wasn   t busy there were many food shops that were not
      open. Our kids (13 and 10) loved the rides and went of a few of them several
      times. My 10 year old cried when we were leaving as she didn   t want to go   so
      she must of had a good day! It was long and our feet hurt by the end of the
      day because of all the walking but it was definitely worth it to see the kids
      having such a good time. We don   t AUD$670 on 4 tickets including priority
      line passes.","Disneyland has always guranteed a great time and a magical experience
      and this one is no less. Although much smaller than its Orlando counterpart,
      this one has enough to keep us on our feet for a whole day. I think teenagers
      would want to choose Ocean Park over this, but I think Disneyland is equally
      good. Grizzly Gulch, RC Racer and Space Mountain were great thrill rides. All
      the others are mostly theme based and more enjoyable for children. Loved the
      Jungle River Cruise, def one of a kind. Also, the Lion king show is not to be
      missed. Make sure you try for Golden Mickies and Stitch Encounter as well. The
      Parade was as good as it could get. And the fireworks more than made it up for
      a great day. Since we went on a weekend, the lines were almost non existent
      and we could enjoy every rides twice without running out of time. The thing
      is, we ran out of things to do by 6 while the fireworks were at 8, so we had
      to go back to Hotel and return. Wish the park would have been bigger and equipped
      with more rides suitable for teenagers. It was still a very lovely experience
      and I would love to return someday with my kids.","if you''ve ever been to Disneyland
      in Anaheim or Disneyworld in Florida you''ll be in for a shock at this watered
      down version of Disneyland that doesn''t have many of iconic rides and attractions
      of the original. The upside is that you can make it around the park in a day   no
      problem. There''s not that much to see. Food is catered to the China visitors.","After
      visiting the original Disney parks in the US and even Euro Disney in France,
      the HK version is a bit of a let down. The park is really small and has only
      one real exciting ride, Space Mountain. The rest is mainly food outlets and
      artificial ''sightseeing'' rides. The staff is really rude and does not hesitate
      to grab you quite violently when you walk in the wrong way. Spending one day
      at this park, which only opens at 10am, is more than enough. This will also
      help travelers to avoid the overpriced Disney hotels and stay in downtown Hong
      Kong where much more exciting things are to be done.","An amazing Disneyland
      to visit and great experience for all ages. So many fun rides and activities.
      You can see the whole park easily in 1 day. We spent about 5 hrs there. Try
      the Mickey Mouse waffles on Main street!","spent the whole day with my family!
      we''re all adults but felt like a child a again. Bought the tickets in Klook
      Application, it can''t get easier by booking with them . :D Whole day of fun
      and strolling around, taking pictures. :D Though it''s really cold there by
      the month of November, still worth it to spend the whole day. Watch all the
      parades and be amazed. :D","Nice place and everything was organized quite well.
      Lot''s of shops and all kind of Disney stuff.  If have child up to 7 year good
      place to visit","Everything about our Disney experience was pure Disney magic.
      So easy to get there on the MTR and the Disneyland train   30m end to end. From
      the moment you get off the train you are surrounded by Disney perfection right
      down to the manhole covers all stamped with the Mickey Mouse icon. The park
      is geared to hold about 5 times more people than were there so we went to the
      front of the line straight away on almost everything waiting 5 15 max anywhere
      including the line to get pictures with Mickey & Minnie   perfect when traveling
      with a 5 year old. We were there for 7 hours on day 1 and 4 hours on day 2 and
      could easily have had a third day   so much to see and do   we never stopped
      and didn''t have to wait in line and still only just got around the rides. We
      did however ride the Buzz Lightyear ride 6 times and Small World twice. We only
      made it to one show and part of Tomorrowland is closed while they make way for
      new Star Wars attractions. We saw the 3pm parade on day 1 and both the evening
      light show and fireworks on Day 2 all of which were excellent. We took our own
      food (I think they just stop you from bringing packaged goods in like cans of
      drink because they would breach their licensing arrangements) so I can''t comment
      on the food option but one water and one Coke cost HKG$58 so it''s not cheap.","The
      Disneyland in HK was open many years ago but I was there only last year and
      it was the first ever Disneyland I''ve stepped into. Though not the only theme
      park I''ve been to, it was one of the most organized park with some really friendly
      and helpful crews around. As usual, there were tons of cash waddling tourists
      and squeaking kids in almost every corner of the park. The were the usual adrenaline
      pumping rides and really cutesy ones too. But the most memorable find in HK
      Disneyland was the food. Yes, the food was great and considering it is a world
      franchised theme park, it''s even better! We had braised beef noodles and HK
      roast rice with succulent pieces of steamed chicken and roast duck. The noodles
      was fantastic with tasty broth and firm hand made noodles with lovely pieces
      of braised beef. Totally unexpected but definitely worth it.","we been there
      by train,Ticket a bit expensive, but definitely worth for it. I love their popcorn,
      is delicious. I was there during monsoon season and its raining, a lot of program
      were cancelled but still enjoy it. The conversation with stitch, drawing class
      ...etc. love it!","Absolutely loved our visit here, really enjoyed being big
      kids. I   ve never been to any Disneyland before, so when I was told this was
      a small. I was taken aback, as there is plenty to do and as it was a week day,
      there were virtually no queues for the rides and we got the benefit of the full
      experience.Overall, I highly recommend a visit here.","Went to Disneyland with
      the entire family and for 2 of our kids, it was their first time. We enjoyed
      immensely and stayed til the Parade. Only thing missing was the Castle which
      was under renovation therefore no fireworks :( we''ll save that for another
      trip back","Regardless of age and how many times I visited, this place is a
      must when I travel to HK! They have added 2 new attractions, Grizzly Gulch and
      Mystic Point. Both are fantastic!","One of my most visited Disneyland cos it   s
      nearer to where I was coming. With the newly additions, it makes the visit more
      worth compared to 2 years back.  Must try the iron man ride and small small
      world.","If you like California Disneyland you   ll love Hong Kong Disneyland
      with its similar compact size. The park is laid out in the same pattern as its
      California counterpart   pass through Sleeping Beauty   s castle to enter Fantasyland,
      turn right for Tomorrowland, etc. Of course, there are key differences that
      make this park special, including hearing instructions in Cantonese before English,
      watching mainly Chinese cast members perform, and dining at restaurants featuring
      a variety of Chinese and Japanese items along with American hamburgers. It is
      at once a fun and cultural experience.My two favorite rides were The Iron Man
      Experience, a motion simulator movie ride that has Iron Man saving downtown
      Hong Kong Island, and Mystic Manor, a high tech reimagining of The Haunted Mansion.
      But no ghosts appear in this through the dark ride. Instead it retells the weird
      stories of explorer Lord Henry Mystic and his too curious pet monkey Albert.
      There are surprises funny and scary at every turn.The stage performances are
      top quality, including    Festival of the Lion King    with special effects,
      choreography, and singing on par with    The Lion King    on Broadway. My only
      letdown was the Iron Man Showcase when the hostess began by announcing    Our
      presentation will be Cantonese    and began to explain the various projects
      without one word of English. I was completely lost. Fortunately when Iron Man
      spoke, his words were only English. (Did this confuse the largely Chinese crowd?)
      A day   s visit here is worth the time, and you probably can do everything in
      one day if you come when the park opens and play all day, enjoying lunch and
      dinner on site.","Had been over 20 years since last visited and found that Disneyland
      still puts a huge smile on your face whenever you go.","Nothing out of this
      world but good scenery and organization. What i liked the most was the robot
      trash bin going around by itself and talking :D","We stayed 2 nights at the
      Disneyland Hong Kong Hotel. We are avid Disney fans! It is much smaller than
      any other Disney park and the attractions in most cases are similar like Space
      Mountain (much tamer and smaller) and It''s a small world (unfortunately, closed)
      but a wonderful experience with the new Toy Story Land. The hotel was like the
      Grand Floridian in appearance, but the room we stayed in was old. The bathroom
      was looking shabby. If you love Disney, you need to stay and experience it.","My
      husband and I took our daughter to HKDL for her 25th birthday. We live in Japan,
      and have been to Tokyo Disneyland and Tokyo Disney Sea (collectively known as
      Tokyo Disney Resort, TDR) numerous times. I grew up 20 minutes from California
      Disneyland, so I went there many times also, and I''ve been to California Adventure
      several times. We have become so used to the average 2 hour lines at TDR that
      we were really overwhelmed by the lack of people at HKDL. It was amazing. Maybe
      it was the time we went, after the Chinese New Year holidays...One thing that
      made us laugh out loud was while we were standing in line waiting to get in
      (the Park opens at 10 a.m., quite late), and we heard a male voice lament in
      English,  Everyone is here!!!  He''s never been to Tokyo, where the line on
      opening day for Toy Story Mania was 8 hours long! I almost told him to go there.
      There were perhaps 150 people waiting around, while in any one line of 20 or
      more at TDR there are 150 people. There were no lines at any attraction, except
      for the Golden Mickeys, and then we only had to wait for the previous show to
      end and we went right in. When lines at TDR can reach up to 6 hours or more
      on weekends and holidays, it was so fun to just walk right in and get on the
      attractions. All our friends who love Disneyland anywhere were quite stunned.The
      Park was extremely clean, including the restrooms, as is expected of a Disneyland.
      The details were spot on, too. Toy Story Land was very small, but awesome! Everyone
      spoke English, which was great for me. The only hitch to that was the Jungle
      River Cruise attraction, where you choose English, Mandarin, or Cantonese lines
      before you board the boat. Our English speaking guide surely was speaking English,
      but none that I had ever heard of. Everyone in the boat was looking at each
      other and shrugging. It was quite disappointing, as I''d read this was a fun
      experience.We had plenty of opportunity to meet lots of characters. The wait
      was just a few minutes. We got a Fast Pass to see Anna and Elsa of Frozen first
      thing in the morning, and the return time was around 11:15, but otherwise we
      just strolled up and waited our turn for Duffy and ShellieMay, Buzz Lightyear,
      Cinderella, Mickey, Minnie, and Goofy, and we saw several others but we already
      had their autographs.Tomorrowland was empty. We could ride Space Mountain twice
      and have our pick of seats. The Buzz Lightyear attraction was also empty. Instead
      of shooting at things as you usually do on the attraction, I just sat back and
      enjoyed the ride, knowing we''d go on it again. We missed the Stitch Encounter
      English show as the timing wasn''t right. You have to go to the attraction to
      find out when the times are for the various languages. This show is similar
      to Turtle Talk at other Disney Parks, I think.Fantasyland had the most attractions
      of any Land, with Dumbo being the most popular. We went on the Many Adventures
      of Winnie the Pooh. It''s similar but slightly different than in other Parks.
      The Golden Mickeys show was fun. It was done in Cantonese, with simplified Chinese
      and English subtitles on screens to the left and right of the stage. The show
      was similar to the Oscars or Emmys, with various (Disney) movies and characters
      being nominated, but no one is actually named a winner, which was a little disappointing.
      Of course, ALL the characters and movies presented were winners! Sleeping Beauty''s
      Castle was really small! You could walk through it in less time than it takes
      to greet someone. And the top half was covered with wooden boards, and that
      half of the castle was painted on the boards! I hope that this was to cover
      repairs being done. it''s a small world was as enjoyable as ever, and we even
      got our own private boat!Adventureland had only the Jungle River Cruise and
      Tarzan''s Treehouse, which is on a little island reached by raft, a la Tom Sawyer''s
      Island, though once you got there, there was only the Treehouse, and nowhere
      else to go. The rest of the island is off limits. When we were there, scaffolding
      covered the whole Treehouse. The whole area of Adventureland had plenty of wooden
      carvings, and a place to rest with various drum type instruments you can play
      with. The Festival of the Lion King show was also closed, another great disappointment.
      Grizzly Gulch was nearly all closed. The Runaway Mine Car attraction, perhaps
      the most exciting, was closed for maintenance. My daughter and I were really
      looking forward to the fish and chips sold at the Silver Nugget Saloon, but
      that place, too, was closed. It really was like a ghost town!Mystic Point was
      fun and interesting, with the Mystic Garden trick art a high point. Mystic Manor
      itself has some very interesting displays along the way toward where you board
      your vehicle, but as there were no people in line in front of us, we just zipped
      along. This attraction is really interesting, and unlike the Haunted Mansion
      it replaces. The outside looks nothing like the Haunted Mansion, though the
      sign on the gatepost looks similar in font and plaque styles, but inside there
      are several rooms that are similar, with different decorations, of course. Look
      for those!Toy Story Land was compact, but really colorful and fun. As someone
      who grew up with nearly all the toys there, it was nostalgic. We went on the
      Slinky Dog Spin, and it wasn''t as fast or stomach churning as we had thought
      it would be. The same goes for the Green Army Men Parachute Drop. Watching it
      beforehand, it reminded me of the Tower of Terror''s many ups and downs, but
      it didn''t feel the same. Not as stomach lifting. We skipped RC Racer, though
      it was fun to watch.Main Street was very compact, filled with nice shops. Even
      at the close of the Park, there were few people in the shops, so we could shop
      without being bumped. There were some items sold at great discounts, so this
      was a pleasant surprise. We went for one whole day, plus a a few hours the next
      day before our flight back home. The whole experience just made us want to stay
      longer, or at least go back again. We are already planning that for next year
      around the same time! Before you go, make sure you check the Chinese holiday
      calendar  and avoid any holidays! Go during the week, not on the weekends.","If
      your prior experience is with us parks, then prepare for a much smaller size!  The
      park is clean and well kept great rides and parades!  Thankfully no lines on
      the day we went but it was truly fun!","We came here during our family vacation
      at the Chinese New Year season so everyone was in a festive mood. Disneyland
      is great. Big park and many cool rides. Don''t miss the parade!","I''m producing
      a review more like a trip report so that people can make more of an informed
      choice as to whether they want to visit and if so when. There are lots of negative
      reviews on here but a lot are from people that visited in the Chinese school
      summer holidays. We visited the first weekend in May.We bought two day tickets
      as it was on offer so only $20 HK more. We were also staying on site. We arrived
      Sunday afternoon around 1pm and decided to just walk around. The queue for astro
      blasters was only 5 minutes so we went on that and it''s a small world was 10
      minutes. We also arrived at philharmagic at show time so saw that too. The park
      was busy but not crowded. By about 3pm queues were 30 mins plus. We only waited
      5 mins for a pic with Mickey. We had lunch at the starlight diner which was
      horrid. Burgers tasted like the worst school dinners. We looked in all the shops
      and the items are pretty similar with very few items location specific (and
      all can be bought in main Street) We left the park just after the 3pm parade
      and returned later for paint the night. We arrived 5 minutes before the start
      and found that the crowd consisted of 1 row of people seated on the kerb so
      we were able to stand immediately behind. Quite a novelty. After the parade
      we walked straight onto space mountain and went to astro blasters again before
      going to watch the fireworks at 8.30. Once again it wasn''t very crowded. I
      had plenty of room around me and we were standing at the top of mainstreet.
      The fireworks were nice but not as wow as the anniversary celebrations in Anaheim.
      The next morning we walked to the park which has a nice atmosphere. We arrived
      just after the 10.30 opening and headed straight to grizzly gulch. The wait
      for the runaway mine cars was 5 mins. This was a nice ride. Less rattly than
      Thunder mountain but the layout was like a tamer expedition everest We then
      went to Mystic Manor. We were able to walk straight on. This was a really well
      done ride. Very enjoyable and clever. We rode again straight away. Then over
      to toy story land. Queue for the parachute ride was 15 minutes. It was an OK
      ride. Lots of faffing around loading. Then 5 mins wait for RC racer. An excellent
      and fun ride. (We skipped slinky dog as we don''t have kids but the q was only
      5 mins). It was now about midday.We had lunch at the royal banquet Hall. Once
      again horrid. There was not enough seating. The serving staff were grumpy and
      just smashed plates on to the tray and the food wasnt good. DH had the pork
      bento box which was passable theme park food. I had the Chinese chicken and
      mushroom which was awful. The chicken was stuffed with bone and shards and was
      inedible. Not great for a   30   lunch. The queue for Winnie the Pooh was 45
      mins so we got a fastpass for 6 7pm. The queues for rides were all about 30mins  so
      we just went to astro blasters as that was 5mins and then headed over to the
      2pm showing of festival of the lion king. It was quite good although Rafiki
      wasn''t that good a singer. Our cunning plan was then to go to the shops whilst
      the parade was on but it started raining so that was then a trying experience.
      We grabbed a Mickey waffle (the one nice thing we had to eat in that park) and
      headed back to our hotel.We returned to the park just before 7 to use our Pooh
      fastpass. Then went to Mickey''s wondrous book at 7.30. This was a super show.
      We headed to space mountain where there were no queues and rode that a couple
      of times before the firework show. Main Street was even less crowded then the
      previous night. We headed about halfway down which was a better position then
      the previous night as we could clearly see the projections on the castle. The
      only problem was that the misty humid weather obliterated some of the view of
      the fireworks. This is not a park for thrill seekers or probably teenagers.
      It is a park for smaller children and Disney lovers. The park was easy to get
      around when we were there and the queues weren''t bad at all. My advice is get
      there first thing and don''t bother visiting in the afternoon. There have been
      a number of comments about the mainland Chinese visitors. The park was not busy
      when we were there and apart from being very loud, repeatedly using their flash
      in the shows and being a bit pushy going into the shows we didn''t have any
      problems. Everyone was queuing fine and the staff were trying to be on top of
      any queue jumping. The toilets in the park were only just OK despite there being
      staff.The staff in Mystic point, Grizzly gulch and toy story land were very
      Disney. Lots of smiles and waves. The staff in its a small world were the opposite.
      I think it is the staff which means that this visit is missing something. There
      is just not that smiling and friendliness across the board. We also found the
      stock in the shops very limited. Most of the garments were Mickey, Minnie, Donald,
      ensemble, stitch or star wars Women also had the option to have cinderella but
      no star wars. Children''s stuff was obviously princess or avengers or cars.
      No animals or villains. I was also very disappointed that there werent any Xmas
      baubles. Pricing varied. Some things were far cheaper than US Disney others
      massively more expensive. There were quite a few characters around on the Sunday
      and Monday. Mickey and Minnie were at the entrance when we arrived at opening
      and they were also there when we returned at 7 on Monday.Mickey and Minnie were
      in the fantasy gardens both days.Donald and daisy were on main Street both days.Chip
      and dale were in grizzly gulch both days.Buzz lightyear and woody were in Toy
      story land both days Tinkerbell and at least one princess were in the fairy
      tale forest both days.Baymax was in art of animation both days.Lotso bear was
      in main Street on the Sunday. We saw piano entertainers on main Street, broom
      art near the jungle cruise and drumming near astro blasters. Be aware you can''t
      take big bags into the park and will be required to store them.The weather when
      we visited was pleasant. It was comfortable walking around. Be aware that they
      seem to cancel the parade at the drop of a hat and certainly with less rain
      then in the US. An umbrella is $160 hkd and a poncho $65 so be prepared if you
      don''t want to pay.Transport to and from the hotels was excellent. The hotels
      are 15 mins walk (disneyland hotel) and 30 mins walk (Hollywood) at an ambling
      pace. The park was very clean when we visited.I believe that food and drink
      is removed if you try to bring it in but double check before you visit ( we
      didn''t try). It might be better value and experience to leave the park to have
      lunch at one of the hotels then return (make sure to get your hand stamped  they
      won''t offer) We had a nice time and we are glad we visited but we wouldn''t
      fly to Hong Kong specifically to visit here whereas we would to Anaheim","It
      was my third visit in 6 years but every trip didn''t fail to surprise and entertain.
      The first visit in 2006 was by myself, the second with my grown up children,
      and the present with my children and my grandchildren... It rained ligfhtly
      half the time but we stayed the whole day right up to the final fireworks display!","My
      husband and I literally opened and closed disneyland. It was just us, no kids.
      Bit of a long day but I didn''t want to miss anything. I guess you can''t work
      out wait times etc.Loved the disney resort line you use to get there, we took
      the first train and it felt the busier than the park almost. We actually didn''t
      have to wait that long for most things, except the golden mickeys show but it
      was very much worth it. Main Street was awesome had one of the best cheeseburgers
      in Hong Kong. Be careful if you are coming from a place that has a good exchange
      rate, we totally overspent in the shops! It was very very very humid, advised
      taking fan, or spray mist etc, very easy to get dehydrated. Must sees   golden
      Mickeys show, it''s a small world, and the main parade.You have to stay for
      the light show, most is in English, get there early for good viewing area. Prepare
      for etc digital cards for photos  battery etc, I know this sounds silly but
      we took an immense amount of photos and our camera died, lucky we had an iPad
      with full battery!Happy travels!","On my first trip to Hong Kong, 4 days and
      3 nights, we decided to spend one of our two days at Disney.  Had a grand time.  Rained
      heavily on the way, but the weather calmed around noon and the wait times were
      negligible.  The...More","I always loved Disney. This Disneyland is small   you
      can finish all in 2 days. They recently added a backwards rollercoaster, and
      it''s so awesome! You could really see the difference between each ''land''.
      The parade floats looked new. The parade song is catchy, I got it stuck in my
      head! The fireworks at night was the best. The fireworks goes along with the
      music, and you couldn''t hear any BOOMs during the performance.","We went on
      a Thursday hence not too crowded. My 8 year old had quite a good time. We started
      quite late but stayed till the end of the night to watch the lovely fireworks.
      Blessed with good weather   not many sheltered places to hide if there''s rain.
      Didn''t really enjoy the food there as compared to the ones at Tokyo Disney","Just
      okay. Had fun, but I enjoyed HK other than this attraction. Yep     looong queue.
      So you better prep up some energy to be ready for this in exchange for 1   3
      minutes ride.","The best way to relive ur childhood memories, the cartoons you
      watched on tv screen, will be seen wearing colorful costumes, hug and take pictures
      with you. Best place for kids aged 5 15 according to the rides, few are for
      adults. Popcorn and cotton candy counters all over the place and some restaurants
      serving lunch and other food items. Do visit the Disney gift shop and make you
      kid be happy by buying happy a mini Mickey or Minnie.Be prepared to spend the
      whole day and wear comfortable footwear to prevent fatigue.For more bat Hong
      Kong visit my blog   sapphireziva.blogspot.com !!","if you wanna feel to be
      young again, well I guess Disneyland is the best place for you mate. It was
      really a lot of fun experience!","Awesome Place, kids and adults will definitely
      enjoy this place, Very busy place, the q''s are long but worth it especially
      the theatres, the Mickey 3D, everything is fantastic, all the Disney characters
      are just Perfect. 2 days pass is not enough. Will definitely coming back here.","For
      any Disney fan, this is a must. It''s great to see another park in another country
      and the similarities and differences. Some of the rides are the same, but there
      are regional touches, such as DimSum or Authentic chinese foods in the food
      courts. The souvenirs are great as they are all Hong Kong related. Because its
      fairly new, it is much smaller than other Disneylands. If you''ve been to the
      Magic Kingdom, this will not even measure up.","Hong Kong Disneyland is an amusement
      park perfectly appropriate and suitable for any age group. With all kinds of
      shows, games, and parades for visitors to feel comfortable. I frequently question
      Disney''s employees, and they answer with great hospitality. No one would be
      in a bad mood whilst in Disneyland. The sensational food that is served there
      each has a special theme that will surely exhilarate your tastebuds. The nightly
      firework show cues that the day has ended and every visitor must exit the premises.","We
      had spend our Christmas day at Disneyland and there are lots of people on that
      day. It''s easy to reach by MTR and bus station just outside the park. Great
      park for kids, especially those who grown up with Disneyland characters. Sadly
      we only able to catch the short  raincoat  version of parade on that day due
      to rain. Luckily we still able to see the fireworks at night!","Hong Kong Disneyland
      is tiny but yet costly.Very few selection of rides and need to queue for quite
      some time.In order to spend time more efficiently, I suggest going there after
      lunch or even later in the afternoon for following reasons (if you won''t go
      for all the rides):1. Avoid overhead sun2. Save money on food and drinks in
      the park3. Do not need to wait for hours for the night parade4. Great sunset","Disneyland
      Hong Kong is spotlessly clean, well laid out and great fun. we visited with
      friends & their families. We enjoyed the whole day esp Hyperspace mountains,
      Iron man show , Mystic Manor,& other rides Disney Parade was enjoyable","We
      spent 3 days at Disney with our 4 kids, hoping that they   d enjoy it as much
      as I had as a kid. Unfortunately the greed of Disney has destroyed some of the
      magic.The Monday was so busy that we almost left. I made a complaint about the
      overcrowding and was told to join a queue to complain!Some of the rides are
      50 years old and need to be retired. My kids laughed at many of them. The fast
      pass system is poor (go to universal and see a proper fastpass system in action).Our
      next two days were much better   it was a shame that the first day left such
      a bad taste in the mouth. This was my 5th time at Disney and I think it   s
      my last.","Usual Disneyland affair but disappointing as it is a lot smaller
      than other Disney affairs e.g. Florida. This makes the experience much less
      real as you can see the mountains etc   so you know you are not in DL but actually
      in a theme park in Hong Kong.At least the tube station was fun with Mickey Mouse
      themes throughout.I wouldn''t recommend it but if you are a Disney fan then
      it might be worth a visit just to say  I''ve been","From riding the disney train,
      to the walking in to your favoutie disney tunes. Loved every moment. I was back
      to a child again. I stood in line to get photos with Mickey and co. and watched
      the parade! Staff were friendly and I enjoyed the rides ALOT. Great attraction","Had
      a great day, although the park felt small in comparison to its American cousins
      the range or rides was good. Easy to reach by metro and a nice break from the
      city.","everyone would love going to Disneyland. Their theme park.is so fascinating,
      always crowded all the time. The souvenirs are so cute and adorable. Spend some
      memorable time with ur family here and let their staff take your family picture
      and you can have a nice family portrait printed in the Winnie the pooh frame.
      The softcopy file will also given to you by their apps. Tips:  buy their tickets
      online include meal. They have a package of 4. it''s cheaper buying online than
      buying on the spot. And you''ll save a lot of time to avoid the queue  Wear
      hat and sunglasses, use comfy shoes. Cause you will walk a lot  Try their fastpass
      tickets","My first visit of HK Disney was in 2009 and came back on 14 May 2012.
      It was always the highlight of our HK tour. The first visit was okay because
      we did not explore much about the park. Then, the second visit was great because
      I brought my nephew with me and I saw the excitement in his eyes and he enjoyed
      it very much. I think he most enjoyed the 3D show because that was his first
      time to wear a 3D glasses.","Hong Kong Disneyland has now been in operation
      over five years, and for locals, we''ve heard about a fair share of complaints.
      The reality is that HKDL is just as magical as any of the Disneylands, and has
      its own unique charms and attractions. You can read about all the attractions
      on the website, but for our family, we just love the East meets West meets Disney
      combination of it all. This is not the largest of the Disneylands, but we like
      that, too   very easy to enjoy the entire experience in one day   in fact, half
      a day if you don''t feel compelled to do everything. The food is particularly
      above average for theme parks, so that''s good   and not as expensive as you
      might guess. And the lines are very tolerable   it''s not uncommon to just spend
      5 to 10 minutes in line for any attraction. The only thing that might be a bit
      of a bother is the heat, but hey, this is the sub tropics. I''d definitely say
      this is a must do for anyone visiting Hong Kong, and it''s a great regular outing
      for locals. Also, btw, the staff and characters are exceptional   particularly
      good with children.","I admit I am a huge Disney fan and love anything Disney
      but I honestly think this place is amazing! Admittedly it is smaller then the
      other Disney parks and there arent a lot of thrill rides but at the same time
      there are still some really great rides. Even better we went midweek and barely
      had to line up anywhere! We really enjoyed Astro blasters, Its a small world,
      Mystic Manor, RC racer, Mountain mine cars and the Tea cups. The shows were
      truely spectacular, we loved the parades but the fireworks can not be missed!!!
      It was the perfect way to finish the day! Only negative thing was the turkey
      leg from the snack cart, yuk!","We were here by Mac 2010. We came on 10am ie
      opening time and return on 8pm after watched firework performance. The time
      we came not peak season therefore no need to queue very long when playing the
      games. We really enjoyed the whole day at Disneyland. We hope will be able go
      other Disneyland for example Japan or USA in the future.","We   ve been at Disneyland
      Japan to compared it with, and obviously this was not as good. The queuing line
      to take pictures with Disney characters took almost 2 hours, way overprice meal
      and not too many options for attractions has made our visit shortened to couple
      of hours only.","We love theme parks and have visited several theme parks around
      the world. Unfortunately this is the worst we''ve been so far. This was our
      second visit to Disneyland in Hong Kong. The park was overcrowded with long
      queus. Due to the guests from mainland China there was a lot of queue jumping
      which resulted in a lot of fighting and pushing. The staff of the park did nothing
      to control these people. We stayed for four days but after day two my children
      did not want to go to the park anymore due to these rude, unbehaved guests from
      the mainland. Toilets are disgusting with human feces on the floors   again
      due to these uncivilized guests. The staff are rude and not all of them can
      speak English. They shout and scream at everyone. It was hot and all queues
      are in the sun. So be prepared to stand for hours in the sun in a queue with
      people pushing and breathing on you. I cannot recommend this park to anyone
      with small children. During the parades adults are pushing you. On more than
      one occasion I almost dropped my child due this. I visited this park about seven
      years ago and it was totally different. It definitely worsened over the years.
      If you are looking for a fun filled family vacation at a theme park, please
      AVOID this one at all cost. Rather go to the more civilized Disneyland in Tokyo.","If
      you love Disney, and even if you don''t, when you come to LA you should visit
      Disneyland! It is magical! I wasn''t really interested, doing it for my kids,
      but I got into it, had a fabulous time, went on many more rides than I expected
      to! Get the fast pass! More expensive yes, but saves you so much time! Priceless!!","First
      you start with MTR train which is built with disney theme (when you board from
      Tung Chung). Then the fun element starts. If you start early like at 9am you
      will not find any queues initially. However you cannot avoid long queues for
      any ride. Average wait time for any ride (depending on the popularity) is 30
      minutes for a 2 3 minutes ride. We liked following rides very much and highly
      recommend:Winnie the Pooh rideGolden mickey showLion King showToystory rideBoat
      ride in fairylandRail rideCastle rideMickey 3D showParadeMeet the characters
      are waste of time, it takes too much of time","Don''t expect massive rides,
      there are some good rides but in there own way even the child rides, like the
      magic house with all the special affects which are great... Anything to do with
      Disney is amazing... The only downside to our visit they shut a lot of the rides
      as there was a typhoon warning...","Two big kids enjoyed the whole Disney experience.
      The attention to detail in the park and the quality in the rides made for a
      fab day out.We booked a one day ticket but spent all day there (approx 10 hours)
      until the park closed after the fireworks finale. We felt a day was enough as
      the park is quite small in comparison to anything you get in USA and therefore
      we walked around at least twice and covered all the rides we wanted twice too.
      The queues for most rides were under 30 mins without paying for a fast pass.
      Our tip would be to buy any gifts and memorabilia when you arrive as the stores
      were quiet and you can leave them with guest relations to collect end of the
      day. The queues at the tills at the end of the day were crazy!","No age limit
      to experience disneyland. You will forget your age in the merriest and happiest
      place in the world. The parades were a sight to look forward especially the
      evening parade with all the acrobatic lights and the fireworks. Couple of rides
      and show were close","When it comes to Disney, you expect wonderful things,
      but we were very disappointed with our overall experience here on our recent
      visit. The park is very small and doesn''t have the magical vibe that Anaheim
      Disneyland exhibits. The majority of staff that we encountered had the personalities
      of bricks and showed no happiness or excitement. Food options were very average
      and opportunities for photos with characters were limited. With the park closing
      at approx 8:45pm on the day we visited, photos with Mickey and Minnie were closed
      off at 4pm, causing much disappointment from numerous visitors. The general
      upkeep of the park also seemed quite poor, with overgrown gardens and dirty
      grounds in some areas. While there was the advantage of much shorter queues
      for rides, this Disneyland just feels like another average theme park and doesn''t
      even come close to comparing with the original in Anaheim. I wouldn''t recommend
      visiting this theme park.","I have been to Disney in Paris and Orlando and was
      looking forward to sing Hong Kong to the list. I wasn''t disappointed. Sure
      it is a bit smaller than the other two but we had a fabulous day out Disney
      style. It is so easy to get to as well from Hong Kong on the tube.","Disneyland
      Hong Kong.My husband and I visited Disney on a Sunday; the whole of Hong Kong
      must have been there. Starting with the Disney Mtr, there where queues.The Disney
      touch started on the MTR with Mickey shaped windows and brass effect Disney
      characters in glass domes. You need to get there early to avoid the queues.
      You get your bags searched on your way in, though you can bring a bottle of
      water in with you, and there are water fountains to refill your bottle. You
      can pick up park maps upon entrance in Main Street. Upon entrance to the Park
      it is set out just like the one in Florida, Main Street USA which has the street
      of old fashioned looking shop fronts, selling Disney goods. A short walk along
      the street and you see the Sleeping Beauty Castle and the road leading to the
      different lands. The park has all the old favourites, Small World, Space Mountain,
      Mad Hatters Teapots etc.The new land Grizzly Gulch has just opened, its very
      small but has a good ride called Big Grizzly Mountain Runaway Mine Cars, which
      when we got there didn   t have a queue and we got on straight away, and we
      enjoyed the ride. We also enjoyed the jungle river cruise in Adventureland,
      and make sure you don   t miss Mickey   s Phihamagic the 3d adventure.Check
      the guide to find out the time of the parades and if you are not planning on
      watching all of it, make sure you are not around the route of the parade because
      you cannot get through the path way until it has passed. Don   t forget to use
      the fast track feature of your tickets; this will enable you to enjoy some of
      the rides without having to spend all of your time in a queue. There are quite
      a few places to eat at the park and we found the prices ok. I have read many
      review of the Park before we came saying about people pushing in front in the
      queues, but we didn   t find it a problem in Disney. You can get around this
      park in a day, but probably best not to go at the weekend. We found that the
      park was very busy with families and couples of many ages.Did I enjoy the park,
      yes, am I a Disney fan yes.","Purchase your ticket beforehand. The queues to
      enter are long, but the queue for tickets is SUPER long. Not many great rides,
      very kiddish. Suitable for 8 and below. The best ride was Hyperspace Mountain.
      Book your fast pass time immediately  there are only 3 rides available for fast
      pass. Download the mobile app   it will tell you the queue times for each ride
      and all the show times. Don''t miss the parade at night, and the fireworks  quite
      spectacular. Super super a lot of ppl, and super hot!","I know that most people
      are busy now with their lives but I suggest to live life while working.... This
      is a dream come true for me .... Being able to visit Disneyland with my 14 yr
      old daughter is a gift from GOD.... I am saying this because if God did not
      help me to find a job I will not be able to purchase tickets and I will not
      be able to afford Hongkong in general :) visit places and have fun while we
      can since it is difficult to travel if we are old already...imagine long lay
      overs that old bodies cant take so live life guys :) it was really fun.... will
      be sharing my DIY itinerary and the attractions that should not be missed to
      maximize your adventure while in there :)","Hong Kong Disneyland is a very clean
      and lovely place to visit. It is one of the smaller Disneylands, so it is easily
      navigated with small children. The majority of the people are pleasant and very
      helpful. I can''t say enough about how kind they are. There was only one incident
      that frightened me. I was leaving one of the major shows with three young children.
      The cousin of the grandchildren jumped up from the seat at the end of the show
      and went the wrong way to go out, thus leading the oldest grand child, who followed
      her. I stopped the two year old, who was standing beside me, and called to them
      to come back, as they were traveling into the oncoming crowd. The couple behind
      me in the seats shoved the two year old to the floor, knocking her down, on
      their hurried exit from the seats. A kind couple immediately stopped to help
      pick her up and stop the crowd rushing to the doors. The older grandchild immediately
      returned to me, and eventually the cousin. We walked out with the crowd. This
      happened in a few seconds. I have heard stories about the mainland Chinese,
      and how abrupt they are in rushing from one show to another. The local Hong
      Kong people are very polite.","The rides are not so great as they cater for
      really young kids like below 10 maybe. Great attraction and a view of disney
      plus the train ride to hear is a disney feel already! I had fun at the 3D shows
      though and theater plays! Make sure to give yourself one full day here so you
      don''t miss anything especially the fireworks at night. Wear something comfortable
      and extra clothes just in case you get wet. I definitely recommend this place
      to families and kids!!!","Three stars. Well yes given it   s Disney and given
      the price we expected more.On the plus side the park was beautiful, the lands
      are incredibly detailed and you can lose yourself in the different zones. Ride
      times were ok and the queues not too bad, but it was frustrating how many rides
      were closed and then opened again later in the day, you definitely need the
      App and Disney don   t give you free WiFi.Now the disappointment, where are
      all the characters? We saw Mickey once and he had to go for a rest as soon as
      a queue headed his way, we saw Woody twice, on the run from autograph hunters    can   t
      stop guys   .Biggest disappointment was no parades midweek, come on Disney we
      spend a fortune getting in, a fortune in your gift shops and you can   t give
      us some actors and cars parading round to delight the kids. Universal Studios
      was just so much better value","A great day of simple fun and thrills. Bring
      cash, nothing is cheap, but we knew that it''s Disney. But they are great letting
      you bring in your own food, drinks, etc but read the list closely, we list several
      items at the entry gates (selfy sticks, glass refill bottles, etc). It is worth
      buying the photo pass and fastpass. Have fun!","even before entering disneyland,
      you could see happy faces of little kids in the train. it was easy to travel
      to disneyland by mtr. try to go on   a weekday.","Had a wonderful day, so easy
      to get here from anywhere in Hong Kong, unlike Disney''s in the US it''s much
      quieter, space mountain was never more than a 5 minute queue all day!! Longest
      we queued for any ride all day was 20 minutes but it was more like 10. FYI Grizzly
      Gulch had the cheapest food options that I saw, the only alcohol is on Mainstreet
      and there''s smoking areas between each park.It gets really chaotic in mainstreet
      before the parade but that''s to be expected.","Although only 3 4 rides were
      good for adults, this is primary for the kids who are in 0 10 year age range.
      And they have more food stalls   restaurants than rides.","Not much of a Disneyland.
      Pretty disappointing. Go to Tokyo Disneyland instead. Tokyo Disney is the best.","Extremely
      long wait times and short ride duration. Posted wait time 150 min and ended
      up waiting for 2 and 1 2 hours at Cars ride. Fast passes out by 10 am. Some
      staff helpful but normally looking like they would rather be somewhere else.
      Food costs high and again staff    unenthusiastic    at providing assistance.
      We   ve been to Disney Florida, Universal Florida and California and have never
      encountered wait times like this. There is no entertainment, no updates on wait
      times or staff available when waiting in these lines, just the same tracks of
      music playing over and over. Very disappointing way to spend the day and lots
      of money.","The place is truly awesome. Helpful staff and information was easy
      to find with their help or guidemaps which were given to us. Food may be a challenge
      for most. Since I was there on Christmas day the place was swarming with people.
      The best and the most awesome part was the floats and the fireworks. I would
      definitely visit again.","this is a must see attraction. Mind blowing even if
      you are not taking kids.  Do not  miss the fireworks which happen post 6 pm
      that is the best part of the tour.","The new rides Toy Story, Grizzly Gulch,
      Mystic Manor are very good. We go there on Friday the queue is not that long.
      The burger and turkey leg are very good.","A must visit place if you are in
      Hong Kong. It   s a lovely place with a great experience. A heaven for small
      children in simple words .","Was a rainy day when we reached. At first it felt
      wet and cold. As soon as the sky started to clear, it became more enjoyable.
      Particularly enjoyed the roller coaster ride that are near the manmade geysers.
      It didn''t seem exciting at first until it suddenly moved backwards at top speed
      and then dash forward. It really set the adrenaline pumping. As it was towards
      the end of the day where the queues are dwindling, we had the opportunity to
      have a second ride.The Mystic Manor is another surprise. A combination of special
      effects combined with ride, I must say is one of the better rides I had taken
      in recent years. Satisfaction is comparable to the Harry Porter ride that I
      had tried in Islands of Adventure in Orlando. A good way to spend a day with
      the little ones. Though I felt the staff there doesn''t give the feeling of
      happiness as much as I get in other Disneyland that I had been.","It is average
      place. I visited Euro Disneyland and this one does not have anything more attractive.
      Long queue and not all games have fast track.","Having been to Disney World
      many times, I was personally not impressed with the size and grandeur of this
      Disney, however for small children this park is just right. We have a one year
      old and a four year old and we were able to get through all but one or two rides
      in a day. I would suggest 2 days for rides and shows with small children. All
      the staff was phenomenal and we are planning another trip back this month and
      will be staying in one of the resort hotels. This park had Fantasyland, Tomorrowland,
      Adventure Land and Toy story land. There are also many food choices both eastern
      and western to choose from. I would def go during the week as there was hardly
      any wait for the rides.","We loved the whole experience and the kids were over
      the moon to meet most of the characters. Quite full so go prepared for long
      waits but totally worth it. Stay till after 7 pm to see the night parade and
      at 9 for the fireworks show","It really nice if you bring the young kids together,
      and sure they will very enjoy the game and show.  But the food is too expensive.","Disneyland
      hong kong was the 1st Disneyland I have ever visited. It was great experience
      for me, my daughter and my close friend. My daughter, who is 2 really enjoyed
      the places the story time. It was a best place to celebrate her 2nd birthday.I
      truly recommend this place, it''s ideal for kids and adults.","We used to love
      it at Disneyland but the park is literally just getting busier and busier everytime
      we go. It ruins the experience. 90 minutes waiting for a 3 minute ride isn''t
      worth it. I''m not sure there''s anything they can do but it won''t continue
      to be our go to destination","Why go anywhere else to see Disland our experience
      was AMAZING we travelled with my daughter son in law and three grandchildren
      I was just as or struck as my grandchildren as this was a dream of mine when
      I was a child being November it was very close to Christmas and we saw the tallest
      Christmas Tree as we entered Disneyland Hong Kong at the end of the evening
      we saw all the fireworks just like on TV plus it even Snowed something I will
      never forget so beautiful (fake Snow of course after all it is Disney Land)
      It was every thing we thought it would be rides things to see food and the Train
      to Disneyland even has windows shaped like Mickey Mouse my Grandaughter even
      had photos with Minnie Mouse Brilliant 100% a must to visit","To make a gift
      to a Thai friend, I went for the first time at Disneyland Hong Kong.The only
      problem for me is that I have already been a few times at Walt Disney World
      (Orlando, Florida, USA) and many times at Disneyland Paris.So, I was thinking
      that it was the same ! Of course, it''s evident that we are in a Disney park.
      But I have been surprised to discover that this park is smaller than in Paris,
      and so a little bit disappointed.But the magic of M. Disney is still here and
      it''s a great experience, despite the long queues (average 1h for each experience)","Easily
      assemble by train, great Disney experience, by really small if you compare to
      Orlando.  Great 1 day visit, opens later than Ocean Park.. a must do for any
      Disney Fan!","Never been to a Disney before. Very impressive place. Certainly
      a full day''s entertainment. Kids liked it ... as an adult I enjoyed it for
      their sake. Air conditioned shops pepper the landscape and draw in hot and sweaty
      punters. Then the relentless souvenir spending kicks in ! Just go with it. For
      some reason, I can''t get  Holiday Road  out of my head.","Visited Disneyland
      Hong Kong with my family during the Christmas week. What to expect from this
      place:1) Suitable for all ages ranging from toddler to senior folks.2) Downloadable
      mobile app that comes with detailed map, show timing and waiting time of queue
      in each attraction.3) Long queue for each ride during peak season (you can opt
      for express pass if your are a frequent goer).4) Show time are quite evenly
      distributed so you can plan your time in between rides and show times.5) Sufficient
      dining options in each section of the park.6) The daily evening fireworks at
      9pm, simply magical!","Having read so much bad publicity I was expecting a very
      bad Disneyland. So I wasn''t disappointed, but not pleasantly surprised either.
      I went in the morning and as everyone has said, each queue was at least 1 2
      hours long. The fastpass isn''t very useful either. For my first fastpass I
      could go back within 1 hour but my second fastpass I obtained before 1pm allowed
      me to take the ride only at 6:30! The rides are mostly boring. There''s only
      1 rollercoaster ish ride, which is the space mountain. Its quite good but isn''t
      really THAT exciting. I''ve tried better at less known themeparks. But objectively
      its enjoyeable, really.If you (or your kids) like the disney characters, it
      might be nice to see them walking around or buy the disney merchandise but as
      I''m not really a fan its no big deal to me.The queue cutting wasn''t that bad.
      There are some people shamelessly walking past us to get to their friends who
      booked a place in the queue for them in front but you just have to put your
      feet down and tell them off. I had this person shamelessly saying  excuse me  when
      I blocked her way as she was trying to go to the front of the queue but its
      really not as common as some of the people here make it sound. There are probably
      such people everywhere, no reason to point fingers at mainlanders and say that
      they have no social etiquette.Some things that are well done include the 3D
      animation mickey show, forgot what its name is. Shall not reveal the reason
      why its so good, the surprise element is part of the fun. The fireworks performance
      at night is also really amazing.A recommendation   Go in the evening if you
      have to, the queues have eased up by then so you''ll probably complete the same
      number of rides with less frustration than if you start in the day and spend
      most of the time in queue. And you won''t miss the fireworks.","Not normally
      a theme park fan but really enjoyed the visit here. Really easy to get to the
      park on the MTR with the last bit on a specially themed Disney train complete
      with Mickey Mouse shaped windows. Plenty to see and do. Souvenirs are relatively
      expensive but pretty normal for a theme park. Huge selection of food. We enjoyed
      staying for the light parade and fireworks display at night.","Disneyland is
      the Happiest Place except for buying souvenirs and stuffs . But I can say that
      this place will make you make you want to be a child again . A place that you
      should not skip on visiting while you   re in Hong Kong. This is my 2nd time
      to visit but still I can   t get enough of it. The experience of singing with
      the casts while they are dancing and you dancing and swaying with them. And
      that feeling of disappointment when you got the unexpected selfie with pluto
      but the camera was in a 10s mode","You can spend time well if you participate
      in games.Some nice restaurants with good view.cable car and the train ride is
      a nice experience. We liked the Night parade and the fire cracker show the most.Quite
      crowded even on a week day.Spending whole day for adults a bit difficult. We
      had to come out and drive down to a near by shopping mall and re enter at the
      time of the evening parade.However nice place as one time experience.The shops
      in side the Disney land found to be very expensive..","Though the weather wasn''t
      was in our favour the ides and environment was breathtaking. When the Thunderstorm
      warning was on the outdoor rides were stopped. But the indoor rides and shows
      were on, which was good.","I''ve been waiting for the day in Disneyland Hong
      Kong with my family, but unfortunately the weather was not good. It was raining
      a whole day. I can''t play and enjoy all attractions and even can''t take a
      photo with one of Disney character. Enjoyed the fireworks, it was amazing!","We
      had two days here thursday 8th and Sunday 11 september.The Thursday was by far
      the better of the two apart from the heat it was a really good day my children
      could go on the rides they wanted to without huge lines. The wait to see the
      characters was also reasonable and they never rushed them away.However on the
      Sunday there was so many people there as it was a long weekend for the the mid
      autumn festival. There was so many rude pushy people. The lines were huge but
      that was oK as we had done them all the other day. We did go on some when we
      saw the lines were smaller. I would recommend if you can do the river cruise
      ride in the day and again in the night as it is such a different ride at night.So
      I would also say if you can help it go on week days and NOT long weekends. But
      sometimes you don''t have a choice so in that case go early do all the rides
      first before it gets to busy.My girls still love the park it was there second
      trip since march.","Too expensive, we wouldn''t paid if we have to pay to get
      in but we know people who worked there in order to get free entry. Overall is
      good with kids but there were so many people and things weren''t particularly
      great. There were a few things that wow us...but overall it was a good experience
      but definitely did not worth that much.","One of the famous activities in Hong
      Kong. Hong Kong Disneyland was small place that you can walk around easily but
      full of the attractions. Its very suitable for kids.","It was my first visit
      to any disneyland so my expectations, to start off with, were fairly low. Having
      said that, Disneyland Hong Kong easily surpassed my expectations. It was an
      easy MTR ride to Disneyland. Just follow the clear instructions in the MTR stations.
      We reached the theme park after lunch, about 2pm. Except for a long wait (about
      1 hr) to take photos with Mickey and Minnie, the queues for the other rides
      were quite okay (maybe within 15 mins). Here are the rides and shows we took  watched
      and my thoughts:1) Runaway mine cars (Grizzly Gulch):  waiting time:   15 mins  thrill
      factor: 4 10  an enjoyable ride, not too ''hair raising''. Even my 62 year old
      mother was able to take it.2) RC Racer (Toy Story Land)  waiting time:   5 mins   we
      took so many times that I lost count!  thrill factor: 6 10  with practically
      no queue, it is a must to take it. It''s also not as scary as it appears.3)
      Toy Story Parachute Drop (Toy Story Land)  I did not take this but my nieces
      took it  waiting time:   30 mins  suitable for young kids. My nieces were 4
      and 7 years old. 4) Mickey''s PhilharMagic (Fantasy Land)  3D (with some 4D
      effects) show  I find the show quite interesting. The effects were pretty good.
      My nieces had so much fun trying to reach out to grab whatever they saw in 3D!   the
      rest of the rides in Fantasy Land are more for young children5) Space Mountain
      (Tomorrowland)  waiting time: no queue, we immediately got ushered into our
      seats, leaving us no time to get ready!  thrill factor: 7 10  said to be the
      most ''hair raising'' ride in the park. Thrilling yes but not the most awesome
      ride I''ve been to. Definitely worth a try nonetheless.6) Tarzan Treehouse (Adventureland)  waiting
      time:   5 mins to take the raft  nothing impressive, you follow the story of
      Tarzan as you climb the treehouse7) Flights of Fantasy Parade (Main Street USA)  vibrant,
      colourful parade with songs and dance  you can get to see all the characters
      in their floats  must watch, advisable to get a good spot for photos8) Disney
      in the Stars fireworks (Main Street USA)  Wow wow wow! what can I say? Amazing
      fireworks performance and surprisely (and pleasantly), a long performance as
      well. It is my strong advice for you to stay back and catch the show. But make
      sure you reach early to grab a good spot. The problem of leaving the theme park
      amide the huge throng of people can wait after you enjoy this fantastic show.","Took
      our young family to visit the magic kingdom in Hong Kong. I think went during
      off peak season so everything was just right. Queues to the rides were minimal,
      so the kids were able to go multiple times on their favourite ride. Recommend
      you get a lunch meal plan as this incorporates some savings. Will go again.
      Although it is the smallest Disneyland it is perfect for small kids who are
      on their feet the entire day.","We boarded the Cathy Pacific flight from Bangalore
      (2.00 a.m. India time) and landed at HongKong airport around 10.00 a.m. (local
      time) We were lucky to have good  Jain Food  in the Cathy Pacific flight operated
      by Dragon AIr. Visa is free on arrival and within 35 minutes we reached hotel    Disneyland
      Hollywood Hotel    which is located within the Disneyland resort.After having
      some snacks in hotel, we visited Budha Temple and The Peak. We were lucky to
      find good vegetarian dinner(along with Jain food) in an Indian restaurant,  Bombay
      House  in HK city. After dinner we spent sometime in the local market and came
      back to hotel in our rooms. Rooms of the hotel were very clean and spacious.
      All over the hotel there were many Disney characters and my daughter was so
      excited to see them. Next morning, we got up early and had good vegetarian breakfast
      in the hotel. We boarded a bus from hotel and reached Disneyland in 10 minutes.
      The main entrance of Disneyland was very beautiful with Mickey Mouse standing
      on top of water flowing from whale fish and a dancing mini mouse. Further ahead
      was a big fountain with a statue of Mickey. Disneyland is divided into three
      main parks Fantasyland, Tomorrow Land, and Adventure Land. In    Adventure Land    we
      saw    Tarzan House    which was artificial but looked very real. We also completed    Jungle
      River Cruise    where I got frightened. We also enjoyed the show    Festival
      of Lion King   .The roller costal ride of Space Mountain and Orbitron in Tomorrow
      Land was really thrilling. We even got a chance to drive UFO is    UFO Zone   .There
      was a spectacular fire show in the evening in Cinderella   s Carousel. My daughter
      also attended a class where she learnt how to draw Mickey Mouse in simple steps.
      This was a memorable experince for her. In    Adventure Land    we saw    Tarzan
      House    which was artificial but looked very real. We also completed    Jungle
      River Cruise    where I got frightened. I also enjoyed the show    Festival
      of Lion King   .I enjoyed the roller costal ride of Space Mountain and Orbitron
      in Tomorrow Land. I even got a chance to drive UFO is    UFO Zone   .There was
      a spectacular fire show in the evening in Cinderella   s Carousel. I also attended
      a class in which I learnt how to draw Mickey Mouse in simple steps. This was
      great. Inside Disneyland, it is not easy to get any vegetarian food but I enjoyed
      my Pepsi along with finger chips. We spend two complete days in Disneyland and
      saw almost everything. We also did some shopping on second day which is costly
      as per Indian standards.","Our first Disneyland experience with our 3 year old
      daughter. We went on a weekday when the park was surposed to be quieter. When
      we arrived not long after 10am we meets large cues with only two thirds of the
      ticket office open. 45 minutes we waited to pay to get in. As you could tell
      by looking around most the girls going were wearing some kind of Frozen clothing
      and there was going to be a lot of interest in the Frozen village, one of the
      main reasons we were taking our daughter. After getting our bearings and reading
      the site map we had to fight for we headed to the Frozen village as there is
      a small amount of tickets for each show allocated on a first come basis. We
      arrived at 11.15am to be told all tickets had been given out so if we wanted
      to see the show and enter the village we would have stand and wait...you should
      get into the 2.30pm we were told, so they expect you to stand for 3 hours in
      the blazing sun with a 3 year old. We left to see some of the rest of the park
      and came back around 5pm to try to get one of the later shows...we still had
      to stand for nearly two hours but at least it was cooler then. The show was
      quite good as was meeting Olaf and the sleigh ride...but they closed the indoor
      snow village before we had chance to go play. There must be a better way to
      organise this..the rest of the park was quite good, we stayed to closing at
      9pm but only managed to get on 8 rides and grab a quick burger in this time
      (10 hours)...you need a two day ticket if you want a chance to go on most of
      the rides...expensive for 8 rides and a short show...","Oone of the highlights
      in HK. It seemd like a complete replica of the the Magic Kingdom. We all had
      a great time there. My favorite part was the fireworks and the parades!:D","For
      a traveler who''s not been to disneyland in orlando , US, this was a captivating
      experience . Although some rides are not meant for 50   , there enough to do
      . Add to it the various show''s , parade   noon & evening & fireworks .... it
      makes the entire experience worth it. For those who want more than a day''s
      outing , plan to purchase a 2 day pass . Also staying in Disney hotel is a totally
      different experience .... one must if time permits !!","Must see for kids, judging
      by their reaction to everything what is happening.I will now talk about obvious
      things, but those were disappointing.Half of performances are in Chinese, which
      Is logical, but does not allow one english speaking to fully integrateVery limited
      choice of food, mostly fast food, which is always true for open parks as well.
      Not too much interactive attractions, rather very conservativeStill, for kids
      this is lots of fun, so I suppose adult''s opinion is a bit biased","Must place
      to visit once in your life... Time will passes like anything. Only problem in
      Disneyland is fooding if you are vegetarian","If you have kids under 10 and
      if this is your first visit to any of the Disney land, then this is a place
      of heaven . I travelled with a 9 year old and a 6 year old.We changed our itinerary
      twice to visit Disneyland because of rains. The excitement started when we were
      asked to board the Disney land train, quite different from the normal metro
      trains. I would say the tickets were not as expensive as I thought for the park.
      You are greeted by Mickey mouse and his spouse : ) at the entrance and are allowed
      to take few photograph''s with them. Our first thing to do was to fill up some
      energy to walk. ( it is a bigger park by walk and energy boosters are required
      in frequent intervals). So there you go, spend some money on the turkey, frozen
      pack popcorns and some energy drinks. We took a copy of the map of the park
      which contains list of additional scheduled events.I had taken a firm decision
      on making the kids wait until I completely plan for the day. Though tough task,
      but at the end of the day we all felt happy for the plan.I am not going to explain
      you what we did with each game the rest of the day because it differs on every
      one''s interest. But if you have girl kids don''t miss the frozen show. The
      3d show, the evening parade, cracker show is worth it. Never mind about food
      or beverages, there are plenty of options. Park is clean and hygienic. Worth
      the Visit","I live in Orange County, California where the original Disneyland
      Park is located, and I have an annual pass. So I had to come here to take a
      look. It''s very similar, with some minor differences. It''s very clean, everything
      is basically new, and when I visited it wasn''t crowded at all like the one
      in Anaheim. We took the MTR to Tsin Yi and then took the Disneyland line. It''s
      really cute. The train, train station, and the area are all themed so if you''re
      coming here with kids (we didn''t... just adults who act like kids sometimes),
      it''s all part of a nice big show.","We arrived just before10am. Once the gates
      opened I suggest you walk in and straight up into the Main Street area then
      you will find characters that you can get photos with.. Minnie and Mickey had
      a bit of a line but there was probably 3 others with hardly anyone there.. They
      just take photos with your camera.. Shortest lines for photos I seen all dayWe
      then tried not to be distracted by the shops and go on the rides.. we were able
      to do most the rides in the morning with less than 10min wait times..I couldn''t
      believe by mid   late afternoon busloads of people arriving. It seems lots of
      people don''t do start to finish time and come laterWe had lunch in a food court
      type restaurant, It cost nearly $30aud for a burger chips meal I was horrified,
      I found a cheaper place for dinnerThe Halloween parade went for maybe 10minutes
      so make sure you see the main parade..The fireworks were amazing, much more
      than just fireworks, it''s a show of lights music etcI have been to the California
      Disneyland, I was still really happy with HK Disney, it''s still magical and
      perfect just smaller..It was a massive day but worth it..Buy your tickets in
      Klook, heaps cheaper and the line is shorter . They just scan the paper and
      your inThere are no scary rides here but that suits it.. I just love the Disneyland
      experience","The staff are accommodating for photos and the place is large enough
      to go around for a day. However, its a bit far and food options are limited.","It
      is no doubt a legendary place but I just dont think it''s worth the money and
      headache of overcrowding and overpriced everything. Disney continues to raise
      the price of admission and the crowds are ridiculous every single day. There
      are plenty of things to do in SoCal that are cheap or free. Save your family
      hundreds of dollars and go somewhere else.","Roller coaster was scary but fun;
      food was really good; shops had good products; parade at the end of the day
      was magical","It''s small and filled with travelers from Mainland.  The attractions
      are well maintained.  Food offered there is quite expensive as expected.","Simply
      Excellent.....!!!!!!!!!!!!! very nice experience... t is a full day of experiencing
      the creative genius of Walt Disney while marveling at the power of incredible
      marketing. An experience which is an education in itself","Once your in Hongkong,
      your in heaven and in heaven disney land is the best place to see, its not only
      for children but even for adults and a lovely place to be at.Its built with
      top class infrastructure with best of rides and lot of star attractions.It is
      so huge and big that one full day might not be enough to see each and everything.Lovely
      place with great climate its a lovely place i saw and enjoyed it so much that
      didnt want to come out from there.If you go to hongkong and if you dont see
      disney land then your trip to Hongkong is a waste","Need some improvement with
      the queue for taking pic with mickey and minnie.. need a canopy and more cooling
      fan.. the ice cream and pop corn were super delicious. Dont miss the micky magical
      show, lion king and the parade especially the night parade at 7:45 pm","As expected,
      high quality rides, shows, standards and expensive food and souvenirs! You don''t
      do Disney every day so suck it up and enjoy. Had a great day!","Check the weather
      first before visiting, April is Rainy season in HongKong. A big No! We went
      to Disneyland last April 25, they cancelled the night parade minutes before
      the performance because of sprinkled rain. A lot were disappointed, we do understand
      but yeah! Toooooooooo baaaaaaad!","I love Disneyland! Pro: Staff is really friendly
      and they are always smiling. Fireworks are really great! Cons: Crowded during
      school holiday and long queue for rides. Smallest Disneyland in the world.Although
      with all the cons, I still love Disneyland. The shows are awesome and you can
      forget everything when you are there. Even as an adult, I went crazily happy
      when I''m there.","A school holiday treat for my 5 years old Son and he had
      a blast today the only set back was my Son was exhausted by 4pm, I had a blast
      too..","parks are well maintained. Staff are friendly.   In comparison with
      Tokyo disneyland, this park is relatively small and have less games.  if you
      plan properly, you can play most of the games within a day.   The toys in the
      shops are expensive.","Pretty disappointed. There isn''t much to do here other
      than walk around the park. The 4d movie was good. There was a main stage play
      that everyone waited hours in line for but we found out after we waited for
      hours that it wasn''t in English (unlike everything else). There was one ride,
      it was like a western gold rush ride and it was pretty good! We only saw one
      Disney princess very late in the day as we were leaving. It was always a dream
      to go to Disneyland but I was sadly so disappointed.","A must see attraction
      on your first trip to Hong Kong.To make sure it''s sweet and short, here are
      tips for you:  1 whole day is definitely enough to explore the magical place     Make
      sure it''s a sunny day on your visit as I''ve been told parades are canceled
      when it''s pouring.  Yes, it''s a sunny day which means an umbrella should be
      brought for the walks from one magical ride to another.  As soon as you enter
      the area, get a map and plan your route as you don''t want to miss meeting all
      those wonderful Disney characters during parades. There are 2 parades: 12nn
      HKT and 4pm HKT.  Fireworks display starts at 9PM HKT. Make sure you get a good
      spot in front as besides the fireworks, they also have a slideshow projected
      on the walls of Sleeping Beauty''s castle which you won''t see if you''re at
      the back.  Food is expensive (At least for me, after converting price to local
      currency   PHP, I wanted to eat even the plate) ! They have 2 food courts which
      offer different cuisines. Asian (noodles and rice meals) and American ( fried
      chicken and burgers). They have food stands too which offer ice creams, pop
      corns, hotdogs, etc. The two piece fried chicken with rice and coke I ate for
      lunch costs 88HKD if I remember it right. Price range of meals are from 70HKD
      100HKD. Food portion is good for 1 regular person with regular appetite. Haha!
      They do not serve hot sauce, only sweet chili sauce.  Food cannot be brought
      in so if you are on a budget you can save by buying 1 big bottle of water drink
      inside then keep the bottle as there are water fountains in the area. One can
      be found near Buzz Lightyear''s area   before you enter the restrooms. One bottle
      of 12ml of orange juice costs 26HKD, but it really tasted good.  Hated the It''s
      a Small World attraction. It''s just 10 20 minutes but I don''t see anything
      Disney about it. It''s just all dolls, some of which, creeped me out. Looked
      like a ride from a very rusty carnival ride. Not a loss if you skip this, but
      if you have time and you wanted to rest, go ahead.It is, indeed, one of the
      happiest places on earth. Missing a visit to Hong Kong Disneyland is definitely
      a No No!","Visited in march with my 4 year daughter, she really enjoyed , as
      kids of her age have plenty of attractions , and all age groups can enjoy the
      Disneyland,","The Iron Man ride was pretty new and it was amazing. However what
      my friend and I enjoyed (and will always enjoy I guess) is The Festival of The
      Lion King show. Watching the performers sing and dance is something that interests
      us. The fire exhibition thrills us to the bones! My Magic Access Pass truly
      has an awesome purpose!","You can easily go around this park in a day which
      cannot be said about the other Disneyland parks in other countries. I like the
      fact that it is so easy to take pictures with mascots since they are all over
      the place and most of them are in the Fantasy Garden. Weekdays are great since
      there are less people around.","Truly the happiest place on earth! Best time
      to arrive during the opening hours to be able to breeze through queues on attractions
      and rides. The newest Iron Man attraction is one of a kind! The parades are
      spectacular, and the fireworks just magnificent! Disneyland will awaken the
      kid in you!","Being middle aged without any kids I probably am the wrong person
      to rate this since it is a fantasy land for kids. But there are still quite
      a few things for us adults as well. I liked the Star Wars themed Hyperspace
      Mountain is a really fast and cramped rollercoaster. Since it all is so fast
      I didn   t really get the Star Wars feeling I wanted. I really liked the Iron
      Man Experience. And the Big Grizzly Mountain Runaway Mine Cars was a great rollercoaster.
      But what I really loved was the Mystic Manor. A great little thing that really
      draws you into the story. We went on the Monday after the Golden Week and didn   t
      need to use any of our Fast Passes. Great! We didn   t have a problem doing
      everything we wanted in a day.","The Disney Park in Hong Kong is amazing. It
      can be reached by MTR Metro or Taxi''s or Conducted Tours. The entrance fee
      is HKD 499 per adult which includes all the rides such as space mountain and
      all other shows and innumerous rides etc. The Park has many interesting sovenir
      shops and plenty of food outlets. At least one full day is required to see.","My
      family and I have been to Euro Disney in France, Disneyland in California and
      Disney World in Florida. On this family trip, we are going to Hong Kong Disneyland
      and in a couple days, we''ll visit Shanghai Disneyland. I guess maybe I was
      expecting too much from Hong Kong Disneyland. While we enjoyed the public train
      ride to the resort, it was overwhelming unorganized, as people pushed to get
      on and off and rushed to get into the park. All we can say is that we were here
      and one item off our bucket list. Here''s to hoping Shanghai Disneyland will
      not disappoint.","The place, itself, is magical. Most of the staff members are
      friendly and accommodating. We were there on a Monday and the place was packed.
      The lines were a bit too long and a lot of people were rude and uncouth. There
      were a couple of Chinese people who were trying to cut lines and a lot of them
      can''t understand english. They should place staff members who can guide (guard)
      people waiting in line. I also noticed that some would deliberately disobey
      the height requirement for the rides. I even saw a toddler in the Space Mountain
      ride.During the parade, the Disney employees who were in charge of the rope
      to keep the crowd away from the floats were cranky and ill mannered. One even
      snapped at my kid for merely touching the rope! Sure, they do it every single
      day and it''s quite tiring doing the same task over and over again but, hey,
      they''re working for Disney and the job requirements are courtesy and a smiling
      face. Also, for tourists, especially the OLDER TOURISTS, they should realize
      that Disneyland is really made for children and they should avoid pushing children
      aside and blocking little people half their size just so they could see Mickey
      Mouse closer. It was downright disgusting seeing this middle aged Caucasian
      man blocking the view of the parade with his huge luggage and practically having
      a tantrum when I asked him to put it aside so my kids could at least see the
      parade. What an embarrassment to his generation. Well, it''s not really Disneyland''s
      responsibility how we were all brought up... But they really should add more
      people to guide (guard) tourists    and train them well to be more accommodating,
      more courteous and speak better English.Aside from those, Disneyland is really
      a beautiful, magical place. The place is wonderful, itself. It was like stepping
      into another dimension where everything is pure, fun and happy. There were restaurants
      and food carts at every corner. The restrooms were all big (no lines!) and clean.
      The rides and attractions were enjoyable enough that you would want to see ride
      them again. There were just so many wonderful things to do that a single visit
      isn''t enough.I loved Disneyland and we will definitely come back here again.  )","Disneyland
      is such a beautiful place that one needs to visit once in HongKong. Enjoy the
      rides especialy the grease train, what an experience.","Kids have a blast at
      disneyland.  Very well organised at all counters and all stalls.  The only minus
      is if you are a vegetarian, there is hardly anything you can eat. The veg pizza
      tastes bad.","It''s probably one of the smallest Disneyland in the world but
      it manage to at least last you for the whole morning and afternoon to enjoy
      the rides and shows. It''s definitely baby and stroller friendly which makes
      it convenient for those having baby to roam in here. Bad side about this   eateries
      opens quite late, around 11:30AM. so it will be a disappointment for those who
      want to have breakfast in a Disney environment.","I was so in love with Disneyland
      since i was a child. It was a dream come true when i finally went there. Meet
      with beautiful princess and of course Disney gangs.","it can be exhausting to
      spend whole day here. Rides have long queues but shows like lion king is nice.
      Adventure zone Tomorrowland highly recommended to start with first. Jungle river
      cruise in adventure land is nice too. Most rides end by 6 pm...while parade
      happens at 8.45...a long wait. Parade earlier used to be proper walk of Mickey,
      Donald but now they mainly use LED floats which are not that interesting. We
      faced thunderstorm on our visit so many rides got cancelled & we got wet. Food
      is not widely available & is restricted. Must take cable car ride that takes
      you to a hill top with many rides n games there.To save time : buy an Express
      Pass, if you can afford","Our 3 year old loved disneyland Hong Kong. The train
      going there even has Mickey Mouse shaped windows!! The parade during the day
      was excellent and had Mickey Mouse as the star attraction. The kids can meet
      Mickey Mouse, Minnie Mouse ,Donald Duck etc just after the park in a designated
      area.we just stumbled across it...no need to pre book.i don''t know who was
      more excited when my kid met Mickey Mouse! The night parade is great.....it
      had lightening McQueen from cars and Mack and all the usual Disney characters.lots
      of restaurants dotted around. The only negative is the long waiting times to
      go on the rides and they don''t run for very long.maybe 1 minute. Well worth
      a visit.","It is one of the best place to be with friends families as have a
      lot of attraction for kids and playing areas and huge place for travel inside
      to see everything needa whole day.","Having previously been to Walt Disney World,
      I decided to take my kids to Hong Kong Disneyland for their first Disney park
      experience. This decision was mainly based on it being a smaller park so a little
      bit easier on their little legs. They absolutely adored it! My six year old
      went on every ride (apart from RC Racer due to height) and apart from Mystic
      Manor (which he found a little scary), he loved them all. The look of delight
      in my three year old   s face was also sweet. It was a fantastic warmer for
      the bigger parks in the U.S.A. One day park? Definitely not. We did every single
      ride (apart from RC Racer and Tarzan   s House) and every single show (apart
      from Moana) and parades, net characters, did none of the gardens and we just
      fit it into two days. And we were there from open to close with a stack of fast
      passes in hand. Maybe we were slowed down due to having little kids with us
      but I don   t know how people do the park in one day and do it justice. Where
      the park lost a star was the food and merchandise. The food was gross. That   s
      all I can say about that. The merchandise? Well unfortunately there were heaps
      of shops on Main Street but they all stocked exactly the same merchandise. Apart
      from Pandora which I don   t personally wear, there was nothing for adults.
      The variety just wasn   t there and the selection that was there was poor. Would
      I go back? Probably not now that it has been done but we are looking forward
      to the next Disney park.","What a great opportunity to experience first hand
      the magic of Disney! After visiting other Disney parks it   s nice to visit
      a park with the same magic but with an Asian flair. With so many similar attractions
      like the ones in the US it a familiar time.","This is probably the smallest
      Disney theme park but that does not detract from the quality. Before you even
      get to the park itself, there is great theming, including Mickey surfing on
      top of the water jet from a whale, with other popular characters in...More","Hong
      kong Disneyland is such an awesome experience. i have been in winter and summer
      and found it not to crowded. kids love it and its perfect for younger kids as
      its not to big. i have stayed in both hotels and loved both but the Hollywood
      hotel is best. the cast members are awesome and i can''t wait for my next trip!
      i recommend three days to see all the show go on rides and have second goes.
      i found things to be surprising reasonable to buy.","Take your package through
      some good agent in India. transportaion is very expensive hence if you take
      it through agent your travel is taken care of by them. Inside disneyland you
      get map for various parts..do plan your trip. There is a live show in their
      theatre ..do not miss it. It''s a 30 minutes live show. There is fasty pass
      access concept..which you can avail on each ticket at a gap of 2 hours. Wherever
      on a ride you have this access available...scan your ticket on fast pass access
      and come back on the designated ride. at 8:30 in the evening there is a huge
      fireworks show...do not miss it at any cost. It''s a lifetime experience. Wear
      comfortable shoes to Disneyland..you will be walking a lot. Make sure you carry
      some extra water bottles with you..since each 750 ml bottle inside the park
      costs 28 hong kong dollars. Enjoy the fantasy land rides..and bring out the
      child in you. Tarzans tree house is an amazing place. Do take pictures at the
      view points, they come out well. Wear comfortable clothes and enjoy your day","We
      had a great day in Hong Kong Disney, the park is much smaller than other counterparts
      and can be done in a day. Food is probably the biggest letdown and very $$$.","Disneyland
      is truly the happiest place on earth and brings out the kid in all of us. I
      spent my 43rd birthday here and despite the rain during the first part of the
      day, Disneyland did not disappoint. I loved the shows and thoroughly enjoyed
      myself. I grew up with Disney and hearing the songs being sung live was a joy!
      The Festival of the Lion King and The Golden Mickeys were great! I have not
      heard  Out There  for quite some time and was surprised that I could still sing
      along to most of the lyrics on the chorus. The cast members were very talented
      and good looking :) I just wished I understood what they were saying during
      the Golden Mickeys. It was in Chinese all throughout the show and I should have
      sat on the right side of the theatre where the English subtitles were being
      shown onscreen. Oh well!Being a weekday, there were not a lot of people and
      there was hardly any queue. Wait time was short except for popular attractions
      like Winnie The Pooh and Buzz Lightyear''s Astroblaster. I absolutely enjoyed
      Mystic Manor and went through it twice!!! There is a variety of food to choose
      from but can be a bit expensive. Am not entirely sure whether the Meal Ticket
      actually saved us money as I have a very small appetite. I hardly finished the
      bowl of noodles I had at Clopin''s Festival of Foods. My only regret was that
      I was too tired and cold to wait for the fireworks which I heard to be awesome.
      The benches were cold so I did not really have a comfortable place to wait it
      out. There was a wind blowing that added to the chill. It must have been 6 8
      degrees towards the evening. If you''re visiting Disneyland around this time,
      wear warm clothes. Being from a tropical country, I admit I was ill prepared
      but I know better next time.It was a great experience worth doing again. I am
      already planning our trip for next year so I can go back and try the attractions
      I missed.","New area called  Toy Storyland  now open. Fresh rides kids will
      love.","This was our second trip to Hong Kong Disneyland. The park was magical
      as before, but this time we spent two days in the park, and I was honestly surprised
      by the quality of the food I found in the park. Specifically, we had dinner
      in the Banquet Hall   a food court of sorts with international type food. The
      food was served piping hot, which was lovely in the winter evening. And the
      pasta and pizzas we ordered surpassed our expectations of what you would get
      in a theme park. It warmed us up nicely in time for sitting out in the cold
      waiting for the fireworks. The quantities were also fairly decent. Two mains
      fed us and our toddler quite nicely. Surprisingly, not many people seemed to
      stay till dinner, so the hall was pretty quiet, with lots of places and absolutely
      no lines. What a relief!","I went there with friends and I''m glad I did! It
      was so fun. It brought me back childhood memories from my favorite movies and
      characters. It''s much smaller than the Disney parks in the USA, but you can
      definitely have a full day of fun activities. There are plenty of exciting rides
      for both kids and adults. They have the old manor, the dolls house (it''s a
      small world), the cups from Alice in Wonderland, the castle, etc. Plus, you
      get the chance to take pictures and get stickers from many movie characters.
      The parade started around 9PM and it didn''t disappoint. One thing different
      from the parks in the USA is that there''s no alcohol.Great place for a weekend
      with family and or friends!","This Attraction was on my daughters(shes 18) bucket
      list of attractions to visit in Hong Kong  And she and we were not disappointed.Making
      use of the excellent MTR transit system we arrived early and because we went
      during a school day there was not a huge crowd waiting to get in. We planned
      where we wanted to visit first in advance so we did not have to wait too long
      for rides or shows. As with all Disney parks it was well set out and very clean.
      Highlights were Toy Story land and the mystery house with the monkey mine rides.Everything
      Is soooo Disney   it makes you feel happy.Food Available was not too bad  though
      green Candy Floss?.The parade of Disney characters was an interesting experience   just
      for the fact that Winnie The Poohs Float broke down during the parade and was
      left stranded for around 20 minutes while the staff wondered how to move it  hilarious.The
      Gift Shops were abundant but must say gifts were well made but slightly pricey.
      Not sure why Marvel characters sold in some   maybe has something to do with
      Disney buying Marvel Inc out.Not Sure If we will see Spiderman and Mickey Mouse
      on the same float in years to come.Overall a great day out for all   go though
      when its a school day or not raining and get there early before the Chinese
      tour groups arrive.","disneyland is the happiest place on earth. It should include
      the maxpass with the ticket prices. It is a money grab and I don''t like that.
      Moblie oredinrg was cool on the app. They should also have more vegy, fresh
      food options like California adventure. hey have very few and I went to one
      and it was closing right in the middle of the day and the next one was so far
      away.","This is an entree size of the original Los Angeles Disneyland.They have
      a small scaled down version of Adventureland, Fantasyland and Tomorrowland,
      although there appears to be extensions going on.Main Street is like LA Disneyland.If
      you''re after the thrilling rollercoaster rides, Space Mountain is the only
      one. Alot of the exciting rides are not there.It''s geared more for the smaller
      market but you can still get that Disney buzz with the character photos and
      parades. While I get that when in Asia, I have to eat Asian, but the food selection
      was disappointing from a Western perspective. It is easy to get to on public
      transport   catch the Disney train from Sunny Bay (near the airport).","The
      park is a much smaller version of the Disneyland of LA or Disneyworld of Florida.
      We enjoyed it but missed see the complete park that we had seen several time
      in California. The shows were wonderful and the staff was very good, helpful
      and always pleasant and caring to the kids that were so excited to see their
      favorite Disney Characters","Disney land is good for a fun day out. The rides
      were pretty cool, and the food was good, although a bit expensive. There are
      big queues for the rides near the entrance, so we started at the back of the
      park. It''s quite small compared to the other ones, but still good. The park
      is clean and well looked after, and easy to go there by tube. Went there about
      tem, and left at four, it gets very crowded at three.","Really loved HK disneyland!!!
      Rides were good for all ages especially to kids and elders, not as scary as
      in ocean park..fireworks were soooooooooooo amazing!!! can''t forget the first
      time that i''d watched it,even the second, when me and my officemate chilled
      until the shows done.. i''m looking forward to visit here during christmas season!!!
      :)","We had an amazing time at Disneyland HK. Stayed at the Disney hotel, gorgeous
      hotel and views from the rooms. Two double beds in the family rooms and connecting
      rooms as well so great for groups. We took the two day pass to Disney and were
      able to see a lot of the park. Favorites would be Space mountain, Grizzly, Mystic
      manor, River adventure, fantasy palace, parade at 3.30pm and the firework at
      8pm. All worth the money and the walking.....","I love Disneyland. We don''t
      go very often, like 4 or 5 times in the last 16 years; but I do love the  magic  you
      find in the Magic Kingdom. Recently I was in Hong Kong for a conference, and
      the  grand finale  to the conference was held at Hong Kong Disneyland. I did
      not want to miss a chance to visit Disney in a different country. How cool would
      that be? Our event started at 7 pm but they let us into the park early, by 5:30
      pm so we could enjoy some of the rides in other areas of the park that wouldn''t
      be open during our private function.I had quite a nice time, despite the rain
      showers that persisted intermittently through the evening; but I was definitely
      surprised at how much smaller the entire park is compared to Disneyland or Disney
      World. In the past, we''ve arrived right as the park opens and stayed until
      nighttime; but it felt like I would have run out of things to do if I''d spent
      the entire day there. Space Mountain is still fantastic, and they''ve got many
      of the same rides; however, many others are noticeably missing. (No Matterhorn,
      no Haunted Mansion, no Pirates of the Caribbean, no Mark Twain Riverboat, no
      Indiana Jones, no 20,000 Leagues Under the Sea   aka Finding Nemo, no Mr. Toad''s
      Wild Ride or Peter Pan, no Alice in Wonderland, etc.) So yes ... much smaller.
      The staff was super accommodating and nice. We had buffet tables set out for
      our private event through several parts of the park, and the selection was very
      good. During the later part of our event, they opened back up Fantasyland for
      a dessert buffet that was fun.Best thing about it ... ease of access getting
      there by MTR. Second best thing ... conference buses taking us directly back
      to our hotel at the end of the night.","This was my first trip to any Disneyland
      in the world and I was truly impressed. From the time we reached the Disneyland
      MTR station we were taken in by the music and so called ''magical'' feeling
      the park was supposed to have given you.Rides are awesome, and different from
      the rest of any themepark that you will go to. Food and souvenir items can be
      a bit on the expensive side and the best part was the ending at 8PM where they
      had the fireworks display for a good 15 minutes at least. Park I heard, is considered
      small but a one day ticket still is not enough time to take all the rides. One
      ride was closed the Space thing, i don''t relaly know what it is called although
      we would really have liked to try this ride as well.","Loved Disneyland......
      Great fun from the time we got there until we left.After reading reviews from
      other trip advisors, we decided to get an early start. We didn''t have time
      to get tickets before we went, so we got them there. We expected huge crowds
      & a long queue, but to our surprise, there was no line. There was a bit of a
      line to get through the gates, but we got it within 5 minutes of gates being
      opened. The flyer for Disneyland stated that opening time was 9 am, so we got
      there at that time...wrong....didn''t open until 10am, we could have had an
      extra hours sleep...hahaha.School holidays were finished, so that may account
      for the fewer crowds, even though it was a Saturday.The park itself was very
      well set out, we found all areas easily as they were well signposted. The lines
      for the rides were no longer than 25 minutes, which I thought was good. Would
      have liked them to have been a bit longer, but I guess they have a lot of people
      to get through. My favourite was Mystic Mountain. Tomorrowland was mostly closed
      due to a StarWars construction which unfortunately wasn''t finished. I was looking
      forward to Tommorowland the most, so it was disappointing not to see most of
      it.The river cruise was fun, our guide was a scream & made us laugh all the
      way through it.Cinderellas Castle was pretty awesome, so was the train that
      goes around the park. The souvenir shops had all the same stuff in them, so
      we waited until we were leaving before buying anything. Everything was reasonably
      priced, which surprised me. I would have given 5 stars, except the food was
      atrocious & extremely expensive. The waffles were excellent, but that was all.
      We went to Grill, a food hall, and ordered a burger n fries. The burger looked
      like it was made of plastic....didn''t taste much better either!!! For 2 burger
      meals ( burger, fries, water) cost us AU$45. Same thing at MacDonalds cost us
      AU$20 and tasted better....lol. Unfortunately you can''t take food into the
      park, your bags are checked at entry, so unless you have a bag with a hidden
      compartment, you have no option but to buy their food. Or have a humougous breakfast...hahaha.All
      in all had a great time, I would definitely visit again. We have no kids, just
      2 oldies reliving our youth, but it was well worth it.","Great fun and a busy
      day. Went on weekday to beat long cues & heat. Lion King show was the highlight","Park
      was a good size and not too tiring for a 3 yr old to explore for the whole day,
      inclusive of a 1hr nap! Food within the park was good too!I went on a non holiday
      friday and there was minimum Q ing. The longest I had to wait for rides was
      20mins! Good!!!","we visited HK Disneyland during christmas vacations.this was
      our first disney experience and we absolutely loved it.Hong Kong Disneyland
      is a full 2 day visit if you wish to cover everything it has to offer...toystory
      land, fantasy world, tomorrow land, adventure land, grizly gulch etc etc. i
      wonder how people say you can finish it in 1 day...not at all...you need 2 full
      days to experience it totally.a must visit place for every traveler to HK ....if
      u r a disney fan. i travelled with my son n husband and parents and we all thoroughly
      enjoyed it .we loved tomorrow land and specially the IRON MAN ride . Grizzly
      gulch was awesome and so was the night parade and the fireworks.its a magical
      world...","The main trip highlight is disneyland. Loads of fun and loads of
      excitement. We had a super time here.","Small compared to Disney World but really
      good for our 6 year old and us being grandparents. Lines were seldom long, but
      it was a Tuesday.  Various rides. Weren''t open when we were all there and we
      didn''t know why","My family had a great experienced, enjoyed every rides and
      shows from start until the spectacular fireworks. An awesome day of pure fun,
      happiness, bonding moments and thrills. Good thing every details, funny antics,
      moments was fully covered by my 2 kids. Definitely we will be back.........
      Soon.","Easy to reach by MTR. It''s a somewhat smaller version compared to Disneyworld
      in Florida, but is as much fun! Park is clean and well maintained and has a
      lot of shops with Disney merchandise. When we visited the park (weekday) it
      was not that crowded and also the waiting times for the attractions were okay!
      They have also the parade at scheduled times.","We found that even in the wet,
      Disney was fun. There was enough shelter in most places that you didn''t get
      soaked but I would bring a brolly. We didn''t do any shows (not the thing for
      Mr 4.5) but he loved the Paint the Night Parade. If you can take a break in
      the afternoon (when its very hot) and come back in the early evening, I would   otherwise
      its a very long day for little ones. MTR is very convenient.","For the price
      of the ticket we expect a bit more warm and friendly welcome from the park esp
      the employees. I understand generally people in HK move fast lane but that is
      not an excuse to be such dry and to some extend snobbish with us the guests.
      Be more helpful and precise in giving directions and help us understand the
      park guide even though they are not in charge at customer service section.Weather
      was almost completely wet thoughout the season and we would expect the park
      to be more proactive in arranging schedule for parade and fireworks such as
      early information. Delay and cancellation of fireworks were stressful for children
      who could have left in happiness to watch it. The least we expect is to give
      info for us to be prepared with season like now or give little discount as people
      travel across the world for this, end up fireworks cancel. Yesterday it delayed
      almost 45 minutes and informed only after 20 minutes pass the schedule time,
      it cause huge distress to most young children.","Being a westerner, I am used
      to going to Disney World in Orlando, Florida so having the chance to go to the
      one in Hong Kong was great as it reminded me of something close to home. Although
      the park is not as big as those in the US it is a lot of fun. We got a great
      deal because for $64 we got the entrance, a meal and even a Disney name tag.
      Loved it.","Thoroughly enjoyed our 2 days at Disneyland.Not sure why but we
      didn''t need to queue long for anything. We visited on the 8th and 10th of September
      and the most we had to wait was one go round per ride.I would suggest the 2
      day pass if traveling with younger children so they can enjoy at their pace.
      There is also stroller rental available which helps when the little legs get
      tired.","Reached Disneyland station by around 10in the morning the park opens
      by 1030 so be there early! Book ticket online to avoid the rush there !!   Usual
      rush of 20mins per ride but choose your area first I would prefer going to the
      jungle river...More","I felt like I was transported back to my childhood days
      where I dreamt of meeting the princesses, mickey and his friends.. the fireworks
      display at night was worth the wait.. no regrets spending my time there.. will
      definitely save up to visit Disney again. This time I hope it will be the Disney
      world in Orlando..","Although it''s not big as others, people coming here is
      less than others too and hence we managed to play all the rides and watch all
      the shows here which is great as the waiting time usually no more than 20 minutes.However,
      when we were here, the castle is still under renovation so there''s no firework
      which is supposedly the highlight in any Disneyland.The popcorn here also doesn''t
      has the special box like in Tokyo. Just a normal packaging.","Based on other
      travellers'' reviews, there are several things I can affirm. The meal coupons
      are really cost saving. The wait for the rides in June was short as there weren''t
      very much visitors. BUT the heat can easily cause sun burn. There isn''t very
      much cooling places to escape from, not very much seating for the elderly. You
      MUST look out for water coolers to refill your bottles. Other than that, it
      was a great experience.","If you have kids and teenagers, Disneyland is the
      place to go when in HK. Although it is not as big and extensive as the one in
      Los Angeles, HK Disneyland has enough attractions to entertain a family for
      the whole day.It has the usual Sleeping Beauty Castle, thrilling Space Mountain
      ride and the not to be missed parade and fireworks. For those who have been
      there in the past, here are new rides in Grizzly Gulch, Mystic Point and Toy
      Story Land.Note: Check the weather forecast. For an ideal experience, avoid
      going there if it''s going to be a wet day.","While the park is not too large,
      it''s comfortable to take 2 days at the park. 1 day will suffice if u start
      early and come in on a non weekend. Crowds come in everyday. Very limited options
      for a Indian vegetarian (only one restaurant has a limited menu). Non Vegetarian
      food is available in aplenty. Carry sandwiches, water, an umbrella for the kids,
      it helps as they tire from all the walking. Wait lines are grueling at times,
      with show wait times being almost half n hour. Iron Man attraction is the latest
      addition to come up next year. Grizzly is a must go to ride. Meet & greet with
      the characters was fun, look for timing as given in the park schedule. The evening
      & night parades are a must see, the fireworks are the highlight.","This is our
      second time in Disneyland Hongkong but the place hasn''t lost its charm. My
      son really loved the attractions, Hyperspace Mountain and Ironman experience.
      We bought 2 day tickets so we don''t have to rush through all the attractions
      and we also waited for the lights parade during the evening.","Great environment
      and excellent service. Awesome character dinner experience with photography
      session for children. Good food in Enchanted Garden. The hotel itself provides
      plenty of activities for children. One example is Tai Chi exercise with Master
      Goofy! Recommended to stay at least 2 days, 1 night to fully enjoy hotel amenities
      and also Disneyland park. Little Disney Princess Themed Package is a must for
      your little ones. Surprise is awaiting for you in your hotel room with all Disney
      decorations. Will come back soon to explore Disney Explorer Lodge!","We spent
      the day recently and were quite impressed. The park is laid out well with plenty
      of rides and food drink outlets. The queues can be large at some rides, take
      note of the times displayed.I would invest in a umbrella, this place was extremely
      hot with very little shade for visitors.1 day was enough for us and we saw most
      attractions. We didn''t stay around for the 9pm fireworks as we were drained
      from the large day. Super easy to get the train to Disney from Central station.Highlights
      were Toy Story Land and Adventure Island. Prams can be hired for smaller children","We
      came here with a group of my son''s school friends and parents.  What a marvellous
      day out!  Friendly and knowledgeable staff, too!","My experiences in this place
      are always worth remembering. The first I time I visited with my mom, I haven   t
      gone through all the attractions. So I vow to visit the place again with friends
      and family and go through to those I have missed before. It would be worth the
      time if you will be early so you can visit all the attractions for every area
      there is queue line and every theater show has a slot time. There is a need
      to budget the time and the guide map is very helpful. The staffs are very friendly.
      The Lion King and Golden Mickey are great. Kind of show that kids will surely
      most love it. The Grizzly Gulch is fun. I love it. It is the most twisting experience
      there ever. Where you can shout loud all the way. But what is the most fascinating
      is the Disney in the stars fireworks. It was breathtaking. Colors sparks above
      the sleeping beauty castle. Dreams do come true indeed. It is surely one of
      the happiest places on earth","Disney is wonderful. You can have fun with the
      kids and be a kid. Thats the beauty of Disney. The rides are good and the queues
      weren''t too bad.","We truly enjoyed our visit to Hong Kong Disneyland. Just
      walking towards the park from the shuttle parking area made us excited to be
      a step closer to the happiest place on earth! Though it was quite a walk, we
      were so glad to finally see the park gates and we posed for souvenir shots along
      the way. There was no queue at the entrance so we just presented our tickets
      and we were off. After the awhile, our small group got separated inside the
      park and it was kinda hard to find each other again in the growing afternoon
      crowd. Anyway, we found each other at some point so its best to agree on a meeting
      site beforehand in case someone in your party gets lost. We enjoyed the Space
      Mountain ride, the Small World boat ride, the train ride (with the little green
      men paparazzi!) and the interactive shooting game ride with Buzz Lightyear.
      We also enjoyed the Stitch encounter, 3D movie at the theater and the fun filled
      night time river boat ride! If Hong Kong DIsneyland, the smallest Disneyland
      theme park as they say, was this uber fun, my kids and I can just imagine how
      much more fun it would be to spend a day in the much bigger DIsneyland parks
      in the USA! What I really like about the park is the picture shooting spots
      that they placed all over the park so you can see which are the most perfect
      picture spots. I also like how clean and well kept the park is. There is much
      space to move around even with the hordes of tourists on the move. The fireworks
      display was indeed a fitting finale to a very wonderful evening!Just be prepared
      to spend for food and drinks   you''ll get hungry from all the excitement! Plus
      bring extra cash for those souvenir items and for emergency purchases (I bought
      my son a raincoat since it suddenly rained during our visit).","Ok..so here
      are the things to remember for HK Disneyland.. 1. Do not bring selfie sticks  monopod:
      A lady there politely told me to keep my stick because it''s not allowed inside...so
      i did..but unfortunately, there are some..only some locals using that...lol2.
      Foods and drinks are not allowed inside. You need to buy foods and drinks there
      so better bring a lot of money coz the price inside is really DOUBLED! Don''t
      forget to try their MICKEY PANCAKE, it tastes very very good! 3. Be patient
      on the ques..almost every ride takes 30 40minutes waiting time. :)4. Provide
      an entire day for Disneyland. The parade and fireworks display are worth the
      wait.5. Save your batteries for the  nightlife  at Disneyland! 6. Make sure
      to bring beanies  jacket (specilly during January February months) it is really
      damn cold!!! :)Have fun!!!","Much bigger than I was expecting. Heard so many
      stories about how small it is, but with small kids it''s actually great. Very
      good for young kids, but older kids would be bored quickly. As usual, food &
      drinks are exorbitant. Night parade was greatGiving it 2 stars for no wireless
      internet in the park.","We visited Disneyland HK in October 2013 its a great
      place to be with kids but since we were not with kids we wrapped the whole place
      by afternoon . Our tour guide took us there at 9:30 in morning. We were so bored
      after...More","Didn   t feel the Disney spirit in this place. There were few
      Disney characters around, but one must wait in long lineup to shake hand with
      them. We stayed for only couple hours and left.","We have 4.5 year old son and
      a single day (11 5) was perfect. We saw everything, went on a few rides, eat,
      laughed and got our photo with buzz light year. For his age a day is enough,
      ''maybe'' with older kids 2 days would be messed art but only if you are ultra
      keen. Magic does happen....","We had an amazing day at Hong Kong Disneyland   absolutely
      perfect for a full day for a family with 3 children (aged 9, 8 and 6). Our children
      were taken with the magic of Disney from the moment they got on the Mickey train
      at Sunny Bay.We arrived as it opened and stayed till it closed (watching the
      spectacular fireworks display). We were there on a Friday.We went on every ride
      (although the children decided Space Mountain was not for them) and even went
      on the Buzz Lightyear ride 4 times. Only one ride required us to queue for a
      long time (about 30 minutes)   I have forgotten the name of it but it was the
      one where you drive your own car around a track. The other rides either had
      no queue or just a couple of minutes.The Golden Mickey show was excellent. The
      commentary was in Chinese but there were English subtitles on the right hand
      side of the stage. All the songs were in English. It would not have mattered
      too much if we could not have seen the subtitles. The Lion King show was off
      the day we visited which was a shame as it is also meant to be very good. We
      saw the High School Musical show but it was not of the high standard of the
      Golden Mickeys show.We bought a meal package at the entrance that gave us lunch,
      dinner and a snack for about $100 HK per person. The food was ok   similar quality
      to most theme parks (much better than Ocean Park where we went a few days later)   and
      the voucher enabled you to choose a western or asian style meal. It was good
      knowing that we did not have to outlay more money during the day for food.The
      park is spotlessly clean.The park is so full of happy and excited people. The
      enthusiasm of all the staff and visitors is contagious.Our children will remember
      it always as such a magical day.","We went to Disneyland Hong Kong with a 3.5
      year old, and a 13 month old. As an adult, initially I rated it 3 10, but conceded
      that to a child, it would have been 8 10. Having read the other reviews, I expected
      the pushing and shoving, rude tourists, queue jumpers, and extended line up
      times. All of which occurred, inparticular during the parade in which people
      wouldn''t take no for an answer and continued to try to elbow us out the way.
      My husband nearly ripped one guys shoulder off when shoving him back so I wouldn''t
      drop my baby. All in all, the kids could go on most rides, and our 3 year old
      was pretty good at waiting in lines. Some rides were quite disappointing (like
      dumbo the elephant, the carousel), in that the staff would begin the ride without
      all seats being filled. We went to Disneyland on a Monday, and had been warned
      not to go on a weekend or holiday. However after we went to ocean park on the
      Friday following, Disneyland won hands down for younger kids (ie  there were
      no rides to cater for kids under 122 cm tall at Ocean park, but hardly any rides
      at Disneyland excluded our 3 year old). So even though there were lines, you
      wouldn''t be turned away from a ride with a young child. We managed to get through
      and experience most things at Disneyland during the one day (given that we left
      at 5.40pm), so the few rides with big line ups  we did those on a partial second
      day. For around au$14 extra per ticket, it is worth the 2 day pass, just in
      case, and because you kinda know your way around on the second day, you enjoy
      your food and take your time.The food on the first day was a bit disappointing
      in regard to searching the streets for a vendor (I could only find ones selling
      popcorn  and thought we should have something a bit more substantial for lunch),
      and then I walked back through the park to a bakery near the entrance for some
      food to take back to toystoryland where my husband was lining up for a ride
      with the 3 yr old. Quite a walk. other places required you to dine in. However
      in retrospect, it makes good sense to have a snack or otherwise by around 11am,
      and then go for a late lunch around 2pm in the royal banquet hall ( good selection
      of eastern and western food), and hardly a line of people that late, so service
      is immediate and you can find a table easily too. The food in there was good.
      To meet the characters, the lines were always too long to the point where they
      wouldn''t accept people to line up anymore, and told you to come back in an
      hour etc. this didn''t bother us because we booked the character buffet dinner
      at the Disneyland hotel, enchanted garden restaurant, as advertised on the disneyland
      website. We booked in advance, although the restaurant was not full, and by
      eating at 6pm Instead of later, the characters had a lot of time to interact
      because the crowds tend to come in later in Hong Kong. My Only advice is  the
      hotel is actually out of the Disneyland gates. You catch a shuttle there. Nobody
      told us this prior, we thought it was within Disneyland itself. The we got confused
      as to which of the 2 hotels the dinner was at  and ended up at the wrong one.
      All turned out ok in the end, the international buffet was amazing, best food.
      And having 2 blonde little fair skinned girls, Minnie Mouse took quite a liking
      to our table, our girls were chuffed, and we ended up with over 6 folders of
      photos to choose a selection from!! Even as an adult rating the park 3 10, the
      dinner is 10 10. We also hired a stroller for the day  recommended. You had
      to leave the stroller in designated stroller bays for some rides (like the jungle
      cruise, or its a small world etc), however they are clearly labelled, and you
      don''t leave your bags in them). The mtr was easy to get there, and recommended,
      however don''t hang around for the fireworks at 8pm (we could see them after
      we finished our buffet dinner at the hotel and got the free shuttle bus back
      to Disneyland to get the mtr  firstly, they did not last long, so unless you''re
      in love with fireworks, you''ll be disappointed) AND secondly, there was a mass
      exodus and people pushing and shoving on the train. The only good thing about
      this was that as soon as people see that you have a baby or young child  they
      give up their seat no questions asked. So in contrast to our poor ocean park
      experience  if you have children under 130cm tall, or children under age 6 7,
      definitely choose Disneyland instead of ocean park. 2 day ticket is worth it,
      but if you''re not that interested in rides, the character buffet dinner (enchanted
      garden restaurant at the Disneyland hotel) is a MUST. Even if you skip the park
      if you''re short on time, do the dinner alone, worth it''s weight in gold.","It''s
      our first time in Hong Kong and of course we wouldn''t miss Disneyland in our
      itinerary! Parking is spacious. They have their own MTR station which is awesome.
      The entrance (arc) itself is an attraction already, it''s a sign you really
      got to Disneyland. A lot of people take pictures from there up to the fountain
      with a whale and Mickey Mouse on it.Most of the rides here are for kids only.
      I think Space Mountain and RC Racer are the only rides not ''really'' suitable
      for kids.Make sure you visit all of the lands, especially Toy Story Land! Only
      HK and Paris has this one. And make sure you catch the Flights of Fantasy Parade
      and the fireworks at 8 PM in front of Sleeping Beauty''s castle.","Hong Kong
      Disneyland must be a 60 70% of the L.A. Disneyland,and at 60 70% of the LA.Price,
      but it is absolutly worth going,   It has very litle of chinese ambient, i thought
      they would use this a bit more.  We went there on a weekday in...More","There
      is really nothing much to see. We thought it will take us full day to see everything
      here but we finished all the possible rides within 4 hours. It is a small Disney
      land.","It was pretty exciting to be there. You can spent hours just wondering
      about and the queue is very long to take photos with disney characters though.
      Not much of choice for food though and it is very expensive.","This is Disneyland!  Suggested
      attractions:    Mystic Manor    Small world is a good choice if you like  easy  rides    watch
      the Lion King show    even if tired, wait for the closing fireworks for a complete
      experience","Have been to Disney World, Disneyland Anaheim and Tokyo Disneyland
      but I feel that Disneyland Hong Kong is really too small to be called a Disneyland.
      It has way too few rides and attractions. Souvenirs, food and even entrance
      tickets are slightly more expensive than other Disneyland as well. Basically,
      this park is good only for small children and people who has never been to Disney.
      The food choices were acceptable, mostly fast food, and not too expensive. Bottled
      water, however, was VERY expensive but they do have water fountains around for
      you to refill your water bottles. The parade was pretty good. It was crowded
      not a problem but what was the problem was the people were just so rude, the
      pushing and shoving cutting in lines for the rides, gift shops, food stands
      was just to much to take. forget trying to see one of the shows its a free for
      all for seats, i don''t see how Disney can let this happen, it was by far the
      worst managed Disney property.","Went to Disneyland HK with my 6 year old after
      Chinese golden week during weekday. Not a lot of queue at all so only had to
      wait 45mn for one attraction. The rest was 5 10mn wait Max. Very small Disneyland
      but my daughter was very happy as not too much walking around and she was able
      to do most of the attractions in a day''s timeOverall a suitable Disneyland
      park for 5 6 year old kids. I did not take my youngest (2 yr old) and I think
      I was right since not so many rides suitable for her.I guess if you have 4 6
      year old kids, the park is good enough. Below that age, Ocean World might be
      a better bet.","had friends take me nice size to roam around in the rides were
      fun and prices ok for the park spent the day there","HK Disney is small but
      fun for younger children . Halloween decorations and special venues were well
      done and scary! Great value for an evening of Halloween fun. Park almost empty
      in early October after 6, which was great!","It was mandatory that we go to
      Disneyland as my 3 year old daughter is a Disney fan. It was a very good experience
      for her to see the 3D show, pose with Tink, ride Dumbo, etc. My daughter loved
      it so much and she talked about Disneyland for a long time.It was a different
      story for my 7 year old nephew who has been to Disneyland twice before. Given
      a choice, he wouldn''t have joined us. There was nothing new to offer to him
      anymore. The other adults who had been to Disneyland felt the same way. They
      were just so happy to witness my 3 year old revel at the theme park. It didn''t
      help that it was a very hot April day and the rides were very long when we went
      Disneyland.","We went as a group of adults and had a blast. There are lots of
      rides for us big kids, lots of places to eat, and the parade and fireworks at
      night are great! It''s worth a day trip while in Hong Kong.","Very nice outing
      for full family. Best part about the park is the parade which is held every
      day before the park shuts. It is something no one should miss. All the characters
      in disney parade with their attires and lighting. A must visit","I spent one
      day at Hong Kong Disney land which was definatly enough time to see everything
      I wanted to see, but did need a full day. The park is quite small, but still
      fun and entertaining all the same. They are currently developing there  small
      world  section, not sure when it opens, but I''m sure it will be wonderful when
      it does. There are not many rides but still lots to do. There were barely any
      queues for rides at the time I was there which was July which was great.I would
      very highly recommend if you are staying at Disneyland to have breakfast with
      the characters. They spent quite a lot of time at each table while we were eating
      breakfast, so that we could get photos with them, doing it this way also means
      the characters come to you, you don''t have to queue up for 20mins for a photo
      once inside the park.The prices in the shops were reasonable which I didn''t
      expect from Disney land, so I was able to stock up on souveniers.","You will
      fill 2 days also less to visit this. Nice attraction. Even the ocean park is
      also one of the nice attaction in Hongkong","Disneyland was the main reason
      for our hong kong tour. We had a fun time. It was weird hearing the characters
      speak in Chinese but you will eventually get use to it. I love the star wars
      area :)It''s great place for pictures. But please take note they strictly prohibit
      the use of selfie stick. This is my dream place for a pre wedding pictorial.One
      day is not enough to enjoy the place. No long lines, only 5minute wait with
      all the rides and attraction. Explore first! Don''t shop at the first two hours
      of your stay in Disneyland.It is expensive, we expected that so we wanted good
      service. Maybe it''s the culture thing but the staff could be more polite. It
      looked like it hurts when they smile. It''s better to download the app before
      visiting the place than go find help in the information area. People there were
      useless and rude.Bring a big bottle of water, because it is expensive!","if
      you think that you should visit Disneyland only if you are accompanied with
      kids... then you are WRONG !this theme park is offering hundred''s of attraction
      for every age group. It''s becoming expensive one as charges for a adult is
      538 HKD. Park is offering the hotels but that too little expensive.","the first
      time my wife and I have been to a Disney park without our son or grandkids,
      I even got a senior discount! Full marks for the ease of getting there using
      MTR and the special connection.We went on a Friday and it was quite comfortable.
      I imagine at a weekend during school holidays it will get very crowded, but
      we were able to get on all the things we wanted to without big queues.One or
      Two day passes are on sale. I cannot see how it could take more than one day
      to do everything, even with children in tow. In all a very pleasant day out.","i
      suggest instead of giving it just a day,rather one should stay there for atleast
      2 days to enjoy the disney magic to the fullest.Loved the courtesy of the staff
      over there.Food is available for purchase but will cost a good deal on your
      pocket.No problems to be faced at all by differently abled.","The Hong Kong
      Disneyland is one of the quickest ways to experience Disneyland. It is not as
      large as the other Disneylands but it give a good experience. If on a short
      trip or passing through Hong Kong with kids, it would be worth a visit. One
      day is enough to cover almost all the rides as the waiting time is mostly between
      10mins and 30mins. The Disneyland is a bit away from Hong Kong city so it is
      recommended to travel by the special train that goes all the way to Disneyland
      station. Moreover that ride itself provides an experience as the interiors of
      the train features some Disney characters and even the train windows are customised
      in that theme. Tickets can be bought online and using the barcode in the confirmation
      email we can print the tickets using self service machines at the park entrance.
      If you are spending part of the time to take pictures with the Disneyland characters
      then it may take more time to cover the whole park as the queues for these photo
      sessions were long and most of the time the characters would be available in
      intervals only. It is worth waiting for the procession that starts around 7pm.
      Show is quiet impressive. Can be enjoyed by kids as well as adults. Later in
      the night there is a fireworks show which you can wait for if there is enough
      time. Recommended to visit the park during winter times to get a better over
      all experience. There are a few restaurants inside the park catering dishes
      from all over the world so there will be something for everyone. Overall it
      is recommended for kids including younger kids as it is quiet easy to manage
      them in this park. The latest attraction during my visit   The Iron Man experience
      was not yet open to public but was available for those staying at the Disneyland
      hotel. Probably at the time of writing this review it would have been open to
      public. The two hotels inside the park are relatively expensive and I don''t
      recommend to stay there as it will also be far away from Hong Kong city making
      it difficult to travel back and forth. If only visiting the Disneyland then
      it''s ok to stay there and experience it. I did not find any restriction for
      photography and equipments like tripod, monopod. But it will be better to use
      a light camera and multipurpose lens. During the evening fireworks or processions
      we can use the tripod if required. Until then lockers can be utilised to keep
      valuables and accessories.","Its was a good decision to visit the part in the
      late afternoon when its less crowded (5min wait time for most rides) and less
      hot. While we finish our day there, we were treated to a fantastic firework
      display at 8pm closing the park. Defiantly worth the price of our tickets!","Although
      I read the reviews prior to going, I still wasn''t expecting the park to be
      that small. The first disappointment was the ''fake'' train station building.
      It looked like a backdrop from a cheap play made out of canvas. Main Street
      was less than 5th of the length than it''s counterparts, and castle (although
      surrounding by hoarding), looked no higher than your tallest basketball player!
      Many of the food establishments were closed, although what i eat eat was very
      good. Been to many Disney Parks, and this was by far the worst...really not
      worth they money they''re asking for.","We are 31 years old & LOVED Hong Kong
      Disneyland!!! It''s clean, efficiently run, everything looks new, it''s very
      colourful, loads of shops carts to buy water, sweets & other refreshments and
      lots of toilets.Entry is 500HKD & it''s worth every cent. We went on an extremely
      hot & humid day. We were sweating like mad so we enjoyed ducking in and out
      of the air conditioned shops.Space Mountain & It''s a Small World After All
      have line ups that are air con too which is very nice in the relentless heat
      of June.Staff are friendly, helpful & all wear name badges which is cute. Although
      full of tourists visitors, there''s so many staff that while you may need to
      line up for gift of food purchases, it doesn''t take long.Lines for the rides
      get much shorter at sun down so if you have some favourites you can hit them
      over & over at a fast rate.There are about 5 lands & although quite a small
      Disneyland, we still needed from noon til close to cover most of it.The parade
      & fireworks are well worth staying for & then you can leave & catch the Disney
      themed train back into the city.Amazing day out!!!","We went on a Saturday which
      is apparently one of the busiest days! Rides were good but some booked out.
      Definitely get the fast pass and use the App. Didn   t wait for the parade as
      it was so crowded. If going with younger kids I would go to this park early
      before it gets so crowded then to California park.","Having been to California
      Disney many times, Hong Kong pales in comparison by far. Fewer rides, different
      vibe, awful food. If you have time and want to spend the money, go. Just know
      what you''re in for. We struggled to find enough to do for 5 hours, rode a few
      rides multiple times even, and were done. We went in November when the weather
      was decent and found it warm. Cannot imagine going in the heat, let alone with
      children.","We visited Disneyland with our 12 year old son. He enjoyed a lot,
      but not much to see. Very few rides and it''s just a fun filled outing. It''s
      not worth to stay inside Disneyland, as one day is more than enough to look
      around. It is just a mini Disneyland. Don''t miss the parade which starts around
      7.30 pm, it''s really amazing to watch all Disney characters walk around. Overall
      it would be fun for kids going for the first time.","It was good. Hong kong
      to me has one of the most easiest train route to everywhere. For Disneyland,
      there are halal stores for muslim. I bought advance meal coupon from klook.
      This help me save a lot. Just remember to show it to them upon entering. You
      have to redeem it before entering Disneyland.The Night show was just average
      to me.( The projector show)","We took our relatives with young children to visit
      the park, they absolutely loved it, the comments are very positive. However,
      there are some small details worth addressing to: 1) the bar code scanning for
      mobile phone (non paper) is not working easily, which slowed down the speed
      at the entrance and caused a longer line. Suggest to give a separate queue line
      for the scanning. 2) we cannot find out the  meeting with the character  time
      schedule easily, not on line anyway. 3) Selfie sticks are banned, but we still
      saw the visitors using them in the park. How does the park enforce the rules?
      4) Chinese mainland tourists usually like to jump the queue and ignore the stopping
      line even, we saw at one occasion one man with a kid jumping over a blocking
      line for crowd control but no one stopped them. How will the park control such
      situation?","It was a dream of mine to visit all 6 Disney parks around the world
      and this was the 5th one I got to check off! We had wonderful weather and it
      was pretty quiet during the day. We went during Halloween Time so the parades
      were very fun and the kids enjoyed themselves. I have never seen a Disney park
      offer merchandise discounts if you come before noon, so definitely take advantage
      of that. It is very small like the original Disneyland but is unique in it''s
      own way. It definitely has the best Thunder Mountain of any park around the
      world!","Disneyland Hong Kong just opened in 2005 and it shows. The park was
      incredibly clean, even by Disney standards. Everything was modern and new. I
      was blessed with going on a quiet day so wait times were never longer than 15
      minutes in queue and most were less than 5 minutes.It was mid November when
      I was there and was lucky enough to see holiday decorations in the park as well,
      which really added to the atmosphere even though you are in a sub tropical climate!If
      you have been to other Disney parks around the world, this one might seem small
      in comparison, but the fact that I was able to go on every ride and attraction
      I wanted to still made it worth the day trip. Plan for a whole day just so you
      can enjoy the rides and attractions at your leisure and at closing time enjoy
      the fireworks show. But if you are a speedster, I could have easily done everything
      I wanted to do in the park in about 4 hours.","Our family went early in the
      morning at 0930hrs in order to maximize our day unless you prefer to stay over.
      What i do not like is the long queue for the rides but other than that was a
      great place for all ages","I visited HK Disney quite a while ago (Jan 2006).
      I was thoroughly disappointed but not enough to write a review. However, after
      reading so many positive reviews, I felt compelled to write one myself.Good   Not
      crowded; good layout; wide streets; clean; new; cheap compared to other Disneys
      in every respect   food, merchandise, tickets; landscaping immaculate; convenient
      to get to; multiple languages for guests.Bad   SIZE; lack of attractions, especially
      those that make Disney so fun and have made Disney so famous in America; people
      cutting in lines; people spitting; people sleeping on benches and bathing in
      drinking fountains; staff being too timid to do anything about obvious rule
      breakers.Okay, I am from America and grew up near Disney World in Orlando, Florida.
      I worked in Guangzhou, China for quite a while including the time of HK Disney''s
      opening. Therefore, I was constantly getting news about the new Disney. Because
      I grew up near Disney World, Disney''s defining characteristic to me is its
      size. It''s huge! Let me list some facts so people can understand.Disney World   30,000
      acres; 4 theme parks plus many others like water parks, campgrounds, outdoor
      parks, etc.; 24 resort hotels not including campgrounds; 99 holes of golf available;
      employee training center (large office complex); huge area with employee store.HK
      Disney   350 acres; 1 theme park; 2 resort hotels.Disney World in Orlando is
      less than 1 4 developed, yet still boasts all of those things. Animal Kingdom,
      one park, is 500 acres, which is still larger than the entire HK Disney building
      area. When you enter the Disney property limits, you drive for miles without
      seeing anything but trees and grass. Their size of the property is astounding.
      The parks themselves are also huge with too many attractions to finish in one
      day, especially if lines are long. You can park in one place and travel from
      park to park by monorail. From Disney''s website:  If you wanted to stay in
      all the guest rooms in all of the hotels and resorts currently open on Walt
      Disney World property (at a rate of one per night), it would take more than
      61 years. HK Disney is based mostly on Magic Kingdom, one of the four theme
      parks in Walt Disney World. Yet, it is less than half the size of Magic Kingdom.
      Magic Kingdom has 45 rides. HK Disney 22, and some of those are from other parks
      such as Animal Kingdom. Worst of all, the rides that are most popular at Magic
      Kingdom are not even in HK with Space Mountain being the notable exception.For
      quite some time before going there, I was told HK Disney is small. I was prepared
      for small. I was not prepared for microscopic. It''s like a miniature Magic
      Kingdom. The castle is 77 feet tall. WDW''s is 185 feet tall, over twice as
      tall. Main St is tiny. When we first arrived, we unknowingly walked from one
      end of the park to the other not understanding why we couldn''t continue (took
      about 5 minutes). It was only after looking at the map that we realized we had
      already reached the end of the park.I do not agree with some of the other members
      on here that construction was great. I thought many things looked quite cheap.
      There were also a lot of things in rides that were downscaled quite a bit compared
      to WDW. Overall, I felt they cut a lot of corners with the park.Space Mountain
      is much smaller, but might actually be better. Lion King was much different,
      and also possibly a better show overall.I think the worst yet best thing for
      me was the Mainlanders. I speak fluent Mandarin and a little Cantonese so I
      could understand what was going on. The worst was the Mainlanders pushing through
      lines as if there were no other people there. They would spit, bathe in the
      drinking fountains, remove shirts and shoes and lounge on benches and sidewalks,
      spit, stare at peole like me who are obviously foreigners and make comments,
      etc. They couldn''t figure out how to use the Fastpass machines and caused all
      kinds of problems in lines everywhere. They argued when they weren''t allowed
      to cut in front of the legitimate Fastpass holders even though they themselves
      had no Fastpass. The undertrained staff was too scared to enforce rules for
      the most part.The best was the HK residents enforcing the rules themselves.
      At almost every ride, while waiting, an argument would break out between a HK
      resident and a Mainlander because of something the latter did. It was great
      to watch and made waiting in line quite fun.I think Disney did a horrible job
      planning this park. I think Disney was not prepared for the Chinese market and
      customers and not at all familiar enough with them from the beginning. I think
      the park misrepresents Disney to those that know nothing of its other parks.
      There have been countless news stories of administrative problems as well. Disney
      built its smallest park in one of the most densely populated areas in the world
      next to the most populous country in the world?!?! I just find it amazing that
      a company as big as this could make so many mistakes. To me, it all comes down
      to poor planning and not knowing enough about the local market. Too bad.","Small,
      crowded, catered for little ones.  The only thing better than any other Disneyland
      is that you can actually get relatively good food.  That is about it.","Fantastic
      place   so clean and every detail is so exact; a real pleasure to visit. No
      long queues and all the rides were great fun.The catering is poor   many outlets
      were closed and the ones which were open were crowded and noisy; the quality
      of the food was terrible. We thought that they would confiscate food we tried
      to take in when they did the bag searches BUT other people were allowed in,
      so next time we will take our own food.This is a big place and I think it''s
      better to buy the 3 day pass and at least do one morning afternoon visit and
      on another day do an afternoon and evening visit. We were so tired from walking
      and the activities that we had to miss the fireworks in the evening.A great
      day out and 100 times better than Ocean Park.","My 5 year old daughter and I
      had a fantastic time at Disneyland. We spent 3 full days there from 10am until
      8pm and still left wanting more!The rides were fantastic and we loved space
      mountain and grizzly gulch which we went on too many times to count!! We also
      loved all the shows especially the Lion King show and the 3d movie was also
      amazing.The food at the park was fantastic with plenty of variety. We has lunch
      twice at the Banquet Hall in Fantasyland and loved it.Don''t miss the fireworks
      they are amazing.Be warned however   the crowds are massive and the pushing
      in and lack of manners from other adults was hard to take for us.","We have
      been coming to Disneyland Resort for years and big fans. My 3 year old granddaughter
      has a severe hearing loss, but knows about 1,000 signs. My wife did research
      and found that they do Frozen with a sign language interpreter at some shows.
      We checked with Guest Services at the entrance and they told us it was on Friday
      at the noon show. They also told us that Mickey and the Magical Map also had
      interpreter services on Monday at noon.While at the Mickey show, we met to if
      the interpreters and learned how to access the weekly schedule of all the shows
      and parades that they do. If you Google  Interpreters Disneyland  you will find
      a link to Disney''s website. Go to the DHH link and embedded in the synopsis
      is a  calendar  link to download the weekly schedule.They offer the services
      Friday through Monday. They have special areas for Parades and shows. The plus
      side is you don''t have to show up hours early for a parade, the downside is
      that it is not a premium view, but not bad considering. The other surprise on
      the schedule is that also do some of the rides as well; including Jungle Cruise,
      Story Book, etc.The cast members are excellent and enthusiastic in their roles.
      We were most surprised that this service has been around since 2010. It is just
      not promoted by Disneyland. In fact at various rides and at City Hall, they
      were either unaware of the service, when it was offered and generally gave contradictory
      information. It was the two cast members that we met at Mickey''s Magical Map
      that we learned about everything that they offer. I highly recommend that if
      you or anyone in your party can utilize this service that you find the schedule
      and use it to your advantage to provide a much more enriched experience.","i
      can safely say that its good to be here during october where there is not much
      people waiting in line:P you have to be in shape for the ong walks though:P
      its a fun filled experience for kids and adults especially we say the Glow in
      the Park parade:P","It makes me remember why it''s so much fun to be a child.
      Even child at heart grown ups like me will be able to maximize the stay there.
      I especially loved the interactive shows! Kudos to the team for making everyone
      fall in love with the place!","Disneyland in Hong Kong is a beautiful park with
      lots of fountains, flowers and Disney Art work. It was so clean you could almost
      eat off the pavement. The rides were great and the employees were very nice.
      The best deal was it only cost me $13.85 (100 Hong Kong)American. One other
      plus is that they have regular Western toilets instead of Squatty Potties.","I
      just came back on 22 Apr 2010. It is my first time to disneyland and i will
      said hong kong disneyland is perfect family outing with children below 12 years
      old. I stay at disneyland hotel , fantasia room with a jacuzzi (king size bed   1
      sofa bed) ...Let me summarized my findings at Airport to disney hotelsIf you
      traveled with 2 4 peoples, you should go via the cab. It is cheaper than taking
      MRT and save more time. It only cost around HKG 120 130 per way and 15 minutes
      to reach the hotel.Disneyland Hotel ... There is 2 hotels   Disneyland hotel
      (higher rate) and hollywood hotel First I thought paying more to stay at disneyland
      hotel to get to have more experienced and excitement with my 2 sons but it kinda
      dissappointed , reason because there is not much pictures wallpapers of disney
      characters especially mickey .. u hardly see any mickey logo even on the lift
      or in the room .. and there is not much restaurants in disneyland hotel compare
      with hollywood hotel ... I did book a breakfast at enchanted garden and we are
      having a great time especially my 2 kids .. the breakfast time divided to two
      section, 8.00 9.30am and 10.00 11.30am. During my section, there is 4 characters
      showing Mickey , Daisy , Goofy and Pluto .. I been told, beside goofy and pluto
      , the others 2 charaters may be different .. so depends on your luck. And if
      you staying in disneyland hotel, you should book the breakfast through reception,
      you get cheaper price. During the breakfast, you hardly eat , but most of the
      time taking photo as each characters will go to your table at least 1 or 2 times.
      I went to Hollywood hotel for dinner at chef mickey restaurant... it is a very
      good place to dine after a whole day trip to the themed park, there is lots
      of hkg flavoured food , with japanese, indian and others cuisine. I am lucky
      as I sit beside the walkway and Goofy appeared .. managed to get some photos
      ...summary , the disneyland hotel is clean, quite and the staff is very friendly
      .. during check out .. princess Bell (beauty and the beast) appeared and we
      managed to take some photo with her .. facilities, indoor and outdoor swimming
      pool , gym , tennis court .. Disney Themed ParkAs I stay at Disneyland hotel
      , there is a promotion on buy 1 ticket and play for 2 days. As my flight reach
      there around 1pm, after check in , we went to the themed park around 3.30pm
      on the first day.. There will be a shuttle bus picking you at disneyland   hollywood
      hotel to the themed park with frequency of 10 minutes. please note, you cant
      bring in food or water into the park. while you entering , staff will check
      your bags. Unless you have infant, water is not allowed. Also please check out
      how to get the fast pass to avoid long queue. As 3.30pm is the parade, during
      my admission , most of the peoples already left or back to hotel and to take
      a rest for the 7.30 fireworks show.I reach into the themed park at 4pm, you
      will see people queing to take photo with mickey   minnie on the center of main
      street. it takes me about 15 minutes to Q. Around that time, chip and dale,
      pluto and goofy also appeared at nearby , but the Q is around 5 minutes ...
      on the US mainstreet, mostly for shopping , so the first stop you should reach
      is fantasy land ... you spend more time here .. main attraction is the 3D Movie,
      dumbo ride, cinderella carousel. And the rest main attraction will be stich,
      space mountain, light buzzyear shooting. Characters..There will be few spots
      that the charaters will be appearing depends on time, check out the guidemap
      .. during my visit (mickey and minnie) (a must queue) , chip and dale, goofy
      and pluto at main street , at fantasy land there is 4 small booths, individual
      mickey, minnie, pooh eeyore, goofy . I noticed donald will appear beside the
      3D Movies at 5pm. I waitied the next day and donald appeard the same time. tommorow
      land, light buzzyear and its a small world area there is pinnochio at 5pm. castle
      area , princess bell and snow white so i suggest you should first go and check
      out with information or those disney staff to get some tips and charaters appearance.there
      is few food court available in the themed park. from asian to western cussine.overall.
      it is a wonderful place for family and i be back next year for sure.","My wife
      and I loved Disneyland..We spent 3 days with a 3 day Hopper pass in between
      California Adventure and Disneyland...We still could have spent more time in
      both..The family and happy atmosphere is compulsive and can   t wait to get
      back. Stay for the fireworks down Main Street. Plenty of wifi hot spots, food
      stores and great gift shops..unexpectedly good rides like the Small Small world
      in Fantasyland are a must...","After visiting Walt Disney world in Orlando 3
      times we expected Hong Kong Disneyland to be on those same lines but unfortunately
      we found the park to be quite small compared to the one in U.S.A., nevertheless
      if you want to enjoy a fun day with the kids I would recommend getting a one
      day pass as you will have enough time to explore the park .","Our family have
      been spending Christmas in Hong Kong Disneyland for two consecutive years already.
      Each visit is worthwhile. You will feel like a child all over again. The parade
      is so fun    but wait for the fireworks display    it will give you goosebumps.
      Made me cry the first time I watch. Will definitely go back here.","One can
      live his her childhood again by coming here irrespective of age. Everyone must
      visit this place once in their lifetime. Having visited the Paris Disneyland
      as well,I can say this is bigger and better! One needs the entire day here to
      experience all the rides etc.The fireworks at night and the parade are mindblowing.","Very
      good! Liked it better than Disney Paris! Big Grizzly Mountain Ride was great
      as it combined several Disney World Orlando rides into one ride that is 2X longer.
      Halloween decorations great. Very easy to get to with your Octapus card and
      1 transfer at Sunny bay.","Disneyland Hk during our visit april 2013 is kinda
      crowded, photo opportunity with Mickey and Minnie Mouse took almost 1 hour because
      of the very long line. Better to get and pay for a VIP pass to be in front of
      all the lines (photo opps and rides) as it really get so crowded. But of course
      visiting this place gives you an explainable feeling, we all grew up liking
      mickey mouse isn''t it?","I have been here before and it was just not the same.
      The crowds are much bigger and the wait is too long. There are no trees so there
      is no shelter from the hot sun! The staff are not as friendly as they used to
      be and they did not try to understand that the temperatures were high and they
      could easily have hurried the pace between rides if they managed it properly.
      Also they never filled up all the rides and a lot of rides had only two or three
      people where 4 or 5 could easily have gone. The only good thing was they had
      a fast tract where you could punch your ticket and were given a time to come
      back for that particular ride. Though the time given was 4 or 5 hours after
      it still meant that we did not have to wait under the hot sun.The parade only
      starts at 7:30 PM and the light show at 9 PM!!!We were there from 1000 AM and
      there was no way our children could stay awake that late.They should look at
      having these two much earlier.","It''s one of the best attractions of Hong Kong
      that requires you to spend at least the entire day there. The experience begins
      as soon as you reach Sunny Bay MTR. The train to Disneyland is fitted with everything
      iconic about Disney, including the windows!The entire theme park is super clean
      and it opens as early at 10am as a preview. The rides cater to both adults and
      children. Spend time and explore. The new ride for Ironman is superb, though
      the StarWars attraction was a little under developed for such a rich franchise.
      One thing to note for adults is the lack of coffee throughout the theme park.
      Lunchtime crowds can be very challenging on your patience. End your day at the
      souvenir shops and not at the beginning. Else you will have to lug all your
      gifts on gravity defying rides. Stay for the parade that starts at 8pm and only
      leave after the nightly fireworks. It''s worth it all! Enjoy!","Huge place to
      explore with many interesting spot. Have great memories in this place. Do purchase
      your ticket earlier because you wont want to line up with long queue at the
      ticket counter.","One of the few place in Hongkong where I can find hospitality.
      Timing of shows are available at entrance. That allows us to plan the day. The
      ''festival of lion king'' and ''Mickey and wonderous book''   shows are highly
      recommended. Downside is the photo taking timing is not available on the brochure
      and you can only know when you are there. If you are staying at Disneyland hotel,
      have breakfast at enchanted garden whereby main Disney characters (Mickey, Minnie,
      goofy, Pluto) will be out to take photos with you. In this way, you can save
      time queueing to take photo in Disneyland.","We went on Halloween weekend and
      saw the villain parades and the experiment ghost house (not in English but still
      fun). The park was quiet enough, especially in the morning, to go on the rides
      without queuing for longer than about 5 10 minutes, some had no queues at all.","My
      first trip to Disneyland ever. Definitely wont be my last. Staff are friendly
      to help with our inquiries and despite the long wait for the rides, they are
      definitely enjoyable.Will definitely revisit in the future. Thabks for bringing
      the kid in me once again.","Quite a small Disney by all accounts and when we
      went it was extremely busy with most rides having a 45 min wait, some as much
      as 1.5 hrs! Easy to get to by MTR, but make sure you have enough credit on your
      Octopus for the return journey! If you stay to the end of the fireworks expect
      the MTR to be very bust indeed, but they didn''t let it get too overcrowded.Some
      of the attractions were being renovated, but the major hit with our 4 year old
      was the Ironman Experience which was worth the wait.","If you have been to other
      Disneyland, keep your expectations low when visiting Disneyland Hong Kong.Featuring
      only a few attractions, smaller land area and water downed rides (uhmm yes...
      I''m talking about Mystic Manor). You can''t help but compare this to other
      theme parks and Universal Studios SG offers more than this one.On the plus side,
      well there''s no long queue here for the  It''s a small world  attraction.","we
      went there not knowing its their 10th year anniversary. we were astonished with
      the parade as if we went back to our childhood, we were so overwhelmed. well,
      you can''t blame us its our first. and the firework is sooo extravagant. overall
      it was great but the food is quite expensive so if you are on a tight budget,
      better bring sandwiches. and also wear comfy shoes for you will be walking and
      standing most of the time.","You can access this through the MTR going to Lai
      King, then Sunny Bay, then to the Disneyland Resort in less than 30 minutes.
      Needs a lot of walking though and the food of course, as expected is not cheap.
      Soda is around HK$30, french fries also HK$28. Average food item is around HK$50
      to HK$100. i witnessed two parades, one in the afternoon and one at night. These
      were both spectacular, colorful and quite wonderful. All the disney characters
      were shown. Be sure to bring your camera or video camera with you. Since this
      is my 3rd or 4th time to be here, and my kids are also grown up, we only did
      a few of the rides. The best one they liked is the Grizzly Bear. After 6 pm,
      the rides are easier to line up since there are only short queue. cost us HK$539
      each but it is worth the price.","My husband and I did a day trip to Disneyland
      on a Saturday. The park was absolutely incredible and not too busy! Wait times
      were very reasonable for rides. We were told that the park is quieter at this
      time of year as school holidays have ended. The variety and price of food was
      great. You must try a Mickey Waffle they are delicious! I was also very impressed
      with the cleanliness of the park and amenities there was not a spot of rubbish.
      I would definitely visit again. Price and availability of souvenirs also excellent.","Superb
      nice to be here, dream come true. But it was not any firework attraction because
      sleeping beauty castle has been renovated. Over all, this place is so good,
      a lot of happy inside","Just don''t miss the show. Ask for the show time table
      when you arrive. The best show was at 6.45 it is a disney parade with so beautiful
      lightning. The fireworks start at 8.00, go to the infront of the castle in the
      parade area to get the best location.","Hong Kong Disneyland gives you the full
      Disney experience. We both the 2 day flexi pass and went in on the Thursday
      and Monday. Both days were relatively uncrowded, unlike the weekends. Most rides
      only had about a 10 minute wait. We watched the Lion King show which was excellent,
      then the parades. The night time parade (Light the Night) has characters from
      Monsters Inc, Lilo & Stitch and Cars as well as Mickey, Donald, etc. I recommend
      getting the Photo pass as the photographers take plenty of photos and also do
      the  magic shots  with characters added to your photos. There are plenty of
      food places for lunch and dinner. Stay for the fireworks at 8.30pm. The Disney
      train station for the MTR is right at the front gate and you can get free shuttle
      buses to the Disney hotels. We will definitely be going back!!","It was my first
      time to visit HK Disneyland and a Disneyland park for that matter. HK Disneyland
      I suppose is smaller than the others but I still enjoyed my visit. The staff
      are friendly and accommodating. The ticket purchase was also a breeze since
      I did it online and in advance. The queue was manageable. There were staff associates
      who were present to make sure that the queue would be moving at a good pace.
      I appreciate how they managed the timing for the photo opportunity with Disney
      characters. Not only I like the accessibility of the theme park, I also appreciate
      and impressed with the special Disney trains which actually build up the sense
      of arrival to the place. I like the attractions and the rides and the shops.
      They also maintained the cleanliness of the toilets especially when it rained.
      It was really a wonderful visit. Disney really has its magic!","It was perfect
      for us with young children, probably targeted at slightly younger audiences
      than other Disney parks and even our youngest could go on all the rides. She
      adored space mountain and wanted to go again and again. Our oldest loved the
      Buzz Astro Blasters. The one disappointment was that the queues were just too
      long in Toy Story Land (90 120 minutes) and not enough rides with fast passes.
      Advise anyone wanting to do these rides to go there first and early.We went
      in a busy time (1st Sunday of school holidays) and yet still didn''t have to
      wait much, got to do nearly everything the kids wanted (several times) and had
      a full day and the food was reasonably priced","Rides were constantly breaking
      down or being shut down. I didn   t mind not seeing a few things due to referbishment
      (Indiana Jones, Cinderella   s Castle) but having rides constantly breaking
      down (splash mountain   shut down for 3 4 hours, Rocky Mountain Roller coaster
      shut down after standing in line for 45 min etc). Staff were all great, line
      ups to get in were long but moved quickly....wish there was an    early morning    option
      for California park and not just Disney as that side is way better if you have
      older kids (or are a kid yourself). Look for the fast pass kiosks near each
      ride....you can get a new fast pass every 2 hours for FREE and this enabled
      us to ride the Cars ride 3 times while there (get to the fast pass line prior
      to 10am as it sells out and then you   re waiting for 2 hours to ride). Unless
      you have small children, avoid Toon Town rides   and even avoid if you have
      small children as most of the rides are kinda dark and scary (Pinocchio, Alice
      in Wonderland etc). Don   t buy bottled water ($4 $5 US   go to Starbucks and
      ask for a large ice water   free) eat outside the park if possible (Bubba Gump,
      Pho, lots of options within walking distance that will save you some $$).","Had
      a fabulous family vacation here, and had the best time ever.  Something for
      everyone   in every age group","Visited Disneyland HK on insistence of the Missus.
      The whole place was swamped with tourists despite reaching there at 9.30 in
      the Morning. The park in itself is well designed, organised and managed. But
      the queue of tourists can be a bit daunting. Especially as a lot of people in
      HK do not like to follow the queues. Anyways the rides are good   more or less
      same as those in other disneylands. But the kids will still like the place.
      If you are a grown   up, you are better off enjoying at Ocean Park.","Well   .
      visiting Disney Land for the first time itself sounds absolutely Thrilling!!It   s
      kind of more for kids and family entertainment. It was an amazing experience
      for us though. But for hard core rides & coaster lovers I guess this place won   t
      work for u guys. However, reaching there wasn   t a task for us as we stayed
      on Lantau Island itself and the journey from hotel to the park was too short
      coz our hotel provided shuttle to Disney land which got us there in just 15     20
      mins, while people travelling from other places will take more time than usual
      but its hassle free, MTR which is the second best option I would suggest, because
      while returning we missed our shuttle, we had to travel through MTR and it was
      a nice experience.The fountain of Mickey on a giant whale was quite welcoming.
      Especially kids, you could see the excitement in them watching those Disney
      characters. There was a live Mickey and Mini interaction when we entered and
      clicking pics with them which gave a kick start to the day. The rest of the
      rides were nice and we enjoyed a lot. Also, would suggest to make proper use
      of maps and the timings mentioned on it for the rides so that you don   t miss
      any being Sunday the wait time was not more than 15     20 mins.One small disappointment
      for us was the food coz being an Indian we would prefer Asian or Indian meal
      but we couldn   t found any options other than European food, especially after
      those tiring activities anyone would wish to have a meal of their choice. Also,
      the Indian restaurants that were shown on map were all shut and there was no
      update regarding the same coz it was far and we had to search walking which
      was very time consuming.But at the end the very famous Disney Fireworks (09:00
      pm) a not to be missed stuff, is a treat to the eyes and it makes you forget
      the entire day   s tiredness.Over all experience was wonderful and would really
      suggest to visit once in your life.","Easy to get to using the MTR. Change at
      Sunny Bay station onto the shuttle service out to the Disneyland Resort. As
      you   d expect lots of Disney themed stuff going on, the train with Mickey shaped
      windows, hanging hand grips Mickey shaped, various statues of characters in
      the carafes. We went in February on a damp day. Not overly busy, with queue
      times between 0 and 10 minutes without any kind of priority boarding ticket.
      Having been to Disney Land Paris and Walt Disney World in Florida I was still
      hugely impressed and couldn   t stop smiling for the whole visit. A real mixture
      of East and West themes going on, similar in so many ways but different enough
      to make it still feel new. There was some building work going on around the
      castle and as a result the train wasn   t working though that didn   t detract
      from the day. Log in to the Disney Land Wi Fi and we got a HK$10 voucher. Thoroughly
      enjoyed Toy Story Land. The classic area of Tomorrow Land rebranded as Star
      Wars & Marvel. I was in Hong King as part of a short break celebrating my birthday
      and would thoroughly recommend taking the time to visit. You   re never too
      old for Disney!","Took the Grandkids to Disneyland and they loved it. It is
      smaller than Anaheim (LA) so t was perfect for Mr 3 & Mr 1   . The Disneyland
      Hotel was very very pretty.","Having been to Disneyland at Anaheim twice and
      missed the Mad Hatter tea cups, I finally ticked it off. what a day people watching.
      Children are the same the world over as are the young adults. The legend of
      the Lion King, AMAZING, having seen the musical not long before, this downsized
      version just nailed it and getting the people in and out of the show was an
      exercise in great people moving.","Overcrowded, overrated, overpriced.  You
      should go to Ocean Park instead. More authentic. Never too commercial.  Forget
      about the Disney dream.","Children under 6 , are the only ones who would like
      this. There was nothing exciting for anyone aged 6 years and one day. Total
      waste of time and money. If you simply want to tick the Disney box then well
      go.... Otherwise forget it","While much smaller than its Tokyo counterpart,
      and with lots of overlap in rides, it more than made up for it, for an English
      speaking family, by the strong mix of languages at shows etc.  The Lion King
      performance was a standout on the day.","I love Disneyland, wasn''t busy as
      it was a week day, so we got on many rides, multiple times and hardly any queues.
      The crew are friendly and make you feel welcome. Good fast past option on a
      few of the major attractions, space mountain was a favourite and probably the
      biggest ride there. It''s a pretty tame theme park this one. Easy place to spend
      a fortune!","Have never been to any Disneyland and was talked into going while
      in Hong Kong, even though I am in my 70s. I imagined it would be a very  mickey
      mouse  Disneyland (exuse the pun).What a surprise. I just so thoroughly enjoyed
      the experience, I will certainly go again.We went in November which probably
      helped as it was in full Christmas swing. A great experience, highly recommended.","First
      of all, people should know that this  Disneyland  is owned more by Hong Kong
      investment than it is by Disney. It is a  co production , not simply a Disney
      property. So people complaining about Disney greed or lowered Disney standards
      need to know this.  They...More","The price $399hkd adult is so not worth it!
      Its very small and really not for teenages adults. Childrens will love it though!
      The parade in the afternoon and the fireworks display at 8pm is worth the moment.
      Expensive to buy food and souvenir same like other parks. Why can''t they lower
      the price so every child customer walks out the attraction with a memento? Look
      out for the walking rubbish bin.","Haven''t seen any other Disneyland across
      the world. This was my 1st visit to one. The place is wow... A great visit for
      small kids and adult kids. It has something for everyone..where you can connect
      to your childhood memories and fantasies. Do visit it on a weekend where the
      park is open from 9 to 9... So you can cover almost 90 % of the rides and stage
      shows in like one day itself.. ( do go for the single rider option... That''s
      the quicker way to get onto the rides) Also do ensure you witness the mesmerizing
      Fire works at night that happens at the Disney castle.","Disneyland Hongkong
      is my first Disneyland, so I can''t compare. But personally I think, this park
      is big enough to visit for one day, and for a visitors with very hectic itenerary,
      I am pretty satisfied with this park. We arrived early before its open,...More","Rides
      are pretty much catered to young children, not so much for thrill seekers.If
      you prefer thrilling rides, you can visit Ocean Park theme park. FYI, I   m
      a thrill seeker.Rides I enjoyed in HK Disneyland are: Big Grizzly Mountain (indoor
      roller coaster) and Space Mountain and RC racer.A pity they stopped the fireworks
      beginning this 1st Jan 2018.","Def worth a visit although diehard Disney fans
      may find it a little limited. Our day somewhat clouded by the fact that Space
      Mountain was out of action for redecoration hence only 3 rather than 4 rating.Grizzly
      Gulch, however, was excellent with a nice twist on the original Thunder Mountain
      ride.Def geared more towards the smaller children, easily done in a day or less
      if not too crowded.Unlike Paris Disney, everyone was polite and nobody jumps
      queues.","This was my first visit to Hong Kong and to Disneyland. It was raining
      still we enjoyed all the shows and rides. Kids will enjoy the most. Ticket charges
      are a bit costly still worth. Booking can be done online with a lunch offer.","This
      is a fun day out for all who like disney at its best,so much to see and do and
      i did enjoy the experiences of this park,so many wonderful rides to choose from
      and shows to see.","Fantastic place if you have kids under 9 10. Cosy, small,
      in some days mid week is not crowded. Worth to have a yearly pass or book via
      Klook.","If you have kids, this is the MUST GO destination for you. I was advised
      to go on a weekday as it will be very crowded. Even then, the average waiting
      time time is 45 mins for each ride. Make sure you allocate enough time, i.e.
      the whole day to enjoy the rides and shows. Visited in January 2014. It was
      kinda cold and windy.","It''s easy to get lost in time and be a Kid again in
      this place! You''ll be smiling from ear to ear from the time you ride the special
      train to the moment you close your eyes to sleep in your hotel."]}'
