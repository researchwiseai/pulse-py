      Buzz Lightyear. After Pirates shut when we were in line for 35 min we gave up
      and left. Too many people, not enough to do! Not the Disneyland I remember as
      a kid thats for sure!!","The first thing on our agenda when we finished checking
      in the hotel was to go to Disneyland. It was a first time trip for my mom and
      my son. Even though we were tired from travelling we felt that the happiest
      place on earth would cheer everyone up. We bought tickets from klook which was
      very helpful. The lines were very long and we can   t seem to catch the best
      time for pictures with Mascots. We enjoyed the simple ride in Small World and
      the intense and visually interactive Mystic Manor.","Everything is magical,
      as always! From the Disneyland train at Sunny Bay to its bathrooms! I am so
      in love with the Hyperspace Mountain ride! I can live there!","If you''ve been
      to the Disneyland in Orlando, do not expect anything close to that at the one
      in Hong Kong. Rides are just about ok. Not worth the money.","Although we spend
      2 hours in the queue to take pictures with Mickey and Minnie my 4 year old daughter
      and 62 year old Mom enjoyed this place equally. Good experience and was the
      only exciting part of my HK trip","We went just after they open the Iron man
      ride. Kids loved it! we even went twice. A good tip is to go during the week
      day, and avoid the national holiday, and school holiday, as it get very crowded.
      By going during the week, we barely wait more than 5 min per ride. Don''t miss
      the new StarWars mountain, steeper, and faster than the Space mountains.","Fun,
      enchantment and a lot more! If you come really early, lines for the tickets
      are short, but the excitement builds up as you see Disney''s facade. November
      and December would be a nice time to visit for their Christmas theme and the
      weather too. Ride the MTR to Disney, such a lovely Disney train!Before the opening
      time of the rides, lots of characters will be around for photo ops. Line up
      to kill time. Ride as soon as you enter the park to avoid the long wait. I miss
      the board in USS that tells you the waiting time in the rides. We have to go
      from one ride to another just to see the waiting time. Know when the ride opens   Disney
      train, Mystic Manor and Jungle River Cruise opens a little later, so try the
      other rides before the line gets long. The Toy Story Land rides opens early.
      My daughter and I loved the Mystic Manor, fast one. We went back again and was
      able to ride quickly on our 2nd time. We were also lucky to be able to ride
      the Big Grizzly Mountain Runaway Mine Cars in the afternoon. I''m glad the park
      is not that big, because after riding the Mystic Manor we went straight to Mickeys
      PhillarMagic to watch the Mickey and the Wondrous Book and then go back to Grizzly
      Gulch to catch the Mine cars again! Planning the rides? One can,but I love going
      around the park because I enjoyed all the beautiful decorations around. My daughter
      would remind me not to take pictures anymore so we could line up for the next
      ride.Don''t miss the parades, watch the Lion King show and get a good view seat
      of the Frozen lighting ceremony. An hour before that show, the main street is
      already filled with people. My daughter was on my husband''s shoulders, so she
      could watch the lighting ceremony! It was magical, it snowed on Main street!
      Don''t miss the fireworks too.Food is expensive but in big serving. 2 day pass
      is great if you have kids who loves to ride, one day ain''t enough to ride all
      the attractions and see the show.","The place is big (and crowded). We managed
      to complete everything, including the fireworks that was held at 9PM. The fireworks
      was amazing and it made the journey satisfying.","Great theme park, children
      fun, overcrowded, you queue for ages on most attractions..Disney prices are
      not for the faint hearted!","Loved our visit to Disneyland Hong Kong. We were
      lucky enough to be chosen as the family to open the park and it 2as such a thrill.
      Meet and greet with Mickey, Minnie, Donald and Winnie. It was too rainy the
      day we went, so missed the princess meet and greet. I took other reviewers advice
      and we only bought tickets for 1 day and stayed in HK Island. Biggest regret,
      time over with a four year old in tow, I would stay at the resort, and buy a
      two day pass. We barely left Fantasyland, and the rain set in so had to leave.
      Its small but for a fi4st time visitor to the Disney parks it was great.","Disneyland
      is a legend. A place both for young and old. Try reaching the resort around
      10 am so you can spend the entire day relaxed. It well connected by MTR.","While
      we were in Hong Kong we had to visit Disneyland. We have been to Anaheim as
      well as Euro Disney. Hong Kong Disney is not as big as Anaheim but is very similar.
      It is fairly new and they are still adding attractions to the park. Glad we
      went and worth a visit!","The monastery is really a beautiful place. The giant
      statues are truly awe inspiring, best seen on a clear day as the clouds can
      really limit visibility.  Great views from the tram up as well but Nong Ping
      is very commercial.","HK Disneyland was much better then expected   its true
      that it is best suited to younger children but my children (age 12 and 8) enjoyed
      it. Its like all the other Disney parks   immaculate and very well run. One
      day there is enough time. We arrived at 10am and left after the fireworks at
      8pm. There were no problems with queues   I think the longest we waited for
      a ride was 20 minutes (we went on a monday). It seemed the rides more suited
      to young children had the longest queues whereas Space Mountain we only waited
      5 minutes each time! One of the highlights of our day were the shows   Lion
      King and The Golden Mickeys   really professional shows and the Lion King was
      like a shorter version of the West End production. Food was not up to much   but
      then it never is at Disney. Would advise doing the boat trip in adventure land
      after dark   we thought it would be quite lame but it turned out to be a bit
      scary (but fun!).","We have been to HK Disneyland twice and our daughter enjoyed
      both times (4 the first time, 5 second visit). She was very popular with the
      princesses (and locals!) and dressed up nearly everyday. Staff are friendly
      and very helpful, park is clean. Rides vary but not really that much for full
      on thrill seekers. We loved our time there.","I had compared disney land of
      hongkong to enchanted kingdom of philippines, and i should say i had more fun
      in enchanted kingdom.. i was quite diappointed on everything they got, i keep
      saying thats it?, but i think its also because it was raining the time we visited
      so some rodes are closed.. but the construction was great. its perfect for kids
      and not so much for adults..","If your family loves Disney characters and movies,
      the park will not disappoint. When we went Toy Story Land had just opened up.
      They seem to be expanding all the time. Expect crowds and long lines on weekends.
      We have had a pass at one time and always went on the weekdays and could find
      our wait time for the rides  attractions 10 minutes or less.One thing to note
      is the park is not that big and can actually be finished in a half day if lines
      are short. Either way expect one day to see everything, unless you have real
      little ones and need lots of breaks. You also need to be prepared for queue
      jumpers, be firm and hold your place! We have had old women push our kids out
      of the way to get ahead of us to ride Winnie the Pooh! This seems more prevalent
      of a problem in Southeast Asia, than we have experienced in America.  If you
      have older kids who have outgrown Disney or younger ones who don''t have any
      special affection for the characters. Ocean Park would be a better choice and
      at the time I write this is cheaper. It holds the magic and charm you would
      expect from Disney and can be a wonderful memory for you and your family.","Just
      20 minutes from central Hong Kong, HK DL is a very floral and delightfully small
      amusement park. There are many unique rides and attraction only found at this
      park. Don   t miss Hyperspace Mountain; Mystic Manor, think Haunted Mansion
      meets Night at the Museum; and...More","Entertaining but avoid going there during
      the Golden Week holiday which is early May. The mainlanders are having their
      1 week holiday so the place gets really crowded.","nice park especially with
      small children, clean easy to access and a pleasant day out, not great for teens,
      alot of rides for young children","My husband and I enjoyed Disneyland Hong
      Kong. Good place to spend time with family, appeals to everyone young and old.We
      got a discount price when we arrived at Terminal 2 airport, go to service Counter
      A4 after you exit from immigration, Tigerair gets 10% off when you show your
      boarding pass. Check with your airline, some have discounts for Disneyland tickets.Time
      spent   We arrived at 11am and left at 9.30pm  be prepared to stay for long
      hours to fully enjoy the parkOur Fav  Fireworks display at night at Sleeping
      beauty castle, get a good spot to sit and wait before the show begins, you will
      not be disappointed  Tomorrow Land, Space Mountain roller coaster, it is a high
      speed ride. The wait in the queue was faster just before dinner time when everyone
      was going to grab a meal.  Royal Banquet hall at Fantasy Land, steak combo meal
      was delicious and affordable for theme prices at only HKD118 for main dish and
      a drink. Add HKD 18 for corn cobImprovements  As it was hot and sunny on the
      day we went, we noticed that there was not much areas for shade, especially
      for families with young kids. I would bring a big umbrella the next time we
      visit  I could not find locker storage for bags when you take a ride. Maybe
      there is this facility but it was not visible to us.We will be back again to
      see the new attraction : Iron Man which will be ready before 2017.","Came here
      once with my parents some years ago. Came here again for another visit. The
      rides are okay but as usual, super crowded and busy, especially the lunch hours
      where the queue can be as long as 45 mins to an hour. Food is so so, especially
      for the Starliner restaurant that serves western food. Ticket came with a food
      coupon for purchase of meal up to $149HK. Bought the recommended value set to
      maximise it but the burger was so pathetic, small, flat and the meat was half.","This
      place is to small to called disneyland,compare to japan and florida...the attraction
      and the ride to little,they don''t even have 4D yet.","Visiting Disneyland on
      a weekday will make you love the place all the more, because there are shorter
      or no queues to play the games and to visit the washroom, especially if you
      have kids. There are some new attractions like Toy Storyland, Grizly Gulch...More","This
      have to be one of the smallest Disneyland around but it contains almost all
      the standard fun that you will expect from Disneyland.","We always can be happy
      if we inside disneyland area.. full of happiness over there.. all the staff
      very kind.. the music was the mood booster.. my little son was so happy playing
      around disneyland.. so many attractions and so many disney figures.. never been
      bored go to disneyland..","Organization in general is very poor and what should
      be a day of fun with family becomes a day of suffering and frustration. The
      only thing I have enjoyed with my kids was the parade and the fireworks. For
      all the attractions waiting time goes over 1 hour. While lining up there is
      no way to go bathroom unless through a mountain of people. You have to line
      up ages for everything, a coffee, an icecream, a bottle of water or a meal.
      One full day cannot get you to attend more than 4 attractions or shows.Ocean
      Park beats Disneyland 10 0.","Visiting Disneyland brought out the child in me.
      An exciting trip, fortunately the lines were not long. Maps are available to
      easily navigate through the park. Good eating place.","Who doesn   t know about
      Disneyland!!! This place to me is better than DisneyWorld. It is smaller but
      way better rides. Always a great time. Get the Maxpass so you do not have to
      wait online. Get Fastpasses right to your phone. Mickey is waiting!","Positives:   The
      classic attractions were fun (such as the mountains) and lasted a while because
      they are old and hence were not built to reduce queue times.   The re theming
      of ''The Haunted Mansion'' for Christmas was very well done. Negatives:   The
      cast members were very rude and did NOTHING about queue jumpers when we told
      them about the issue.   Very long queue times and, on New Year''s, there were
      so many people trying to leave that we literally stopped and stood still for
      about 10 minutes trying to move.   As always, very expensive in every regard.   Fastpasses
      all gone by midday.  Difficult to get to from L.A.Hope that helps!","Disneyland
      is a must visit for families vising Hong Kong. Kids will love it. The rides,
      themes are fantastic. A must ride is the train and boat ride. The lion show,
      the parade and the night lighting and firworks are a definite watch. The Indian
      restaurant inside serves good food.","This was my first and only visit to one
      of Disneylands. It was really very impressive in terms of richness of the live
      shows. Not only nice for kids only, also for adults.","Go early, enter at 10.30am,
      go straight to Grizzly Gulch, and walk clockwise via Mystic Point then to Toy
      Story. Visit these 3 new theme park first then go over to the rest , it is definitely
      lesser crowds. We have been to the rides twice each and walking straight into
      the rides prior to crowds coming in. Love it soooo much !!!","Small in comparison
      to California. The variety of items however dont compare. They do not have all
      your favourite disney characters. It would only take one day to see the entire
      park quite easily. Plenty of variety food wise & not expensive either. If you
      get a voucher from your travel agent make sure the date on it is for the first
      day you want to go not the day you get there as it can cause a bit of a problem
      that can be easily fixed.","I spent 1 full day here with my wife and our 5 year
      old daughter in July 2015 and the day flew like never before especially for
      my daughter. We''d have walked over 20,000 steps but she had no signs of tiredness.Key
      attractions were Lion king show, Frozen island, Golden Mickey, evening parade
      and the light show at the end. Pictures with Mickey, mini, goofy, Pluto n all
      are skat in my daughter''s treasure box. If I were to lobby out one area of
      improvement for their management team, it would be better queue management.
      Overall for kids that really doesn''t matter and may be 1 day would be less
      got seeing it completely. Prioritise what you want to see and then 1 day is
      good. My personal recommendations on must see include Lion king show, Frozen
      theme show, Golden Mickey, parade and light show at 9 pm.","Much smaller than
      Disneyland Anaheim,California.Fireworks display not really that good just ok.Take
      your camera and take lots of pictures.If you take them with disney characters
      like mickey pluto poo bear and all the others take as many as you can as they
      will also have a photograper who takes 2 or 3 and then they try to get you to
      buy theirs.Kinda expensive pics you buy on your way out.Ocean world is much
      nicer to visit.I recommend it.More rides,ect","We went to HK Disneyland thinking
      it would be like California''s Disneyland but boy were we disappointed. Less
      rides and my four kids didn''t have much fun. Our youngest is 9 and everything
      there was more for younger kids. There was a few rides that they enjoyed that
      weren''t meant for toddlers. We had paid for the Vip treatment front of the
      line and a hostesses. Again I thought it would be like California with the huge
      line ups, many attractions and rides. Our hosts were great but I wasted my money
      with the VIP package wasn''t needed. We went early and there wasn''t any lines
      up at all. In two hours we had finished the park and the kids wanted to leave.
      Honestly they thought it was boring. They had such a great time at Ocean park
      instead.","It is nice   for half an hour before it becomes overcrowded. Should
      be covrr for sun.  Unfortunately.","Nothing special if u had earlier visited
      another Disney. But for children good place to enjoy. Lot to walk. Pick discount
      coupons near inside entrance to avail discount on soft drinks etc. lol for them
      n ask for coupons . Jungle ride good. Tarzan good for kids. Don''t leave ur
      belongings. Careful. Carry water enough   2 bottles per head.","Went out to
      here this year as a surprise treat for the kids in Christmas! The kids absolutely
      loved it, there was so many things to do for both the young and the elder people.
      One of my favourite moments were queuing to take photos with the disney characters
      which was definitely worth it, pictures are now in my photo album. Food there
      is good, perhaps a little pricey even but there are many snack places to go
      that you should visit. If you stay in the evening, the fireworks are a must  see
      since they were a brilliant way to end the day! They have loads of places to
      purchase unique souvenirs too, we splashed out a little there! Recommend to
      all families!","The smallest Disneyland I have seen but all of the Disney Feeling
      is catching you right behind the Entrance!   Enjoyable and family designed.  The
      big different to the US Parks is also that your feet won''t be hurt in the evening..","I
      have always loved disney characters. a big fan of disney movies. and disneyland
      was a treat for a disney lover like me.i literally lost there. just loved it.
      it was for the first time i was visiting disneyland. loved the concept of dedicating
      special areas for every disney stories. i loved to pose with disney princess
      , and taking pictures everywhere.i loved the last firework show. no words to
      describe how awesome it was.just amazing.u have to reach there early to grab
      a place yourself,else you will have to stand in the last.its not as big as usa
      disneyland. but still i loved it.","Okay experience overall! However wasn''t
      for the ages 12  as most of the rides and attractions was targeted for younger
      children. However if you are 12  and like that sort of thing then go for it!
      Very expensive to purchase anything there so make sure to buy and pack food
      in advance to save money.","One of the main attractions in Hong Kong. A must
      see for those with or without kids. Expect long ques during peak season.","I
      visited here with my parents and 2 teenage sisters, we had a really fun day!
      The food offerings were good (albeit expensive). It was incredibly busy, but
      I think all Disneyland''s are! Very easy to get to from Central Hong Kong. I
      think my highlight was the gift shop which was huge!! I would definitely recommend
      for a family day out.","Well its definitely smaller compare to the one in USA
      or Japan but since in Asia, HK disneyland is the closest so why not? they have
      very good fireworks at the sleeping beauty castle at night and the rides are
      all quite fun and most importantly the waiting queue is reasonable around 30
      60 mins max. Dont forget to take photo with the disney characters and shop at
      the disney store.","Having holidayed in the US in September 2012, and having
      visited Disneyland in both California and Florida, my 2.9yr old daughter & I
      were looking forward to Hong Kong Disneyland, as HK has 2 parks that are not
      found in the US, being Grizzly Gulch and Toy Story Land. Of course I booked
      a transfer and ticket through Gray Line and it was the day that it rained all
      day. So we got very wet and cold quickly. I bought in baby food, no problem.
      My daughter is going through a Toy Story thing at the moment, so the goal was
      Toy Story Land to have photos with Woody & Jessie and head to Tomorrowland for
      a photo with Buzz. HK has a cheaper entrance fee than the US, and whilst the
      park is slightly smaller than the US, it is still a magic place for young and
      old. Looking forward to Paris and Shanghai when it opens.","I am like a child
      when I am in Disney. I like to go back here again and again and again. Food
      is quite expensive but worth it. I love the Space Mountain ride, gives so much
      adrenalin rush.","We were thinking between Ocean Park and Disneyland and decided
      on the latter. Though full of kids, we had a great time doing most of the adult
      rides.  I especially enjoyed RC Racer!","Before this, none of them know any
      character from Disney. Ever since they visited Disneyland in HK they started
      to watch mickey mouse cartoon, used mickey mouse related items....They had a
      very good memory especially the photo taking session with the character. The
      size of the theme park is just nice for the 2 of them which is at age of 5 and
      3. We didn''t wait till 7pm for the fireworks as afraid that there might be
      too many people to queue for the train to go back to the city.","This is one
      of the small Disneylands but very good to spend a day or two in, especially
      with children that are not yet teenagers.We visited Hong Kong Disneyland on
      a Tuesday in March and that was probably a very good decision. It wasn''t too
      hot and the queues   waiting lines were not so long.Everything was very well
      taken care of and clean and the staff   sorry, cast   was very friendly and
      helpful. My daughter (6 years) loved hunting for stickers.I personally love
      roller coasters and fast rides but for that there was only RC Racer in Toyland
      and   of course   Space Mountain. But there are plenty of rides for the not
      so big children.We were there on a not so busy day and I still think the ratio
      waiting time to duration of ride was not very good. I would seriously considered
      buying a  fast track  ticket next time.Being used to Chinese habits (we live
      in Beijing) I was a bit anxious about queue jumping and general pushing and
      shoving but I was pleasantly surprised.We had dinner in the  Explorer''s Club  Restaurant
      and that unfortunately was disappointing   it tasted like canteen food in a
      very big company.All in all, we really enjoyed our stay and I will probably
      be back with my daughter.","Disneyland Hong Kong is very much aimed at younger
      people. Whereas Disneyland in LA has things for everyone to do, there are serious
      limitations on things to do if you are over 12 years old.The park is rather
      small and there are only a few rides which would be suitable for teens or older.
      Overall given that it is far less expensive than US Disneyland parks it is okay
      if you just want to be able to say I have been to Disneyland Hong Kong. If you
      have been to the other parks though you might want to give it a miss.","While
      smaller than other Disney parks, this theme park does well to keep the standard
      high. The crowds were present, and the queues could be long, but not bad compared
      to what''s encountered at other Disney parks worldwide. Best to arrive early
      in the morning to beat some of the queues. Read ahead on what the events are
      for the day and you can plan to see parades, shows, do photo ops with Mickey
      Minnie Elsa Anna. There was a Frozen themed village display, but the only way
      to get in was to queue up at the area itself within the park right when the
      whole park opens at 1000. Thus, check ahead and you might have a more meaningful
      experience, especially if bringing kids. It''s pricey like all Disney parks,
      but a very good experience overall. A lot of shows events are in Cantonese with
      English subtitles displayed on screens.Best way to get in is via metro which
      stops at a station prior, then you board a Disney metro that goes one additional
      stop to Disney only. Very convenient. Better than paying for a cab bus.","would
      be a most interesting place to spend one full day for the younger children (primary   junior
      secondary high sch children).","Well, its disney afterall. Their intention was
      to make you forgot about your life and immerse yourself in pure happiness. They
      really succeed in entertaining people. They think of small stuff like when you
      ride the tram to circle the park you will see something that would only be seen
      when you ride the tram. Toilets less clean than universal studios in singapore
      maybe because theres so many people in 31december.","this place was just great
      and I loved every second of it as im still a teenager this park is divided into
      4 parts like future land which was the best .this place is not meant for old
      people as it is a lot to walk and ,much more to do .overall great experience
      I stayed n the Hollywood hotel and also went for the fireworks and the carnival
      which is just awsome","I know in the future they will expand, but for now, it
      seems awfully small.  I got there at 10 AM, and people were leaving at 1:30,
      right after the parade.  There just aren''t enough rides attractions open yet...
      and some of the real classic attractions...More","I am a 44yr old woman with
      two teenager kids but I feel I am a little girl inside whenever I see Disneyland
      or hear about it .it was my 4th visit to hongkong Disneyland and I yearn for
      more .i literally transform into a kid when I reach at the entrance of the gate.go
      for the rides,museums inside or walk on the streets it''s magic magic magic
      all the way!maddening crowds,small kids ,elderlies,young men,women who us not
      there.Go grab a ticket to the magic land!They have fantasyland,adventure land
      ,tomorrow land,mystic land,wonderland ,us main street etc.etc.if you cover 1
      4th of the plCe fully you are a winner because after walking to this huge property
      you feel tired so go for the food every land has it''s own set of restaurants
      and cafes although high prove for everything is guaranteed.but to have fun and
      magic under one roof you have to pay a handsome price.i loved it''s a small
      wonder,mystic ride ,miners and grizzly bears'' ride,mickey''s philanthropic
      orchestra and many more rides and covered almost half of the Disneyland Hk this
      time and hurrah!!my kids missed a dumbo ride but I did it ho ho ho ho!!please
      see at least one of the Disneyland and you will cherish it all your life!!and
      say:ILOVED DISNEY!!","Very mixed feelings about our recent visit to Disneyland
      Hong Kong. Firstly we stayed at the Hollywood Hotel which wasn''t anything extraordinary!
      I think I had very high expectations for our stay there   after all its Disneyland!Not
      sure if it was because of the crazy Christmas time of year that we went, but
      the lines were way tooo long, over 60 minute waits which 5 children under 6
      are not going to cope with :( I must say however that 2 day passes were very
      affordable, and even merchandise was quite cheap considering. I was mostly disappointed
      with the fact that we travelled all this way and didn''t get one photo with
      any of the characters. The wait lines were full of older people (40  !!!) Seriously,
      where is the fun for the kids if every line is full of adults! The kids were
      very sad by this :( The only thing that was magical was the beautiful evening
      show of lights and fireworks and the  snow  that fell in USA Street. Apart from
      that Disneyland really wasn''t that great. I hope when I visit another Disneyland
      in the future I have a better, happier, magical Disney experience","Disneyland
      is a great place for young and old. If you want to buy some souvenirs I would
      suggest getting them when you enter the park to avoid the peak at the end of
      the day. You can do this park in a day but if you want to have lunch, look at
      the gift store and relax I would suggest a two day pass. We did it in one day
      with a baby, 4 year old and 7 year old but it was a bit rushed. The food is
      pretty good at Disneyland (we ate in one of the restaurants) and a reasonable
      price. You do have to wait a while for some rides so be prepared to wait and
      make sure you bring plenty of water. We stayed in Kowloon and the best way to
      get to the park is by taxi. It doesn''t really cost that much ($30) and at the
      end of the evening it is easy to get a taxi back. To avoid the rush at the end
      of the night leave the park a little early or hang around looking the lights.If
      you need a wheelchair or pram, the park has plenty to hire.","We visited Hong
      Kong last March 2016 and of course, Disneyland was on our list. We had one day
      pass and the experience turned out to be wonderful and exciting. Moreover, we
      loved the shows and the parade that featured the Disney characters. I remembered
      that moment when we had our lunch at the main street corner cafe in which my
      boyfriend and I hurriedly asked for the bill and went out just to witness the
      parade. That time we were so excited to see the Disney characters, it will really
      bring out the child in you. Watching the fireworks is the best way to end your
      magical visit to Disney, but wait, the experience was a lot memorable when my
      boyfriend planned to have the proposal during the fireworks display but I was
      just too tired to walk right in the middle of the main street where he planned
      to do it, He failed! Haha! And he was able to do it after the fireworks display
      and then we''re Engaged!!! :)","If you have been to DL in America you may be
      a little disappointed as this one is very small in comparison and more for kiddies.
      Space mountain is the only real adult ride as such, however this is still a
      place of MAGIC! I went without kids and one thing i thought this Disneyland
      did better than the US is the stage shows. They were FANTASTIC! The shows run
      extremely often as they spilt them into languages and if your a westerner they
      will pull you up and let you know that the show is not in English. Food is still
      relatively expensive when you compare the price of food out of Disneyland, but
      it is still cheapish. I highly recommend you catch the train there, as it''s
      very straight forward and it''s charactorized. The windows are mickey shaped
      and inside are cabinets of charactors to entertain you. I tried to look at all
      of them, but made it to disneyland before I got to. The train does get busy
      but I had a seat at any moment.","And the highlight of our trip is going to
      Hong Kong Disneyland, So we traveled form our hotel to Disneyland via train
      and when we reach there the nonstop photo taking started. I went back to my
      childhood, I have seen Mickey and Minnie and every Disney character that I liked.
      so just enjoy the whole theme park and go to the every ride that you can take.
      And for the ticket we purchased it in the airport, our ticket had a meal coupon
      already so that when you get there no need to worry for the food and by the
      way outside food is not allowed inside the theme park.","It   s a good venue
      to experience. The park as in all Disney parks is crowded. Nevertheless, despite
      the long wait for rides, it   s still a nice place to visit.","My first time
      HK Disneyland back in 2010 was truly amazing that lead me to comeback 2011 and
      will definitely not gonna be my last. It helps that cool breeze weather in Hong
      Kong made it great to enjoy the theme park unlike in Signapore''s Universal
      Studio wherein you''ll be drenched in heat due to the humidity. As you walk
      into DL''s magical gate & see Moby Dick;s fountain, you''ll hear the wonderful
      classic Disney movies musical scoring (beauty & the beast, little mermaid, cinderella,
      and more). That will already elate your childhood memories that will be warm
      your heart. The rides & shows never disappoint! They are all a must try & wonderful!
      The space ride, lion king, its a small world, tarzan''s house are among the
      you should never miss attractions. Make sure you''ll have a photo op with your
      favorite Disney character in the designated area & designated time. Check your
      map & activities for the day for a smooth proof leisure. The parade of characters
      mid afternoon & the fireworks display are the cherry on top your DL adventure.Love,
      love, love!I surely recommend this experience for the kids & kids at heart    family,
      friends, lovers. All ages & sizes.Make this trip you wonderful tale too!","The
      price to get in here was pretty steep for what you get for it. The Gulch mine
      cart ride was well worth it and the boat trip around the island at adventure
      land (I think) was entertaining. The Star Wars ride was thrilling through pitch
      darkness but the wait for this ride was ridiculous and no fans or coolers to
      keep such a large number of people cool in high heat and humidity while they
      wait. We just waited for long periods of time in line after line for short rides.
      There weren''t too many spots to sit down to rest and you could only buy the
      designated branded items on sale at their high prices for food and drinks. The
      family were pretty frazzled by early afternoon and we pulled the pin only to
      have to wait in lines for the train to stand all the way back to the hotel.","The
      Disney experience is a must do when you visit Hong Kong specially if you didn''t
      see Disney else where.The first couple of hours we felt bad and as if the place
      is so childish but then we were overwhelmed with the theater shows, the parade
      and the fireworks.It''s a must have experience for all ages.","As seniors we
      paid only 100HKD admistson and we thoroughly enjoyed our day there. We love  It''s
      a Small World  and did that twice. The area set up for that is even nicer than
      at Disney USA. The only show that was presented,  The Golden Mickeys,  was quite
      good. The 3 D move  Mickey''s PhilharMacgic   was also great. We did go on some
      of the other less wild rides. We had lunch at the Starlite Diner restaurant
      in Tomorrowland and it was surprisingly good and reasonably priced for the chicken
      with rice dish with soda. The Flights of Fancy parade at 3:30 was well done.
      The shops were full of Disney things and we couldn''t resist. It was an easy
      park to navigate and one we did enjoy.","Travelling with our young daughter
      Disneyland was a must and we spent a whole day; the entire family enjoyed  the
      many attractions and rides.","A fun filled trip to Disneyland park with a 4
      year old kid! Sure loved every bit of fun that we had as a family out there!
      Everything about the place was beautiful   The Parade, the character visit,
      theme based setup and the lights with fireworks! Well spent and good attraction
      for the kids who know a lot about Disney characters!","As far as Disney goes
      this is a clean and friendly park. Everything stocked and open. Can do this
      in 2 full days with children. The lines aren''t long. Except if you want a photo
      with characters Mickey and Mini  get there as soon as they open or half an hour
      before and go to the main circle and start lining up first. The first day we
      caught the train from central HK city  terrible idea   took too long to get
      there. Caught an uber home. Very quick, luxury and not too much more than the
      train (family of 5). Next day uber there and back. The only downside I would
      say is lack of food options and availability. If you''re travelling with young
      children take food and drinks. It takes too long to go and find a food stall
      and then when you do they only serve the same thing   nothing healthy.","We
      have been to the Original Disneyland in LA and to Disney World parks in Orlando
      so this one was a bit of a let down as it was a lot smaller but still every
      bit as much Disney. What spoilt it for us was the cold weather and rain but
      the kids still enjoyed themselves. A lot quieter which was great, no horrendous
      lines like the other two parks. Food prices and souvenirs though were absolutely
      ridiculously expensive and although the other parks are pricey, they have nothing
      on Hong Kong, but then everything in HK is crazy expensive. Hardly saw any disney
      characters walking around like in the usual parks which was disappointing. Enjoyed
      the Toy Story land which was something new that we hadn''t seen in the other
      parks. Very well done. The night parade was really great, but we were so cold
      it was hard to enjoy it.","Hong Kong Disneyland is a great place to visit. You
      can visit all the amusements in one day and the rides were great. We especially
      enjoyed the Buz Lightyear ride and Mystic Manor which is new. Take plenty of
      money with you as the food and souvenirs can be expensive.","I have been to
      the original Disneyland in LA and also to Disney World in Florida and my wife
      has been to Disneyland Japan, but we both kept an open mind going to Disneyland
      Hong Kong, it would do no justice to Disneyland Hong Kong to make comparisons.
      That being said Disney HK is a good place to go with kids for sure, but ideally
      it should be done on a weekday unless you want lots of pain and go on a weekend.
      I can only imagine the waiting time in the rides on a weekend given the over
      all size of Disney HK. You have to spend a day here to get to ride all the rides
      for sure. I also suggest not doing this on a hot summer day, late November is
      good as it is sunny but cool. Getting to Disney HK is easy with lots of public
      transportation available so that is not a hassle at all.","It''s a great place
      for kids and we basically went for this place for our kid only.   So many things
      to do and children would love being there.","The smallest of all of the Disneyland
      resorts, this one doesn''t boast many ''high speed thrilling'' rides   more
      ones for 5 10 year olds. (if you want rollercoasters, head to ocean park). Tickets
      are quite expensive and good luck if you think you can leave without taking
      something home from the extensive gift shops! For little ones, this is great
      and would be a really lovely family day out. Bring cash, a small bag, an umbrella
      and your own drinks if you can. My favourite parts   The River cruise, The runaway
      mine cars and the toy story blaster ride.","I am a disney lover (and annual
      pass holder)So as you can imagine I was crazy excited to go to Hong Kong disney!
      It was cute and well thought out...but in no way does it compare to wdwI was
      disappointed but if you have never been to Orlando I''m sure this is a very
      nice day","be prepared to queue for 1 2hours for taking pictures with mickey.
      the rides are nice. the food taste average but it was a bit pricey.","Its located
      on Lantau island of HK. Easily accessible by MTR disney line. Trains are also
      designed in disney theme. Park is pretty big enough to spend 7 8 hours. They
      also have all the necessary amenities for kids infants too. Its very well maintained.
      Unfortunately the main castle was under renovation. Also 20% of the rides &
      attractions were shut due to Mangkhut typhoon which was hit a week before.","Being
      from the US, it is easy to have in your mind, how all Disneylands are supposed
      to be. Well, drop the bar because the HK Disney is much smaller and therefore
      missing the key attractions we are used to. But the biggest thing missing is
      the food. Don''t come here expecting to eat US food anywhere. Even the popcorn
      is different   honey mustard flavored. The chocolate dipped banana is packaged
      in bite sized pieces. I will say the mango Dole whip was the highlight. We ate
      on Main Street at the Coca Cola branded restaurant and it was meh. Nothing Coca
      Cola at all but the location was right for the night time light parade. We had
      a little extra show as there was a HKer yelling at a Mainland tourist for what
      appeared to be a cutting in line.Kids loved the Thunder Mountain like ride because
      there was a twist when the ride went backwards. Loved shopping in the Main Street
      store. The mugs are really cute and a few of the shirts were nice. Most of the
      shirts are garrish; very loud and overly detailed. Yuck.The train is cute with
      Mickey shaped windows and handlebars. There is a display in each train which
      has an enclosure with a bronze like character inside.Would I go again? Nope.
      Check on the bucket list. We got lucky on the timing. Went on a Friday early
      afternoon and stayed until closing at 830. Let the crowd go ahead otherwise
      you are backed up on the train landing.","This is a small Disney park but it''s
      well managed and is good for a visit with young children. It''s small size means
      you can spend a day here with young children, have fun on the rides, watch some
      shows, and not have a cranky child at the end of the day. Very accessible using
      the MTR. Go for the shows they are awesome. They river cruise is nice.","I came
      here expecting it to be rammed with people and even though there were a lot
      the park seemed to cope pretty well with the mass volume of visitors. We caught
      the MTR to Sunny Bay and then caught the train   this was quite magical as a
      Disney themed train takes you to the theme park. Trains were very frequent so
      no waiting around . Queues were not too bad I think the longest was 35 mins
      which is acceptable in summer holidays . With the busier rides we used a fast
      track ticket (note there is no extra cost!!) and returned in the given time
      slot . After 5pm the crowds eased off and rides were easy to get on. Park is
      very easy to manoeuvre around   not too far to walk from one area to another.
      All very child friendly the staff very good and helpful   lots speaking very
      good English too. Top attraction for me was Hyperspace mountain   the children
      loved the Buzz Light year ride. Also enjoyed the Mystic mansion   great animation
      here. Watched the Lion King show   wow fantastic my daughter absolutely loved
      this . We stayed to watch the Night Parade   this was incredible ! Very pretty
      to see the floats all illuminated . Great Iron man ride if you don''t get motion
      sickness   there was no queue here we went straight on . Food   you can''t take
      your own food in and they do check your bags at the gate. Park food is expensive
      that is the downside   be prepared to part with money to buy the Disney brand
      . There are lots of outlets to eat from   food is  ok  standard . If you are
      feeling flush I can highly recommend a Disney themed ice cream   they were delicious
      but $45 a go ! So remember when its busy you can scan you entrance ticket in
      the fast track machine by the popular rides to get a slot time to return with
      no queue   there is a list of rides that have this feature on their web site.
      Great day out at Disney and they give you a nice fireworks display to close
      off your evening !","Overcrowded with Chinese tourist who likes to take photos
      of cute young children without permission. The rides are fun but taking too
      long to queue. Food offering is good.","Great day at HK Disneyland. It''s a
      much smaller park than Anaheim but with intense sun and heat, we were grateful
      to get around most of the park in a day. There''s plenty to do and we were there
      from the minute it opened until close and we missed out on plenty. The parades
      were awesome, Springtime procession, paint the night and fireworks were all
      must sees! Be aware, we used a global wallet card and all our credit card transactions
      were duplicated across multiple currencies and have not been returned two days
      later still waiting for help on this. Overall park was great and hard to criticize
      when I love Minnie so much. Be organized though we waited 90 minutes at the
      start for photos with Minnie and Mickey and got sunburnt in the process. Those
      of us who have been to other Disney Parks may be disappointed with the more
      limited merchandise selection.","This was the first Disneyland my partner and
      I visited and it didn''t live up to expectations.It is a fairly small Disneyland
      relative to the other ones located in the US so this may have played a part
      in the disappointment.A few of the shows were interesting but we ended up towards
      the back of the stage and as such, visibility was a bit of a downer.The rides
      were not very thrilling or exciting as they were more catered towards young
      children or teenagers, however, the fireworks show at the end of the day was
      quite impressive.We wouldn''t really recommend Disneyland to any other age group
      unless you are with your own children or have a need to satisfy a childhood
      desire to visit this famous theme park.","enjoyed a family holiday and its fun
      for both adults and young. lots of good rides. weather was perfect","Having
      been to Disneyland in Anaheim, Hong Kong''s Disneyland is the exact same magical
      place.  Wonderful for children and adults.  There is something to make everyone
      smile and feel happy.  Certainly recommend it if you have a day night spare
      in Honkers.","please be more innocent when you get in this wonderland! just
      enjoy!!! check out all the shows and rides, they are growing more bigger!!","I
      went to Disneyland on 29th September. I arrived at the park entrance around
      9am and there''s no crowd. The first attraction I rode was Star Wars and it''s
      great.","Its always fun to go to Disneyland. It was super duper hot (on July).
      Make sure you bring your sun block here. Having lunch in Disneyland is pricey
      and you have to queue for a long time. Plus, you need to guard your future table...More","At
      $539 HKD which equates to about   50,it is as cheap as chips.The gift shops
      and eateries are typical Disney overpriced. My advice is take a picnic.Transport
      links to the resort are excellent and the staff are very happy,cheerful and
      helpful.The park itself is relatively small and you can easily get around in
      a day,but for the price no complaints from me","Should not miss the Disney Flights
      Parade.. Wow wonderful to see the characters live and kids will be mesmerized.
      Due to new year season we experienced tooooo much crowd and queues in every
      point of Disneyland.","We visited Disneyland as a Christmas treat for the kids
      with my parents. We spent two days there and the kids loved it. The park is
      not too big so we could easily do it in one day but having the second day at
      hand gave us the pleasure to take our time and check the rides we and the kids
      liked. Try to get the express tickets for certain rides as it allows you to
      jump the line, especially if you have small kids. Some of the rides were a little
      too scary for my kids (age 4 and 7), but they loved all of it! The photo taking
      with Mickey Mouse have a way too long line so we skipped it and opted for goofy
      , Donald and daisy and other. Try not to miss the parade in the late afternoon
      where you get to see all the cartoons characters. I am not a big fan of these
      parks but to see the joy on my kids face was priceless, and my father seemed
      to like as much as the kids! A very nice treat for all the family...","Hong
      Kong Disneyland isn   t as big as some of the other resorts but it has a lot
      packed in. The park is easy to navigate and there is always something to see
      or do. Character encounters take place at all times throughout the day and all
      over the park, often without a crazy lineup. The separate sections of the park
      are unique and well organized, and each gift shop as something a little different
      from the others. The Lion King show is amazing and very entertaining. A great
      place to spend a day or two if you   re in Hong Kong!","I have been to Florida
      many times as a kid and I''m a big fan of the Disney parks. We now live in Dubai
      and the trip to the USA is too far with two kids so we thought we would try
      Hong Kong. I must say it was a really pleasant surprise, in many ways it was
      better than Florida. I had read lots of comments that its not very big, but
      really the magic kingdom HK has all the same things you get in the US only this
      looks newer, we went in October, the weather was brilliant and they had a special
      Halloween theme which was a nice change. We also went to ocean park as well,
      terrible place for toddlers but it was good to see the pandas.","I''m used to
      going to the Anaheim park and the HK park wasn''t as small as I expected. There
      are definitely not a lot of rides compared to Anaheim and Orlando, but it''s
      still an overall, fun experience if you love Disney. There seems to be space
      for them to add more rides. The parades seem to be similar to the ones in Anaheim,
      but with fewer floats. Some of the food is pretty expensive for what it is   I
      wish there was an option to not get a drink with the meal at a lower cost since
      you''re able to bring your own drinks into the park (not your own food   snacks
      though). The park is not terribly crowded compared to the U.S. parks and Tokyo
      parks and if you go early, you can avoid having to wait in line for the rides
      at all. The lines to take pictures with the characters though are so much slower
      than in the U.S.   the characters spend a lot more time interacting with you
      and the cast members don''t really move you through efficiently like in the
      U.S. and they''ll let you take a ton of pictures with, what seems to be, every
      combination of individuals in your group   this makes it painfully slow for
      people in line. The merchandise is also good   mostly different than what they
      sell in the U.S. (cuter), but not as cute as what they sell in the Tokyo parks   still
      just as expensive as what you would pay in the U.S. though. Also, if you''re
      using a U.S. credit card   it seemed that for all transactions in the park and
      to buy the entrance tickets, they will ask if you want to charge in USD or HKD   if
      you say USD, they tack on a  fee  to the exchange rate. I would recommend saying
      HKD if you have a credit card with no foreign transaction fees (e.g. Capital
      One). On a side note, there''s a Disney Store at the HK airport that sells almost
      the same things that they sell in the park if you don''t have a chance to visit.","Hong
      Kong Disneyland is the smallest Disneyland in the world. As a lot of areas are
      used as hotels, it doesn''t provide any wow factor. The queue for the rides
      is extremely long. So if you love trying different rides, you had better go
      there early in the morning. Shanghai Disneyland will be open in future which
      might provide a better alternative.","Given several visits to Disney   s US
      based attractions I was generally impressed with their Asian version. Rides
      stayed true to the originals while paying a bit of homage to new ideas....we
      absolutely loved Hyperspace Mountain, Grisley Gulch, and It   s a small world.
      Very easy to get around and I think they did an exceptional job of making sure
      the attractions were still enjoyable for those who spoke any English.Only complaints
      are that I found their WiFi to be very spotty and slow, which Impacted our ability
      to use the app, and the times listed on line lengths were very inaccurate.The
      folks on Disney   s property seemed to implement Disney   s traditional atmosphere
      of hospitality....the same can   t be said for the transportation segment on
      the way there....we found the bus driver to be very disinterested in answering
      a simple question...A good experience overall....not as good as the original
      but a very good representation for Asia.","This is our second time in Disneyland
      Hongkong but the place hasn''t lost its charm. My son really loved the attractions,
      Hyperspace Mountain and Ironman experience. We bought 2 day tickets so we don''t
      have to rush through all the attractions and we also waited for the lights parade
      during the evening.","I''m back to visit disney this time with my youngest son
      and daughter. Our last visit here was 5 years ago with my eldest daughter. I
      can say that after that I was really happy to see the added attractions like
      the Toy story and Grizzly bear. Plus the shows were superb specially the Lion
      King. We enjoyed our visit like it was just our first time. Plus the fact it
      was a perfect timing on a weekday we were there Wed a lot of people but not
      crowded and the lines in the rides was fast fast. We even get to enjoy Space
      mountain riding on it 3 times in a row since there were no lines during that
      time. We enjoyed the weather also because it was winter :) We just got disappointed
      having our pictures taken with some of the mascot because of the long line and
      sometimes they cut the lines and we still have to chase them on their next schedule
      for photo sessions. But over all we will be glad to come back again. All the
      roller coaster rides was fantastic Grizzly bear and space mountain is our favorite.","The
      park is as I remembered but I looked around at the background more than before.
      There are magical touches everywhere. Took a bit to figure out the fast pass
      system and would recommend it and the Disney app to see wait times.","Most of
      the rides were pretty usual rides found in most parks. Adults will find the
      park boring, the kids will like most of the rides.","Go on  weekday, the crowds
      are less and you can see more   little kids enjoyed everything   they had fun","Came
      here for the 2nd time, now with my 3 years old boy who really enjoy the park,
      the carnival and show.We came during Christmas holiday. It was really packed!
      If you prefer to enjoy most area of the park & the rides, holidays season might
      not be best time for that. Queue for the ride is long and took 45 min   1 hr.
      But for my young son who just love to look around, its not a problem. A small
      tips that useful for us. If you come by MTR during the peak season and you dont
      have the octopus card, you may want to purchase the return train ticket when
      you arrive, just to make sure you don''t need to queue on the vending machine
      when you about to go back : )","We have read many unfavourable reviews of the
      Hong Kong Disneyland. To be fair, we decided to see the place for ourselves.Hong
      Kong Disneyland is made for families and for people who wish to rekindle the
      magical experiences of the Disney characters. With our 2 kids, we enjoyed ourselves
      very much every minute of our 2 days spent at the park. Never a dull moment.The
      most praiseworthy aspect is the localization of Disneyland for Asians. We were
      pleased that there were 3 languages used everywhere at the Park   the Putonghua,
      Cantonese and English. Great job!We will certainly visit the Hong Kong Disneyland
      again!A Disney Fan.","Do NOT take your toddler to Disneyworld. The lines for
      the very few baby rides disallow strollers and clearly not one of the designers
      has ever tried to stand in line for 40 minutes with a toddler! Apart from It''s
      a Small Small World , the shows and rides are frightening, especially in   dventure
      land, so you are reduced to the Fantasyland area where there are two main rides,
      that are almost impossible to access. Surely strollers can be parked at the
      end of the queue and not at the beginning? Also impossible to shop as there
      were too few cashiers and no one to assist on the floor, forcing clients to
      save questions for the cashier, thereby delaying the lines even more as the
      cashier had to run around finding correct sizes etc.","This is my second visit
      to Disneyland in one year. I like this visit better than before mainly because
      of the good weather. We enjoy the lion king show and Disneyland parade more
      than anything else. Nice addition of game compare to the first visit. Please
      do not bring outside food as it''s strictly prohibited. You can get a good price
      in CTS near ferry terminal as we find the price at the entrance price much higher.","With
      an afternoon to spare, and good weather, my girlfriend and I headed off for
      a quick trip to Disneyland, Hong Kong. It was about $50 a person...can''t recall
      the conversion (sorry!). Access was easy...very! There''s a direct train line
      there...lots of signage, and cheap transport.We were there in April, and there
      were NO PEOPLE! We had no lines, no one in front, no one behind! We managed
      the whole park in 3 hours! Note...2 adults and no crowds!It''s well laid out,
      typical Disney (that''s what we expected) in that access was easy, staff were
      helpful and fun, characters wandered around, and the rides were the same!It
      is a smaller Disneyland, no question, but perfect for a day trip.We enjoyed
      it very much...no regrets taking time away from the culture, to have a little
      fun. Just two big kids running from ride to ride! *Note...we were there April
      2012, but that date isn''t offered when filling this out!","Do I have to say
      something about this manmade theme park. Must visit the Lion King story, little
      small wonders, the disney show & most important the parade of Disney characters.
      Must go with kids, they will enjoy to the fullest.","This is the smallest Disneyland
      of all.  The parade was a real waste as there were very small amount of cars.  The
      food was badly catered (despite that it''s in Hong Kong).","First time in Disneyland
      HK, and it far exceeded all our expectations. The theme park was very clean
      and very well kept, especially for being out of season. We were only there for
      one day, and there is too much to cover in just one day (especially with a 3
      year old and a 10 Month old). The older child had a fab time on the rides she
      could go on (most of them were age appropriate).Didn''t see enough of the characters,
      but I think downloading the app would have helped locating them.Remember to
      pack sun cream! And so see the parade!","What a great place to be with family
      and friends!  Lovey shows and in the end there was a firework show to end the
      day.","Things to Prepare:Make sure you have pre bought the tickets to save time
      in the line.We went in November but during the day it was still very hot. Be
      sure to have mini fan umbrellas caps and shadesKnow the schedule of the shows
      and parade so you could manage to make sure you get to watch.The Lion KingThe
      Wondrous BookThe 12nn parade in the plazaThe 3pm afternoon paradeThe 745pm night
      paradeThe 810pm fireworksBe warned that food and drinks could get expensive.","Perhaps
      the most interesting part of the visit was watching the main land Chinese tourists
      struggle with the concept of queuing , push you young children to the front
      of the queue then go find them , simply push to the front of a long queue because
      you had a young child, pretend to study the paining and wall paper to push your
      way along a corridor .Easy to get to on the MTR, ok early in the morning and
      again late afternoon as people appear to disappear for dinner","everything is
      really really great! enjoyed much.  the food is very expensive inside but i
      dont mind since i dont go there everyday :)","First, to my fellow travelers
      who have been to Florida Disney World, no, it does not compare. That said, why
      should it? HK Disney is a magical experience in and of itself. Since the last
      time I was here three years ago, the park has more than doubled in size. Toy
      story land is open and wonderful. Construction remains ongoing and Grizzly Gluch
      is open, though it leaves a lot to be desired. Food in this park, at least at
      the Mei Sum hosted restaurant, blows Florida Disney food out of the water! Definitely
      the park can be done in a day, provided that it is not a public holiday or weekend,
      even with kids in tow. I''d advise that you go on a weekday as we were able
      to do all desired rides and some ride 2 3 times.","As a silver pass holder,
      I enjoy come about 5 6pm with friend and stay still closed. Avoid to bring heavy
      stuffs and pay $100 locker rental. Eat before going in. Shop souvenirs first
      and check for bargain deal. Send what you bought to the front gate concerige
      but I haven''t used this service. Go into early morning but skip first 30mins
      avoid long Q. Love Disneyland always.","The rides were good as expected but
      due to the heavy crowd and hot weather, the park should provide more sheltered
      areas for people waiting for rides. For many rides, waiting in the hot sun was
      most uncomfortable especially for children. Food options at the park is pretty
      good but very expensive which is expected. Service level needs to be improved
      as most staff don''t even carry a smile on their face which is hardly representative
      of being  one of the happiest place on earth . Both parades and the fireworks
      are the highlights of the whole experience.","if walt disney is currently in
      a cryogenic chamber above the fire station in disneyland   s main street, he
      must be wanting to pull the plug. having been a fan and visitor of orlando   s
      walt disney world, disneyland was a disappointment. most of the staff seems
      to hate working there, it was hard to receive a smile. i don   t blame them,
      they have recently had disputes with they   re salary. the park was mostly dirty,
      and the bathrooms in 7 eleven were cleaner that most of the restrooms across
      the parks. about 40% of the rides had issues midway through. and they were unannounced
      closures throughout the day.one good thing was the 3 day passes that included
      maxpass (for fast passes) and photo pass, which were a great value. i went in
      trying to feel like a kid, but they brought the adult side of me.","If you can''t
      go to a Disneyland in North America, this is where its at. While the park may
      be small in comparison, the value, rides and fun your kids will have is enormous.
      Don''t miss out on the food, shopping, rides, new rides and the nighttime musical
      fireworks show. Your kids will never forget the time they went to Disneyland.","Definitely
      a must visit place in Hong Kong. To be able to do all the activities and visit
      everything, a full day is recommended","Easy to get to via taxi (approx $130HKD
      from the airport). Lion King and mickey''s storybook were the best shows in
      the park.fantastic parades and even adults feel included in the disney atmosphere!
      Food & drink is a little pricey.","This was my second visit to this attraction
      and it only gets better.Traveled with my wife and it was priceless to see my
      wife''s expressions who of course is another disney aficionado.We were able
      to cover majority of the attractions in a day but would recommend spending two
      days, especially if you are going with kids considering the time spent in queues
      to take pictures with the cast and to walk around to cover the park for rides.","We
      took the one day pass for Hong Kong Disney and it turned out to be a fun experience.
      You can cover the park in one day so don''t I''d suggest going for the one day
      pass. Use the MTR to travel to and from Disneyland if you''re not staying at
      their hotels.We were there on a weekend so it was rushy. Try a weekday if you
      don''t want to stand in line for too long. Our average waiting time for some
      rides was between 10 20 minutes.It is obviously not as big or as impressive
      as Disneworld but the experience is just as magical. Really wish they had a
      haunted house instead of Mystic Manor. The fireworks were decent and leaving
      the park at closing time was not a problem either. Lots of people but getting
      the MTR ticket and getting on it didn''t take more than 15 minutes.","Had an
      incredible experience in the magical Disneyland with my family. Whether you
      are adult or a child, you will too feel all the excitement and fun in here.
      Make sure you have more than a day to spare,because it''s a huge area with lots
      of activities happening all over the park. You will find lots of Disney characters
      waiting to get clicked with you. You will be mesmerised by the parade and off
      course by the fireworks show in the night.","Although small as compared with
      other Disneyland around the world, it has all the essential attractions rides
      for different age group. It''s more fun for yonder teens I think. Unfortunately,
      like everywhere else in Hong Kong, expect to have big crowds and long queues.
      Try to get there when the park is opened and obtain fast pass if available.
      Don''t expect too much of the food insider the park!","We did one day here and
      had fun. The lion king show was very good  a must see. Everything looks the
      same as other disneys but was missing (in my opinion) some of the more exciting
      attractions offered at Disneyland in LA or Disney world. This is why I would
      say better for younger kids. My kids are 7 and while they had fun noted the
      LA one was more fun and that they liked ocean park better. 1 day is definately
      all you need. I would say if you''ve never been to Disney or have young kids
      worth doing,but if you are short on time and have access to go to other disney''s
      you may want to skip. I would recommend doing ocean park more in that case.","We
      visited HK disneyland on a Monday and entered around 11am. With our experience
      at Tokyo Disneyland, we very already planned out our route and deciding which
      fast pass we should get. To our pleasant surprise there is no need for fast
      pass at all. My first few rides had waiting times of 5 15min and the longest
      I waited was for a performance which is 45min and that is still so much shorter
      as compared to the 2 3hrs wait for one ride at Tokyo. The night parade was sadly
      suspended during our trip but the fireworks was still awesome. The atmosphere
      is definitely lacking as compared to Tokyo Disneyland but in return u get shorter
      queues and more rides. Not too bad actually ;)","Our 4th time at Disneyland
      Anaheim, My wife and I have been fortunate to visit every Disneyland Park on
      the planet and when asked which is our favourite, we always reply, Anaheim the
      original. It''s called the Magic kingdom and I can see why!","For thrill seeker
      try the space mountain ride in the tomorrowland and the RC Racer in the Toy
      Story Land.. they were funnnn..","We visited the park with our 2y old and planned
      quite carefully, which really helped making our stay wonderful. We had a two
      day pass, which is not that much more expensive than a one day pass. This way,
      we simply stayed in the city (hence saving money on an expensive Disney hotel),
      yet having sufficient time to see it all, without exhausting the little one
      (and ourselves). We visited one day morning till about 3:30pm and the second
      day from 5:30pm onwards, allowing for naptime, and leaving sufficient time and
      energy for the rides. Our daughter loved Fantasy land with princesses and Small
      World. The Pooh ride was actually a bit too scary : ) . We visited on a Monday
      and Tuesday and never waited anywhere for more than 10 minutes. Brilliant! Staff
      is well trained and very friendly. Great idea to have them hand out stickers
      to the little ones... our daughter loved that. Be prepared for hot days and
      take extra clothes, as some areas allow kids to cool off getting soaking wet.
      I understand the rides are not that interesting for adults, but for people with
      younger kids this is a perfect park. Only down side that i can think of is that
      some of the adults get a bit over excited over the characters. Many of the people
      waiting to get their pic taken with Tinklebell were (way) over 18, which i found
      silly and sometimes slightly frustrating, having to wait for adults japping
      endlessly with a character while young kids are waiting in line. Anyway, i guess
      this is part of the quirks in an Asian park. We had a great time and i would
      certainly recommend a visit for parents with pre teens.","More for the kids
      than adults, although there''s plenty to see and do. Disneyland offers a variety
      of rides, sights, and character spotting is lots of fun! Take the Disneyland
      train MTR to the Disneyland station. The restaurants inside are relatively expensive.
      There are plenty of opportunities to purchase souvenirs, although they too are
      a little on the more expensive side. Loads of rides experiences   the kids will
      love it.","The park itself not really big the staff it self not really friendly.
      I was excited to visit HK Disneyland since i like theme park, and that time
      was my first time for Disneyland. Unfortunately i was disappointed about this
      place. I didn''t know about other Disneyland but compare to other Theme park
      i went, i am sorry that i''m not impress. If you guys interest taking photo
      with Disney characters better to go early and straight away queuing, otherwise
      there would be long line due to lack of Disney characters.","Talk about being
      a kid again... Disneyland will still and always be the happiest place on Earth.
      Hyperspace Mountain is my favorite ride. I cried during the Flights of Fantasy
      Parade seeing my childhood virtual playmates come to life. The festival of yhe
      Lion King was definitely a hit! And of course the fireworks is a much watch.
      We booked through Klook for discounted tickets and it was definitely a great
      choice.","This being one of the smallest Disney resorts, it was definitely well
      managed and pricey. Though it was chilly we had the best weather that day and
      the place looked magical :) The ticketing and the entrance was hassle free and
      faster than expected. We didn''t like much of the foods available at the resort
      as it was really bland and tasteless. There was a lot of activities to choose
      from and thought the rides were short it was ok as the wait for the rides were
      not long either. We got to see the Flights of Fantasy from the front row and
      it was pretty cool. Recommend waiting for the night light show. Definitely worth
      a visit if you are in HK :)","We did a previous review of HKD and its Explorer
      Lodge.  We had a great time and would go back for sure in two or three years.  Highly
      Recommened.","While in Hong Kong my wife and I decided to visit Disneyland.
      This was my wife   s first time into a Disneyland park, I have been to 2 others.
      In Hong Kong the Disneyland park was well laid out, and well maintained. They
      had many very fun rides, and the entire park was beautiful, like the others
      I have been to.My wife and I both loved the park and the rides, I think we rode
      everything at least 1 time, some we did 2 times, we also went into the movies
      and plays and were still able to leave before they closed. I wanted to stay
      a bit longer, but the wife wanted to leave. Guess who won ;) The day we went
      the lines were very short and we got on the rides quickly. One note: As with
      other Disneyland parks you can   t bring any food into this one, unlike many
      attractions in China.","How amazing is it to be able to go to Disneyland in
      another country?! Yes, HK Disneyland is small, but it is not lacking in fun
      or that Disney magic. I love that there are some similarities to Disney at home
      (I''ve only been to Anaheim Disney), but there are some very unique attractions
      as well. Mystic Manor was amazing. I could''ve ridden it all day! Be realistic
      about the size of this Disneyland, as well as the fact that yes, you may encounter
      some rude tourists (we did). Shake it off and enjoy your visit to HK Disneyland!!
      I would love to go back someday with my children. Yes, I went without them.
      :)","For our last in Hong Kong we choose Disneyland and I''m happy we did. at
      the beginning I was thinking it''s only for kids but the truth is we saw a lot
      of elders there and couples. You never stop being a child inside. We loved the
      golden Mickey awards show, the performers were really good. The show is planned
      in details with fireworks and bubbles coming from the sealing. For children
      must be amazing. We payed 500 HK$ per person for full day access, which was
      ok. Some rides were so good we went twice like train thru the mountain. I mean
      you must try everything you will love it. The queue for the pictures with Mickey
      was long so did not wait to have a picture with them but now I regret I don''t
      have it. I''m looking forward for another Disneyland adventure in the different
      country.","This is a wonderful place to visit. Never miss this. If possible
      plan for 2 days.   Tips :   Tickets   you can get the best price for Disney
      land from CTS (China Travel Services). CTS has offices all over Hong Kong. There
      is one RIGHT...More","Our visit to HK Disneyland was amazing. The cast members
      are really friendly and they provide really good service. The quality of the
      rides are really good compared to Disneyland Paris which we visited 2 years
      ago. The live show performances are a must watch! :)If you are a Pandora fan
      like me, you must visit the Pandora store! It''s really beautiful! And of course,
      you can get your HK Disneyland Exclusive Pandora and Disneyland Parks Exclusive
      Pandora! There are 2 parades; one in the day and the other at night. The night
      parade is really creative. After the night parade, don''t leave so soon as there
      will be fireworks at the Sleeping Beauty Castle. I would say that we truly had
      a magical day in HK Disneyland.","This is a place that everyone must go in their
      lifetime! The staffs are friendly and you get to forget your troubles.","Fireworks,
      fun rides, and happy children! I have to say for those who would go here, please
      expect the same things as what you experienced the last time you visited here.
      However, don''t let this stop you from reliving those happy moments with your
      loved...More","Not so well organized and as fun as the ocean park, but nevertheless
      still a good experience for me. Kids will definitely enjoy at this place. Food
      and drinks are available, but price is at a very high side. Fireworks were awesome
      but not mind blowing.","Me & my family total visited April 30 2018 it was excellent
      experience,my both daughter loved so much ,also don   t forget to watch 4.30
      pm Mickey Mouse road show in Disney world,also if you   re children are more
      than 12 years old start discovering Disney world from last point.also amazing
      is to visit it   s small world","I''ve been here last Christmas. The weather
      is nice, the atmosphere is great! Disney''s always Disney''s, the place with
      no age, no time. Everything is fun. You can meet all the characters alive! If
      you come to Hong Kong for any kinds of trip, don''t forget to have some fun
      here.","Thank you Disneyland , you have given me the chance to become little
      KID again, its really worthy to pay only HK$350","I like all its places just
      the food options are very much limited for vegetarian people which create problem
      so better carry some food for yourself.","Disney like all others are spectacular   filled
      with excitement and entertainment. The only difference in the Hong Kong one
      is that there is Mystic point which the others don''t have. The fire works that
      go on at the end is fabulous to say the least. Continuous array of lights against
      the Magic castle which is also lit up and changes with the different crackers,
      so well blended together, a sheer delight to the eyes. The Mickey Parade comes
      twice, once at 3.30 p.m. which is nice, but if you stay back for the 7.30 p.m.
      show it is something so different to the eye from the afternoon one because
      of the lighting and the costumes.","Having not been to a Disney theme park,
      we were impressed once we finally arrived.Getting from Shenzen took longer than
      we thought due to the thousands of people wanting to cross the boarder. So if
      you are coming from China allow a bit of extra time.Park is well set out and
      very clean.The day we went, there was not a huge wait for rides and food options
      seemed plentiful.We had lunch at Maxims and this was delicious   Asian style
      for 3 and 2 non alcoholic drinks each around AU$130.Main Street Parade was magical.Staff
      very helpful at end of day when we could not figure out which was the bus back
      to China. Instead we caught a green cab for CNY 300 right back to border crossing.Great
      day out and look forward to Disneyland in US on next trip.","I never have any
      problems with Disney, ever. It really is the happiest place on earth and I will
      continue to daydream about visiting until the moment I can set foot in the park
      again. One of my favorite places on earth, hands down.","I enjoyed our whole
      day tour in Disneyland even though it was a bit raining.  The rides were amazing,
      the entertainers were amazing, however the lines for the picture opportunity
      for the Disney characters were very long.","It was nice also the 3D movies where
      so exciting. The food was great and the night parade with fireworks where awesome.","I
      love Disney, so was always keen to visit Hong Kong Disney. We have visited LA
      Disney previously and knew it was going to be smaller and different. But i don''t
      think you can compare them completely, it''s like comparing oranges and Lemons
      they come from the same family but are different... and really would you want
      them to be all exactly the same. We went as three grown adults and had a great
      time, even the one that wasn''t a big fan enjoyed himself. It is the one place
      where it is ok to be a kid again to ride the carousel, the tea cups, Dumbo etc
      that you might not normally do!We were warned not to go on the weekend if we
      could due to the extra crowds so chose to go on at Thursday and a Tuesday. The
      crowds weren''t too bad, the most we waited in line was about 20 minutes...
      however you could see that on extremely busy days that wait would be much longer.
      As others have mentioned people to tend to try and push in and run to be at
      the front, but we found this at every attraction in Hong Kong not just Disneyland.We
      took two days to enjoy the attractions which allowed us to see all the shows
      and do the majority of the rides. If you were only interested in the shows,
      parades and maybe one or two rides you could squeeze it into a day but it would
      be rushed depending on how busy the park is on the day.There are allot of shops
      to visit all varying that slight little bit so you need to visit them all. While
      there seems to be allot to potentially buy I was slightly disappointed with
      the lack of items for Disney Princess, Seven dwarfs, Lion King and Star wars
      but I guess that was because I was particularly looking for them for family
      and it would be difficult to produce items for every Disney movie. Saying that
      I still managed to spend alot prices are about average for Disney Store and
      Parks.As others have said the castle and part of the main street are being renovated
      are covered with board pictures of the building which is a little disappointing,
      however looks much better than lots of scaffolding and a construction site.
      So while it is disappointing I think it was a good effort to still create the
      Disney magic.The parades are a must to see as was the Lion King Show and the
      Golden Mickeys. The Space Mountain ride was a little disappointing compared
      to the LA version which was much darker and space like, but still an enjoyable
      ride. The fireworks are average and I think that is mostly because of the renovations
      to the castle, they haven''t allowed for the higher boards so would probably
      be much better when the renovations are complete.As a Disney fan I had two great
      Magical Days and would recommend it to all Disney fans!","As a HK resident and
      father of 4 children, we were excited to revisit HK Disneyland after our first
      visit being within the year the park opened. 11 years on, the park was meticulously
      clean, the offer was much expanded (more rides) and the whole ambience and fun
      factor was much better than i remember. Entry price was reasonable and in summary,
      the family had a great fun experience. Strict policy of no  selfie sticks  a
      welcome relief. Negatives were the beverage snack drinks carts didn''t accept
      card payment (octopus or credit card) and that there was only one ATM which
      was at the entrance. Overall, HK Disney now beats Oceanpark by a mile.","A must
      visit place in Hong Kong , preferable use the train to reach this island where
      Disney Land is locates , a fun filled place for the entire family ,, Loved this
      place and recommend to all the travelers going to Hong Kong.","Ive visited Hong
      Kong Disneyland many times. This time was no less fun!2 adults and 2 kids....9
      and 13yo. We all enjoyed the attractions over 2 days. The 9yo probably had the
      most fun though!Weekend days are much busier than weekday.The only disappointments
      were probably the food selection and the Theatre. The food seemed a little limited
      and the quality was OK, but not as good as it could be. The theatre was disappointing
      as its mostly in Chinese. I get that probably most guests are Chinese, but it
      just left me feeling rather disappointed (there are English words projected
      on a highly visible screen however)The highlights for me are (Hyper)space Mountain
      and Grizzly Gulch Mine Cars, along with Mickey''s Philharmagic. Its a Small
      World is a nice calm cool break from the outside world.The Jungle River Cruise
      has to get a mention, as the cast members always add a bit of fun and cheekiness
      to it. And Mystic Manor is goods fun too!If you love non stop ride action, getting
      fast passes is well worth it on the busier daysI havent been to any other Disney
      parks, but from what I know this is one of the smaller parks. You can do it
      in 1 day but 2 would also be fun. Its probably more suited to the younger kids
      (5 12) but with an open mind, anyone can enjoy!Transport options are plenty,
      with the MTR popular and easy. Wear yourself out before your flight home with
      a visit, its only a 5 10 minute taxi ride to the airport at about $70HKD","Fantastic
      experience @ Disney land Hong Kong,China. The ambiance was electrifying and
      took us back to child hood on a  time machine .","For a traveler who''s not
      been to disneyland in orlando , US, this was a captivating experience . Although
      some rides are not meant for 50   , there enough to do . Add to it the various
      show''s , parade   noon & evening & fireworks .... it makes the entire experience
      worth it. For those who want more than a day''s outing , plan to purchase a
      2 day pass . Also staying in Disney hotel is a totally different experience
      .... one must if time permits !!","Not a very huge park, but if with kids, it
      definitely requires an entire day. Better to plan on a weekday else to plan
      when schools in Hong Kong and China are not on holidays. We went on a Saturday
      in October and it was alright. Most of the rides had only a 10 15 min wait atleast
      till 5pm. Post that, the lines get a little longer to 30 40 mins but i guess
      that alright. a lot is covered by that time. Tickets: Tickets can be purchased
      at the gate else a better option is to took them online in advance and get them
      cheaper by $30 per adult.Travelling: We were staying on Hong Kong island. So
      we took the MTR from Hong Kong Stn to Sunny Bay via the Tung Chung Line. At
      Sunny Bay, change to the Disney Line and the magic of disney begins there itself.
      A specially designed Disney theme train to take you to Disneyland. Mickey is
      everywhereOrder of Zones to Cover: Tomorrowland, Fantasyland, Adventureland,
      Grizzly Gulch, Mystic Point, Toy Story Land. Tomorrowland and Fantasyland have
      majority of the attractions which we covered by 2pm followed by lunch. Post
      the 3pm parade we went to the other zones which are smallFood & Water: Lots
      of small food joints everywhere and a restaurant in each zone. However the food
      is expensive. We ate at Tahitian terrace and the food was good. In between,
      we munched on fries, popcorn and some snacks. Food is kind of expensive but
      there is other option. Outside food is not allowed and the checking at the gates
      in quite strict. Water can be filled inside at many water stations available.
      the bakery in Mainstreet USA is good tooMost of the rides are for kids and adults
      might find them silly, but hey, this is disney and if with kids they will have
      a great time at almost all the rides and attractions. So silly they may be,
      enjoy with them.Must Do Rides zonewise:Tomorrowland: Space Mountain, Buzz Astro
      Light Year, Autopia & OrbitronFantasyland: The May Adventures of Winnie the
      Pooh, Mad Hatter Tea Cups, Its a small world, Cinderella Carousal, Dumbo the
      Flying elephantAdventureland: Jungle River Cruise, Festival of the Lion King
      (Show)Grizzly Gulch: Big Grizzly Mountain Runaway Mine CarsMystic Point: Mystic
      ManorToy Story Land: RC Racer, Slinky Dog Spin, Toy Soldier Parachute DropParades:3pm
      Flight of the Fantasy: Awesome. take a seat around 45 mins before the parade
      to get a good seat. Best viewed from the place there the entry to Adventureland
      is. If lucky, your kid would be called in the parade and made to participate.
      My daughter was called in like 4 5 times and she went so crazy9pm Fireworks.
      A must see, just brilliant. They happen above Sleeping Beauty''s castle and
      are best viewed from the Gazebo at Main Street USA close to the entranceSince
      it was Haloween, we had a special parade at 7:30pm called Disney Paint the Night.
      a parade with 900k LEDs and the disney characters. Simply brilliant. Best viewed
      from same place as the 3pm paradeFast Pass: Space Mountain and Winnie the pooh
      rides have fast pass. So if you do not get a queue go for it once and then take
      fast pass. Come back again at the mentioned time and enter with minimal queue
      againShopping: Princess clothes and stuff along with Mickey stuff at a shop
      in Fantasyland. Lots of other carts all around for accessories, souvenirs and
      toys.Meet the Characters:Mickey, Minnie, Pluto, Chipmunks, Donald Duck   In
      Fantasy Gardens in Fantasy land. But expect a queue of 25 40 mins for photo
      with each character. Buzz Light Year   Next to the Buzz Lightyear Ride. expect
      a 30 min queue atleast.Have a great time at Disneyland. you and your kids will
      be smiling all day :)","Lantau island Big Buddha is worth a visit. One must
      click lots of pictures. Good for a day picnic on a cool and windy day","It''s
      been a long time since last step into HK Disneyland. (Actually, less than 1
      year ago, as I went for the HK Disneyland run that run thru the park...and I
      went for the 2018 edition again this time lol)So this time into the park direct
      to see the shows and some of the rides. (Frankly, the queue is scary; unless
      you go first thing in the morning, or buy  get the fastpass, 1 day is not enough
      to see ALL the shows  rides... ) Ok, certain things are under renovation   including
      the well loved Castle, and thus the fireworks at night though never stay that
      late.Stay for the new Mona show, Lion King show, the favorite Small World ride,
      the Pooh ride, ...and of course the well loved parade.As usual, magical at least
      for me to see Mickey and most of the Disney characters.","not much variety of
      food.  not to crowed. toy story land was great.  prices simillar to others.
      maybe. they have a ride similar to the log ride","An overall good place for
      a day to spend at.It''s small so it''s easy to go around and try everything,
      they have parades and firework display in the evening. There are places to eat
      at as well small vendors around.","What to say. Everything is magical...!!!  We
      visited during XMas and lit brilliantly.   Everything is expensive inside.   But
      once in a lifetime experience...","We had spend our Christmas day at Disneyland
      and there are lots of people on that day. It''s easy to reach by MTR and bus
      station just outside the park. Great park for kids, especially those who grown
      up with Disneyland characters. Sadly we only able to catch the short  raincoat  version
      of parade on that day due to rain. Luckily we still able to see the fireworks
      at night!","Spent 8 hours here had so much fun I went around New Year   s Eve
      time and the lines weren   t very long! The fast pass that is free really helps
      out! The lines were way smaller then Disneyland Tokyo and was not nearly as
      crowded! The food selection was also good especially as one of us is vegetarian.
      Always such a magical place!","my first ever dieny viist and its actualy a fanstasy
      with so much to do in a day starting from fantsasy land to rides and adventure
      land. A must see place","You can''t miss visiting Disneyland when you''re in
      Hong Kong. Especially when travelling with family. Great for kids especially
      below 12.","You can get here from Sunny bay MTR station interchain tonMTR disneyBought
      2 day pass in December friendly weather in first day 25, get promo for 2X popcorn
      2X Disc HKD 15. Ride also friendly for children below 5. The new ride is Iron
      Man 3D SPACE ship. And Moana dance performance. There 2 rides that you can enjoy
      fast pass. Space mountain and Winny the pooh. So come and collect your fast
      pass ticket firstResto will be full of crowd and long Q, suggest yo have early
      or late lunch, and bring yor snack for delaying your lunch. Parade entertaint
      us in the afternoon and a singing fire works performed in the closing day 8
      pm but unfortunately this time, the castle is under renovation no fireworks
      this Xmast.","Nice....though I feel you have done a few disneylands they loose
      their appeal...was visiting one after almost a decade so was fun to see my son
      enjoy...loved the parade (which is much more hi tech than when we were young)
      and the fireworks","Visited end of December with my 7 5 and 4 year olds. They
      loved it. Very appropriate for their age however you have to be organized as
      the shows and character  meet and greets  have strict times. It is a good idea
      to download the app which is live and gives tells you waiting times at the different
      rides. The Lion King show was nice, the Parade at 4pm was fabulous.I didn''t
      think we would last 3 hours there but we were there from 10am to 7pm . The food
      is basic but we didn''t go there for food so no biggy. And signage was poor.
      But the app was very helpful","Wow, their roller coaster in adventure land is
      as smooth as the dwarf ride at WDW Magic Kingdom and only a 10 minute wait without
      a fast pass! Pretty impressed with their Space Mountain that has a star wars
      theme too! The least waiting I have ever done at Disney and all are top notch
      fun. It''s a small world has Disney movie characters in it here, but I didn''t
      remember that in Florida. Amazing weather too and does not seem as expensive
      as Florida.Getting there using the MTR subway was easy and cheap for a day trip.","we
      had fun for 2 days.Must visit place in life time.Its Mickey and Disney character
      magic all the way.Love the place.Dnt miss Night Parade Specially.","Ok so it''s
      Disneyland. What more do you want to know?If you''ve been to California Disney   think
      a more compact version, but still with quite a range to keep you entertained.We
      visited mid week and although it was a very warm day there was enough shade
      and cool places so we didn''t find the heat a real problem.Quiet when we arrived
      shortly after opening and it became busy by lunchtime but certainly nowhere
      near crazy packed. This made most rides only a short wait ( 20 min) and so managed
      to repeat many rides and get around everywhere in a day. I think one day at
      this park would be plenty in most circumstances.Come early if there are specific
      rides you want to do more than once. Autopia queues get very long early, move
      slowly, and have a lot of families.If you''re a thrill ride junkie you''re probably
      going to be disappointed   this is not Universal. But if you''re expecting the
      Disney experience, then it''s a great day.Quite a few restaurants were closed
      (off peak?) so we found the eating choices a bit ordinary and in fact was part
      of our decision to leave early before the fireworks.The metro connections are
      easy although it will still take a while to get there. The last metro ride is
      purely Disney and it helps to put you in the mood as it''s themed.I thought
      the ticket price was good value given all the included rides and live entertainment.","We
      only went to Disneyland to buy our Grandkids some Disney Stuff , We got the
      day tour with pick up from hotel and drop off at night we started about 10 am
      and got back to the hotel about 11.30 pm as we were the last drop off  the bus
      left disneyland at 9.45 pm   so it was a big day out. We went on nearly all
      the rides even MR SLINKY which is a kiddies ride haha and saw two of the shows
      we even went on one of the rides twice . The final parade was pretty good but
      i dont think i could have gone a second day as there is just not enough to do","Great
      environment and excellent service. Awesome character dinner experience with
      photography session for children. Good food in Enchanted Garden. The hotel itself
      provides plenty of activities for children. One example is Tai Chi exercise
      with Master Goofy! Recommended to stay at least 2 days, 1 night to fully enjoy
      hotel amenities and also Disneyland park. Little Disney Princess Themed Package
      is a must for your little ones. Surprise is awaiting for you in your hotel room
      with all Disney decorations. Will come back soon to explore Disney Explorer
      Lodge!","Love this place, everything is done so well. The whole family had a
      great day and lots of fantastic memories were made.","Expensive tickets and
      expensive food inside premises.  Few choices of rides. Long queues (each lasted
      more than an hour). Too crowded!","From what I''ve previously heard it''s not
      a small park, like many have said. It''s a clean place and well organised. Services
      are ok but the restaurants have expensive prices for the varieties of foods
      they have to offer. The rides were high quality. Don''t go on a rainy day.","Hong
      Kong Disneyland is indeed very small, but absolutley gorgeous. The park is so
      clean! My wife and I visited on November 22nd 2005 and had truly magical day.Getting
      to the park is so simple and the Disney train with its Mickey Mouse shaped windows
      is superb.A few of the rides have fastpasses, but as the park is quite empty
      (11,000 the day we visited), you really don''t have to queue for much. You can
      easily see and do everything in the park in a day at a quite leasurely pace.The
      ''Tarzan'' treehouse gives a fantastic view of the park and its surroundings,
      the surrounding mountain create a beautiful backdrop.Space Mountain is very
      much like the EuroDisney version and we only queued for 10 mins to get on. The
      Golden Mickeys is excellent but allow a good 45 mins before the show time to
      make sure you get in. The shops are very good but due to the size of the park
      they do not offer as much range as the bigger parks.The staff were very helpful
      and the food was fantastic. We were escorted to a table and even shown how to
      use the chopsticks! The Fireworks at the end of the day are the best we have
      seen at any Disney.Reading some of the negative comments we were very anxious
      about going but were really surprised at how lovely the park is. 57% of the
      park is owned by the Hong Kong government which means there is a very ''Chinese''
      feel about Hong Kong Disneyland. There are plans to expand the park in the future
      but it is definitely worth a visit.","I recently reviewed Universal Studios
      in Singapore, and I just thought I''d review the one that I compared USS with.
      I went here before I even went to Universal Studios, and I found it more cheerful,
      to say the least, to commute to HK Disneyland because of their very own train   windows
      shaped like mickey''s ears included. Going to Disneyland, and going home from
      it, were easy   they have their own MRT line. One plus, I think, of HK Disneyland
      is that the tickets are very much accessible   we purchased ours in a convenience
      store near where we were staying. Getting to the amusement park was a bit longer
      than it should have been, there was an unnecessary walk from the train drop
      off to the entrance of the amusement park itself. The lawn bushes that were
      shaped like the Disney characters did not help at all in lifting our energies
      up. However, when we got there, we were pretty anxious already. What I did not
      like the most in HK Disneyland was not the long queues for the rides, but the
      long queues for the photo ops with the Disney characters. As compared Universal
      Studios, they only had photo ops in ONE area in HK disneyland   so pretty much
      every person who wanted a picture flocked there. We ended up having a picture
      with just Goofy because of all the lines. I will not write about the rides because
      of the different preferences of the people, but I can say that HK does a so
      so job in catering to the preferences of the guests. The rides had long queues,
      and there were not enough rides to divide the people''s attention. With the
      expansion of the Toy Story area, I hope that HK Disneyland continues with the
      expansion so that it would cater to the daily traffic that they received. I
      read somewhere that HK Disneyland is operating at a loss, and I can see why.
      There was just simply not enough rides to make people go back.  Happiest place
      on Earth     for just one day. The parade, however, somewhat made the entrance
      fee worth it as this America imported amusement park does not disappoint with
      the parade. It was very much lively, and it featured all the characters that
      people were expecting to see. The parade participants that weren''t on the floats
      were even interacting with the guests with unending charisma all throughout
      the parade. As compared to Universal Studios in Singapore, the souvenir stores
      here are priced decently. They had adorable items   but I think thats just because
      Disney characters are an easier sell as compared to random characters from Universal
      Studios. Rides, however, are a totally different story; as I mentioned earlier.
      The one thing that made all that walking worthwhile was the fireworks display
      that happens promptly at 7PM. You''ll see people flocking Cinderella''s castle
      because the view is best from there. It did not disappoint as the famous Disneyland
      fireworks display was simply breathtaking. If it''s anything, simply go to Disneyland
      in the afternoon and wait for the display! All in all, Hong Kong''s disneyland
      was an okay attraction. However, as I mentioned, I think its something I will
      visit just once in my life   not unless they expand beyond the Toy Story land.","Total
      hype ...... Ocean park is much better than DL . I mean if you are visiting just
      for the name sake .... No use . My kids didn''t enjoyed rides . Shops are too
      expensive . Universal studios of Singapore is 100 times better . Actually DL
      is more of for small kids .","We had a wonderful time in Disneyland Hong Kong.
      Here are my top 10 tips:1. Stay at a Disney resort and do the character breakfast.
      It will make your kids eyes light up when the characters come over to your breakfast
      table and spend 2 5 minutes with your kids... You do not get this personal attention
      at the park.2. Go to the park early and stay late. These are the times to try
      the most sought after rides such as Winnie the Poo and Buzz Lightyear. The Buzz
      Lightyear ride is great fun for both adults and kids.3. Bring some fruits. The
      food is not that great and the snacks are expensive and unhealthy. Some fresh
      fruits is a good refreshing treat.4. Get to the parade a 10 15 min early so
      you get a good spot.5. Consider spending 2 days in the park. It allows you to
      go back and try the best rides again.6. Watch the shows. The Lion King and the
      Golden Mickey. They are fantastic.7. Buy your tickets through the Disneyland
      resort it might not be cheaper but saves you the hassle standing in line at
      the park.8. If you like rollercoasters you should definitely try the Space Mountain
      and the Big Grizzly Mine cars9. Make sure you do the 3D Mickey''s Philarmagic
      movie.10. Stay for the fireworks. It is a bit late for younger kids but it is
      worth it as a magical end to a magical day.I hope you will enjoy your visit
      as much as we did.","Needless to say, there is no way you can skip disneyland.
      Adult, child or just grandparents, you would totally become a child in this
      place. Booking of tickets at the counter is no hassle at all.Senior citizens
      could be much bothered by the amount of walking. But you can rent wheel chairs.
      The rides are AWESOME   Space Mountain and Grizzly Gulch. Very very memorable.
      Food is OK. It is a visit that you would never ever forget!","This was our first
      visit to any Disneyland and we were pretty impressed. We spent 2 days exploring
      rides and shows and meeting all number of characters. We loved the Lion KIng
      show and the parade as well as the Mickey''s Phillarmagic 4D show complete with
      smells and splashing water. It was hot in July though so bring face washers
      flannels for wetting and wiping to cool off and lots of money for cold water
      to drink. The food prices weren''t too bad considering it was a theme park but
      it was not a cheap 2 days. We did find the crowds overwhelming and many people
      had no consideration for others. We arrived on the MTR in the afternoon and
      were swamped by a crowd trying to get on the train before we could get off.
      We had to scream and shout to get our way though. My husband told everyone they
      should be ashamed of themselves and then the crowd parted to let us through.
      We had many other experiences of queue jumping and jostling thrughout our time
      despite constant reminders from staff to respect others. I couldn''t believe
      a grown man tried to push my daughter (5) out of the way to get on the teacup
      ride. I put him in his place pretty quickly. To avoid crowds, go to the attractions
      at the far ends of the park early in the morning. Besides the crowds it was
      an amazing experience for us and the kids (5 and 3). Oh, we got more time with
      the princesses too because we speak english. Everyone else just got a photo
      but we got conversations even my son loved that!","Very easy to get to by train.
      If you have little one''s they will LOVE it. If you have teenagers, NOT so much.
      Not many good, age appropriate ride selections for the older child. It''s not
      Disney World, but you get to say you''ve been to Hong Kong Disney Land!!:) Also,
      tickets, food, pics, etc  very reasonable compared to Disney World. Enjoy and
      safe travels!!","This is the 2nd time we visited Hong Kong Disneyland. We visited
      the theme park in 2010 while we were dating and this time 2014, with our 2 year
      old toddler. There is additional of 3 areas, the toy story land, mystic land
      and Grizzly Gulch. In December, the weather is much cooler which makes the waiting
      and queuing acceptable.Armed with a toddler this time, we are well aware of
      height restrictions for rides and we planned our program pretty carefully. You
      may refer to the calendar website here:http:  park.hongkongdisneyland.com hkdl
      en US tools calendar calendar?name DayViewPageWe strongly encourage to avoid
      weekends and Chinese public holidays (ie golden week of China). on he average
      we spend about 30 50mins of waiting for rides (pooh bear and Cinderella carousel)
      and some 40 80mins for photo taking for Disney characters on weekday.This is
      what we did; We arrive abit late at 12pm, we headed to  The Golden Mickeys  for
      a musical performance, which ended at 1pm, by then parade just started and the
      streets were lined up with people.We made our way to Main street USA, opp the
      Disney railway station for the vantage point. Subsequently as the parade ended,
      we were already in queue for Mickey & Minnie Characters at the Town Square.I
      would highly recommend the parade segments; Flight of fantasy at 1pm and 4pmhttps:  www.youtube.com
      watch?v Y9ZGjM5hBc0As well as the night parade Paint the night with light; which
      was spectacular (it ain''t day parade parade with lights, but more) Recommendation;
      Stay on the left side of parade, you will get to face Mike Sullivan (from monster
      inc) and Buzz lightyear (from toy story) https:  www.youtube.com watch?v  SnVV188V1oNot
      forgetting the Fireworks which commence about an hour after the paradeNote:
      you may wanna make your way before the fireworks end to beat the crowd of MTR
      train back home.","It meet our expectation based on review on this theme park
      despite we think it is smaller than Universal Studio S''pore. Do not attempt
      to bring any food item inside as the security personnels stationed at the entrance
      will check every bag and will remove the food item. Overall the rides are in
      working condition and well maintained, most of the toilets are spotless despite
      huge crowd around the area.The crowd control need to be improved as visitors
      from across the other side of the border having problem to stand and wait in
      the line. Disney merchandise shops located at every single park and it''s where
      Disneyland printing the HKD, people who collect the Disney momentos will find
      every single item with any of the Disney''s character.","I am of an age where
      I still love the mouse and Disney Hong Kong did not disappoint. This was my
      husbands first experience of mouseland and he loved it to. We were there for
      rope drop and got talking to a couple who visit all the parks every year so
      they gave the tip of go to the back of the park and do RC Racer first as it
      is very quiet at the beginning. Great tip and the queue was non exsistent when
      we got there. Did it three times in a row and then went off to do Slinky Dog
      which there was a queue for and I am not sure whether I would wait again for
      it. You can do this park comfortably in a day but make sure you pick up the
      parade times which we forgot to do until too late in the day. Beware of the
      shoving that goes on getting into any of the 3D shows   Mickey''s Philarmagic
      a woman with a child was trying to push me out of the way but I stood my ground
      and had a yelling fit at her! Sadly it does seem to by mainland Chinese that
      are doing this and not the local people. The fireworks over the castle were
      totally magical and worth waiting for and if I am honest I thought they were
      better than the New Year''s Eve ones   sorry but true","You can check the weather
      before you are planning travelling to Hong Kong. We brought entrance tickets
      from KLOOK APP which is easier and have discounts for online booking. You can
      spend all day in Disneyland and night time you can watch the fireworks at night
      time. P S : you can bring clothes for exchange if you going to play water park
      games, umbrella or raincoat. And also, you may book your lunch time with KLOOK
      APP and buy their lunch package is much save more money for family trip.","Went
      with my daughters (6 and 9 yo). There was around 45 to 60 minutes queue for
      every rides since it was during the Chinese New Year rush. My youngest height
      is more than 112cm, so she can ride every rides, which we did. Don''t forget
      to get the fast ticket for Space mountain and the Winne the pooh ride. The best
      rides are the big grizzly mountain mine, and mystic manor. Food is expensive.
      Don''t miss the parades (day and the color the night parade) and the fireworks.Don''t
      buy the 2 day tickets, since you only need a day to explore the park. Highly
      recommended for small children and first time disneyland visitor. I prefer the
      Ocean park for older children.","We found the Hong Kong Disney experience overall
      a great family outing. Plenty of things to do and see and easy to cover in a
      day. Although the queues were long they were generally less time than the signs
      indicated. The down side of the day, was the closing of half the park for a
      private function. Luckily there were plenty of signs and staff at the gate were
      helpful in suggesting to do that side of the park before it closed to the general
      public although we did miss a couple of rides. It was also hard to get a photo
      with some of the characters, always seemed to turn up just as the photo sessions
      were closing.On the plus side the fireworks show was amazing and well worth
      staying to see.","This is Disneyland, a place for you and your children to meet
      Disney characters and feels some good but not too extreme rides. 2018 is my
      2nd time to go here. Disneyland is constantly adding and renewing their attraction.
      However one main reasons to postpone your visit here (at least until late 2019)
      because the main castle is under renovation. The renovation also means that
      there are no fireworks show, which makes come to Disneyland is less worth these
      days.","We were done in Disneyland in 3 hours, rides included. How magical.
      (We appreciate the lack of queue and crying children.) Considering that it takes
      some time to get from the city to Disneyland, it doesn''t seem that worth it
      to go at all. Skip this and perhaps try Ocean Park instead.","The park was relatively
      well priced. My brother and I took several trains to reach the attraction, but
      this was rather simple and there was a special Disney train that takes you directly
      to Disneyland from Sunny Bay. Taking the train is, I believe, cheaper than taking
      a taxi. Aimed mainly at children, the rides were mediocre with not much thrill.
      3 or 4 rides appealing to the ''older crowd''. The parade was fantastic, but
      very cramped. I found there to be a good selection of food, fulfilling numerous
      tastes and nationalities all at expected ''Disney prices''. My criticisms lie
      in that queuing for some attractions were much too long and the ticket prices
      were slightly too expensive for the experience. I would recommend HK Disney
      Land for families with young children, and if you are older try Ocean Park instead
      as I believe it is aimed at teenagers and adults. The general experience of
      Disneyland was enjoyable, but nothing compared to the likes of Disney World
      Florida, and I will not be returning. My final complaint is that I failed to
      meet any Disney Princesses as they were always ''unavailable'' and this was
      extremely distressing (yes I am 17 years old). I had waited many years to get
      the chance to meet a princess, but this was not to be, much to my disappointment.","The
      place is nice and clean, but small. It is the smallest Disneyland I have been.
      The place it is perfect for little kids. Monday it is the best day to go, we
      didn''t have to wait to use the rides.","Wednesday 27 March  As a family we
      have visited the other Disney parks and were keen to experience the HK one.  I
      was travelling with DW, DS(16), DD(13) & DD (10)  We got up relatively early
      and caught the Island MTR line to Central and...More","Had a seventeen hour
      layover in Hong Kong so we took our daughter to Disneyland as a special treat
      for her and to fill in time. She loved it. My wife and I were a little disappointed
      getting pictures with Micky and Minnie was a task in its self, lines so so long
      no shade and kept getting closed off, so had to keep going back and start over
      again.wich made it a very long day. All in all still a great day for kids. Even
      with the lineups it   s still worth taking the little ones too.","One thing
      I like about HK is the efficient transport service. You can just use MTR and
      reach there within 1 hour from Kowloon. For a Disney character fan like me,
      Disneyland is a haven. I strongly recommend you to purchase the 2 days tickets,
      as one day is definitely not enough to explore everything!","worth visiting
      place with kids.Enjoyed a lot in disneyland. My 8 years daughter''s favorite
      place in Hongkong.","Disneyland hong kong was the 1st Disneyland I have ever
      visited. It was great experience for me, my daughter and my close friend. My
      daughter, who is 2 really enjoyed the places the story time. It was a best place
      to celebrate her 2nd birthday.I truly recommend this place, it''s ideal for
      kids and adults.","I went to HKD in early april. The line ups for all of the
      major rides were really short like 5 15 mins. Which is really short compared
      to WDW. The weather wasn''t so good. It was raining but thats why it was so
      quiet. We were the first on the jungle river cruise which was fun. But the time
      to go would be when the weather is not to good because to me the weather didnt
      affect us on any rides and thats what made the wait times shorter but also dont
      go on the public holidays because it will get really busy. Go in the off season!","I
      have been to Disney in Florida, California, Tokyo, and Hong Kong. This one is
      on par with all of them, it does seem a little smaller. From the start they
      have a train line, you get to the park. If you wish to use public transportation,
      and not drive. The cast members where outstanding, the ones I talked to spoke
      very good English.","Given that I have been always going back to hongkong Disneyland
      and this is my 3rd time, I was excited to see they have the newest attraction.
      You have to go directly here if you are a returnee, lines are not so long and
      you get to experience a cool ride. It''s like being in a storybook. Your kids
      will enjoy the monkey.. Careful though for those suffering from epileptic seizures
      and problems with the heart, the ride has some pyro special effects that might
      surprise youOverall, great new attraction HK disney!","MTR in Hong Kong is very
      sufficient, we finally arrived to Disneyland resort station within 20 mins from
      Wanchai station.We have been to Disney world in Orlando, this is a small version
      of that. We started with space mountain ride, that was awesome, but little kid
      can get scared. Our most favorite one was Big Grizzly mountain, we had to get
      on this twice. The best part of this ride was the train stopped and went backward
      for about 200 meters, then fired toward with high speed and turned sideways.
      That was absolutely awesome. The only one thing I wish for this ride is fast
      pass.","It is Disneyland. Nothing much to write as the name Disneyland has its
      own reputation as the most happiest place on earth.. still does.","On the way
      into Disney resorts... whtas better?  10 10  even for anyone not in love with
      the house of mouse, its great","I have just returned from a great 4 day stay
      at the Hong Kong disney land hotel.A bit expensive but well worth it Went with
      my wife,daughter and 5 year old grandson.He actually had his fifth birthday
      at the hotel and the staff gave him a royal time.Disneyland itself is a lot
      smaller than the one in USA but is easy to get around for older and younger
      .If you allow two full days in the park it is better because you do not have
      to rush.Not many queues and no pushing.Did not have any trouble getting water
      in at the gate and there are plenty of taps to refill your bottles.All in all
      a great trip.Barrie Clarke","My wife and I came here for the first time in 2006.
      10 years later, we returned here with our kids. Although there were not many
      new rides and venues, It was still joyful and entertaining as it was 10 years
      ago. The food was ok, the park also very clean. However I feel something difference
      about the services. Not many staffs around, not many photographs taken to be
      deemed in photostore booth, some staffs a bit not friendly nor helpful. I saw
      a father got mad to a staff, complaining why his kid cannot took a photo with
      mickey while he already stood in the line but the photo session time was up.
      I once heard from someone that one of Disney''s motto is  no child cries (or
      feel sad?) in disneyland!  Regardless the need to be improved service, I think
      it was an exceptional experience for us.","A total cheerful place, awesome time
      spent with family and friends.A must visit place and worth waiting for the Night
      Parade and Fireworks.I''d say for anyone visiting, download a map online first
      and ask people what all things are must watch, that way your time is spent wisely.","The
      shows (both street shows & theater shows) are a must see. It forms the basis
      of the magic of Disney! Food is very expensive at the Disney theme park. 3 sets
      of lunch combos with drinks cost $72 SGD. Rides were short but exciting without
      being too intimidating. You will need a two day pass to explore everything.
      Iron man, Thrill Mountain rides are exciting.","This is exciting and awesome.
      Requires atleast 2 days to fully enjoy all the attractions. Better to plan in
      advance on what to cover to enjoy maximum rides. Indian food is available only
      in 1 restaurant during our visit.","As expected, Disneyland was amazing. Had
      lots of fun with my boyfriend walking around, taking photos and taking in the
      scenery. The rides were good also. We were lucky to have been walking past the
      area where the parade was going to go through, so we settled down with some
      soy milk and caramel popcorn and thoroughly enjoyed the performance. Make sure
      to catch the 3pm session, perfect time of the day.","The Disneyland HK is little
      overrated, though there are few interesting rides  events activities, the full
      park was flooded with regional tourists & long delays made the fun fly away.","I
      enjoy a lot there with my family and friends there many rides from extreme to
      mildPrade is the must see attraction of the parkpark have many food courts and
      restaurants and I like the food  It need full day to visit and enjoy it fully
      with family","Even if you are an adult, but still young in your heart, this
      is a place to visit during your stay in Hong Kong.I already visited Disneyland(s)
      in Orlando and Paris and I can say that they look pretty much the same. Only
      Disneyland in Orlando is a REAL land with a lot of attractions, all the others
      are Magic Kingdoms (part of Disneyland in Orlando). The most impressive part
      of this Disneyland in Hong Kong is the closing ceremony and its fireworks, which
      I think is the most spectacular of all others...I will not spend more words
      on this, since I will post a lot of pictures and each one of them worth a thousand
      words : )","I wasn''t expecting much so wasn''t surprised at how small it is;
      it really is just a day out and if you usually like to whip round Disney you
      could totally do it in an afternoon! there are some great rides and also some
      which are better in other Disney parks round the world but it''s all a bit of
      fun.Food was as usual very expensive especially compared to food out in HK;
      a mickey waffle is GBP  5 whereas out in Hong Kong a large meal at McDs costs
      about GBP  2.30 but what more could you expect from Disney?! It''s fine to take
      snacks and water in with you.","I was surprised it was cheaper to get in than
      the one in the States, it is much smaller that the American one but still very
      impressive.  Perfect place for children and if you want to re live your childhood.","This
      disney is not as big as one in Japan.  They charge a fortune for individual
      bags in the cloak room.  Not as good as in Japan.","The place is nice for family
      bonding and also for good friends. I enjoyed visit the haunted house specially
      for Halloween celebration. We loved the jungle cruise and riding the Go Cart.
      Disneyland wont be complete without taking pictures with Mickey Mouse. I enjoyedalso
      the night parade with songs and danced and wonderful fireworks. The most memorable
      trip to Disneyland with always make your heart feel young.","Very nice place
      for my kids even me and my wife we enjoy there and you should go Early and wait
      till evening to see the fire work , advice don''t go on hong kong holiday it
      will be tooooo many people it''s hard to try most of the game","Having lived
      in Florida and holidayed in California, Disney has been well and truly tried
      and tested and then some, being one of my favourite places to visit. So when
      we visited Hong Kong on our World Trip at the end of last year, we just had
      to visit Disney Hong Kong. I had read about it and knew beforehand it was considerably
      smaller than Disneyland CA. However what we were not prepared for was the lack
      of people visiting this park which although it made the queues for the rides
      a joy, being able to just walk up to the attraction and there be only up to
      10 people waiting in line or simply non at all, it lacked atmosphere and character.
      The Asian people are certainly not as demonstrative as the Americans, which
      all adds to the fun and flavour of the visit and makes it exciting and buzzy.
      You could see European people coming through the gates and looking around in
      amazement as we had done, especially if they had been to the US parks. The parades
      were excellent as with the evening electric light parade which was very high
      tech. The fireworks at the end of the evening were beautiful too as with all
      Disney parks. They don''t have electric wheel chairs, so I pushed my husband
      around in a normal wheelchair which certainly burned off the calories! Leaving
      the park once the fireworks had finished was very easy, there is a train station
      right by the entrance which we chose not to take as to get back to our hotel
      we would have had to make several changes, but the option is there, but we took
      a taxi and there was not one person in line before us. The taxi ride was around
      45 minutes back to Happy Valley area in Hong Kong and cost us approx 20 euros
      either way, so an obvious choice for us. It was worth a visit as its Disney
      and the cost of a park entrance for us as over 65 years old was the princely
      price of 11 euros each, the regular cost was minimal. It was disappointing,
      but still a must visit for us.","We   ve been planning this trip for some time.
      Sadly, or happily, it rained all three days! Dress in warm layers, grab some
      dollar store rain ponchos and ride baby! DOWNLOAD THE DISNEY APP on your smart
      phone!!! Get familiar with it before you go...this will make you a much smarter
      visitor. Besides the map feature with the    you are here dot    you can check
      out wait times for various attractions and use in app purchases to add remote
      Fast Pass acquisition. You can also scan passes for your party into one phone
      device for easy access, and protection from loss. Finally, if you want a sit
      down dinner in the park, MAKE A RESERVATION before you go. Even a bad day at
      Disneyland is a great, memory making, day!","Get there for it opening   we went
      in April and waited no more than 10 minutes for a ride   most 5 mins or straight
      on. Plenty of eating options and big range of souvenirs to buy. MTR very easy
      and cheap to get there.","This was my fourth time in HK Disneyland and it was
      always better and better every time I came back. More attractions were provided
      here. This time I was so happy with the Toy Story land, Mystic point, and mine
      train. They were all well built. I will definitely came back here with my family
      next time we visiting Hong Kong.","Disneyland is not as huge as the ones in
      LA or Orlando. Its almost half the size. dont miss the parades. It was quite
      hot when we visited in Aug. You should ensure adequate water is taken. Food
      is not an issue for vegetarians. Ample...More","We went there last year. My
      kids really enjoy being here. We spent a day here but i think it''s not enough
      for us to enjoy disneyland in one day. May be we will come again another time.
      My kids really excited to meet all their idols, mickey, minnie, donald and daisy.
      It was really unforgettable vacation.","This is by far a fun version (short
      lines) of LA Disneyland. The parades are not as spectacular, but the wait time
      fofor the rides is approx. 15 mins. I was shocked at how fast everything was,
      and English is spoken on the rides unlike...More","We are an older couple but
      we thoroughly enjoyed Disneyland. It is smaller and does not have as many rides
      but it is not so busy either. We had very short (about 5 minutes) wait to get
      on rides. We arrived as it opened and the Disney characters are on the Main
      Street to see. Lots of shops to look in and some good shows to watch. The parade
      was very entertaining.","Too small and nothing much to see.Got done in half
      a day with most attraction not worth the money here","Visited this place last
      October 2014 with a friend. The weather was kinda hot but it was tolerable.
      We arrived around 2pm (from our tour) and found a good spot to see the 3pm parade.
      I could not contain my happiness when I''ve started seeing my favorite characters,
      I literally cried when I saw Mickey Mouse and his pals! After the parade, we
      tried the Big Grizzly Mountain Runaway Mine ride. There''s this senior couple
      in front of us and I can tell that they were irked by our shrieks. LOL. We''ve
      also lined up for the Golden Mickey''s show and watched the night parade after.
      As much as we enjoyed the attractions, we did not want to spend additional bucks
      on food (Disneyland meals are hella pricey). We just had a bottle of water with
      us. Visiting the restroom was a breeze, since they''re everywhere (and surprisingly
      not overcrowded nor smelly). They say that this is the smallest Disneyland park
      in the world,nonetheless, we still had an amazing experience. Tip: If you''re
      visiting this place for the first time, don''t bring FOOD.","We had a day full
      of fun and entertainment at Hong Kong Disneyland on 1st Jan2014. It was one
      of the best New Year Day Celebration. Even though it is not as big as Paris
      or US, but given the overall land size of Hong Kong it was sizable, you would
      still need lot of energy to enjoy all the rides. Disney Parade takes place at
      11, 1 & 4. if one has seen Disney movies, he could easily relate this parade
      with movie characters and enjoy it better. Rides were extremely wonderful, different
      type of rides are made suitable to children, youngsters as well as elders. Having
      spent the whole day at Disneyland, one must watch 9:00PM Fireworks show at the
      Castle.","We went when my daughter was 5 and again when 8. Absolutely perfect
      for meeting characters, going to shows and going on the less adventurous rides.
      She''s not into those huge rollercoaster type rides, whereas with a bunch of
      12 year old boys, they''d probably think its all lame. We had an absolute ball
      both times and loved Christmas theme the first time and the Chinese   Halloween   Disney
      mash up on our second visit. Well worth the visit and the Disney Hotel experience
      is fun and affordable too.","If you are visiting Disney HK make sure you check
      the weather prior your planning to travel since the park closes all out door
      events in case of cyclones, heavy thunder and showers. And also the Qs to the
      rides can take up to 60...More","Having a 5 year old kid who''s a fan of Disney
      characters, we''ve been visiting Hongkong Disneyland for several times already.
      From 2010 to this year''s visit, I noticed that there were less English fluent
      speaking guides and staff available and less smiling attendants to greet the...More","We
      arrived there about noon and were done with the park around dinner time. Some
      restaurants don''t serve vegetarian meals and seating can be hard to come by
      during lunch time, however it was rather empty after the late noon parade. We
      jumped on rides with no lines, shopped without too much of a hassle, and had
      a pretty descent time. The park is smaller than the other ones in the world,
      but it''s enjoyable. I wish it would be a bit more themed for the culture and
      not just all Disney related, but that;s how it is.","Visited on 2nd Jan, the
      place was crowded with new year travelers.Having visited Universal Studios at
      Sentosa  SG, I would definitely recommend this. We got a discounted day pass
      at 350 HKD against the usual 500 HKD as we were in transit passengers with Cathay
      Pacific. Try to reach sharp at 9 am, coz the waiting time at attractions is
      much lesser in the forenoon (15   30 mins) as compared to afternoon (60 90 mins).
      Rides were good  The Walt Disney themes were showcased by all elemenst of the
      park. Don''t miss the 4 pm parade. For a snap with Mickey or Minnie (5 pm),
      you have to join the queue an hour earlier.","Adults and children, everyone
      loves Disneyland. Can be very busy at weekends and holidays, better if you can
      go mid week . Plenty to do , you will have a great time.","My kids enjoyed it
      but it''s just not for me. Expensive entry ticket, long queues, crowded and
      extortionately expensive food. Compared to the one in Florida, this one is small.  As
      an adult, I''d have preferred Ocean Park.","The park is smaller than those in
      the States, but there is still plenty to do. Younger children will probably
      enjoy Fantasyland the most as it seems the have the greatest number of toddler
      friendly rides. We also had a great time in Toy Story Land, which wasn''t there
      the last time we visited.While bad weather on a Sunday kept us ducking for cover
      for a couple of hours, the trip was memorable enough for us to begin planning
      our next visit. Probably in the summer, definitely on a weekday, for a thinner
      crowd.","we enjoyed every minute of this great experience ,we took the small
      train all around the Disneyland ,then we took a small boat to see the wonderful
      animals lived there and although they are unreal one ,they look very real with
      the emotions and voices they act .there were also a very nice show with all
      the famous characters of Disney ..worth to visit","We''ve been here quite a
      few times and one of the better Disney''s as queues are short and small enough
      to see everything in a day.We went mid week so was lot quieter and bought our
      tickets through Klook which was easy, but many of the rides attractions were
      under refurbishment and around 50% of the restaurants were closed (presumably
      due to less people). Price stays the same though! So you may want to double
      check in advance if you really want to experience any that might be closed to
      avoid disappointment.","It''s a nice theme based entertainment hub for people
      of all ages. Lots of ways to have fun and entertainment by one and all. It''s
      a good place to visit with family, friends or solo. The fire work show at the
      end of the day is special attraction for all.","The smallest Disneyland in the
      world.  Take the MTR Tung Chung Line is the most convenient way to the theme
      park.","Must visit Disneyland when in Hong Kong. Its marvelous and not only
      kids but people of all ages just love it. All attractions are well created.
      The parade and the fireworks at the end of the day are awesome.","This is my
      second visit to Disneyland park. My last visit was 5 years ago. Both times I
      went 2 days to the park in the same trip and on weekdays so that it is not that
      crowded. Found that this time round, the place was no longer that exciting nor
      many things to do even though they have added in 1 new area. The toy story land
      was not as interesting as the one I went in Tokyo. Also the were not many rides
      though it was a new section. Disney service staff was also not as friendly as
      previously. It is better to go elsewhere but if you have kids of 3 4 years,
      perhaps this park is still suitable for them.","Just spent 6 hours at Disneyland
      with our 8 year old granddaughter! This is not the first time we''ve been there
      with her, but we can see at this age, her height qualifies her for more exciting
      rides! Some rides were reserved for her an her grandfather, but others, we could
      all enjoy! Our trip was the latter part of October, so apparently it had cooled
      down a bit. Comfortable but warm. It is a very fun place for all!!","I love
      Disneyland. Typically laid out in all the worlds. Great rides for young and
      old, lots of food and drink stations around the park. Most rides open the day
      I went. Plenty of parades and music happening most of the day. Always a fun
      day.","This was a true highlight of our trip, they suspend reality so well in
      the park each lands attention to detail is incredible in decor, the sounds   smells,
      the staffs costumes and personas. There is truly something for everyone of all
      ages. The lines where very well managed with even on opening day of the new
      marvel ride just around 40 mins wait. Make sure you use smart fast track passes
      where you can they are free at some rides.It   s fair to say this park is much
      smaller than the others but somehow in that it becomes so much more charming.The
      staff could not do more for people bending over backwards they clearly love
      their jobs. They just seemed to intuitively just know what people needed.Would
      strongly recommend anyone with a day or two to spare. The current two day ticket
      offer was great for us as we did most of the flagship rides day one and the
      show and on the second day the other items.With this very close proximity to
      the airport and cheap bag storage it   s an ideal place to stop over or visit
      on your last day like we did heading straight to the airport after.","It   s
      Disneyland! It just does not need reviewing!  Place speaks for itself.  However
      smaller than I expected.  Great experience","We spent a whole Saturday at HK
      Disneyland, and it is smaller than some other parks, but with Toy Story Land
      and Grizzley Gulch, is definately worth going. My 10 year old son had a blast,
      crowds were heaviest in middle of day, early and late we almost walked on rides.
      Would love to go back should the opportunity arise.","after a lot of hesitation
      because of the protests i took my family for a holiday to hong kong with the
      main intention of taking my kids to Disneyland,took a two day pass from my travel
      agent and later came to know that senior citizens get a discount which was not
      provided to me by the travel agent as they said group bookings do not get that
      facility was disappointed with the attitude of some of the survey takers who
      were very selective in giving gifts to the people whom they questioned for their
      survey.Asians from the far east and chinese were always given postcards ,sticker
      sheets ,writing pads but INDIANS were given the round stickers which all kids
      get when entering. so if you are an Indian don''t bother answering and wasting
      time to answer the survey questionssecondly veg food is difficult to find in
      any of the eat outs aroundsenior citizens who come in private vans of tour operators
      have to walk quiet a distance to the main entrance would suggest golf carts
      to be provided to senior citizens and mothers having toddlersover all my kids
      enjoyed the disney experience and it was worth my risk to go to hong kong during
      the political unrest","Its what we expected. The kids 3 and 10 years old enjoyed
      the attractions. If you''ve been to any of the other disneylands around the
      world then its pretty much the same.","I am aiming to take my kids to all Disney
      theme parks and on the Disney cruise. In 2012 we went to Orlando, this year
      Hong Kong, next year Paris etc.I recommend going to HK Disney if you specifically
      want to go to Disneyland however if you''re after rides and theme parks then
      Ocean Park is actually better.As a Disney theme park, it has all the great rides
      we love including buzz lightyear, carousel etc etc. There were long lines so
      we spent more time in the rides area they didn''t have in Orlando such as the
      Toy Story area and Jungle Book.It was easy to get to via the MTR (Tung Ching
      line, get off at Sunny Bay and you won''t miss the trains going to Disney) with
      the added bonus of catching a Disney train complete with the little details
      Disney are known for (e.g. mickey shaped windows).You can also buy the tickets
      from various MTR stations but we bought ours at the gates and there were no
      lines so we had no issues.","Hong Kong Disneyland has now been in operation
      over five years, and for locals, we''ve heard about a fair share of complaints.
      The reality is that HKDL is just as magical as any of the Disneylands, and has
      its own unique charms and attractions. You can read about all the attractions
      on the website, but for our family, we just love the East meets West meets Disney
      combination of it all. This is not the largest of the Disneylands, but we like
      that, too   very easy to enjoy the entire experience in one day   in fact, half
      a day if you don''t feel compelled to do everything. The food is particularly
      above average for theme parks, so that''s good   and not as expensive as you
      might guess. And the lines are very tolerable   it''s not uncommon to just spend
      5 to 10 minutes in line for any attraction. The only thing that might be a bit
      of a bother is the heat, but hey, this is the sub tropics. I''d definitely say
      this is a must do for anyone visiting Hong Kong, and it''s a great regular outing
      for locals. Also, btw, the staff and characters are exceptional   particularly
      good with children.","Splendid experience to HK Disneyland with 3 nights stay
      at Disney Hollywood Hotel that have awesome food","YES! a real fun, so visiting
      Hong Kong was a great opportunity to go and see this Disneyland as well. It  s
      really nice, a bit smaller than Paris but nevertheless a lot of fun and the
      whether was WAY better.","Admittedly, food in theme parks are not that cheap.
      If you''re looking for yummy yet not so expensive food around HK Disneyland,
      trek to the Starliner diner and grab some of those chicken wings. They are the
      yummiest in Disneyland! Hot french fries complete the tandem with this finger
      licking chicken wings. The serving is generous and can fill a hungry tummy.
      But if you have space for more, go for another round of these chicken wings
      while at Disney.","simply love this place as even adults will enjoy themselves.
      Of course being a themepark, everything is overly priced but that is nothing
      much you can do about it.. Staffs are all so friendly and my son loves chasing
      after Mickey and his friends for photo taking.. A must visit place especially
      parents with children!","We moved to HK when my son was less than a year old.
      Thus we have visited Disney land a number of times every year. He enjoyed it
      very much especially the rides like tea cups, an indoor ride with beautiful
      music and dolls called Small World, etc. The Lion King show is also a must for
      both kids and adults. The newly opened rides including train rides were also
      exciting for kids. Definitely recommended for families visiting HK to see at
      least once.Although smaller than most Disneylands in other countries, still
      need to wear comfortable shoes because it will require a lot of walking for
      parents and kids. Good news is that parents of children under 6 years or so
      could hire a push chair from the customer service desk so you they would not
      have to carry their children the whole day around Disneyland.","A dream come
      true even though a tad too late! I suppose better late than never. It was truly
      magical and surreal. We spent an entire day and only returned at night to our
      inn with fond memories. Even the train ride was fun with mickey''s head everywhere
      as logos. It was a long ride from Tsim Sha Tsui. We met all the disney characters
      and it was a great bonus to be visiting in December, as the whole park was decorated
      and adorned in christmas fineries. It was as if I was in a fairy tale. All the
      rides were fun but very long queues despite the fact that we went on a Monday.
      Be prepared to wait. I loved the Lion King show that we watched and the street
      parade which was like a christmas fiesta with fake snow!","Being a huge Disney
      fans my Mom and I were very excited to go to another Disney park! If you have
      been to Disney World in Florida do not expect the same thing. This park is much
      smaller and less extravagant but it is still amazing to see Disney in another
      culture. Getting there from the city was easy as they have their own subway
      stop (wait until you see their Disney themed subway car  it''s amazing). The
      rides were fun, the food was good and the gift shops was full of really unique
      souvenirs. Overall we had a great time! I think you would only need one full
      day there but we stayed at their hotel for a few days. Definitely a must go
      if you''re visiting Hong Kong!","Oh my!! This is the place that i''m looking
      forward when i''m in hongkong, most of my friends told me its a must to visit
      Disney. I get to hop on Disney MTR. Its was great feelings. Me and my date enjoyed
      ourself there.. we took all sort of ride. We both like a small kids when we
      were there. Get to experience watching all the Disney doing the parade and last
      but not least looking forward for their FIREWORKS. Its super awesome!!!!","I''ve
      been to a few Disney attractions in my day including Tokyo Disney. Compared
      to other Disney place it''s OK but not amazing. It wasn''t as busy as Tokyo
      Disney (I went on a Thursday in July, would probably be busier on a weekend)
      so I got to go on all the major rides I wanted, first thing in the morning and
      returning about 7:30 for the night parade and a last few rides. Yes you have
      to be careful with the timing, it''s busiest in the afternoon. If you go when
      it first opens (10am for ''main street'' shopping, 10:30 for the first rides)
      most of the minor rides have little or no lines. Use the fastpass for Space
      Mountain or Pooh.If you go in summer, the heat is PUNISHING. There is nowhere
      to sit and rest in the air conditioning   you''re either sitting in the heat
      (even in the shade it''s hot), or standing in the air conditioning (e.g. shopping
      or once the lines get inside the buildings). There is some indoor dining but
      of course they''re the expensive restaurants. The indoor shows were about the
      only chance to rest, sitting, inside. So anyway come prepared for the heat   plenty
      of water, loose clothing, sunscreen, many people use umbrellas for shade. BIGGEST
      TIP for the heat: buy one of those small handheld electric fans you can pick
      up at the touristy areas BEFORE going to Disneyland. Inside you can only buy
      a huge, heavy, expensive Disney fan.All that being said, I still had a good
      time. I''m glad I went to my hotel for a rest in the afternoon (get your hand
      stamped and save your ticket to return), then came back for the evening parade
      and a little bit of fireworks (left before it ended to avoid the crowd going
      home), even managed to sneak in two more rides right at the end (although many
      rides close early).Highlight for me was getting a photo with Chewbacca! Yes
      you have to queue to get a photo but it was worth it. I love roller coasters
      so my favourite hands down was Space Mountain (Star Wars themed) and the runaway
      mine car was also super fun.","When my sister and myself travelled to Hong Kong,
      the attraction at the top of her list was Disney Land. We are both adults and
      to be honest I could not think of anything worse. That   s where the negativity
      ended. Despite being a 32 yo male who likes heavy metal and nothing to do with
      Disney fantasy I had an absolute ball. I loved every moment of it and would
      definitely go back if the opportunity was there. Whilst there is a lot of rides
      and attractions that are targeted towards younger kids there is still plenty
      to do for adults to have fun. My favourite three rides were (In order).1. Space
      Mountain (Tomorrow Land)     I reckon we went on this ride about 20 times over
      the two days2. Big Grizzly Mountain Runaway Mine Cars     (Grizzly Gulch)     Lots
      of fun, try to sit as close to the front as you can.3. Mystic ManorWe had a
      two day pass and found that was just about perfect to see the entire park. We
      found during the day there was 30 60 minute wait on some of the more popular
      rides (we were visiting on a public holiday apparently). What we recommend doing
      is see as much as you can see during the day on the first day and then view
      the fireworks show on the first night. Then again during the second day see
      the remainder of the park you didn''t manage to see on the first day   night.
      Then on the second night, go on all of the rides you want to revisit or that
      were too busy during the day. Whilst most people will be queuing up to see the
      fireworks display the remainder of the park is very very empty with no waits
      on any of the rides.","A truly magical holiday   the park experience was great.
      Though it wasn''t a big park, but there were enough things to do and meet our
      favourite characters. One of the best things was the shows   not to be missed
      as well as the night parade which was really fascinating.Staying at the resort
      really gave it an overall excellent experience and this was an unforgettable
      holiday.","This particular Disneyland is a smaller version of the Anaheim California   There
      were however long lines of people waiting for all of the rides. The heat at
      this time of the year is unbearable. Two to maximum three hours is all that
      is bearable","If you have been to Euro Disney, Disney World Orlando or Anaheim
      Disneyland, you must agree that the one in Hong Kong is not worth to visit.
      However for HKD 450 one day ticket, I would say:   not too bad.  The park is
      a lot smaller than Magic World Orlando or Euro Disney, and the variety of attractions
      are also very limited. Oh the Lion King Show is also worth visit. I really enjoyed
      the bi lingual performance (Cantonese and English). But the 8 PM fireworks in
      the Sleeping Beauty Castle is a MUST SEE! I think they did a great job with
      the fireworks, better that what I saw in Disney World Florida nor EuroDisney
      in France.","I have been to many theme parks, this is the worst!They have more
      retail shops than attractions. You hardly see any other tourists from other
      countries except those from China. This Disneyland seems to be only suitable
      for mainlanders. This theme park has no queuing order, staff are not well trained.
      There is not enough shelter for visitors to take a break especially in Summer.
      I can''t imagine if it''s rain, where can the visitors go? There is no staff
      to control the queue, mainlanders are cutting queue as usual. The park do not
      control the total number of visitors for the day, it just seems over crowded.
      Waiting for a single attraction takes more than an hour. You just waste all
      your money and time waiting and waiting then you got to find out that they have
      a system called ''Fastpass''. Those visitors who got Fastpass can enter first.
      This is really ridiculous as who on earth a first time tourist will know where
      and how to get a fastpass? The park is small and for the services they provide,
      it just not worth the price and live up to the name of Disneyland.The MTR station
      also did not provide enough ticketing machine for visitors to purchase tickets.
      The stupid machine only accept small notes and coins. There is no staff to help
      you. You have to wait another hour queuing to finally get your train tickets.
      The train station equally sucks!Overall, you just felt like after they took
      your money, they just leave you to die. They don''t even care if you had fun
      or can go home safely.My final advise; this park is only suitable for the locals
      and visitors form China. Don''t even think about it.","My daughter and I had
      a magical two days here celebrating her 13th birthday, travelling all the way
      from Sydney, Australia!Right from the time we entered the park on 30th May things
      were lovely. We loved the photographer who took our photos at the gate and later
      again on Main St. Her name was Harley and she made our buying the photo pass
      well worth it! The photo lady at the Winnie the Pooh ride was also really helpful,
      explaining how the photo pass worked and getting all of our photos downloaded
      onto the app on my phone. (She also helped me download the app and helped me
      sign up.) It felt so great to see the professional photos from that day and
      even breakfast all there, safe on my phone! I wish I could mention her name
      too!Although we were just able to do all of the rides in one day (we went mid
      week out of school holidays) we also needed a day to line up and have photos
      with characters. My daughter loved meeting Piglet, Winnie the Pooh, Eeyore,
      Cinderella, Aurora, Chip and Dale and Minnie and Mickey. Just be aware that
      the lines always seem to be really long for Minnie and Mickey and you have to
      be early and quick for the princesses (except Princess Sophia as she doesn''t
      seem very popular at all).We had 12 fast passes for two each from our hotel
      (Disney Explorers Lodge) but we only ended up using 5 of them because there
      was not more than 5 minutes wait time for any ride apart from Winnie the Pooh
      and the Parachute Drop. We did use them for the Winnie ride because my daughter
      really loved it. We really loved being near the It''s a small world ride early
      in the day when no one was around. I love that It''s a small world and Winnie
      the Pooh are air conditioned. We also especially loved the Mystic Manor ride
      (also air conditioned).We took our own water bottles in and loved our meal at
      the Plaza Inn for my daughter''s birthday. (We booked in advance but it was
      not busy.) The pork fillet was delicious. The other evening we ate fish bites
      and chips in the cafeteria at Tomorrowland which was pretty standard American
      food but at least it was air conditioned and quick. We also had the incredibly
      cute donuts which my daughter loved eating.We knew the castle was being renovated
      in advance but the Main Street photographers still managed to get nice photos
      of us with it. Main St was pretty much deserted about 3pm the Wednesday we were
      there so we got some great photos! Again, thanks to the lovely photographer,
      Harley!Well worth visiting, especially if you are from Australia as it is not
      as far as the USA. Thanks, Hong Kong Disneyland, for a magical visit!","We visited
      in November and was decorated ready for Christmas , the lines were quite long
      for most rides about 1 hr  But that   s to be expected,all great , clean and
      very Disney.","This is my second visit to Hong Kong Disney. I remember it being
      not remarkable the first time (many years ago). But, this time, I think it is
      worth the price of admission and a great getaway. There''s several Hong Kong
      only rides that you have to do. Comparing to Shanghai Disney, I prefer this
      one a little more. We spent two days here and could have stayed a little longer.
      So, if you are a Disney fan, do not count this Disney as the little one. It
      has pure Disney heart.","Awesome experience ! You find yourself in the dreamworld
      with beautiful artificially constructed squares and buildings, amidst the cartoon
      creatures you have admired for long. There are many fun rides. I have always
      stayed away from swings due to motion sickness , so was a bit apprehensive about
      the rides. But these rides are comfortable and amazing. For a photography lover,
      the place is a paradise. You will get abundant of pics to keep on updating your
      facebook profile pics everyday for a month the parade (twice in the day) at
      3 pm was an out of the world experience with all your favourite characters with
      many dancers and performers passing in front of you, waving and even shaking
      hands with your kids. The fireworks at about 9:15 pm are amazing. Though it''s
      not something new for the indians as the festival of Diwali is celebrated every
      year, yet the way it is managed and arranged is extraordinary. You can''t think
      of visiting hongkong and without visiting DISNEYLAND.","Must must visit for
      everyone from all ages. The rides are not adrenalin fascinating but lion king
      musical and few other rides are recommended.","Lot of constructions on the way,
      tones of visitors inside the souvenir shop without crowd control. Almost 30
      mins line up on cashier check out.","Having read so many negative reviews of
      Hong Kong Disneyland I am somewhat at a loss: how can you sincerely not feel
      that palpable magic that (like all Disney parks) fills this place, leaving an
      almost perceivable shimmer of fairy dust hovering at the edges of your vision?
      At least the vast majority of people have their heads screwed on straight as
      the consensus seems to be that this Disneyland is truly a wonderful, magical
      place where (just maybe) a dream or two might come true.One of my favourite
      things about the Hong Kong example is, though actually the smallest park worldwide,
      it offers several absolutely awesome attractions that can''t be found anywhere
      else. Apologies Haunted Manor fanatics but Hong Kong''s take on the ride (dubbed
      Mystic Manor with Albert the cheeky monkey) is far better and has slotted itself
      into my top five ride list. I also loved the Big Grizzly Mountain Railway   it''s
      a similar rollarcoaster to Expedition Everest with it''s backwards fall and
      very fun.Tuesday is my rule of thumb as always: a magic day where, time and
      time again, you find an almost empty park with shorter wait times (if you wait
      at all) and a generally less crowded park. If you can''t do Tuesday try Thursday.
      Avoid weekends and public holidays if at all possible. I am not exaggerating
      when I say that going on Tuesday meant we never waited longer than 15 minutes
      for anything   an unusual theme park experience and a great one.As anyone who''s
      been in Hong Kong for any period will likely know, the locals idea of manners
      generally are very, very different from typical western courtesy. Don''t be
      surprised if people push past you in lines intentionally and shows become a
      free for all push feat in the effort to attain good seats. Don''t let it put
      a damper on your day: you''re at Disneyland after all. But it''s probably gonna
      happen so be prepared.The opening hours for Hong Kong Disney are reasonable:
      usually around 10am to 8pm. As it''s a smaller park you shouldn''t have any
      trouble seeing everything. We certainly didn''t.The food here is reasonably
      priced and fairly decent for theme park fare. I''d recommend opting for a sit
      down meal in one of the restaurants   they''re slightly more expensive but the
      food is considerably better and it will give you a much needed opportunity to
      take a seat and rest your feet.I personally found the vast majority of staff
      here to be quite upbeat, pleasant and what you''d generally expect from Disney.
      My husband and I are passionate pin traders and it was as easy, fun and fabulous
      as it generally is. Almost all of the pin traders and shop assistants gave us
      free stickers (sometimes for our favourite characters specifically). We had
      about 100 by the end of the day, which was a nice way to cap off a perfect Disney
      day.Honestly I thoroughly enjoyed Hong Kong Disneyland and I''m sure if you''re
      a Disney fan you will too.","If you''ve been to Disney parks in the USA, then
      the Hong Kong park will be somewhat disappointing because it''s simply not very
      big. Unless you''re hit with long queues, you''ll get through the park easily
      in one day, doing all the attractions.I went on two mid week evenings during
      early November 2015 and there were zero queues. (Tip: On empty days, take the
      single rider queue on Grizzly Mountain to avoid the cattle like queueing systems
      and head straight for the ride.)Fastpass is only available for Winnie the Pooh
      and Space Mountain, but were not useful during my visit due to the absence of
      queues.Some rides were closed (Jungle Cruise), some were being built (Iron Man,
      Mickey''s Storybook) and some close at night (Tarzan). I missed Stitch Encounter
      because it alternates languages (English, Chinese) each session and the last
      English one had already started for the evening.The fireworks show above Sleeping
      Beauty Castle is a good closing to the day''s activities, after which you can
      join the throngs of customers in the Main Street shops.There''s a handy MTR
      train station, which means you can get yourself to from the park from downtown
      Hong Kong. I stayed at Disney''s Hollywood Hotel, but the size of the park does
      not really justify staying on property. Nonetheless, take a look at the hotels
      if you have an opportunity... just follow the Park Promenade from the transport
      hub, or hop on the frequent shuttle buses.","I have visited the Hong Kong Disneyland
      multiple times and to me, everything has always stayed as ''fairly good''. My
      family and I always chose to take the MTR for not only it is cheaper than taking
      a cab there, but we''d get to ride the Disney ''monorail'' which has Mickey
      shaped windows and handles, some statues of characters as well as comfortable
      couch seats (of course it is quite different to the one in Anaheim and Orlando
      by exterior and maybe interior if I''m not mistaken). We''ve been to the park
      both during vacation season and not, but our recent was during Vacation.Firstly,
      we realized was that it was slightly overcrowded than usually (which is always
      peaceful and literally a no wait for rides during off vacation season) People
      were slightly pushing but I cannot complain much about that since it''s, I would
      think, the same in every theme park. When we got to the gates, the lines were
      not long and the cast members were welcoming. Usually in the mornings, there
      will be Mickey and Minnie just outside of the City Hall for meet and greets;
      ALTHOUGH, I highly recommend you to skip that and go on straight to the rides:
      they can be found again at the Characters garden which you can also meet Mickey''s
      other pals. Don''t waste your time at the beginning of the day.Secondly, this
      is a little trick I always use when visiting the Disneyland parks. People would
      often go and head on over through Cinderella''s castle and go straight to Magic
      Kingdom; therefore, instead of going straight through the park, head on over
      to either Adventure land first OR Tomorrowland. The rides in those areas would
      often be shorter earlier due to people going straight to MK. In addition, while
      you''re at Tomorrowland, quickly grab fast passes for the group for Space Mountain.
      The line for that fills up quickly as it''s one of the most popular rides. If
      not all the party wants to go on, use their tickets to get fast passes anyways
      and you will be able to use it instead (ONLY DO THIS IF THEY DONT PLAN ON GETTING
      FAST PASSES FOR OTHER RIDES) Fast Passes really helps your day on getting on
      rides, but there are certain ones that don''t support Fast Passes such as Autopia
      and the Famous Spinning tea cups.Lunch time? Take a walk down Main Street USA
      and find a little food corner where you can get some grub. YOU ARE NOT ALLOWED
      TO BRING FOOD INTO DISNEYLAND UNLESS THEY ARE LIGHT BIGHTS SUCH AS COOKIES AND
      CRACKERS. Which is a slight bummer because the foods inside are slightly pricey.
      I recommend getting the famous Turkey leg. It is totally worth it. It''s pretty
      big for a child or if you''re not that hungry, but if you are, you will definitely
      finish it. The food corner is located next to the bakery which you might want
      to visit for desserts. After your meal, it''s also a great time to go shopping
      for souvenirs. If you are staying at the resort, you can most likely get it
      sent to the hotel, otherwise, if you don''t want to go shopping now, the souvenir
      shops close later than the park closing time, so if you would rather go after
      park hours, you are more than welcome to do so (although, it could be pretty
      crowded). Finally, those printed photos from Disney are PRETTY expensive. I''ve
      only gotten a couple of those pictures on my first visit. Never getting those
      again as they are overpriced. If you don''t really need those printed photos,
      don''t get them. Bring your own camera and you can always photoshop them so
      they''ll look like the parks photos (;Overall, Disneyland is always a wonderful
      place to visit w  friends and family and I''d go back there any day.","Having
      visited Disney World, Disneyland and Paris Disney this pakl feels very small
      with very few rides and entertainment. Food is very expensive and terrible.
      This was my second time to this park and I will not be back!! One of the things
      that really...More","I''ve been to several Disneylands including the one in
      Anaheim and the one in Orlando. My fair warning is that if you''ve been to these
      two, don''t expect much. The one in HK is a small, compressed version of the
      Disney experience. But of course, it''s always fun to feel the tingling, giddy,
      magical butterflies in your stomach that only a Disneyland franchise can bring
      out. It''s not the biggest one out there but if your are from the ASEAN region,
      it''s the next best thing. But if you have the means to go to the ones in the
      Western side, go for that one. Best time to go: October December. Not too hot,
      and not too cold. Just about right!","Such a divine day out, best to get there
      at opening time to avoid the afternoon madness. Hire a stroller for the kids
      and you are off. We love going to Mystic Manner and Toy Land the most and then
      on to Its a Small World and the main rides in the middle. Best to go when not
      so hot as no shade from the sun unless inside shops or restaurant. The parade
      is fabulous too. Kids love it every time and so do I!","My wife and I (then
      engaged) went to Hong Kong Disneyland in 2006, just a year after they opened.
      This year, for our anniversary, we came back to Hong Kong. All the things you
      could find fault with the old Hong Kong Disneyland are gone, and this is every
      bit the classic wonderful Disney experience! Rides and shows are adapted seamlessly
      to English, Cantonese, and Mandarin. Characters are everywhere. The fireworks
      and parades are incredible. Go in order to be immersed in the world of Disney!","We
      went there late already 3pm, and we were stuck in Tomorrowland until the rest
      of the day. We spent entirely our time on the long queue , of course, with the
      stars of the land, photo op with Mickey and Minnie Mouse. But our son, even
      us, enjoyed the sites, the rides, the parade and lastly the fireworks. Just
      prepare your feet for a very long and briskly walk especially going back to
      the train station going back home, the station is crowded, be sure to get there
      first.","The happiest place on earth ! Smaller than other Disney Lands but it''s
      always great fun ! I love the Lion King show and the parades . The night parade
      is always popular. Bring a padlock for your pushchair though !","We really loved
      our time here. The  cast members  were so helpful and kind. We went twice, both
      on weekdays. I can''t imagine it being more crowded. Lots of people!!Pros: Loved
      the Lion King show. Be sure to go see that (or any other show for that matter.  Kind  crew
      members . They would take pictures with your phones. LOVED that!!! Frequent
      opportunities for pictures with characters.  Loved the main strip... especially
      the afternoon parade. Don''t miss that!!!! The evening fireworks are great.
      We went for Christmas and they even shot out fake snow onto the main strip.
      My little girls loved that.  Decorated well for the season. Cons: Price! So
      expensive. Nearly everything costs something. There''s a lot of commercials,
      too. They make you exit via gift shops. That''s common for a park, but not after
      individual rides. You''d think the high price of admission would cover other
      things. But I guess that keeps away the masses.  it''s DisneyLand in Hong Kong.
      Where is Mulan?! Seriously, Disney... how was this overlooked? Maybe she''s
      in ShangHai, now that they have a park there.  I had high hopes for the Toy
      Story part. Wasn''t very good, especially for small children.","The park opens
      around 9am so be sure to visit early to avoid long lines and crowded attractions.
      For first timers, I suggest you grab a map so you don''t miss any attraction
      or ride. Meet and greet Disney characters and have your photos taken with them.
      Expect to bump into Mickey and Minnie Mouse, Goofy, Pluto, Donald and Daisy
      Duck, Chip and Dale. Enjoy Main Street Entertainment as a musical band offers
      lively New Orleans style music, and Disney Characters amuse everyone with an
      interactive celebration in Flights of Fantasy Parade. Make all of your storybook
      dreams come true by exploring the fairytale adventures in this enchanted land.  My
      visit to Hong Kong Disneyland is definitely one for the books! We missed some
      attractions and rides but we more or less experienced majority of the theme
      park''s best attractions and highlights.","I am not a fan of Disney but found
      myself getting into the mood, had great fun my 6 and 8 year olds getting on
      all the rides. Get the two day ticket if you have time as its only slightly
      dearer, recommend a morning on one day and evening on another day. But you must
      use it within 7 days and its not transferable.Only negative I have is watch
      out for people trying to jump queues for the rides, they get one person to queue
      then a big gang will suddenly arrive and push past everyone to  join their family
      or friend ... I blocked them wouldn''t let them past, they will give up when
      you look them in the eye and just say NO. Also be aware of pushy adults who
      arrive late to the parade then will just stand infront of your kids or push
      their kids past your to see the parade. A lot of rude parents and spoilt kids...
      Just keep your clam and don''t let anyone push past. Other then that its great
      and even I had fun.","First off it was a stinking hot day, I think more shade
      may be needed. That said my wife and I had a great day, a lot of fun for us
      oldies in our 50s. Yes it was expensive but all these places are. A great day
      out, thank you HK Disneyland.","True Disney style, very clean, staff helpful,
      magical and great.Our daughter (7) isn''t into all the big rides yet, but still
      had an awesome time! Yes park is smaller and only a couple of big rides, but
      they appear to be building new attractions...Family has been to Paris, and me
      to LA, I haven''t noticed before the art class (drawing lesson) of Mickey Mouse,
      this is in Main Street on the right hand side looking towards the princess castle..
      This was awesome even though we did not understand what they were saying (Chinese
      ) but was able to follow the drawing.Meals great, great seeing veggies and rice
      and noddles instead of junk food! Thought this was great.The paint the show
      was very clever, and miss K wand was able to change the lights on the parade
      at night.We visited in December and loved the christmas decorations everywhere.One
      happy family. Thanks","more directed for the very young. entrance fees was bit
      expensive about 144us for 2 adults and 1 child, however the subway system is
      very clean and quite extensive and it cost for 3 passengers from TSIM SHA TSUI
      Kawloon to Disneyland and return about 5 us bucks","Very well organised and
      the some of the rides like World is a small village, Pooh etc are too good for
      young kids","What can one say except this is Disneyland after all. Magical place
      for the kids but bear in mind that HK Disneyland is way smaller than the one
      in LA!","Disneyland had always been a dream to visit since a small child and
      it didn''t disappoint. Great place for kids (no matter what age). All the worlds
      had something for everyone. Be prepared to wait for some rides. Food and drink
      stalls everywhere with plenty of bathroom facilities.","I live in Hong Kong,
      have a 3 year old princess obsessed daughter and we have annual passes. We always
      have a good time, but tend to only stay 3 4 hours in one go. There are a lot
      of great rides for young children, not tried the bigger adult rides, but there
      are only a handful. The staff are young, pleasant and very organised. Obviously
      expect to queue and avoid Chinese holiday periods if you don''t want to exacerbate
      the queueing experience. Things can get a bit pushy at times, but take your
      patience with you and its worth it. Its worth going in the evening at about
      4pm onwards, queues are shorter, looks pretty at night and the fireworks are
      good. I haven;t been to any of the other Disney parks and would stay a mile
      away if it wasn''t for my daughter, but it is a magical place as the marketing
      goes and worth a day trip if you have more than a few days in Hong Kong.","I
      wasn''t expecting to be blown away, but I still think that disneyland was a
      little too overpriced for what''s there. The park is quite small and there''s
      not tonnes to do and see, but maybe I should have gone with kids for a better
      value day!","I recently visited HK Disneyland for the second time in March 2017.
      A large percentage of the venues were  under maintenance . We were disappointed
      there were so few rides to go on and most importantly, they no longer have curry
      popcorn! I was shocked they had discontinued this, the curry popcorn was out
      of this world! We aren''t so much into the characters anymore, but I can''t
      recall seeing any characters walking around either. It hardly felt like Disneyland.
      Next trip to Hong Kong, we''ll stick with Ocean Park.","I went to the HK Disneyland
      for a day with my family. If you''ve been to other parks, such as Paris, Anaheim,
      Orlando etc, it wont seem worth it in my opinion. If you have teenagers, i''d
      say over the age of ten, there may be 3 rides they''ll really enjoy. There are
      many rides for small children though. The park is very small compared to the
      others. There are some good food stands and restaurants in the park. It is pretty
      well put together, and Main St. is amazing as in the other parks. Fireworks
      were great. I woud go on a monday or something, and off season is better as
      holidays and peak season its very busy. I would recommend this park for smaller
      children, but not nesecarilly for older kids.","Having been to all of the Disneylands
      (except Tokyo), I find this one to be small but manageable. Our family of four
      went in late December (but not on a weekend) and the crowds were manageable.
      If you are looking for big rides (like the Disneyland in Calif or Florida),
      you will not find it here. HK Disneyland incorporates some of the attractions
      from the Magic Kingdom (Philharmagic   which is one of my most favorite attractions
      in all of the Disneylands) and the Lion King show (from Animal Kingdom). The
      Golden Mickeys show was a lot of fun and enjoyable. HK Disneyland doesn''t have
      the rides but it has show and entertainment. Even the rides are toned down (compared
      to the US like Space Mountain).What did I like about it? Since it was smaller
      (only 2 fast pass rides), the price was lower and the food was very affordable.
      You could buy a whole fried chicken dinner (including drinks) for HK$50 (US
      $6). When we were at the Paris Disneyland earlier this year, even a small hot
      dog was 10e ((US $15). Plus the service at Paris Disneyland was atrocious (see
      my other review). The admission tickets were much lower than the US and France
      also. It''s a relief to not be gouged at this Disney Park. The customer service
      was excellent   cast members were responsive to my questions (directions, merchandise
      in the stores etc). The cast members even help you carry your food to your table
      and clean up (bus all your plates) for you at these fast food places (with a
      smile). The food was not your normal theme park food   there were noodles, won
      tons, pork chops, chicken wings etc.(along with American food too) .Since I
      have been on many big rides at the other Disney parks, I did not miss them   plus
      I enjoy shows. Small World was very cute   it had all the characters from the
      Disney movies and it was decorated for Xmas. The cast members gave each guest
      a disposable pair of glasses to view the lights on Main Street (and all the
      lights twinkled when you used the glasses).What didn''t I like about it? You
      have to take 3 different subway trains to get there (from Causeway Bay you switch
      3 times and it take about 45 minutes to get there). Going back when the park
      closes (which is right after the fireworks) is a nightmare because everyone
      is trying to get on the subway train (most people in HK take the subway there,
      they do not drive). The park should try to have the fireworks earlier so that
      people can leave before closing time. There are only 3 lands, not 4 lands to
      visit so it is much smaller. The subway train from Sunny Bay to Disneyland was
      so magical   it had Mickey windows, plush seats and the ring holders on the
      rail were shaped like Mickey.All in all, an interesting and pleasant Disney
      Park.","Been to Hong Kong Disneyland twice. First was in 2007 and the second
      time was 2014. It was the most happiest days, as a kid i really dream of coming
      to Disneyland and it do came true. It was an amazing experienced. Although their
      rides are mostly for kids, adults can enjoy too. Love their fireworks. Fireworks
      are their finale before closing except during rainy days. The parades of characters
      such as Mickey and friends; and princesses are the main attraction. The place
      offers joy not only for kids but also for adults.","We had a good time at DisneyLand.
      We enjoyed the fireworks the most. Do not miss it, it begins just after the
      park closes.","What''s not to like about Disneyland? I felt like a little girl
      again the moment I stepped on Disneyland. My childhood fave characters are brought
      to life. Plus there are special areas for every Disney story. I totally love
      Toy Story rides! I''ll definitely go back, this time with my lil girl.","Disney
      is a place for all ages.the highlight of the place is the parade.the characters
      are so realistic and colourfull.there are a lot of interesting rides.the show
      at the fantasy land is worth seeing.once everytime the charcters  pop out and
      you can meet them now...More","Disneyland is the Happiest Place except for buying
      souvenirs and stuffs . But I can say that this place will make you make you
      want to be a child again . A place that you should not skip on visiting while
      you   re in Hong Kong. This is my 2nd time to visit but still I can   t get
      enough of it. The experience of singing with the casts while they are dancing
      and you dancing and swaying with them. And that feeling of disappointment when
      you got the unexpected selfie with pluto but the camera was in a 10s mode","the
      park is small compared to US attractions, but the atmosphere and service were
      excellent.  We also visitecTokyo Disneu and can''t wait for Shanghai!","value
      for money, easily accessed by metro train, queues not too long for rides","  a
      lovely and magical place, but the weather was sooo hot. However, didn''t stop
      us from visiting each and every parks in it  my first Disneyland experience,
      so I don''t know how to compare with the other Disneylands   the staffs there
      are nice and polite","If your a Disney Dork you will appreciate park and its
      twist on Disney. The park is very small, you could easily do the whole park
      in half a day so I wouldn''t be comparing the park to California or Orlando...
      or even Paris. If you know your Disney Parks you know they love lining queuing
      you up for rides and shows. At this park while waiting to see Festival of The
      Lion King show there was nothing like this to keep people in line no staff and
      ropes as soon as the doors opened to theatre everyone was pushing and shoving
      (which is not in the Disney spirit).Festival of The Lion King was absolutely
      amazing and personally think its better then the one in Animal Kingdom in Orlando.The
      one thing that bugged about this park is there wasn''t Walt Disney statue.Would
      definitely recommend it to people!","This was our first time to visit Disneyland
      and it was magical! Definitely brings the child in every one. Even if all of
      us were adults we still enjoyed seeing Disney characters, princesses and taking
      the rides. I even dared try the Grizzly Gulch ride which was for me a nerve
      wracking experience but it was fun.Food and souvenirs inside the park are much
      too expensive for our budget so we made sure to eat before we went there. Overall,
      it was awesome. Make sure to wait for the parades, one in the morning, afternoon
      and the finale, Paint the Night where you''ll lots of beloved Disney Characters
      on floats.","For those who have been to LA or Florida, one day here will be
      enough. It is a real Disney   clean, friendly staff, regular favourite rides   but
      be ready to experience the stifling humidity. Try and ensure you have the option
      of the swim available at then end of the day; also be warned that inclement
      weather caused the cancellation of the night parade both nights we were there","This
      Disney land is a pore copy of the real Disney land in America. The rides are
      very short and have to wait in queues in stifling heat for 20 minutes until
      you get inside for another 20 minutes wait in the air con then a 60 second ride.
      At 358 hkd it is not good value. I won''t be going back.","We have been to Hong
      Kong Disneyland a few times already but we still want to come back. Why? Because
      there are rides we were too chicken to try the first visits that we finally
      had the courage to try and we ended up loving them. We love the Big Grizzly
      Mountain ride. We thought it will be too scary but we love it now. Will be back
      again!","It is small with significantly fewer rides than Disneyland CA, Disneyworld,
      or Eurodisney. Other than the food you would have no idea that you are in HK.
      even the t shirts are boring: put on Mickey and then add  Hong Kong . Space
      mountain was here is a line, wait, here is the ride. That is it. Nothing to
      entertain while in line. Sterile. The Lion King show was the best part of the
      visit.Save your money and skip it.","Small and dated. Poor facilities. Young
      children will enjoy the place. The food is very expensive...","It''s the smallest
      Disneyland. Really nice for younger kids though. Gift shop and their signature
      fireworks, princesses and figures, any essentials from Disney they have it all,
      just to a smaller scale and size. The restaurant is particularly good with food
      allergies. We were really impressed by their consciousness. They took extra
      mile to ensure the food is safe for our kid with allergy. Highly recommended
      if you are visiting Hong Kong.","All the wonderful amenities expected of Disneyland.  A
      much smaller park, but has some really fun rides.  Definitely go on Big Grizzly
      Mountain and Hyperspace Mountain.","Went here in April 2013 and I was not impressed...
      or more like disappointed. Getting there is so easy, just take the MTR to Sunny
      Bay and change to the Disneyland Express. Journey takes about 30 minutes from
      central Hong Kong. The train is fab and so is the station and the entry... but
      that was kind of  it  for me. It was a cloudy day, not much people and no real
      queues to talk about but it took us approx 20 minutes to get tickets to get
      in, then there was the security line to check the bags. Not a problem but I
      can imagine the chaos on a busy day. You walk into Main Street and well.. its
      a street full of shops selling Disney merchandise and sweets... even the bread
      is sweet and finding anything else became a challenge. We saw Mickey and went
      to get a picture just to get told that the waiting time was 1.5 hours so we
      gave up. We worked our way around just to find 3 of the major attractions  closed
      for reconstruction   sorry for your inconvenience ... doesn''t help me when
      I paid almost $70 AUD to get in. Where was the signs at the gate that some attractions
      are closed?It doesn''t really take a lot of time to walk around, I was looking
      for Disney characters or themes, but I found it scarce. All day I saw Mickey
      once and Minnie once as well and that was it! Its supposed to be like walking
      into the  World of Disney , but this was more a  sell as much Disney merchandise
      as we can , a few half bad attractions on the side and some nice gardens. Another
      thing were the waiting times... as I mentioned, it was a slow day, not many
      guests but the wait was still about 15 minutes on most rides... as said before,
      I don''t want to be here on a good day... I have to say that the Gulf was a
      really good ride but the rest of the ones that were open I could do without.
      I think that if you have young children and you don''t mind lining up and waiting
      it could probably be a fun day out, but not for the older ones. To me it was
      more of a half bad amusement park.","This was such a fun day! The characters
      are all mimes so they don''t have an odd accent. Every ride is in English with
      English speaking actors. The ques aren''t too bad except for the Winnie the
      pooh ride which is really long! The heat is not ideal for ques. Every ride has
      had a lot of thought go into it, almost identical to Americas! Such a great
      day even the train there is decorated in Disney : )","Amazing place for everyone
      to visit.The concept and the rides along with the shows are awesome.The Mickey
      stage show and the Amazon river ride were fantastic.One can spend an entire
      day here and still miss some of the things this place has to offer.","Great
      day out .....granddaughter had an absolute ball.  great main street parade and
      rides for the kids  as expected food n drink a tad expensive   Pleant of spots
      for us oldies to sit and relax","Disneyland Park is great. Lots of fun for everyone.
      I wasn''t impressed with the cost of food items though. We ate one night at
      the Chinese take out restaurant. We were famished otherwise I don''t think we
      would have eaten it. We chicken was not recognizable and the japanese terriaki
      did not taste like terriaki at all. Sorry! Would be nice to have more affordable
      food since we pay so much to get in the park.","by no means cheap, but great
      entertainment for the young and young at heart. Do not bother to eat the crappy
      fast food in the park it is dismal, but the hotel food was very good. Will go
      again","We caught the train here and had a lovely day with our youngest grandchildren,
      their parents and other grandparents.Despite the rain nothing dampened our spirit.
      I screamed my way around the roller coaster, shot down baddies on the buzz Lightyear
      ride and were transported into fantasy land on another ride. We also took the
      boat trip and our three year old was captivated by the frozen show and her chat
      with tinker bell. Even my reluctant husband enjoyed himself. I bought my tickets
      through Trip advisers aviator that enable us to fast track entry. The others
      paid a lot more through the travel agent and had to line up to exchange their
      vouchers.A fun day","A pain. Over expensive. Over cheesy, touristic rip off
      in one centre. Felt like my entire life   s savings were being squeezed out
      of me. Ok for the kids but even they got bored of stuff too quickly. Needs rethinking","Disneyland
      in Anaheim felt like a magical place. Everyone was so happy and smiley it really
      felt like a magical other world. Unfortunately, you don''t get the Disney magic
      here in Hong Kong. The staff are helpful when approached but it''s not in their
      nature to be magical.The park was small and easy for our young children to navigate.
      We went on a Monday and Wednesday and it was a lot quieter in the middle of
      the week.Lots of tourists from the mainland who, unfortunately, did lots of
      queue cutting and pushing and shoving. One old lady quite aggresively pushed
      past my 3 year old to get a seat in the 3D show, and the auditorium was only
      half full.","My wife and I visited Hong Kong Disneyland yesterday. It''s an
      amazing place with great rides, attractions and atmosphere. We visited on a
      Friday and boy was it crowded. I shudder to think what it would be like on the
      weekends. We could only last 5 or 6 hours there though because it was just so
      hot. Nothing the park can do about that   but I suppose my suggestion is that
      if it''s an option then try to avoid going in the hot summer.The park has many
      attractions and I would say it would take at least 2 days to see it all if you
      were so inclined. Getting in there is easy   take the MTR.","Visit to HK Disney
      was fun and nice. we visited in Jan, which was great as the weather was lovely
      to be outside, not to cold, but not to hot either, a nice cardi would suffice.
      The park is similar to the ones I''ve visited in the US, but its tiny in comparison,
      so 1 day at the park would suffice. This is of course if you are living at one
      of the nearby hotels, then its very convenient to hop over the next day. The
      park is clean and there are not many people during the weekday (when we visited)
      which was so freaking awesome! Because this means no Q. Shows are mostly in
      dual language which can make the showtimes twice as long, but we didn''t have
      much to complain about. Would recommend for people who want to visit Disneyland
      but don''t want to travel all the way to the States.","We enjoyed it, moreover
      our kids that really love Disney''s character. Though the rides are common (you
      may find the similar rides elsewhere), but still we enjoyed it because it is
      in Hongkong!","Last year we visited Disneyworld in Florida with our 8 year old
      in June and its huge offering would have needed a full week to enjoy. This time
      our visit to Hong Kong Disneyland over Christmas was a lot more relaxed. For
      one thing the Park is far smaller, more compact and less crowds and lining up.
      Also the weather was perfect, whilst winter, it was a mild 21 degrees most days.
      I wouldn''t recommend going in June which in Hong Kong (like Florida) is just
      stifling hot and humid.Disneyworld is easily accessible by MTR from Hong Kong
      central. After two days we had been on most rides. Thankfully the new new Ironman
      ride had a soft opening and it was great, incorporating the Hong Kong skyline
      into the ride with great effect. The other rides were good and our 8 year old
      had a great time. There is a wild Star Wars roller coaster ride as well but
      not much else of Star Wars other than the Jedi Training academy and a lot of
      merchandise. The evening fire works also were fun.The great thing is for an
      Australian, Hong Kong is only 9 hours flight away and in Aussie time zones compared
      to the US with both Anaheim and Orlando big flights for kids.We will now only
      go back to Disney once the new Star Wars worlds are open in the US, that will
      be worth travelling for!!","Visiting Disneyland is dream for Kids & adults as
      well. We visited earlier in Paris but first time for my boy. The Disney train
      is really really lovely. Unfortunately during our visit the Main castle was
      closed for renovation & many other rides were closed due to Typhoon hence had
      limited choice. Even in evening the fireworks was cancelled & replaced with
      Parade which was good.Too small compare to the one in Paris with two attractions
      Disney Park & Studio but still good.Suggest to book ticket in advance preferable
      online at discounted price.","Disney has the magical ability to turn everyone
      into a small child once again. Everyone told me Disneyland HK is really small,
      but I found this to be a plus instead. The attractions and rides are positioned
      close to each other, and you don''t have to walk long distances just to go to
      the next one. Even then, we could only cover 70% of the park on our first visit.
      Glad we had the two day pass, so we could have a relaxed pace on our second
      visit.Tips:a) Best to visit on a weekday when it''s not raining. We had an average
      wait of 15min on most rides, stretching to 30min on popular ones.b) Go early!
      Generally they allow visitors into Main Street 30min before the official opening
      time. That''s when you can join the queue to take photos with your favourite
      characters. They do have a number limit, so you may miss out if you go too late.c)
      Plan your day by getting a copy of the park map and show times. (2 different
      leaflets)d) If you don''t mind missing out on that photo with Mickey or Snow
      White, then my advise is to cover the popular rides first! Look out for attractions
      with FP (fast pass) marked on the map. These are the ones with the longest queues.
      Example: Winnie the Poo, Space Mountain. The main crowd comes in at 11.30am,
      so beat the crowd!d) Generally, try to arrive for shows 20 30min before. There
      are no best seats for Festival of the Lion King show. The best position to watch
      the Flights of Fantasy Parade is facing Sleeping Beauty Castle, at the circular
      lawn area. The best place to watch the Christmas tree light up is of course,
      closest to the tree.e) Grab a takeaway dinner at Main Street right after the
      Christmas tree light up. Everyone will park themselves back at the Sleeping
      Beauty castle (circular lawn) right after the light up. Enjoy Disney Paint the
      Night. If you have a good seat, don''t leave it. Somehow it has become a norm
      to wait in front of the castle (1 hour) for the fireworks. So if you lose your
      seat, you''re quite unlikely to get it back. The place fills up quickly.Love
      Disneyland. Enjoy!","Went there with some friends. I was hugely disappointed.
      Having been to the one in Tokyo, which was great, I was not expecting this to
      be better. But it was worse than I thought. Long lines everywhere. Yes, I know
      this is Disney Land. The worse is the locals seem to think it is OK to cut lines
      anywhere they want. Even worse is the park authorities allow it! Also, it is
      not clean. Would not come back again.","What can I say, It''s Disneyland! Over
      priced tickets, food, and souvenirs, Over crowded with people. Wait in line
      for hours (although going through the single rider line is great) for a 2 minute
      ride. But where else can you have this kind of fun? Going as a child years ago,
      and then going now that I''m older, it''s fun to see what has changed and what
      has stayed the same.Yes, I''ll go back to Disneyland, but I''ll probably wait
      until I save up enough money to go. Maybe in 5 years.","Hong Kong Disneyland
      is not very big, it''s ok for one day visit with kids but it''s a bit overwhelming
      with mainland tour groups who skip the queues over your children for kids rides!","I
      had 4 days to spend in HK and really wished that I hadn''t wasted a whole day
      in Disneyland. Even thought I had my 6 year old with me, it just wasn''t big
      or interesting enough to have spent a whole day here. Now, I''ve been to Orlando
      a few times so my expectation was high   but if you''ve got nothing to compare
      to, then it might be ok. There were no characters to be seen. The food was also
      terrible   I had the worse hot dog and hamburger in my life here in Disneyland
      HK.","Having read some of the reviews that it was small and over rated, we went
      and found it was better than expected.  We went on Monday, during the height
      of the August summer holidays. It rained slightly in the morning but it didn   t
      deter the...More","This is my first time visiting Disneyland and boy, what an
      adventure I had in Disneyland Hong Kong. It was like reliving all my childhood
      memories the moment I stepped my feet into the theme park. Disneyland is truly
      the place where a grown up can be unashamedly giddy and smiling all the time
      watching Mickey and his lovely gangs'' entertaining performances. It may be
      the smallest Disneyland in the world but for us, one whole day in the park is
      still not enough. I would love to go back again someday.","Loved spending my
      birthday at HK Disneyland. The staff were super friendly and when I went to
      collect my first time visit badge, I got another badge for my birthday and collector
      stickers which were a nice treat. The park was nice and clean and on the day
      I went, there were minimal wait times for the rides. Too bad the Cinderella
      Castle is under construction but it was still a magical day!","I was very excited
      to visit Hong Kong Disney. It did not open until 10:30am and we were there for
      the opening. We never waited in one line. As it was not high season it was not
      too busy. We walked onto every ride with no wait. In fact many we asked to stay
      on and they let us go on the ride again as there was no line. They had only
      3 fast pass rides however it was not necessary to use any fast passes. There
      were numerous characters around the park in different locations.","This park
      is much smaller than its US sisters, but all the charm and fun is still there.
      I almost prefer it   not as much walking and none of the crazy restaurant bookings
      6mos in advance. We had a great time and will be back!","Our first Disney experience
      was a memorable one. Our 6 year old loved every minute of it as did we. Booked
      on klook which saved some time and cash. Got there at 12 and stayed for the
      fireworks. Food was pricey but the fish and chips at grizzly gulch was reasonably
      priced. A bit disappointed the Frozen parade was so short but was still a highlight
      for our daughter. Wasn''t too crowded on a Monday. It''s a must visit.","We
      visited the park last December 2015. It was a fun experience actually, we''ve
      experienced all of the must try attractions there given the fact that it was
      a peak date. However, to maximise your experience, you should learn to strategise
      the visit; such as looking for some blogs through internet about HK Disneyland,
      try to get some tips there from what attractions that you should not to miss
      out, which attraction to visit first etc. It helped us a lot that is why we''ve
      got the best out of our visit. The place is kinda small actually.Please try
      the  Mystic Manor  no matter what.","I have never been to another Disneyland
      so I can''t compare, but I like it here. I think the ride is milder than rides
      of Universal Studio in Singapore, so the kids will enjoy it more. I don''t remember
      having to queue for any attractions very long, as we came early to beat the
      crowd. The fireworks at night is fantastic, it''s actually what I enjoyed the
      most. Bring your umbrella for both sunny or rainy days as a hat alone won''t
      be able to cover your arms and legs under hot sun.","But not good for teenagers.
      It was a mistake going there. We thought it would have exhilarating rides but
      obviously teenagers weren''t the target market here. Kids would definitely love
      it here, with the castle and Toy Story. But the park was rather small and we
      finished exploring the whole area, but obviously this is from a teenager''s
      standpoint.","A place must visit for all age range people! It is suggest to
      go for 2 days pass because definitely one day is not enough to see all spectacular
      disneyland. There are free stroller available for kids. Every park has restaurant
      and toilet, so no worries. Lot of shades and chairs for old people to sit and
      relax. The park if full of FUN!","If you want to enjoy the entire park reach
      early in the morning. Don''t miss the toy parade. There are many live shows
      in the park. Check with the information counter or get a copy of the guide which
      details the various events of the park. Kids will enjoy a lot. The entrance
      fee and other charges are more economical compared to Universal studios in Sigapore.","Been
      twice about 8 years apart.   A small park compared to others but in saying that
      it is really enjoyable as crowds aren   t so large.   Adding more attractions
      all the time, and easily accessible from Hong Kong","It was a dream come true
      to visit and have great adventure in Hong Kong Disneyland. It would be perfect
      to be with your friends or families enjoying different rides and attractions
      in this theme park. The parade of characters was truly amazing, the Golden Mickey
      was fantastic and Lion King was superb. Don''t miss the RC, Grizzly Gulch and
      Space","Went 12 years ago and loved this trip even more. Everything is so well
      maintained and well run. We all had a wonderful day with so many varied experiences.
      An all day outing with the only negative being the unhealthy food.","Amazing,
      the best, i got a change to meet minnie mouse and take pictures the attractions
      are good,  lines for every attraction are  long, food are not so delicious but
      it can fill your hungry stomach and marvelous  parade","We are annual pass holders
      at Disneyworld, so it was a no brainer to go. Most of the attractions are a
      little different and the have some new ones. Very well done and very Disney.
      The shows are all in Chinese so if you go, go for the visual. A half day was
      enough to cover the park for us. Do not change money there, terrible exchange
      rate. Getting there is easy and the Disney train is, well very Disney","We liked
      & enjoyed almost everything. The attractions in Fantasyland was my 5 yrs old
      daughter''s favourite. The only dislike was the queue for Jungle River Cruise
      whereby the Visitors were divided into 3 queues according to their preference
      in languages ie Mandarin, English & Cantonese. We have no objections at all
      as the PA System was annoucing that regardless of which queue you are in, the
      waiting time would be the same. My wife happened to join the Manadrin queue
      unknowingly and we were disapointed to see with our own eyes that the English
      & Cantonese queues were faster by at least 5 boats ahead of us. I recalled a
      Thai family who went in the same time with us but boarded 5 boats ahead of us
      and some who joined in the English queue later boarded the boats before us.
      Please switch of the announcement. It would only irritate the visitors. Thanks.","I
      had a great experience throughout my day visiting the park. The rides are varied,
      fun, and associated with famous Disney characters so you''ll have fun even walking
      around the park because there are so many things to see and take pictures of.
      Because I visited in August, the weather in Hong Kong is ultra hot. Also understandably,
      all rides are packed with people queueing so be patient when waiting for your
      turn. Unfortunately, I didn''t get to see the fireworks show on the night because
      of heavy raining.The souvenir shop is pretty interesting, even tempting to make
      you spend with all the interesting stuffs you can find. There are a ton of souvenir
      stalls everywhere, but they basically sell the same type of items, so just visit
      the huge shop in front of the park to save time from stopping at those stalls
      every once in a while.A few tips that saved me a hassle :1. If you want to save
      a bit more, do not eat inside the park because the food prices are pretty high
      as in all theme parks although I can''t comment about the taste. Instead, take
      a 10 15 minute MRT ride to Tung Chung and eat in the Mall nearby the station.
      2. I was told that almost all rides are open until 9 PM. So if you are not patient
      enough queueing all day and or cannot stand the heat, you can go somewhere else
      first and come back in the afternoon. Based on my experience, I arrived at the
      park at 11 AM, only got 2 rides due to queueing, left the park at 3 PM, came
      back at 7 PM and managed to got 4 rides in 2 hours with almost no queueing at
      all.Overall, it is worth it, maybe in part because I have never been to a disneyland
      before. I have been to Universal Studios SG, and I think Disneyland is a tiny
      bit more interesting.","Funny, friendly atmosphere, suitable for both adults
      and children. On visiting there, you should enjoy Disney show, watch 3D movies,
      easpecially play the game call   Moutain Space  . The rest games is very simple,
      you will get bored easily","Well it''s either I''ve not been watching disney
      cartoons or the theme park is using non Disney characters. Either way, the experience
      was great as there were a mixture of rides for young and also for older kids.
      Mystery manor was best for me not for the exciting ride but the video presentation
      throughout the ride was good and almost (a little lower than almost rather)
      real. Having said this, it might be not so great for not so young kids as the
      rides suitable for them are not many and the rest might feel a little boring
      to them. I also find this Disney a little small compared to the one in paris(I''ve
      only been to two Disney, this being the second one). A single day is sufficient
      if you are just covering the rides. The parades and fireworks finale were great,
      as usual. The restaurant food don''t appeal to me so I was glad we brought our
      own food. The trip there was easy as there is a mtr station serving Disney.
      The train and it''s interior were themed. So the excitement starts even from
      the arriving journey. By the way, you can buy the entrance tickets from circle
      k convenient stores and the travellex at k11 shopping centre. I recommend circle
      k as they are cheaper but you need an additional step to exchange the issued
      voucher for real tickets at Disney entrance. Great experience although I think
      some of the characters are non Disney.","finally i got in here and yes its the
      happiest place on earth. we get there on sunday at 9.30 am and its already full
      of family with children. when you enter the park, dont forget to take the show
      schedule and manage your time wisely. the attraction and show was very good.
      the food was expensive, about 100 HKD per person.and you have to wait until
      close time because they have a wonderful firework at the castle, around 8.30
      pm.","Any Disney afficianados will understand the title line which is probably
      as much as needs saying. Whilst well intentioned it lack sthe atmosphere some
      may be looking for.","passing time with shopping will mini it as 6pm mostly
      park ride close9pm firework was a long waitwith the addition of night parade
      at 730 pm time flyall ride in park was fun for me May is not really good month
      as it raining every dayyou will see 5 min of rain then 5 in of sun so onbut
      night fall will be strong rain beware of it","Much smaller than the California
      Disneyland but almost identical in some respects.  Can be covered easily in
      half a day.","Not many people would go visit this Hong Kong Disney now, probably
      mainly because of the drop in mainland china tourists, for the opening of the
      shanghai one, or simply currency reasons etc. Favourable to anyone who''d like
      to try out a less crowded version of the Park. Have what it advertised of cause.
      Expect what you would expect, just less crowded.","If you like California Disneyland
      you   ll love Hong Kong Disneyland with its similar compact size. The park is
      laid out in the same pattern as its California counterpart   pass through Sleeping
      Beauty   s castle to enter Fantasyland, turn right for Tomorrowland, etc. Of
      course, there are key differences that make this park special, including hearing
      instructions in Cantonese before English, watching mainly Chinese cast members
      perform, and dining at restaurants featuring a variety of Chinese and Japanese
      items along with American hamburgers. It is at once a fun and cultural experience.My
      two favorite rides were The Iron Man Experience, a motion simulator movie ride
      that has Iron Man saving downtown Hong Kong Island, and Mystic Manor, a high
      tech reimagining of The Haunted Mansion. But no ghosts appear in this through
      the dark ride. Instead it retells the weird stories of explorer Lord Henry Mystic
      and his too curious pet monkey Albert. There are surprises funny and scary at
      every turn.The stage performances are top quality, including    Festival of
      the Lion King    with special effects, choreography, and singing on par with    The
      Lion King    on Broadway. My only letdown was the Iron Man Showcase when the
      hostess began by announcing    Our presentation will be Cantonese    and began
      to explain the various projects without one word of English. I was completely
      lost. Fortunately when Iron Man spoke, his words were only English. (Did this
      confuse the largely Chinese crowd?) A day   s visit here is worth the time,
      and you probably can do everything in one day if you come when the park opens
      and play all day, enjoying lunch and dinner on site.","Make sure to download
      the Disneyland HK App for easy MAP access and to know all the show schedules
      of the day. It was very helpful for us that''s why we were able to pace and
      schedule our whole day in Disneyland. :) MTR to Disney was very easy as well!
      All the food inside were quite expensive even the drinks, so I suggest that
      you bring your own refillable tumbler so you have water while walking the whole
      day. Must watch The Lion King show and the Festival Parade!","If you have already
      been to Anaheim and Orlando you will find HK Disneyland sadly lacking. Space
      Mountain, Buzz Lightyear, Small World and Jungle Cruise as well as a bunch of
      the smaller rides like teacups, Carousel, Winnie the Poo etc. Notably missing
      are most of the good rides like Splash, Big Thunder, Pirates, Indiana, Haunted
      Mansion etc. However, we still had an enjoyable day. As always everything is
      clean and the staff are friendly and helpful, however, the food outlets are
      awful, when we were there the Comet had 4 meals on offer, but could only supply
      1 of them and the alternate restaurant that we found opposite had burger style
      meals that were not nice, the pork in my friends burger was stringy and dehydrated.","It
      is much smaller than I expected however it was good enough for a 1 day pass.
      Fun for the whole family esp the younger ones. Shopping was pretty good. Prices
      were reasonable. Food was not a problem and was quite good too. Loved the fireworks.
      Should bring the whole family especially if you have not been to any Disneyland.
      It is worth it.","The thing I''ve enjoyed in this theme park is their theatrical
      presentations which were superb. Sans the rides I think I can still enjoy this
      park. This place caters more on kids with their child friendly rides  which
      is a bit boring compared to others. But all in all the park is really worth
      your visit a good place to bring kids because for sure they will like the place","It''s
      very accessible and there are variety of public transportation available. We
      rode the mtr. There are a lot of attractions which brought out the child in
      me.","Came for Anniversary Trip, Rides were extremely long. Couple of them broke
      down. The castle was under Construction and no where does it even state this!!!!
      Some people come for the Whole Experience! What a huge Disappointment for the
      large amount of money you spent! Visited both parks and were extremely overcrowded!
      I   m so happy to see you are making it NO SMOKING, Maybe you could make it
      an Adults only Morning Admission sometime?? I have 6 kids and we went for a
      little getaway and gift to each and it was not even what we thought! My experience
      at the other park was the worst! I was knocked over by a little boy! Just horrible,
      it was a horrible visit! This truly is not the    Happiest place on Earth   !!!!","I
      went on a weekday to avoid the weekend crowds, and that definitely made the
      trip easier! I''d say if you aren''t big on the shows and photograph taking
      with the disney characters, you could finish the park in a day. But if you''d
      like to...More","It simply doesn''t get better than this.Curried fish balls
      down Main Street USA   fantastic.This is literally like they''ve lifted up the
      Magic Kingdom from it''s home (wherever that might be) and slotted into Lantau
      Island in Hong Kong and added some fine local touches and local guys.Sure it
      might get busy, but it''s Disney and it''s in Hong Kong. Space Mountain not
      as scary as the one in Disneyworld and they have real live talking, moving rubbish
      bins!Go and see the main HK first and then stay for a few days in the Disneyland
      hotels and have a Disney time before heading back home   airport is only 20
      minutes away.","From the start it is an adventure! From the sunny bay MTR train
      station there is the Disney train that goes straight to the park. You could
      take a taxi but the train completes the Disney experience here. You should take
      the train. One comes every 3 mins.While quite a bit smaller than Disney in Orlando,
      FL, this Disney packs a lot of great things in. It has tons of great rides for
      the small ones and everyone else, including tea cups and dumbo. There is also
      Space Mountain but it is Star Wars themed and SUPER cool!!! Our favourite ride
      by far!!! It''s like being in the scenes of the death Star battle with Tie fighters
      and x wings zooming in every direction. Our 7yo son thought it was a bit loud
      and fast but this was the first rollercoaster he has ever been on.We all really
      enjoyed the jungle boat ride  our guide was very funny! Tarzana tree house was
      also a favourite.Get your pictures with Micky, Minie, Cinderella, and all the
      Star Wars characters too !!!!We went on a Wednesday at 11 and it was great bc
      it was not crowded and we waited only 5 mins to get on rides!!!! That''s almost
      unheard of!!!!The castle is small but still cool to see. We didn''t stay for
      the parade. It would have made for too long a day. We live near Disney here
      in HK and get the pleasure is seeing the fireworks over the water every night.
      It''s always cool to see!It''s a great park with lots of great rides and things
      to do!!","                         MTR                                      Sunny
      Bay                                   MTR Disneyland Resort Line (                                                             Disneyland)                          Hong
      Kong Disneyland                                      Hong Kong Disneyland                                                                                                                                                                                                                          (                                                          Hong
