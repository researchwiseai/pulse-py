      many photos but it would have been more enjoyable if we had children. BUT i
      am sure it would have cost a lot more because they would be wanting ice cream,
      toys, pop corn drinks etc and i would not have been prepared to pay these ridiculous
      prices.\",\"Especially now that Shanghai Disneyland has been opened (which is
      much bigger) the number of people visiting Hong Kong Disneyland has dropped
      dramatically. Bad for Disney, but GREAT for Hong Kong people visiting Disneyland.
      Highly recommended   especially if you have kids!\",\"No matter which Disneyland
      you go, it's still the happiest place on Earth.  All visitors have a smile on
      their faces   both young and old.  Very conveniently located.  Seems like all
      roads lead to Disney\",\"Disneyland is made basically for children but it   s
      really amazing for adults too. we were there in first few of October and it
      was not so busy time there, still 2 days are not sufficient to enjoy the whole
      Disneyland. We enjoyed there every second of the time we spent there. Not only
      your children, you will not like to come back from Disneyland. Everything is
      made there is to mesmerise you. Starting from the toy train to meeting the ICONIC
      Mickey mouse. You can   t forget a single second of your time spent here.Disneyland
      is divided in 7 sections. In which only two sections have rides, in which fantasyland
      is for young children and tomorrowland is for adults and teens.Other than rides,
      you will see, ironman museum with an awesome 7D show. Another 7D show is about
      Mickey Mouse and Donald Duck.   it   s an small world    ride in a boat is simply
      the most charming. Well I will not say much about other attractions, but all
      are equally awesome. Park is super clean and well maintained. You won   t find
      anything which looked dirty or worn out. Staff is very supportive. When we were
      there HALLOWEEN was around corners, so the whole park was decorated with Halloween
      theme. Entry fee has just right price tag but rest everything inside is so costly.
      A half litre water bottle costed 35 HKD. A mickey shaped lighting balloon costs
      HKD 150. Logically this balloon should cost less than 15 HKD (150INR) in India.
      Other than attractions, you can also shop there extensively, from a basic T
      shirt to a great party wear gown, a simple water bottle to soft toys, everything
      related to Disney is there for sale. Prices are obviously so high. A basic T
      shirt for 2 yr child was priced for 200 HKD (2000 INR). A doll set of 24 small
      dolls set back me 400 HKD(4000INR). I have not visited other Disneylands, but
      this one is so mesmerising that your brain will refuse to forget the instances
      of Disneyland. Overall it   s a must visit place if you are in Hong Kong.\",\"As
      a resident of Hong Kong, and very close to Disneyland, we   ve been visiting
      here often ever since it opened. We used to have yearly passes for the whole
      family. It is such an awesome escape from the frantic, sometimes    dirty    city
      life that surrounds it. All the normal Disney characters can be seen plus a
      number of new (to Disney)    Marvel    characters and Marvel inspired rides.
      Favourites of our family include the Jungle River Cruise, Grizzly Gulch, It
      \  s a Small World, TeaCup ride, Slinky Dog and Mystic Manor. The staff are
      almost always friendly and helpful and the shows and parades are ALWAYS jaw
      dropping and definitely not to be missed. Watch out for the sporadic street
      performances of the street sweeper drummers who have an amazing drum perscusion
      show based on their garbage bins and cleaning implements. Also watch out for
      the    cleaner    who paints (using water) Disney characters literally on the
      street road. There are only really two possible negatives to the Disney experience.
      A very limited selection of western style (and quality) foods in some of the
      Disney resteraunts. Lastly, if it   s a mainland China holiday Disney can be
      quite unpleasant with the crowds. The best plan is to ALWAYS try and get there
      for opening time for less queues and crowds. Having said that, the iconic fireworks
      show is well worth hanging around for. Oh, and get there by train. Disney has
      its own train station. It   s the cleanest, quickest, cheapest way to get there.
      Have a GREAT trip to Disneyland. I thoroughly recommend it.\",\"i visited here
      about 15years ago and it was great then. now not so sure. average waiting time
      was over 60 mins. food was not good. best option was the popcorn. public shows
      were great in main street, especially the Xmas show.if you go make sure you
      buy the express pass otherwise you will wait all day for a couple of rides..\",\"We
      enjoyed our two day visit to Hong Kong Disneyland. It is on the small side compared
      to other Disney Parks, but it is run perfectly just like all the others. The
      Mystic Mansion was our favorite ride. We did not encounter any overly long lines
      and our time there was very memorable. We were kind of surprised that there
      was not a wide verity of flavored popcorn's like they have in Japan.\",\"One
      day is not enough to explore the entire Hongkong Disneyland. As a family with
      a Kiddo it took us two days to roam the entire park. When you enter the park
      make sure that you have your own Disneyland Map Park with you. This way you
      can plan your day. Watch out for the time allotted for different shows.The shows
      were fantastic, the circle of life is even more fantastic.There will be long
      queue for every show it is an advantage to get a fast pass to escape the long
      line. Except for picture taking with Minnie and Mickey Mouse you have to endure
      the long queue because there   s no fast pass for this.The jungle river experience
      is a must! For water if thirsty there should be water fountain in the park just
      locate it in the map, anyway selfie stick is not allowed inside the park.\",\"We
      are used to going to Disneyland & Disney World in USA and have been several
      times to Disneyland Paris and compared to Disneyland Paris it is very tiny,
      so be under no illusion it   s a very piece of Disney and not many of your favourite
      traditional Disney rides. That said we had a great time, we brought a 2 day
      pass as there was not much difference in price of 1 day before we went, we also
      purchased the food package of 2 meals and a snack. The food you get with this
      deal is very filling and we struggled to get through all the food we could have.
      The snack was either popcorn or an ice cream and the meals were full size dinners
      with soft drink. Everything that we ate was very tasty.Possibly the 1 meal and
      a snack option would have suited us better.It was very quiet there when we went
      and hardly had to queue for the rides and didn   t need to use fast passes at
      all.decorations for Christmas were really good but I was disappointed that there
      was not much In the way of Disney Christmas ornaments to purchase.All in all
      we had a great time, I still can   t get over how small the castle is, I thought
      the one in Paris was small but it   s huge in comparison to the one here.\",\"Disneyland
      is Disneyland and if you have been to one I wouldn   t recommend going to visit!
      With kids yes but it is overpriced and a little boring to be honest\",\"Took
      my daughter to HK Disneyland for her 5th birthday. Disneyland hotels are hugely
      overpriced, so we booked a hotel outside Disney. The Park itself is beautiful,
      so are most of the shows  I loved Magic Manor and my daughter loved the Lion
      King show. The parade was great, but a bit too short. A few things went bad
      though  lots of waiting for every ride  15 25  minutes. Kids got tired and we
      gave up on some rides. The food is overpriced and tasted bad  The Main Dining
      Hall (up to 20 USD for a tasteless meal), food stalls with outdated corn for
      4 USD 4, sausages 5 USD. Actually all soft drinks in the Park cost HKD 32 (
      4  USD) and you are not allowed to bring your own food! Another point  it's
      close to Christmas time, a lot of Christmas music was being played non stop
      including Church hymns like Hark! The Herald Angels Sing, O Come All Ye Faithful,
      etc. Sounds too religious, not suitable for kids, a bight of brainwashing so
      to say. And no wi fi at the park at all. For the families with young kids I
      recommend 1 day visit after a heavy breakfast.)\",\"Great place for all ages
      to go. Went here on a week day which was good and the place weren't that busy
      thank god making it a lot easier to get on rides in no time. There was a lot
      of old people which was different showing no matter how old you get you can
      still enjoy Disney. Stayed here all day to watch parade so was worth it. Value
      for money Highly recommend. Booked a two way transfer save the hassle of train
      espically when travelling with little kids.\",\"We had so much fun! This was
      my favorite activity we had in HK. It was a magical experience indeed. Big thanks
      to Klook we we're able to get the most affordable ticket for Disneyland. A day
      of visit is totally not enough especially on a weekend and you want to experience
      all the rides and take pictures with Disney characters.\",\"I already had my
      Disneyland experience in Anaheim, California USA and wanted my 7 year old grandson
      to enjoy the experience. We expected a big crowd, being a Saturday, and true
      enough, we had to fall in line for rides. We opted for less crowded attractions.In
      the bumper car area, the grandkid passed the height test but without notice
      that he had to be at least 8 years old, he was not allowed in. There were few
      staff members positioned to assist, and we had to get information from vendors
      manning their kiosks.What made our Disney experience worth it was the amazing
      parade. Sadly, there were no fireworks for is that night.\",\"Rides were family
      friendly and disability friendly, with a mix of intense and relaxed rides, exhibitions
      and shows. As expected, the facade of the theme park was intricate and well
      maintained. Food items were also cleverly designed and incorporated Disney symbols
      into their design. I would highly recommend families to buy a meal combo ticket
      (lunch dinner 2 drinks snack) to get the most bang for your buck.Please view
      the following photos to experience the beauty of this Theme Park.\",\"Third
      Disney park we have visited as usual full of the Disney magic. Hong Kong has
      been the smallest one we have visited but also had the shortest queues and was
      not as crowded as OrlandoAnd Paris. The bus service from the park to the hotels
      is also much better than Paris as proper queueing system. Happy to of ticked
      another Disney off the list,\",\"It was a dream of mine to visit all 6 Disney
      parks around the world and this was the 5th one I got to check off! We had wonderful
      weather and it was pretty quiet during the day. We went during Halloween Time
      so the parades were very fun and the kids enjoyed themselves. I have never seen
      a Disney park offer merchandise discounts if you come before noon, so definitely
      take advantage of that. It is very small like the original Disneyland but is
      unique in it's own way. It definitely has the best Thunder Mountain of any park
      around the world!\",\"Great place to spend with the young ones, better for kids
      over 6 years as more rides options. Our favourite is the small small world and
      Mickey mouse 3 D cinema show. Toy story unable to due to her height and then
      2 rides waiting timing was 50 mins. Do stay for 6pm and 6.30pm Christmas light
      and concert shows. The 8pm parade is worth while too. Pre purchase ticket via
      Klook cheaper but meal voucher I don't really suggest.\",\"The family spent
      one whole day in HK Disneyland and apparently it is still not enough. There
      were just so many things to see, watch, ride and do. We arrived just after the
      gates opened and already the place teemed with guests. It helped that we bought
      our tickets online (and cheaper) as we were able to skip the ticket counters
      and breezed through the entrance. We were greeted by rows of souvenir shops
      and rows of cheery greeters before the kids raced towards the rides. Us adults
      appreciated that there is (already) a Starbucks along the Main Ave which provided
      a caffeine respite every now and then. We appreciate the numerous pockets of
      benches for rests and very helpful staff who consistently provided assistance
      to our queries.We loved our photo ops with Cinderella and Snow White as well
      as the Lion King and Moana shows.\",\"So we were in HK with kids and grandkids.
      They all love Disney but have only been to Orlando. We took them for the day
      here. Couple of thoughts:1. Its a very compact park, you can do it all in a
      day.2. Its easy to get to by taxi or train.3. While the tickets compare in price
      to Orlando, stuff inside is less expensive (really!).4. The VIP experience is
      worth it, especially if the park is busy. Be sure to get the armbands for the
      parade   you get the best seats possible with no jockeying.5. Weather was perfect
      in November, weekdays not crowded at all, weekends are crowded, especially with
      mainlanders since completion of high speed rail (my assessment),\",\"What a
      nice place to visit. Loved it, never been to any other Disney land, so this
      was quite the experience.  Restaurants, stalls, games, rides, shops.  Loved
      it.\",\"Full of Mainland tourists, spitting and pushing and shoving. IS NOT
      THE HAPPIEST PLACE ON EARTH!!! Expensive!!\",\"we arrived around 15 minutes
      before the gates were open and stayed all day until it closed. thats how much
      fun we had there! of course travelling with kids there are lots of breaks you'd
      have to take. we enjoyed the parades, and the fireworks. for muslims travellers
      there is a prayers room even with an ablution area! although its not labelled
      as musolla and it can be use by all religions but i should give credit for the
      their thought of having an ablution area. the prayer room is spacious and enclosed
      so our children could rest for a while while we prayed. most of the rides are
      suitable even for my 4 year old daughter although few are not. the food at the
      cafeteria were also delicious.\",\"Having worked at Disneyland in California
      for quite some time I can honestly say that Hong Kong Disneyland delivers the
      Magic! It   s a great place for a date, to hang out with friends or to take
      the whole family. It   s a Small World is incredible and has hidden characters
      from Disney movies throughout it! Thunder Mountain was my absolute favorite
      ride (for slightly older kids and adults) and the shows were great! We saw the
      Festival of the Lion King and Mickey and the Wondrous Book! Both amazing! The
      Moana show was ok but Moana didn   t sing so we left. Good food options and
      lots of lands to explore. Definitely smaller than Disney so if you start early
      you could see most of the park in a day. I turned in my day pass for an annual
      which was cool because they let you put your paid amount towards the full year!
      Oh and there is free Wi Fi throughout the park. Looking forward to heading back!\",\"Hit
      all the rides in under 2 hrs. Love this place! I went mid day in October,and
      there were no crowds.\",\"It   s a little small compared to other Disney parks.
      The castle and jungle cruise ride were closed.  The queues were short. My family
      had a great time.\",\"We spent 2 days here exploring the park and visiting Disneyland
      Hong Kong. As a Disney fan we enjoyed it and the park does a great job with
      the whole Disney experience. Many of the rides are similar to what you would
      find at Walt Disney World but we had to see for ourselves the park as we are
      on a quest to visit all of the Disney Parks around the world. Crowds were manageable
      and the weather was perfect during our visit.\",\"the best every to go to the
      best every the best every one shold go there it the best every the best the
      best\",\"As i know this Disneyland is the smallest one in the world. I had visited
      Tokyo one before I visited here and my experience in Tokyo wasn   t that good,
      thus i only had a small expectation about it. But i really enjoyed here, attraction
      were much better than Tokyo one. The best attraction i enjoyed is Mystic manor
      which i felt kind of childhood innocent. The do not miss Mini Lion King musical!
      It   s really worth to watch!\",\"Our visit to Disneyland was planned solely
      for son who   s 4 year old. That we would also have so much fun was not known
      The whole environment is one of gala and celebrations. The different worlds
      created within Disneyland make for one new experience after the other. It is
      humanly impossible to do all the rides and there is a fair bit of walking in
      between the different    lands    and quite a wait for the very popular rides.
      You can you the fast access to plan though. The only downer was the food options.
      If you are fussy you should plan your movement through Disneyland to be around
      the restaurant that serves food that you like. The dining options are a bit
      pricey for the fare offered but that   s come to be expected of all entertainment
      parks et al. The rides themselves are brilliant. My wife is particular got nostalgic
      when she did the small world ride again after 15 odd years. The Iron man ride
      is a do not miss ride. Couple of pieces of advise:A. Plan your route. For eg.
      come to the Iron man ride in the evening. Nearly no waiting around that time.
      Plan where you want to have lunch and decide the route for covering the various
      lands.B. Plan which rides and attractions you want to cover or are must do.
      C. Get hold of the maps once you enter and the show timings. There are different
      shows and the timings vary. Also the popular ones go full sometimes 30 mins
      in advance. D. And finally see the timing of the parades. There a few in the
      evening. The grand finale at the park closing time is not to be missed. It gets
      crowded there so try and get there to get a good path side place. Honestly it
      \  s near impossible to cover the park in a single day. Even most good ones
      would take a day to cover even at a rapid pace. Two days would give you the
      ability to cover the park in a relaxed manner. Goes without saying a must do.\",\"We
      are a Disney loving family so this was a must do for us. The park opens later
      than other Disney parks which worked out for us because we could actually sleep
      in on vacation. The park is small but absolutely lovely. I found that our only
      negative was some pushy guests at parade time. There were virtually no lines
      for most rides. Our hotel gave us fastpasses but we didn   t need a single one.
      Most rides were actually walk on with no wait at all. We did wait about 20 minutes
      for Dumbo, I think that   s it. I would have liked to have seen more offerings
      to meet the characters. Cast Members were friendly but not quite up to the usual
      Disney standard. Overall, wonderful but small park, easily done in a full day.\",\"It
      \  s always fun to visit Disneyland!The hype begins (if you   re commuting to
      Disneyland) when you transfer to the Disney train with Mickey Mouse shaped windows.
      Children will always have fun in Disneyland. The adults in our trip also appreciated
      adult friendly rides. Points for improvement:   cleaner and more accessible
      public toilets   healthier dishes in the menu for children  English as main
      language in rides and of characters mascots plays We ended up staying in Hotel
      Disneyland as well where the amenities and rooms were spacious, clean and stayed
      true to Disney designs. A little pricey, as expected but you get your money
      \  s worth with the amenities, service, privacy and security of the property,
      and the decor. Sharing Disneyland train and Disneyland Hotel photos.\",\"We
      had a lovely full day at Disneyland Hong Kong.We have been to Paris, California
      and Florida parks and Hong Kong is tiny in comparison but it is a still a fun
      day if you are in the area.The castle is still there but is partly obscured
      by construction walls and a crane   it will soon be demolished for a new super
      castle in 2019 which is really exciting.The park is mostly bilingual with English
      and Cantonese (and Mandarin on occasions)   we would it hilarious when Mickey
      and friends spoke in Cantonese.Tips:Highlights of the park that you have to
      go on   Mystic Manor (a unique experience amongst disney parks with a fusion
      of ratatouille and haunted mansion rides), Big Grizzly Mountain Runaway Train
      (a fusion of Exhibition Everest and Big Thunder Mountain and a launch coaster),
      and Hyperspace Mountain (HKDL version of space mountain). We went on each of
      these twice and loved them. The rest of the park rides are the same similar
      as the rest of the parks around the world.Mickey and the Wondrous Book is a
      really special show and I highly recommend you see it. Each performance was
      full and it wasn't until our third attempt did we get a seat! It's a fusion
      of Florida's happily ever after night time show and Paris's Peter Pan night
      time show. The live singing and performers were all excellent.Both parades were
      excellent and are your opportunity to see lots of characters at once. Arrive
      30 minutes before to get your spot.If you want to meet characters get to the
      park for 9.30am. Gates open at 10 and there are lots of characters to meet on
      main street USA before the main park opens at 10.30   Mickey, Minnie, Goofy,
      Donald and Daisy, Chip and Dale were all out and about.Only negatives of our
      day were the weak side show performances e.g. Moana home coming and the Christmas
      stage show. I'd avoid these and use the time to go on rides. Also the shops
      were always rammed and overflowing with queues snaking around the shop so you
      couldn't find the end of the line. If you want to get gifts and don't want to
      queue there is a hong kong disney store at the airport with the same prices
      and a fair bit of stock.\",\"Love the Princess , Love the show and good place
      for entertainment. My kids love it.. They enjoy all the ride and love taking
      pictures.. There fireworks and weather is cooling.\",\"Cold weather around our
      visit January 2018. A bit raining also. Not a best time to go at this month.
      But we still go because the show must go on. Its a dream come true for the kids.
      But it will the best if your kids around 8years old and up for their have some
      height limit on the rides.\",\"Make sure to download the Disneyland HK App for
      easy MAP access and to know all the show schedules of the day. It was very helpful
      for us that's why we were able to pace and schedule our whole day in Disneyland.
      :) MTR to Disney was very easy as well! All the food inside were quite expensive
      even the drinks, so I suggest that you bring your own refillable tumbler so
      you have water while walking the whole day. Must watch The Lion King show and
      the Festival Parade!\",\"Such a beautiful place that one can keep going again
      and again. Brought our kids there for their school break. A lot of changes,
      with new attractions, however, we came at the wrong time where a lot of constructions
      and castle closure which was a put off. The language use... hmmm Mickey talking
      in Cantonese was a put off. Should stick to English instead.\",\"Spent a weekend
      in HK for our daughter   s gymnastics meet. We decided to reward her afterwards
      with a family day in Disneyland. It was great fun especially since we joined
      other friends there from the event. Our daughters cartwheeled their way into
      the entrance. Crowd wasn   t so bad but the castle was under repair so no traditional
      fireworks to cap the night. Instead, there was light show parade which wasn
      \  t half bad!\",\"It was awesome! We went on a Monday and got to see every
      show and ride every ride that we wanted. Wait times were minimal and crowds
      were sparse. I would say that my one poor experience came from the cast member
      responsible for maintaining the line for the Pluto meet and greet. He was quite
      rude and yelled at children repeatedly, then yelled at parents. A child and
      parent who got out of line were allowed to rejoin the line ahead of me and my
      son. This was also frustrating as we had been waiting for quite some time to
      see Pluto. I didn't find it overly expensive, it's Disney!\",\"I read alot of
      reviews on this and was a bit concerned that it wasnt worth going but this was
      an absolutely amazing experience. I will note that i am a huge disney fan and
      that this was my first disney part visit.We arrived early and seemed to be at
      the start of tourist season. It was busy but not too bad. We didnt stand in
      a line for longer than 20 minutes. When the park opens you are first only allowed
      in the shopping area, obviously so you can buy stuff and they can make money
      but there is sooooo much to choose from.We went on most of the rides and went
      on them twice   once at day and once at night.We bought the tickets and food
      vouchers on Klook and this was a great savings and also really worth it.The
      rides were really fun and the overall ride experience was amazing. We thoroughly
      enjoyed the mine cart in the grizzly grouch area, as well as the star wars ride
      and the toy story horse shoe.The parades   we watched both the day and night
      parades   were absolutely spectacular and definitely worth going to   just a
      tip though is to find a spot about 30 minutes before the parade is due to start
      as there are alot of people.Also try and find a spot towards the end of main
      street USA where the road splits to the different parks as the last few floats
      and characters dont go all the way to the bottom of the road.We also managed
      to watch two of the shows. The Lion King which was amazing and then Moana which
      was great but the Lion King was definitely a way better experience.The only
      let down was that the characters are not walking around so they were only available
      for short time slots and for a limited amount of people so you had to try and
      plan your day around this.\",\"Disneyland is a must when you visit Hong Kong,
      it is located near the airport which is out of the way depending on where you
      are staying.We were staying the New Territories (Sha Tin), fortunately there
      is a bus that goes to Lantau Island Plaza where we then change to Disneyland
      bus (R8) which take us straight to Disneyland, all in all taking around 40 mins
      to get there.There are many ways to get the Disneyland the MTR, the blue coloured
      taxis or bus, the bus is definitely the cheaper option costing under $50 HKD
      per person.Entry to the park is quite expensive costing $699 per adult and $515
      per child (as of October 2018) in total costing   210 GBP.Within the park there
      are many various rides that suits all ages, from the infamous Hyperspace Mountain
      to the jungle cruise.The eatery within the park are reasonable priced. We visited
      the park during a weekday and even though there was a lot of people in the park,
      the queues for rides were very good, averaging around a 10 minute wait.The parade
      is not to be missed and was very well put together. During our visit in October
      2018 there was construction work being carried out on the Princess Castle, so
      there was no firework display in the evening. Overall, we have a fantastic day
      and out young children loved their time in Disneyland Hong Kong and it was definitely
      worth the visit. Tips:Visit during a weekday.Pre book buy tickets to see if
      there are any deals packages.\",\"Crowded but worth it.  I loved the light show
      at night, Christmas music was played and snowflakes flew in the air. At that
      instant, I felt the joy of Christmas.\",\"Entry was expensive, kids under 2.5
      years free. A lot of people told us it wasn   t worth it and it will be crap
      however we did enjoy it. The kids are young so they rode on rides that suited
      their age group. Not a huge variety of food but there are a few restaurant cafes
      around. My only safety concern was lack of security guards or police presence.
      I caught a man taking pictures of my child along with other kids while watching
      the Moana live show. He was on his own not accompanied by a child or family.
      He was taking photos of young teenagers too. I confronted him to delete but
      he didn   t speak English. Managed to delete but this didn   t stop him doing
      it again. We spotted him a few times. While waiting for our turn on rides 2
      other I saw two native people taking photos of my own children I asked them
      to stop and intervened but again people don   t speak English. They   d stare
      like it was completely normal and I   m over reacting. It made me very upset,
      angry and furious and this behaviour is unacceptable. Especially when it comes
      to children. When I contacted authorities and staff they didn   t seem to care.
      This is VERY VERY important that people are made aware and to be on alert. PLEASE
      WATCH YOUR KIDS AT ALL TIMES! don   t take your eyes off them.\",\"It is a must
      have trip if you have kids! Got the kids dressed up in princesses for them to
      enjoy this magical experience. My child was given a birthday badge by the hotel
      and she could pin in and get recognised in Disneyland. We have received complimentary
      ice cream at restuarant and some staff would wish Happy Birthday.However, it
      is prob my last time gg to Disneyland HK as the 1) Lion King show was the same
      as 10 yrs ago. 2) experience of being pushed by rude mainland Chinese in queues
      was not pleasant at all. Perhaps Disneyland SEA in Japan would be a much better
      choice.\",\"Loved this Disney park.  It was quieter than any of the others I've
      been to and retains the charm of the original Disney parks in America before
      they started modernising them.  Great day and my favourite of the four Asian
      Disney parks.\",\"The best thing about this Disney land that it is allow most
      of the rides younger kids. I am able to visit most of rides with my 2 years
      old son. However if you visited any other Disneyland like Shanghai or Tokyo
      you might not feel very happy with this disney land as i couldn't find any WOW
      factor in this Disney land. Food is expensive i would suggest to buy advance
      meal tickets from Klook and convert them to the vouchers at check in gates.\",\"This
      is one of the smallest parks we have been to. Currently we have been to all
      of the Disney parks except Paris, hopefully next year. Allow yourself about
      a half day to see everything. There are about 3 rides worth the time to wait
      in line, Hyperspace mountain, Mystic Manor, and Grizzly rollercoaster.\",\"Visited
      this theme park 4 times over the past years. Its getting old and it shows. Time
      to give the place a spruce & add in more new rides, otherwise it will lose its
      visitors to other theme parks in the region\",\"To be honest, we were expecting
      this to be the worst Disney park we   ve been to because it   s so small, but
      it was brilliant. It is small, but that   s part of the charm. It has all the
      classics you expect but with none of the stress and hassle you get in other
      parks.\",\"If you move fast, you can get thru the park in a day knowing that
      you won   t see everything. It   s certainly not packed like LA Disneyland or
      Disney World. Most of the rides in Small World are the same sans Peter Pan.
      Their rides in some of the areas are different. Food is really bad. Jr Yelper
      said we should eat at the best restaurant in the part, The Explorer Club with
      a variety of ethnic selections to order. But at nearly $20 a plate with meager
      portions, it was the worse Disney park meals I   ve ever had. The Jungle Ride
      was closed the weekday we went. They had 2 different Disney ice cream pops sold
      at the carts. One is blueberry and the Minnie is Strawberry for $5 USD. They
      were OK. The evening light show was basically flashing lights of Mickey and
      friends on the buildings. The electric parade was really good. We watched part
      of the Moana show. We were so bored and the singing was mediocre so we left.
      This is the 4th of the Disney parks we   ve been to and easily ranks at the
      bottom.\",\"Hong Kong Disneyland is off the beaten track destination for everyone's
      desire. This site is full of new creation, nice atmosphere and beautiful landscape
      to explore while visiting here. The place has also captured our attentions and
      felt absorbed in.\",\"I went with my girlfriend in Hong Kong, and she had a
      great time! Needless to say, she lived her childhood dream all in one day. You
      all should've seen the looks on her face during the whole day we spent in HK
      Disneyland. Getting to Disneyland from Central and the way back was easy and
      convenient, given that Hong Kong's MTR is one of the world's most efficient
      metro system.\",\"An absolute must see and a perfect way to spend a beautiful
      day, the park along with all the shows is stunning. Very well organised and
      plenty of friendly staff to help you around .Food is good and they have a large
      variety of restaurants and caffe . There is a locker service where you can leave
      your belongings for the day , is secured and you can access it anytime, there
      is also a luggage valet service if you want to leave a case with wheels.We didn
      \  t spend much above the ticket price as all rides are included.\",\"We   ve
      been to every Disney Park in the world, and this one may be our favorite. In
      our 4 visits to HKDL, we have loved the beautiful surroundings, the short or
      nonexistent lines, and the manicured walk from the hotels to the park. The musical
      productions here are terrific (it   s currently Mickey and the Wondrous Book),
      and there are other unique attractions as well: Mystic Manor (which is NOT a
      Haunted Mansion) and Grizzly Gulch. There are also some minor noteworthy features:
      this park   s Small World was the first to include Disney characters, and its
      Jungle River Cruise has a surprise ending. The castle is surprisingly small,
      but it is currently undergoing construction that will enlarge it.\",\"Being
      from FL we had to check it out, sadly I think we were better off spending a
      second day at Ocean Park.\",\"We had a great day out at Disneyland. We went
      on a Thursday in October so it wasn't busy at all. Longest wait for anything
      was about 15 minutes. Download the App and it tells you the current wait times
      all over the park.It is much smaller than Disneylands but that was good for
      us with 2 kids under 7, it was easy to walk around the whole park a few times,
      and most of the rides were good for the younger kids. It might be lacking if
      you're after big thrills. The food was generally ok and not at astonishing prices.As
      it got dark we went back and had a second ride on all the things we wanted and
      some we had missed earlier in the day. All 3 parades we good and as it wasn't
      too busy everyone was able to see fine. Highlights: The Lion King show (don't
      miss this and it's a good airconditioned break), Mystic Manor and the Jungle
      River cruise (make sure you go after dark, it's much better). As people have
      mentioned HK Disneyland doesn't really have the characters just walking around
      the Park like you find in other Disneylands, so if getting pics with them is
      your thing you will have to line up at specific locations and times. The train
      out there was good, and wasn't even packed after closing time (we walked slowly
      back to the station). Easily managed to stay the whole day, opening to close,
      and would definitely go back next time we are in HK. If you need to decide between
      Disneyland and Ocean Park, pick Disneyland if your travelling with younger kids.\",\"We
      simply had the best day at Hong Kong Disney. I had read some negative reviews
      but they proved to be untrue. We visited in mid November and the park was decorated
      for Christmas which made it even more special. It was my wife and I and our
      20 year old daughter who went. The rides were excellent. The lines were pretty
      short (we were there on a Monday), the longest we waited was 20 minutes but
      some rides we just walked on. The shows and parades were pretty good. Except
      the snow show at 6:15pm. Not worth waiting around for. The park was clean, the
      toilets were clean, plenty of food stores (overpriced but that goes with the
      territory)Best rides were Mystic Manor, Grizzly Gulch and the Iron Man one in
      Tomorrow Land. My daughter said the only negative was that there were no thrill
      rides like a major roller coaster. Getting there via the MTR was super easy.
      If you bought the tickets online you have to go to Guest Relations on the left
      of the main gate to pick up your actual tickets. If this has been helpful please
      give me a helpful vote.\",\"Went on a week day which I would recommend as even
      then there were hundreds of people, didn   t have to line up longer then 10
      minutes to go on rides , we both loved the iron man experience ! Food is very
      expensive and wasn   t that great cost over $100 aus for 1 burger a small serve
      of chick wings and 2 milkshakes . That aside we were amazed by everything the
      lights on all the buildings etc at night gave it a truely magical experience
      we felt like kids again ! We much preferred Disneyland over ocean park\",\"Great
      park. We easily rode did everything we wanted in one day and went back for a
      few hours during mid day for a second day for our favorite rides and shows.
      Mickey and the Wonderous Book is my all time favorite Disney show. I just wish
      the castle wasn't under construction, but I'll just have to go to see the new
      one when completed.\",\"Dumb to go.America Street is a boring place because
      the prices ain't cheap and much can be bought elsewhere.The other zones are
      horrible,with too much people and staff not doing much for the adventure.Very
      unhappy during the whole trip.\",\"I have visited this theme park 6 times in
      my life. first time was with my mom and dad. Went three times alone and two
      times with my wife... This was my first theme park visit back in 2012. I was
      amazed and was wondering it to be dreamland. I rode every rides here. From thrill
      rides to the family rides. Well the best attraction was off course Ironman experience.
      Mystic Manor was cool, hyperspace mountain, rc racer, Grizzly mine car ride
      were all thrilling and exciting. Enjoyed the lion king and mickey mouse shows.
      River cruise was awesome. It's a small world was amazing. September is the month
      I recommend to visit. No long lines... Iconic castle is transforming don't know
      how long it would take. If the castle transformation is complete it would be
      my 7th visit...\",\"Ive been lucky enough to visit Hong Kong Disneyland a number
      of times since it first opened, and each time I've been there there's something
      new and exciting. Whether with children or just adults, Hong Kong Disneyland
      is a great day out for anyone. Who doesn't want to have their picture taken
      with Mickey Mouse??? It's a short train ride from any part of Hong Kong, and
      there are great food outlets and entertainment for all the family.\",\"If you
      \  re after a trip filled with coasters and white knuckle rides forget it, but
      if you want some good old Disney magic then it   s worth a visit. Quite a small
      park if you   re comparing it to other Disney resorts, the shows are very good,
      but no fireworks, no castle ( it   s under construction) and not many characters
      wandering around for photos. A good day out but a little disappointed to be
      honest.\",\"Although we were given 8 priority pass from our kingdom club stay,
      we didn   t managed to use any of it. The queue were generally not too Long
      except for photos with iron man and the smaller kids ride.The priority pass
      Given to us were only applicable to 5 rides, it would definitely serve us better
      if it   s applicable to all other rides. As we have very young kids, rides like
      toy story parachute, slinky dogs etc would attract younger kids more and we
      couldn   t use it.I would think it would be better if Disneyland can share when
      and where the character would appear. Like Disneyland LA, more characters will
      appear in different time slot. These information weren   t available anywhere...\",\"Disneyland.
      Need I say more? The most wonderful place in the world!Hong Kong Disney is a
      lot smaller than the others I   ve been to but of course there   s plenty to
      do. I   ve been twice, but most recently I got there as it opened which was
      great    there were no queues for any of the rides so we whizzed round quite
      quickly.I love the shows they put on there! The Lion King one is great so make
      sure you get to see that! You can book day tickets online for HKD 619     62!
      100% worth it! It   s quite close to the airport and has luggage storage if
      you want to fill the day before you leave. It   s about 30 mins from Hong Kong
      Central station and very easy to get there. The train has Mickey shaped windows
      and handles!!! So cute!You can read more about it in the blog on my page. Please
      check it out!\",\"Went with family , 2 children age 4 and 13.The Disneyland
      MTR was nice, took around 10 mins to reach the destination.We went on 7 11 2018,
      Weather was sunny ,no rain at all.We stayed Novotel City Gate hotel so it was
      2 stations to Disneyland which was very convenience.\",\"Of course anything
      Disney is magic! Our experience at Hong Kong Disneyland was a memorable one..
      having been to the parks in California, USA, we found Hong Kong to be much quieter
      and the longest we ever lined up for a ride would have been 10 15 minutes   and
      this was only for a couple of rides! We did stay at the nearby Disneyland Hotel,
      and this included some  priority passes  to certain attractions.The rides were
      all fun, with all but a couple having height restrictions that our 4 year old
      just missed out on! The only disappointment was the BIG lines to see the characters
      \  and this resulted in us missing out on a photo with most of them! Even with
      a full 2 days here.. The lines close, well before they even officially arrive,
      and with only a couple of appearances each day, it is so limited! There should
      be more characters dressed up, and they should be out & about ALL day   not
      just an hour here & there... there could be 2 of each scattered throughout the
      park even.. and this would make everyones visit just that bit more magical!!
      The chaos in the gift shops is crazy, the best time to shop is whilst the parades
      are happening just outside!! I would skip back in a heartbeat and could quite
      easily spend another 2 days here!\",\"Had Visit on the 5th of Nov. Sadly alot
      of rides and attraction is close.  Besides that the place is clean and well
      kept.\",\"Went with a group of Disneyfied adults on a week day. The park was
      decked out for Halloween   very nice. There were no crowds so we could go on
      every ride without ANY long waits. Liked the crowd  mellow & happy.\",\"Having
      visited Disneyland Paris some 25 years ago we decided to spend the last day
      of our holiday at Disneyland Hong Kong. The rides were outdated and given HK
      love of all things electronic we expected more. There was a greater variety
      of rides in Paris. The parades started late   so we missed the last few minutes
      of the evening parade as we had a coach pick up to meet. The parades were not
      a patch on Paris some 25 years agoThe majority of the staff were rude and unhelpful
      \  unlike the Paris staff. Given that English is widely spoken in HK a lot of
      the staff barely understood English. Putting it mildly it was an utter disappointment
      from start to finish.\",\"Need to plan which rides you want to go on and what
      you want to see as it   s too big to do everything. shows arrive about 15 20min
      early. rides were max about 30min to 1 hour wait without fast track on a sunday.
      Hit the ones you want to go first early to beat the crowds. I went for halloween
      and there was a good 2 for 1 deal on disney   s site that allows me to enter
      the park a second time before the end of this year. For popular characters expect
      at least 30 min to 1 hour waits to take pictures with them (eg. jack and sally
      for halloween). disney staff give out lots of stickers and candy during halloween.
      the villains night parade at the end is not as exciting as the one during the
      day or their regular one as the floats with the villains are plain comparatively.\",\"It
      is indeed one of the happiest places on Earth though the rides are not as thrilling
      as the rides of Ocean Park HK. This park entertains its children audience visitors
      than young adults so if you're a solo traveler, Ocean Park HK I think would
      suit you.If you're going to watch some shows or presentations, you have to run
      around the park so expect to have feet soar lolNo fireworks display when I went
      but the parade would entertain you for sure!Overall, it's very good and you'll
      certainly feel like a kid after visiting this park\",\"Who wouldn   t want to
      celebrate their birthday , at least once in Disney ! So do I . However , I felt
      that Disney Hong Kong is a poorer cousin as compared to Tokyo. I supposed this
      comes from different management . Everyone knows Japanese are meticulous to
      the last details. Whilst, in Hong Kong , I suppose they have practical mindset
      rather than imagination. They are doing the basic normal job in a magical place
      .. what a waste . They have plenty of room to improve to make the best place
      as magical as possible .\",\"Fantastic Experience. This is my Second time visiting
      Hongkong disneyland and it never fails to amaze me.The best part is the Iron
      Man experience for me. Superb. Also, the Castle is under renovation when we
      went there so We cannot have a photo of it. better go to these place as early
      as 930 am. Get a Map at their City Hall Area . Get your fast Pass to save your
      time on queing.\",\"Overall the place was ok but many attractions were closed
      with no reduction to the entry price. The attractions were OK but nothing like
      I expected at a Disney Park. Only the Americans can do Disney!!!! All in all
      though it was an OK day out.\",\"Actually I thought Disneyland would be for
      small kids. But it   s not. I went with my teenage that loved. Many attractions
      that for them was great. But be ready to stay long in the queue. And it   s
      a bit expensive but if you have energy you can spend the whole day there. Not
      my case.\",\"After living in Hong Kong for a few months, I had not heard great
      things about HK Disneyland. But, I decided to go with some friends and had a
      really fantastic time! We got there right when it opened and the lines were
      quite short in the morning. We didn't spend more than 20 minutes in a line!
      The park is small; I was able to go on my favorite rides multiple times throughout
      the day, with and without fast passes. Because of its size, visiting the park
      is one day is more than feasible. I personally loved Space Mountain and Grizzly
      Gulch rollercoasters.The food was not as good as food at other Disney parks.
      The Mickey waffles and ice cream were tasty, but the popcorn wasn't warm and
      the sandwiches from bakeries on in Street barely had any meat and cheese in
      them. I recommend bringing your own food into the park.I wouldn't get a season
      pass for HK Disney because it's too small and it would get old quickly if I
      went there too often, but I will definitely visit every once in a while!\",\"We
      visited HK Disneyland on our last day in Hong Kong, the food was great, but
      as to be expected over priced and the lines were a nightmare! A lot of the rides
      with audio only had it in Cantonese   understandable because your in HK, however,
      it   s a bit of a let down if you don   t understand it.\",\"I love Disneyland.
      Typically laid out in all the worlds. Great rides for young and old, lots of
      food and drink stations around the park. Most rides open the day I went. Plenty
      of parades and music happening most of the day. Always a fun day.\",\"We went
      there , but frankly speaking travelling to other Disneylands , this one could
      do better. We didnt see the night parade since it was on HOLD for quite some
      time know . Overall , It is too pricey for the enjopyment expected.\",\"Although
      it's not big as others, people coming here is less than others too and hence
      we managed to play all the rides and watch all the shows here which is great
      as the waiting time usually no more than 20 minutes.However, when we were here,
      the castle is still under renovation so there's no firework which is supposedly
      the highlight in any Disneyland.The popcorn here also doesn't has the special
      box like in Tokyo. Just a normal packaging.\",\"Hong Kong Disneyland is just
      too small with limited rides compared to parks in California, Tokyo or Paris.
      A little disappointing but the kids (10 and 13) enjoyed it all the same   it
      \  s Disney after all!! A good place to spend the afternoon if you have time
      to spare, otherwise I would give it a miss.\",\"No matter what age or marital
      status, Disney is always my favorite place. The shows and rides are fantastic,
      I keep coming back. Definitely for all ages!\",\"Hong Kong disney, was a marvellous
      place for their parade and shows. The rides were great for young kids. There
      are no real thrill rides , most rides a 5 yr old can go on , but it was an amazing
      park, ride lines at its longest was 25 minutes, which was great. Well worth
      it\"],\"set_b\":[\"A super small but cute Disney park; great for little ones,
      light on thrill rides. Mostly kiddy rides other than Space Mountain; thrill
      seekers should look elsewhere. It\u2019s small and suited to young children;
      we did most rides with kids under 7. Think of it as an intro to Disney magic
      for the little ones. Good for small children and people new to Disney; too few
      attractions for veterans.\",\"Go midweek and early; we walked onto most rides
      with 5\u201315 minute waits. Weekends and holidays are packed and queues can
      hit an hour. Arrived at opening and did most rides by early afternoon with short
      lines. We waited around 20\u201330 minutes per ride; manageable on a weekday.
      Queues were long on a public holiday; we barely rode anything.\",\"The castle
      was under renovation, so no fireworks. Several areas were closed for maintenance,
      including the train. Building work and scaffolding spoiled main square photos.
      Many rides were under refurbishment but tickets were full price. It felt half-open
      with the castle and train shut.\",\"Mystic Manor and Big Grizzly Mountain were
      the standout rides. Iron Man Experience was excellent; we rode it twice. Hyperspace
      Mountain\u2019s Star Wars overlay was great fun. Festival of the Lion King was
      a must-see, world-class show. Mickey and the Wondrous Book was superb for all
      ages.\",\"Food and drinks are expensive; bring a water bottle to refill. Quality
      is hit-and-miss; Main Street Corner Cafe was decent. Halal options exist at
      Tahitian Terrace and were appreciated. Vegetarian choices were limited and often
      bland. Water is pricey, but fountains let you refill for free.\",\"Buy tickets
      on Klook or online; walk-up prices aren\u2019t worth it. Two-day passes made
      it more relaxed and better value. Seniors get a big discount at the gate with
      ID. Priority pass scanning issues left us embarrassed. FastPass is limited to
      a few rides; plan usage wisely.\",\"Staff were fantastic and very helpful throughout
      our visit. Cast members lacked the Disney smile and felt indifferent. Service
      felt abrupt and not up to Disney standards. Crowd control at shows was poor,
      leading to seat scrambles. Some staff went above and beyond to fix a ticket
      issue.\",\"Getting there by MTR is easy; the Disney train is part of the fun.
      The park is an hour from Kowloon but well signposted. Stroller rentals were
      convenient and quickly replaced when lost. On-site hotels with shuttles made
      visiting with kids easier. Locker and luggage storage at the entrance was handy.\",\"It
      gets very hot with little shade; bring hats and umbrellas. Rainy days kept crowds
      down, but some rides closed. Toy Story Land was blazing with no shade; add sun
      sails please. Cooler months made walking the park comfortable. We were grateful
      for short lines on a wet weekday.\",\"Few characters roam; expect long lines
      for Mickey and friends. Go early if you want photos with the entry sign and
      mascots. Princess makeovers and character breakfasts thrilled the kids. Jedi
      Training was fun and easy to join multiple times. Character lines close quickly;
      check times and plan ahead.\",\"It brings out the child in everyone; we left
      with big smiles. Smaller than expected, but still a magical day out. We loved
      it so much we\u2019re planning to return. A must-visit in Hong Kong, especially
      with young kids. Even as adults, we had a carefree, fun-filled day.\"],\"flatten\":false,\"fast\":false}"
