      after i have visit in Paris and USA, this one its not that great.  it's feet
      more to little children.  The show at the evening was great.  I really waited
      to the  space mountain  but it was nice only.\",\"I have never been to any Disney
      Land and this was my first visit. I do not know who was more excited, my daughter
