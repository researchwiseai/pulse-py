      to disneyland on a holiday unfortunately as we did not had much options. There
      were huge queues at most of rides but wait was worth. The pilhar magic show
      and Lion show was indeed amzing. There are lot of small parks with small castles
      and my both the daughters enjoyed a lot. We did not bought much of merchandise
      or souvenirs from here as we found stuff lot cheaper at Hongkong airport with
      amazing discounts on.We had to walk a lot and good we purchase a stroller on
      rent ($100hkd). At the end the cartoons parade and Fireworks show was amazing.Vegetarian
      food was difficult to get and good if you can take your own stuff inside","We
      get there easily by metro .i recommeded to get ticket  from  china travel agency
      as there is crowded in ticket sales .it is much  smaller than paris disneyland
      that i visited previously but ok for  small children .","Disneyland is a magical
      place when everyone is respectful of queues, personal space and general politeness.
      We visited Hong Kong Disneyland in October 2012 and the 2 days were awesome.
      We have brought our kids back as they have been asking for near on 2 years they
      loved it so much, but this time in August it has been a very different experience.
      The weather has been a challenge with rain causing major disruptions to park
      operations. Lightning can also shut down all outdoor rides for 1 2 hours. The
      crowds were huge and as many others have said the mainland china visitors can
      make the day very frustrating. They push and shove their way through queues
      and when you pull them up on it they get upset. I found it exhausting trying
      to stop my kids from being trampled and got sick of arguing with people trying
      to push past us. Disney does make announcements about line skipping but they
      do need to make more of an effort to be a presence during these high peak visitor
      times. I think this Disneyland is great for younger kids. My 3yo went on everything
      that she wanted too and my 8 yo was also well entertained. Tips: get there first
      thing and plan your first 1.5 hours to do your most wanted rides as after that
      you will wait at least 45 mins for everything you try to do. If fast passes
      are operating for any rides get in early as they switch them off when it all
      gets too busy. If you are wanting to buy souvenirs don''t wait until the end
      of the park day to do so as you will battle every other visitor at this time.
      If you are staying for fireworks be prepared that you may have a very long wait
      for the train if that is your mode of transport. I still think Hong Kong Disneyland
      is great but will never return during this time of the year again.","If have
