    body: "{\"set_a\":[\"If you've ever been to Disneyland anywhere you'll find Disneyland
      Hong Kong very similar in the layout when you walk into main street! It has
      a very familiar feel. One of the rides  its a Small World  is absolutely fabulous
      and worth doing. The day we visited was fairly hot and relatively busy but the
      queues moved fairly well.\",\"Its been a while since d last time we visit HK
      Disneyland .. Yet, this time we only stay in Tomorrowland .. AKA Marvel land!Now
      they have Iron Man Experience n d Newly open Ant Man n d Wasp!!Ironman .. Great
      feature n so Exciting, especially d whole scenery of HK (HK central area to
      Kowloon)!Antman .. Changed by previous Buzz lightyear! More or less d same,
      but I'm expecting to have something most!!However, my boys like it!!Space Mountain
      .. Turns into Star Wars!! This 1 is Great!!!For cast members (staffs) .. Felt
      bit MINUS point from before!!! Just dun feel like its a Disney brand!! Seems
      more local like Ocean Park or even worst!!They got no SMILING face, but just
      wanna u to enter n attraction n leave!!Hello this is supposed to be Happiest
      Place on Earth brand!! But, just really Dont feel it!!Bakery in Main Street
      now have more attractive delicacies n Disney theme sweets .. These are Good
      Points!!Last, they also have Starbucks now inside the theme park!!\",\"Thanks
      God it wasn   t too hot or too humid when I was visiting the park   otherwise
      it would be a big issue (there is not a lot of shade).I have arrived around
      10:30am and left at 6pm. Unfortunately I didn   t last until evening parade,
      but 8.5 hours was too much for me.There is plenty to do and everyone will find
      something interesting for themselves to enjoy.It wasn   t extremely busy and
      the longest time I had to queue for certain attractions was 45 minutes (which
      is really not that bad).Although I had an amazing time, I felt a bit underwhelmed
      with choice of rides and attractions. The park itself is quite small (I was
      really expecting something grand   even the main castle which was closed by
      the way was quite small).The food options are good, few coffee shops (including
      Starbucks) and plenty of gift shops. There was no issue with toilets as they
      are everywhere.All together it was a great day out and I really enjoyed it.\",\"HK
      Disneyland is a great compact park. Unfortunately there is quite a bit of maintenance
      work going on at present so a number of areas are closed off (including the
      famous castle) If you go midweek, it is not too crowded and certainly no where
      near as bus as LA Disneyland. We did notice on this visit that prices for food,
      drinks etc have really gone through the roof so be prepared to pay top dollar
      for snacks (and avoid the souvenir shops if you can) Regardless, kids will love
      it.\",\"the location is not in the city, took around 1 hour from Kowlon, my
      kids like disneyland so much, everything is fine.   but its really crowded and
      hot in Hong Kong\",\"Have been to Disney World, Disneyland Anaheim and Tokyo
      Disneyland but I feel that Disneyland Hong Kong is really too small to be called
      a Disneyland. It has way too few rides and attractions. Souvenirs, food and
      even entrance tickets are slightly more expensive than other Disneyland as well.
      Basically, this park is good only for small children and people who has never
      been to Disney. The food choices were acceptable, mostly fast food, and not
      too expensive. Bottled water, however, was VERY expensive but they do have water
      fountains around for you to refill your water bottles. The parade was pretty
      good. It was crowded not a problem but what was the problem was the people were
      just so rude, the pushing and shoving cutting in lines for the rides, gift shops,
      food stands was just to much to take. forget trying to see one of the shows
      its a free for all for seats, i don't see how Disney can let this happen, it
      was by far the worst managed Disney property.\",\"Great place! Your day will
      go by and you won't even know it. Obviously went there for my daughter and she
      absolutely loved it! Too bad the parade got canceled though.\",\"Think of it
      as an intro to Disney magic for the little ones. Almost all of the attractions
      can be completed in 1.5days.One drawback was the timing. For example, Disney's
      Storybook Theatre is closed Wed Thu for private events. Some restaurants close
      mid week Tue Thur as well. So best not to plan your visit during mid week.The
      biggest disappointment is the food at the Park. Even Maxim's is so so only.
      The only decent Restaurant is Main Street Corner Cafe and the Main Street Bakery.
      And do be prepared for the typical abrupt HongKong style service from the serving
      staff.\",\"Feel so let down with this place,the Disneyland train was fantastic
      until you get past the station,bad signage, terrible staff who just did not
      want to be there ,it was rainning and rides were not working could not find
      a map of place, over priced fun park. Disney characters only 2 seen under a
      cabana having photos with visitors queuing up in the rain. Dont waste your money.
      Walt Disney would be horrified, not enough eating places for the amount of people
      or rest rooms. Seems they are building something but who knows what. No atmosphere
      of fun and fantasy.\",\"I can go on talking about Disneyland. Whatever I say
      about it, is less. Disneyland is all about your childhood dreams come true.
      Starting from the Entrance, the environment, popcorn, the shows, everything.
      Even the MTR Trains and the station is specially designed. In my opinion one
      should by a Two Day Ticket to explore it well if you have time. Else few of
      the attractions may remain incomplete in one day. An online Two Day Ticket can
      save around HKD 100 in comparison to an on spot ticket.  Must NOT Miss  attractions
      include the Jungle River Cruise, Micky's Phillhar Magic (a 4D Show), The Lion
      King ShowIt is better to have some home work regarding the Show Timings so that
      you can maximise the number of shows you can cover. It is better to avoid Sundays
      or the public holidays to avoid rush.\",\"Disneyland never cease to amaze me!
      I've been to Disneyland florida and I thought I have exhausted the kid in me
      but nope! I still had so much fun in disneyland hong kong. 2 DL off my bucketlist
      and more to come!\",\"We spent the day here with our grown kids and I have to
      admit we had a great time. It seems the kids never tire of Disney. There aren
      \  t as many rides as the states Disney parks but they have some great ones
      no less. Do the haunted house, catch the lion king show, space mountain, and
      the iron man experience to list a few. They have lots of shops that you have
      to spend some money in of course. The kids will love the day!\",\"We spend two
      days, the second day went early then went straight to the back of the park,
      no lineups for so children got to go on many rides, some twice in a row. This
      Disneyland is very suitable for young children ours were 7,6,5,4,3 and 1 so
      most of them could go on all the rides, it was disappointing the castle was
      closed no nightly fireworks. Would not like to go in the hot season.\",\"It
      was indeed the happiest place on earth! My family had really fun and it made
      my daughter's birthday a memorable one!\",\"This place is HUGE! Definately need
      more than one day. We had 3 children aged 11, 9 & 6 and they loved it. A great
      variety of rides and attractions for all ages. Food options were fantastic with
      3D models of what you were ordering. Staff were fantastic, very helpful. An
      awesome family experience.\",\"We brought tickets before we left and got 2 days
      for less than the price of 1. After visiting would advise everyone to look for
      an online deal not worth the walk up price. Castle was closed due to that area
      being refurbished and altered, weekday aprox no more than a 30 min wait for
      rides with most being less than that would not recommend weekends or holidays.
      As has been said like all Disney parks and theme parks in general food and drink
      is expensive .This is a small park and can easily be done in 1 day\",\"Its huge
      , not enough to visit in one day. We did with 2 days pass ... all the scenes
      were amazing ... you were like in movies, fairytales, etc. At 8 pm, we have
      enjoyed lots with the character show on the street. Must Visit !!!\",\"Around
      \  60 per person and if you want to eat or drink at any point it was cost you
      a small fortune. If you go on a week day like we did I assume like us you will
      wait around half an hour per ride. At the time we went the Disney castle was
      under construction.. it doesn't look like it will be finished soon. Fast track
      is free for everyone but single rider was a lot faster. An average day at an
      expensive place.\",\"It   s Disneyland! It just does not need reviewing!  Place
      speaks for itself.  However smaller than I expected.  Great experience\",\"There
      is nothing more to say except that you become a child once again as you step
      inside Disneyland in HK!  Easy to go and come out with dedicated trams and subway
      stations.  Wait for the parade at sunset it is definitely worth waiting!\",\"We
      bought a 2 day tourist ticket via Klook which made it better value. It was good
      to have a day to get our bearings and a second day to go on the rides we missed
      and to go back on our favourite ones again. It also means less queuing.The shows
      and parades were amazing. We saw the Lion King, Moana and Mickey   s Wondrous
      Book. Unfortunately there is some works on so the Castle isn   t visible and
      the train is not open. We still had a magical time.\",\"First off I'm not a
      really big Disneyland fan. I live about 20 minutes from the California Disneyland,
      and haven't been in over 10 years (by choice). We were on vacation in Hong Kong
      and were able to get free tickets, so why not. First getting there by subway
      from downtown was super easy. I will say I was impressed with how the train
      that takes you there was decked out in all the Disney themes. Next the park
      was okay just super small compared to the one here in California. The castle
      was under construction so that kinda of sucks and the train didn't run. We went
      on a Wednesday so it was slow. There are not a lot of rides, so please don't
      come with that idea. It's a nice place for little kids, but thrill seekers stay
      at home. One tip make sure you read the description of each ride before you
      wait in line, because I will never get those 30 minutes of my life back (Iron
      man experience).\",\"Mickey and the Wounderous book was great and the kids love
      it. The new Ant man attraction was good for all ages. Our four year old love
      the pubs afraid waiting in line because of the loud noises. The 10 year old
      was afraid of Iron Man   s ride it   s good for 12 and I   ll probably but it
      was a great ride. The castle is under major construction so there   s no fireworks.
      Overall the park is still beautiful and wonderful to visit and buy the teacup
      ride there is a good restaurant that has Standard Chinese food at reasonable
      prices for Disney. You   ll Have a great day or two. Still probably the best
      attraction in Hong Kong for children one of the top two for sure. Adults can
      go on roller coasters and other rides as well they will not be disappointed.\",\"I
      \  ve been to Hong Kong Disneyland twice and even with new attractions such
      as the Ant Man and the Wasp, the experience was really flat and not as enjoyable
      as other Disneylands in the region. With Sleeping Beauty Castle under renovation,
      pictures taken at the main square isn   t that appealing with the scaffolding
      in sight. Souvenirs, food and even entrance tickets are slightly more expensive
      than other Disneylands.\",\"GO early if you want to do photos with the signboards
      and Mickey Donald Duck. Otherwise, you could spend an hour just waiting in line
      to get a free photo. The paid photo is also available at a price.Tomorrow land
      Iron Man was excellent and we did it twice.Philar Magic is really awesome.Fantasy
      Land is great for the rides.Adventure Land has some nice opportunities to take
      photos with Tarzan, a treetop house visit, a boat cruise for kids.Grizzly Gulch
      was one of my favourites, Roller Coaster ride was worth the 15 minute wait.\",\"Disneylands
      the world over are generic apart from the language. This was no different than
      the others. It was a shame about all the building work and some closed eating
      areas.  Definitely worth a visit if you have young children.\",\"This was my
      second trip here, the first been about 3 years ago. This is a smallish Disneyland
      park. The attractions are of a high standard but there are few thrill rides
      and no outdoor roller coaster. The park was clean and tidy. Food was expensive
      in the park not of an excellent qualify (ie served like warm or cold) and there
      were few vegetarian options.The castle was under renovation at the time of my
      visit. The park is easy to walk around and many of the attractions are great
      for kids. Lines were virtually non existent with our longest wait 20 minutesOverall
      worth a visit if you are with the kids in Hong Kong and have the time. The park
      entry is also comparatively inexpensive when compared to other Disneyland parks.\",\"We
      have been to Hong Kong Disneyland a few times already but we still want to come
      back. Why? Because there are rides we were too chicken to try the first visits
      that we finally had the courage to try and we ended up loving them. We love
      the Big Grizzly Mountain ride. We thought it will be too scary but we love it
      now. Will be back again!\",\"We visited here on a Wednesday. We arrived for
      opening and found the queue times to be short and had done most the rides we
      wanted to by early afternoon. Unfortunately there were no fireworks due to the
      castle being renovated and we have seen many parades at Disney world so we decided
      not to stay for the evening.\",\"I need to say I have been to    home of Disney
      \   Disneyland Anaheim. HK Disney is about an 8th of that park!    Biggest ride
      \   (as in scary) was Space Mountain. Mostly kiddy rides other than that. We
      did really enjoy the Lion King show. I can   t get over how expensive it was.
      Water equates to $6 AUD a small bottle and a burger combo meal equated $22 AUD!!!!
      We also stayed at Disney Hollywood Hotel   where they have u by the balls and
      charge insane prices ($120 AUD) for buffet dinner or $55 AUD for breakfast.
      There are no shops   cafes   supermarkets nearby to grab a snack or cheap dinner,
      unless u take 2 trains! After travelling thru HK  China for 3 weeks it was just
      crazy expensive for crappy deep fried food or a flavourless bowl of lettuce
      salad. Very few food places open. Castle under maintenance. Train under maintenance.
      vouchers we got on the way in stating ALL shops on main st have 10% discount
      before 1030... then told at bakery    that not here   ?!!! At home that   s
      called false advertising?!! Toy Story land was insanely hot   no shade, sun
      bouncing off light concrete   my husband actually had a hypo while waiting for
      daughter on ride coz it   s so hot. Come on Disneyland... surely you can put
      up some    camo style shades    so waiting parents don   t pass out?! A few
      seats for elderly wouldn   t go astray either. All up pretty disappointing experience
      and about $900 AUD poorer, for 2 adults & 1 child for 2 day pass (note: u won
      \  t need to go back for a second day).\",\"Took a five year old and a two year
      old. Could not fault anything other than a hire pram being pinched, which was
      quickly replaced.  Staff amazing. If you can stay at one of the hotels, do so.
      \ Makes it all much easier.\",\"A great day out even for adults.We can early
      and we're able to do almost all rides in a couple of hours. The restaurants
      were great and a good selection of different foods. Try the caramel popcorn!
      Unfortunately, when we went the bars and 1 restaurant was closed, but still
      other options available.The rides are mostly for little kids bit a couple were
      good for adults. The shopping was the highlight of the day with huge selection
      of Disney gifts and clothing. Note if there is a daily special get it early
      as it will sell out. There is not a lot of shade so bring hats and an umbrella.\",\"I
      went to Hong Kong Disneyland with a little trepidation as our family had been
      to Disneyland in California 6 months previously.No trepidation needed, we all
      loved HKDL! Loved loved loved it.Yes, its much smaller than California and there
      are not as many fast paced rides, none the less, we had a great day. The park
      is beautiful and the experience is just like being at Anaheim.We went on a day
      where large amounts of rain were expected, so numbers were down. We had line
      ups of less than 5 minutes on most rides. The rain held off until 3pm and we'd
      been able to go through all of the park by that time and we were going back
      over rides we wanted to do again. Once the rain started we found that most people
      huddled under their umbrellas, where as we went on all the undercover rides
      over and over.I totally recommend HKDL, just keep in mind it is smaller and
      slower paced than other Disney parks.\",\"This Disneyland is a lot of fun. There
      are many rides that are good like the Iron man experience, hyperspace mountain,
      the toy story car, and many others. I went to Shanghai Disneyland as well and
      that one is so crowded you can   t go on a lot of rides but in Hong Kong we
      were able to ride almost every ride in a day. Lines were very short and the
      park is small so it   s easy to get around.\",\"We have been to Disneyland in
      LA two times, and Tokyo Disneyland Disney Sea. Walking through the gates at
      HK Disneyland felt like going back to LA. This is because the park is owned
      by Disney and HK Government. We loved the quietness of HK Disneyland in the
      morning, most things in HK don't open until 10am, so to walk in with very few
      people in front of us was great. Toy Storyland doesn't open until 11am. We purchased
      our tickets online from Australia and printed them before we left. You are sent
      an email with a link to an electronic version with QR codes and personalised
      characters, but we used the printed version much easier and the website can
      be a little slow. We also purchased the Dining Vouchers as well, this entitled
      us to Lunch or Dinner a popcorn or a iceblock. If you are there for two days,
      like we were then just double the number of vouchers you purchase. HK Disneyland
      uses the old style Fast pass system, scan your ticket and get a printed fastpass.
      We were staying at Disney Explorers Lodge and received fast passes to certain
      rides from there as well. The food in HK Disneyland is aimed at the Asian Market,
      although there are restaurants who serve burgers etc. If you have fussy eaters
      then beware you may have limited choices, but over all the food was Disney quality.
      We ate at the Starliner Restaurant at Tomorrowland.We loved Space Mountain with
      the Star Wars overlay, sooo coool. The is no Pirates of the Caribbean ride,
      sad, but the Lion King show and Mickey's PhilharMagic shows are great fun.Unique
      to the HK Disneyland is Mystic Manor, an amazing trackless ride so fun we went
      on it three times, the Big Grizzly Mountain Runaway Mine Cars is great fun,
      the experience varies depending on where you are sitting, we had front row,
      amazing, and last row, still fun but a little rough. Also unique to HK Disneyland
      is the Iron Man Experience, a ride simulator on a Stark Industries flyer through
      Hong Kong. Lots of fun.When you ride the Jungle Cruise remember to choose the
      English line or Cantonese line as the skippers script is done in both. They
      say there is no difference in the line waiting time, we didn't really notice
      it.Yes HKL Disneyland is smaller than LA Disneyland  Tokyo Disneyland but two
      days allows you to see pretty much everything and not a break net speed. We
      are a Disney loving family and our girls were aged 17, 15, and 10 when we attended
      the park. The Christmas decorations and the parade were great.HK Disneyland
      is on the MTR line just change at Sunny Bay Station for the Disneyland line.
      You can use your Octopus Card to travel on the MTR. There are shuttle buses
      that run from the Disney Hotels to the transport hub at Disneyland and you can
      walk if you want to along the bay from the hotels. It would be roughly 20 minutes
      walk from the Disneyland Hotel along the bay. There is also a ferry that runs
      from Central to HK Disneyland but the MTR train is the best option in my opinion,
      especially as it has Mickey Shaped Windows and Disney theming inside the train
      carriages.\",\"Australian family of four with 2 kids (12 and 9) enjoyed a full
      day out at Hong Kong Disneyland with plenty to do and see.If you have been to
      other Disney's and get a chance to visit Hong Kong   I say definitely do it.
      There are a couple of unique Hong Kong experiences including two Marvel attractions
      \  Antman and Ironman   both which we enjoyed.For thrill seekers there are a
      couple of great rides   The Big Grizzly Mountain was probably our favourite
      \  it was unexpected and fast. And the RC Racer in Toystoryland definitely worth
      the wait.For families with younger kids there is heaps here to do   we kind
      of skipped fantasyland   but for young families you would probably spend a lot
      of the day here.The park is easy to get to as well   the dedicated Disney train
      line was fun to ride on   and with an easily navigable MTR in Hong Kong it was
      simple and cheap to get to the Park.\",\"If your are travelling to Disney land
      from mong cok you can purchase your tickets from one of the travel shops at
      a discounted rate (we purchased ours from Hong Thai travel) this is in the bank
      centre on Nathan road, right next to the Mong Kok station.   if you go to level
      4 there are numerous travel shops (including CTS) which from other reviews that
      I read is where most people purchased the tickets. We asked around the shops
      on level 4 for the price of their Disneyland ticket (including CTS) and we found
      Hong Thai travel the cheapest. The tickets were $557HKD each for adults. I would
      recommend asking around each shop for their price on the day. They seem to all
      open at 10am. The sales advisor will hand you a letter which you then take to
      the box office at Disney land and swap for entry tickets   it was very easy
      and we had no problems. Hong Thai travel Bank centre Nathan roadAs the park
      opened at 10.30am we decided to get a taxi on the way there, this costs roughly
      $200HKD from Mong Kok and takes around 20 minutes.On the way back we used the
      trains, the route is:Disney land to Sunny Bay (pink line)Sunny Bay to Lai King
      Station (orange line)Lai King Station to Mong Kok (red line)The trains costs
      are around $20HKD and takes roughly 1 hour.  if you want to catch the train
      to Disneyland from Mong Kok the route is;Mong Kok to Lai King Station (red line)Lai
      King Station to Sunny Bay Station (orange line)Sunny Bay Station to Disneyland
      (pink line)\",\"Hong Kong is easy to get to via the MTR from Kowloon, great
      signage and fast. Our day started well but just after arriving it started to
      rain quite heavily and didn't stop until mid afternoon. Characters were out
      in the main street but only saw two during the day, probably due to the rain.
      Even though the crowds on entry were big once inside it didn't seem crowded
      at all, Toy Story Land was a ghost town with no one going on the rides in the
      rain. We enjoy the rides that were open and all in all had a good day. Had heard
      great things about Mystic Manor but found it just okay, loved Hyperspace Mountain,
      Ant Man and Ironman. Big Grizzly Mountain Runaway Mine cars were my favorite
      of the day! Though shopping wasn't as good as Disneyland in the USA which was
      disappointing, catering mainly to children. Happy to have visited but don't
      think I'd go to Hong Kong again.\",\"You have to visit to understand the memorable
      experience. It is a place that brings out the child in everyone. You have to
      stay for the fireworks. Food is expensive so take snacks along.\",\"HKDL got
      different event for different period. Like Jan Feb for Chines New Year, Apr
      May for Spring Carnival, then Summer, Halloween and Christmas, each event got
      different theme for both charaters costume and decorate, and sometimes might
      got the special daily parade too. Thats why recommend to check clearly which
      event you want to join before you make the disney trip. If you don't like crowded,
      Mar & November without any event happening will be your choice!\",\"The park
      is great if this is the only amusement park available to you. It is small and
      the rides are very tame. The park can be done in 3 4 of a day. Disney is always
      clean and has the best customer service.\",\"Visited here with the family and
      had a very memorable experience. It didn   t seem as big as Anaheim, but very
      clean and well maintained.  Received priority queuing passes but didn   t need
      them as the lines were very short.\",\"It's always going to be fun at Disneyland.
      These are a few of my reminders: don't bring selfie sticks and huge tripods
      you can bring bottled water or if you have a reusable container, use that instead
      food can be expensive so eat plenty before going here. Just don't ride the rollercoasters
      right away. don't miss the Festival of the Lion King Show. You can forget the
      Moana production though if you're expecting the songs from the movie and to
      see Maui wear comfortable shoes. there will be lots of walking have fun and
      don't get discouraged by long queues. you'll have your turn sooner than you
      think.\",\"To be honest it rained nearly all day, if the weather was better
      i'm sure my overall impression would have been much better. It lacks the thrill
      seeking rides of other disney parks. That being said it also lacked the ridiculously
      long quees. Waits were around 5 minutes!\",\"A super small but cute Disney park
      \  if you're a Disney fan you tick this park off in a day though, be warned,
      if you're used to the service in Walt Disney World and Disneyland, it doesn't
      seem to  translate  as well at Hong Kong Disneyland. The food is also not as
      good   we had lunch from the Lucky Nugget Saloon, which was mediocre at best.A
      fun day though, regardless.\",\"Plaza Inn was fantastic, and the kids in our
      group loved the rides. It   s smaller than Disneyland, but if you love Disney,
      it   s worth the visit. If you   re not super into Disney, I   d probably skip
      and just go to Disneyland in Anaheim.\",\"We first did Disneyworld in Orlando
      some 40 yrs ago with our 2 year old.Back then, we had to buy different value
      tickets for various rides whereas that has changed and the entry fee now covers
      all rides etc, except for food. What hasn   t changed. The place is remarkably
      clean and well maintained given the number of visitors they see each day. Some
      rides had a long wait ie 40 minutes, so skipped them till later in the day ie
      4 5pm, and the wait period was down to less than 10minutes.A very full day.
      We got there around 10.30 am and left when the street parade finished at around
      9.15pm. Exhausting, but simply loved it\",\"Had a great time at Disneyland.
      Great, but can be busy on Saturday and Sunday. Only point to note, is that the
      park opens at 10:00 but the first zone does not open until 10:30. I purchased
      priority tickets, if going at the weekend I would recommend priority tickets.
      Queues smaller during the week and not sure if priority needed.\",\"We had a
      terrific time at Disneyland HongKong   rides were fun, waiting times ok, shows
      were enjoyable, very clean, staff super friendly   only let down was average
      food but to be expected.\",\"Even though the rain set in for most of the day,
      as an adult we still had a fun time at Disneyland Hong Kong\",\"Good to see
      while here, but very small. Great if we brought the children, but not for adults
      who have been to other ones. Not exciting for bigger children either.\",\"I
      love Disney, I even worked at Disney World in college so when we came to Hong
      Kong I knew we had to visit. I didn't visit the one in Paris when I went and
      I regret it. Hong Kong Disneyland is the smallest of the Disney Parks. We were
      able to ride all the rides in 3 hours when we first arrived at 9:30 a.m. I loved
      the Wondrous Book of Mickey and the Mystic Manor ride. I also liked the new
      Ant Man and Wasp ride b c it's like the Buzz Lightyear Space Ranger's ride in
      Orlando. I also liked how all the characters were dressed up for Easter and
      the Easter decorations they had up as well. I loved both parades, the afternoon
      and the night time one reminded me of the Electro Magic Parade that was in Orlando.
      If you're a Disney fan then you must visit Hong Kong Disneyland!\",\"Small disneyland
      catering to kids, but they have some nice rides including the new Ant Man ride.
      Pricey food and somewhat long queues but that is part of the theme park. Try
      to go in the morning and then again in the evening, best is to stay one day
      at the hotel to maximize the park.\",\"It was very essay to go from the city
      to Disney central Station. We bought tickets on sight with the additional VIP
      Status so that we didn't have to line up.It was a week day and the park was
      not full  it was heaven. My only downside to the experience was that the main
      castle that appears on all their publicity was under reparation and it was very
      hard to find a restaurant with a variation of vegetarian food unless you liked
      pop corn, corn on the cob or a vegie burger in one of their fast food outlets.
      We really enjoyed our selves and so will you. Mind you I am 50 and my friend
      is 30 something...so it works for adults as well.\",\"Awesome attractions that
      blew my mind away. The attraction is filled with amazing rides and entertainment.
      There are also halal food that definitely cater to my needs. Glad to be able
      to meet Mickey and friends.\",\"Great fun for the family.  The fact that it
      is a smaller park than other Disney   s is a plus.  Facilities seem new and
      loads of different games.\",\"Love this place very clean and safe have it own
      MRT to get here !!! Night time is beautiful too many things to do\",\"The Hong
      Kong Disneyland is quite small, there are too many people and the waiting line
      is long. it took average one hour or more in the line. however, the transit
      Disneyland tram is very nice, very impressive!\",\"I visited here with my parents
      and 2 teenage sisters, we had a really fun day! The food offerings were good
      (albeit expensive). It was incredibly busy, but I think all Disneyland's are!
      Very easy to get to from Central Hong Kong. I think my highlight was the gift
      shop which was huge!! I would definitely recommend for a family day out.\",\"It
      was ok. This Disney is more catered for smaller children rather than adults.
      Some of the areas were closed. There was only one really thrilling ride. the
      rest are for children. Maybe needs a few more western restaurants as well.\",\"Went
      for day xx brilliant food x was holiday day for local people so very busy buy
      so polite .. had a great time\",\"I would recommend to go through below tips
      to navigate easily and manage most of your time at this marvellous amusement
      park.We visited during new year with 2 year old infant so some points could
      be helpful for fellow travellers.Tip: 1. dont take big luggage or even trolley
      bag while entering as they wont let you inside plus you have to PAY to use thier
      storage service also..only BACKPACK (read not too big) is allowed.2. Book online
      from klook app to get discount. This only saves time as on spot booking as long
      que.3. Always reach disneyland by its special metro train as its interior is
      superb and gives you great feel.4. Take map or use free wifi to access their
      app for show timings and ride schedule.5. Do not miss any of the live shows
      as they are worth watching and direction is highly creative.6. Always ask from
      disneyland employees at ride entrance exit for stickers as they usually keep
      and gives it for free as soveniour, even when you leav door person can also
      give you some JUST REMEMBER TO ASK POLITELY.Rest this is worth visiting and
      whatever age group you belong you cannot miss DISNEYLAND LA LA LAND!!!\",\"A
      very small Disney and the castle was being worked on but overall had an amazing
      time. Was able to ride all the rides we wanted to ride. Very nice staff, lovely
      experience.\",\"Way smaller then the others and staff did not interact with
      kids as much as every other then park around the world. Signs to go where hard
      to read.. Arrows pointing in random direction, son is autistic so got told to
      take him around to priority que but who knows where that was.. Not many ques.
      Which was a bonus. Toilets plentiful and clean. Good shading and plenty of seats.\",\"Superb
      atmosphere in HK Disneyland. Must enter the park by 8am soon it   s opened and
      have more than enough things to do until dawn. Better check which amusements
      are under renovation as usually it has 1 or 2 parks under construction everyday.
      If this is your last item in HK tour you can check in luggage at Kowloon station
      and visit Disneyland. But recommend to reserve two day ticket if you want to
      try out all excursions. Fantastic creation and life time snaps to capture in
      48 hours.\",\"You will love this place for the fun, food and the nostalgia it
      creates! Even when you are not a great mickey fan, you have enough avenues to
      enjoy.   Its not just for kids; even adults enjoy this.\",\"Just so friendly.
      \ Lovely food.  It was Halloween time and we had a great time.  It was good
      that y on could see everything in in one day.\",\"The hotel is clean and tidy
      . The environment is nice . Staff in this hotel is very nice and effective .
      Swimming pool is good for children . A good resort feeling hotel and a lot of
      activities for children to play . Better to provide the photo taking for the
      hotel guest with Disney Explorers Micky as a souvenirs with the Explorer bathrobe
      .\",\"My son and his wife and three children recently visited Disney HK. They
      had a great time exploring it and said there were virtually no lines!!The one
      fault they found was in the food. Children   s food was very lacking in variety
      and taste. Our grandson who must be gluten free had no selections on the children
      \  s menu that he could eat. They had to purchase a $60 steak that was not the
      best either. They have frequented Disney in the US and it is very conscious
      of allergies and gluten free menu items are readily available. I would implore
      the Hong Kong ownership of this American icon to be more sensitive to these
      needs and make some much needed improvements to their menus.\",\"Took some family
      to park for their first time at a Disney park. They loved it and it was a joy
      to see the kid in their eyes as they enjoyed all that it had to offer. Weather
      was great as well.\",\"My first ever Disneyland, couldnt ask for more. Rides
      were good, shows were good, performers were all excellent! Rides more towards
      kids friendly. But theres a couple of adult rides. Overall a great experience.\",\"During
      a recent stop over in Hong Kong we paid a return trip to Disney. We chose a
      day when the park was quiet so our longest wait was 30 minutes I am sure this
      is not the case at other times.Unfortunately some of the rides were being tested
      or being upgraded. To prevent disappointment check out closures before you go.We
      didn   t eat in the park as previous experience of it   s restaurant were disappointing
      and very expensive.This was our third visit to the park, whenever we visit Hong
      Kong a visit to Disney is a must.\",\"We had an impromptu trip to Disneyland
      on a weekday. I love the trip because there is no wait time or at least 15minutes
      wait time for the rides. Limited restaurants though because maybe it   s a weekday?
      The bad part though is that the castle is under renovation and there are on
      going construction in the park.\",\"this is a wonderful place to bring your
      kids of all ages!!!it was very well kept and clean!! alot of rides for young
      kids...amzaing staffs around!there were halal foods which was wonderful!! it
      was fantastic at night and the light parade was fantabulous!!!Its a MUST GO
      for parents with young kids!!\",\"Who wouldn   t enjoy Disneyland? Hong Kong
      Disneyland is really easy to access. They have special metro to Disneyland and
      special designed. You better get there before 10 and directly queue until the
      parks open (at 10), so once it open you can enjoy many rides without long queue.
      Just be there on weekdays, avoid weekends!For muslim traveler, you shouldn   t
      be worry since you can find halal restaurant inside called Tahitian Terrace.
      It is located close to Tarzan   s Treehouse. The price ranges from 120 150 HKD
      if i   m not mistaken. I enjoy big rides but avoid big thrill drop. I   ve tried
      almost all rides except Big Grizzly Mountain Runaway Mine Cars. Shame, i   m
      afraid of fast backward drop lol. So far I enjoyed Ant Man and The Wasp: Nano
      Battle, Hyperspace Mountain, Mystic Manor, and Mickey   s Phillarmagic!\",\"It's
      my second time here but it's my daughter's first time in HK disneyland.Staff
      were nice but we weren't given much priority despite being 7mos pregnant. Overall,
      the theme park is still nice however, the comfort rooms were not well maintained.Shocked
      to find that regular malls and even Ocean Park provide toilet cleaner liquid
      dispenser in every cubicle and Disneyland has none! Maybe it's time to upgrade
      it as well.\",\"Although this is apparently a small Disneyland, I loved it.
      Being from NZ, it was the first Disney I had been to and everything was amazing.
      The shows, the rides, the attention to detail. Highly recommend it, although
      you really only need one day. never queued for longer than 10 mins on a Tuesday
      in March.\",\"We bought a package through the Disney website. We started at
      the Explorers lodge and the package included several priority passes (like fast
      passes). We actually never needed to use them because the longest wait time
      for a ride was 10 minutes. All of the shows and rides are in English and most
      cast members speak English really well. This park is the smallest of Disneyland
      parks in the world, but we still felt like there was enough to keep us busy
      for our day and a half that we were there. The bus shuttles were very clean
      and ran on time.Would definitely go again next time we are in Hong Kong.\",\"great
      way to spend a day in Hong kong as a tourist, easy to wander through the park
      and lots of fun, overall good value, found some good souvenirs along the way..food
      a little expensive as is with most parks a should do if your over that way\",\"I
      went to HK Disneyland on 5 April which happens to be Qing Ming festival and
      did not expect the massive crowds on that day. Queues for rides and F&B outlets
      were very long and we did not have a great experience especially with a young
      kid. For the amount spent on the tickets, it's really a waste of money as we
      only sat on a few rides. I'm wondering if the park has any cap on the number
      of guests in the park as we had a hard time finding seats around. I booked my
      tickets via the Disneyland Hotel online but there was no info or confirmation
      given to me whether my park tickets are booked. In the end, I was unable to
      enter and had to buy tickets on the spot. Luckily, one of the cast members,
      Carmen, helped us to resolve the issue and let us access without queuing up
      again. Also the balloons there are overrpriced   HK150 for a helium balloon.\",\"We
      have been to LA and Florida Disney MANY times so we were told we would be disappointed
      with this one. Not at all! We loved it. It had different rides and shows while
      still having the same layout and Disney feel. It is expanding a whole lot at
      the moment. My suggestion would be to add more food restaurants as the food
      lines were as long as the ride liens. We purchased online tickets and bought
      a partial ride upgrade. We wanted the full ride upgrade but it was sold out
      for the day. IMHO it is well worth it! We spent opening to closing there and
      loved it. The midway games were fun\",\"already went the for 4th times and it
      will never enough. It was a truly magical experience. Even though it is a small
      park but full of excitement. The parades, the rides, the characters and cast
      members all blend to make a great day with the kids. Going there by MTR was
      so easy.\",\"My wife and I brought 2 daughers in law to Hong Kong Disney recently.
      It has been more than 5 years since our last visit to Disney. Many new attractions
      have been added and we enjoyed very much during the visit. Our favourite ride
      is the Mountain Runaway Mine Car even with our age ranging from 12 to 59. In
      fact, we played 4 times all together and if time allowed, we would play more
      ! Take the ride disregarding your age when you visit Hong Kong Disney and have
      fun.\",\"We had a local family member to take us round and he knew all the tricks
      to get around but the park is so super busy with so many queues. Kids enjoyed.
      I think evening is way better as easier to get on rides without queues! Avoid
      weekends and local holidays! The lion king show was fabulous!\",\"Definitely
      a fun place to visit whilst in Honkers. We had loads of fun there and would
      recommend a visit\",\"Everyone loves Disneyland !!! If you are traveling with
      young kids I would really recommend staying at one of the three Disney hotels.
      The hotels provide coaches, thereby making it more convinient. We stayed at
      the Disney hotel for two nights, the high point being the visit by the Disney
      characters at breakfast .  We also took a two day pass, it made the whole experience
      more relaxed and easy going.  Vegetarian food is only available at one of the
      restaurants. But the taste and quantity is good.  The park itself is well designed.
      There are enough options to engage very young kids to older kids.  The parade
      is not to be missed, as well as the different photo opps with all the Disney
      characters.  Other than the rides my kids really enjoyed the opportunity to
      dress up as young Jedi   s n fight the evil forces . A great family vacation.\",\"This
      was a true highlight of our trip, they suspend reality so well in the park each
      lands attention to detail is incredible in decor, the sounds   smells, the staffs
      costumes and personas. There is truly something for everyone of all ages. The
      lines where very well managed with even on opening day of the new marvel ride
      just around 40 mins wait. Make sure you use smart fast track passes where you
      can they are free at some rides.It   s fair to say this park is much smaller
      than the others but somehow in that it becomes so much more charming.The staff
      could not do more for people bending over backwards they clearly love their
      jobs. They just seemed to intuitively just know what people needed.Would strongly
      recommend anyone with a day or two to spare. The current two day ticket offer
      was great for us as we did most of the flagship rides day one and the show and
      on the second day the other items.With this very close proximity to the airport
      and cheap bag storage it   s an ideal place to stop over or visit on your last
      day like we did heading straight to the airport after.\",\"We've been here quite
      a few times and one of the better Disney's as queues are short and small enough
      to see everything in a day.We went mid week so was lot quieter and bought our
      tickets through Klook which was easy, but many of the rides attractions were
      under refurbishment and around 50% of the restaurants were closed (presumably
      due to less people). Price stays the same though! So you may want to double
      check in advance if you really want to experience any that might be closed to
      avoid disappointment.\",\"Bucket list unlock.      One of the best trip we ever
      haven. Enjoy every single second inside Disneyland must to try every rides of
      it.\",\"Hong Kong Disneyland is definitely a must see. It is a smaller park
      but what it loses in size it makes up for in quality. Hong Kong is currently
      home to the only Marvel themed rides and they do not disappoint. Hong Kong has
      many of the standard rides shows you expect from Disney but it also maintains
      a variety of exclusives. Hong Kong also has a lot of exclusive merchandise especially
      pins. Also most if not all of the rides are Bilingual.\",\"Buy your discounted
      tickets on Klook (thus no ticket queueing when you arrive), get the MTR to Disneyland
      (35 mins from Hong Kong station where we had breaky at the Pret A Manger in
      the shopping mall there.). Take in lots of water as it   s expensive in the
      park. We also took in kids food and snacks as they are expensive and not great
      quality, you get searched on entry by if you have a good bag with many compartments,
      it   s easy to hide! Get there at 1015am latest and when the gates open at 1030am
      go straight for the Star Wars or ToyStory area. Only 2 or 3 rides have the fast
      pass, if you want to go to the Winnie the Pooh, use it there as the queue was
      long. Toy story land was great and big queues for the green parachute ride,
      so that   s one to go to first if you don   t start with Star Wars. The 245pm
      street show was very good (no need to get there early) but we were disappointed
      not to see the lion king show that is not currently on (download the free Disney
      HK App   will tell you what   s happening when). The Lion King show is a not
      to miss apparently and you have to get there before the street show ends or
      you might not get in. Recommend the musical show in the big Theatre, that   s
      next to the Small world. Saw the 1230pm show with lots of singing and Mickey
      Mouse and goofy !Our highlight of the day though was Mine train  amazing. Went
      on it 5 times.All in all, a good long day out   too tired to stay for the 730pm
      lights show !\",\"Despite being one of the smaller parks of the company, two
      days are really worth while with a five year old and a baby. It is most relaxing
      as you will find enough time to enjoy. The transfer with the metro and the disney
      line works like a charme, all super clear signposted. Truly a fun day out with
      the kids.\",\"This was our first family trip to Disney as a family (hubby and
      I have been to LA before we had kids). We left the hotel at 8.30 am even though
      the park didn   t open until 10.30. I   m glad we did as it took a little while
      to get there and get tickets etc. We bought the Priority line pass for an extra
      HKD$299 but it was a big waste of money as the park wasn   t busy and we only
      had to wait once for a ride. As the park wasn   t busy there were many food
      shops that were not open. Our kids (13 and 10) loved the rides and went of a
      few of them several times. My 10 year old cried when we were leaving as she
      didn   t want to go   so she must of had a good day! It was long and our feet
      hurt by the end of the day because of all the walking but it was definitely
      worth it to see the kids having such a good time. We don   t AUD$670 on 4 tickets
      including priority line passes.\",\"This is the 10th time to Hong Kong Disneyland.
      I'll always recommend going on a weekday as on the weekends everybody goes with
      their children and the queues are doubled. The castle and other attractions
      were shut but they always inform guests on their website. The staff are nice
      and speak English so there's no need to be intimidated by that.\",\"Didn   t
      feel the Disney spirit in this place. There were few Disney characters around,
      but one must wait in long lineup to shake hand with them. We stayed for only
      couple hours and left.\",\"Fantastic  Nice place and kids friendly  Easly to
      get food in that area.   Better buy ticket from online, traveloka i guest  Because
      we can save our time before come to this place. Near from bus station and MTR
      station\",\"What is there not to love about Disneyland? The attraction is well
      run, well worth a visit and a fun day out for all ages. The park is easily accessible
      from Hong Kong central by train and highly recommend the street parade and staying
      to see the park light up at night.\",\"Friendly staff and cooling weather! Used
      Klook to purchase discounted tickets and scan QR code to enter was easy and
      fast. Enjoyed the time with my kids\",\"Smallest Disneyland and spent a day
      here. Having just gone to Tokyo Disneyland in February and comparing with this
      one in Hong Kong, I would say that this is a smaller theme park. However, they
      have packed quite a lot of activities and rides into a smaller area so there
      are still a lot to do for a day. In fact, Hong Kong Disneyland is newer and
      has more updated areas such as Iron Man and the upcoming Ant Man. Not very crowded
      when we were there during a week day but there are still short queues for the
      rides.The parades during the day and night were similar with most Disneyland
      but shorter and not as many floats. Went for the Mickey show as well as Lion
      King shows and they were enjoyable.\",\"I'm a big Disney park fan and a regular
      visitor to Disneyland Paris, so I was very excited to visit a new Disney park.
      We had a great time here, but compared to Paris, Tokyo and Florida (the others
      I've visited) it was very small with a limited number of rides and no real thrill
      rides. Space Mountain was very tame compared to all other versions.I'm serious
      about my Disney parks but struggled to fill two days here   I'd recommend only
      visiting for one day.The highlight was the shows   the Lion King show and the
      Wondrous Book were the best quality shows I've seen in any Disney park. The
      staging, live singing and performances were all very impressive.The food options
      are also really good with lots of variety.\",\"It   s a very huge game cum theme
      park, so if you are travelling with cute little ones make sure you have enough
      things to eat and drink. Although lot of restaurants and eateries are there
      but most of them are occupied in peak hours. It is an evolving theme park with
      addition of new games every year I liked the stark area in sci fi zone. I waited
      till 8 pm and witnessed the Disney   s signature parade too. Please expect waiting
      time of 20 30 mins for each ride.\",\"The main attractions were shut while we
      still paid the full entrance fees, without any intimation either online or as
      the ticket kiosks\",\"While it's not as great other Disney properties. This
      park as all the fun rides and attractions to give you the Disney fix. Mystic
      Manor is a great unique ride that plays the part of the SEA story that Disney
      is trying to tell. Overall it's fun to go visit when the crowds are low. Be
      sure to check your timing before booking your visit.\",\"We made it to Honk
      Kong Disney on the MTR and it was easy, quick and pretty convenient. We purchased
      our tickets onsite and used the online 10% discount for foreign travelers just
      by showing the web page and our drivers licenses. Much easier than buying online.
      I downloaded the app and it was great as a map and to track wait times for the
      rides. Most rides had 5 to 40 min waits. I recommend getting the fast pass for
      Dumbo as it was the only line that took MUCH longer than the advertised wait
      time. We were able to get on all the rides and still make it back on the MTR
      at a decent time but the train was pretty packed. Overall a very manageable
      and enjoyable Disney experience in a day.\",\"Even though it is smaller, there
      is great rides and and wonderful atmosphere. The paint the night parade is a
      must. Hard to find good lunch food choices but didn't matter. Great shops. Longest
      ride line was 20 minutes. 4 year old daughter did princess makeover and that
      was super cute. Ask all staff members for stickers, they generally have different
      ones in their pockets. We did 2 days and could have easily done a 3rd.\",\"We
      tried to buy our tickets online the day before but after entering payment details
      it said try later. We tried with a different card and it still gave the same
      message. The credit card company said the payment was taken but we had not received
      a booking confirmation. We took a taxi from TST area and it was not expensive
      and in an air conditioned car it was a pleasant journey. We arrived about 10:30.
      The next day at the park we had to waste time at guest relations where we were
      told the payments had not been taken, so we bought our tickets at the park.
      We will need to check our card statements to ensure no payments have been taken!We
      did not know if we should add the priority pass to our tickets as there was
      no information on how long the queues were at the entrance, unlike parks we
      have visited in the US, so we purchased them.Whilst at The Iron Man ride the
      priority cards were scanned on entry then scanned again before getting on. This
      is where two of the priority rides were recorded as used but it should only
      have been recorded as once   we did not know this at the time. When we tried
      to use our priority pass for the 3rd time later we were told we had none left.
      This was very embarrassing in front of the other park Guests. We said it could
      have occurred at Iron Man as they scanned it twice and was told to go back to
      Iron Man! We were tired by this point from going around the park and did not
      want to walk back there and so said we would go to Guest Relations instead.
      Guest Relations were not apologetic. We were offered the priority ticket for
      our next visit but we are from the UK and do not expect to return! We were offered
      a soft drink or popcorn   whoopy dah! We had just had lunch   no thank you.
      So we left with it not being resolved to our satisfaction.Please be careful
      if you buy online and if you have purchased a priority pass!The queues were
      about 15 30 minutes.We did have a great time at Disney but the pre purchase
      and priority pass experiences have left us feeling dissatisfied rather than
      elated and we still need to check payments had not been taken, so our negative
      Disney experience continues, even once back in the UK for the next few weeks.\",\"Went
      to HK Disneyland via the MTR ( easy to get there and back) early March. Most
      days before were light showers but not cold. Our day was no rain :) and it took
      only 5 minutes to get onto the rides we wanted. Wife had never done a disney
      trip before and got some good shots with the Characters. She thoroughly enjoyed
      the Main Street parade and when we left the train was 2 minutes walk which was
      easy to get to our hotel.\",\"Spent 2 days in Disneyland with my young children.
      Our 2nd time actually to the park. A must visit to everybody if ever you have
      the opportunity !\",\"We were disappointed with HK Disneyland. The train wasn't
      running and the Castle was under renovation, as were several other areas. It
      had an air of dilapidation. Our coach driver advised us to take food in, not
      in our bags, which would be searched, but in our pockets. The reason for this
      was that They want to make you pay the incredibly high prices for food they
      sell. He also suggested not buying souvenirs there, but taking a picture, then
      getting the item from Ali Baba (or Ali Express I suppose). A basic souvenir
      mug cost A$20 approx, and watches were about A$80. The parade though, was fantastic,
      and made up a lot for the rest of it. It's on twice a day, in the afternoon
      and evening. The fireworks that we'd previously seen there were suspended for
      a while, due to the renovations. An MTR station is right there at the gates
      \  change at Central for other lines. There's also a ferry but it limits you
      to certain times of leaving, so MTR, taxi or bus is better. For a senior, HK$2
      on the Oyster Seniors card gets you all the way back to a station close to your
      hotel, so don't bother with a tour.\",\"It is my second time coming to HK Disneyland.
      Unlucky us, it rained. Haha! Although rain didnt stop us from enjoying. Its
      just sad that the afternoon parade was cancelled. But during the night when
      the weather cleared, HK Disneyland pushed through the Paint the Night Parade.
      It was my first time seeing it. 6 years ago there was only fireworks behind
      the castle (which is now still under renovation).My family and I will definitely
      go back. Love seeing my little one enjoying Disneyland.\",\"HK disneyland was
      a great experience during Xmas, the celebrations and rides were great. People
      management was also top notch. Renovation of the main castle was undergoing
      when we went which was a disappointment so was the main night parade cancellation.
      We waited till the last moment but rains ruined it. Some refund or voucher would
      have been appreciated for cancelled show and castle renovation.\",\"The start
      of the journey to reach Disneyland by MTR gives a fun ride with the train painted
      with disney characters. There is also a train within the Disneyland which helps
      you reach some attractions.\",\"I have been there 5 years ago with my wife..Now,
      i go there with my children..It's really nice to spend time with your kids in
      this theme park..Some problems:1. Castle is under renovation2. No fireworks3.
      Lion king under renovation4. Princess photo is limited only (no elsa of frozen
      is available for the photo session).. quite sad because she is my daughter's
      favorite princess...\",\"Visited this theme park on 26.02.19. Overall, it was
      okay. Nothing spectacular. I have previously been to Disneyland Anaheim, Disney
      World Florida, Disneyland Paris, Tokyo Disneyland Disneysea. HK Disneyland is
      tiny, but fortunately not many crowds. The haunted house (mystic manor) was
      weird, though. I would expect something along the lines of other Disneyland
      parks, but yeah maybe it   s a cultural thing (nothing beats haunted house in
      Universal Studios Singapore during Halloween Horror Nights, fyi). Overall, my
      kids had fun there. Main reason why we went to Disneyland.\",\"I took my kids
      to Disneyland on weekday which was a great decision as there was minimum rush.
      very small queues. we reached there by 10 and started with Tomorrowland. we
      did all the rides by 5:30pm and left by 6:00 pm. Hyperspace mountain, grizzly
      mountain, jungle cruise, Mystic Manor and Iron man experience are a must do
      rides. better to buy tickets food combos from klook. you do not have to stand
      in queue. just scan barcode and enter. Also, most importantly, take your food
      coupons just after entry so that you do not ahve to return later to get the
      coupons. We went to Royal Banquet hall for food. average food. carry water bottle
      as water is expensive there.\",\"We liked this compared with United States because
      its easier to navigate because its smaller and there are more rides for little
      ones. We went on Wed. and the line was short. Only from 5 minutes to 15 minutes
      wait. Unheard of in the USA. You can get here easily with MTR. Expect to spend
      a day here. They open at 10 am. The Moana show and the Disney Tale Story Show
      was our favorite.\",\"The monastery is really a beautiful place. The giant statues
      are truly awe inspiring, best seen on a clear day as the clouds can really limit
      visibility.  Great views from the tram up as well but Nong Ping is very commercial.\",\"We
      had a fun day here, it was quite busy and wait times were roughly 20   30 minutes
      per ride. Plenty of eating places and souvenir shops available. There were a
      couple of good rollercoaster rides, but nothing like Disneyland in USA. I would
      still recommend it for a good day out.\",\"Optimal size to try most rides in
      one day, if queue is less than 30 minutes. I wish there were more affordable
      gifts in shops and food and beverages.\",\"Tickets were cheaper than other Disneys.
      Fast Pass was the bomb as we pre bought. The best rides were Mansion and the
      Grizzly Man Coaster. Space Mountain is not as good as Florida, California and
      even Paris. Ironman is okay. Pooh bear is good. This park is way smaller than
      the others which keeps the day simple. You only need one day here.\",\"Having
      been to Florida, Anaheim and Euro Disney, Hong Kong Disney is definately the
      smallest, however given 5 hours to a day of spare time we think it is worth
      a visit. Limited number of rides but still fully professionally set up in true
      Disney style. The shows equally up to Disney standard.\",\"Without a doubt,
      a true Disney experience.The parades, the rides, the characters and cast members
      all blend to make a great day with the kids.The journey is not long, and the
      MtR takes you literally to the front gate, so it is convenient for strollers.They
      will allow you to enter with baby food, as there are not many healthy options
      inside.With the classics like Small World, the park train, Main St. and the
      Castle you will not lack any of the    magical    feel.Make sure to have your
      tickets before as the line can be tedious in the morning, so don   t waste any
      time at the ticket counter\",\"I've seen many negative posts and comments on
      HK Disneyland in the past. It is really not that bad. Yes, it is expensive and
      small but it has tons of rides for all ages.As an HK resident, I always go to
      Hk Disneyland and the experience is the same every time. Whether it is the parade
      or the rides, the park is incredible. There has been tons of revamps in the
      past few years with the farewells to Autopia and Buzz Lightyear Astroblasters
      but has been replaced with a brand new section in Tomorrowland featuring Iron
      Man and Ant Man coming in April as well as a brand new revamp of Space Mountain.
      The staff are extremely helpful and the gift shops have loads of merchandise
      and souvenirs. The park is also extremely kid friendly. The only negative I
      can extract from this park is the food price. The food isn't that bad but for
      it's quality, it is way too expensive. Since visitors aren't allowed to bring
      food in, you might have to starve for a day or buy an expensive meal.If you
      have lots of free time in HK and want something enjoyable whether with the kids
      or with your mates, HK Disney is a great park although if you are a major thrill
      seeker, Ocean Park would be more suited for you.\",\"Very very small, disappointing
      all along the line... the park is too small, without big attractions. In 3 hours
      you will have seen everything. There was construction with a lot of noise during
      our visit. It was ridiculous to visit the enchanted forest when you heard a
      jackhammer!! The maneges are limited. The prices are high for the quality of
      the park. It is better to keep your money and invest it in another activity\",\"The
      place is no less..It is Disneyland :)My kid had amazing fun and the place is
      massive.It is such a wonderful place to visit when your kid is old enough to
      qualify all rides.My boy is 112 Cms and pretty much qualified every single ride.I
      loved adventure land personally as it is involved tree houses,boat rides etc...Mystic
      Mansion was out of the world..soooo digital and so well done..Eating options
      for Veg folks are very very very limited.Asked around inside the park about...veg
      food and people kinda looked at us weird..lol..Vegie Burger was the best we
      could get at 98$...Was not great but DLand compensated for the non food part..You
      could have ice creams at 45 HKD and pop corn at the same price.I liked the HK
      Tea in packed form.it was good.Bus from Disneyland R8 to Lantau costs around
      6 HKD(very inexpensive) and i stayed at TST(Tsim Sha Tsui).From Lantau toll
      toook A21 to go to TST Prat Avenue.Costs around 28 HKD per Adult and around
      20 HKD per child below 11.If you take a taxi from Dinsey to TST,considering
      decent traffic,it would set you off by 205 HKD one way.Peak traffic could cost
      you around 250 HKD to 275 HKD.Disney is a must visit and we took 2 days to do
      it as queue(s) are long and minimum it took us 45 mins of queuing to get to
      any attractions.Infants and toddlers,cap is mandatory and be ready to buckle
      up and stand the long queue(s),unless you have a priority pass.\",\"I really
      loved Disneyland! The two must rides are the Mystic Manor and the Grizzly Gulch
      Runaway Mine Trains. Both are excellent. Highly recommend going on a weekday.
      We did not have a wait longer than 20 minutes any where on a Monday and Tuesday.
      You don't need the Priority Special or Priority Special   on weekdays.\",\"Came
      here 1 day after Chinese New Year, it was very crowded, try googling for the
      best time to visit the Disneyland. They had a few big parades around the theme
      park at certain hours, the last one was at 2000 hrs. To avoid rushing back with
      other visitors, I tried staying back after the last parade and got on the MTR
      after most of the visitors had left.The theme park provide strollers for rent,
      be careful not to lose the deposit slip or they wouldn't cash your deposit when
      you return the strollers.My kids enjoyed every parade especially the last one
      at 2000 hrs, with all the lightworks and Disney characters out on the street.\",\"An
      Amusement Park for all ages. Disneyland is for children and a adult that are
      young at heart. Its a place that you will enjoy. The best time to visit is March
      were the weather was good, that you will enjoy roaming around.\",\"This is my
      first time going to Disneyland Hong Kong. Unfortunately the Cinderella castle
      is being renovated and firework show being canceled. Shows such as Mickey and
      the Wondrous Book or Lion King are amazing. The parade in the afternoon is also
      good because we can see all Disney cartoon characters coming out. I love big
      grizzly mountain runaway because it was thrilling. I recommend you to buy popcorn
      which sold at stand throughout Disneyland, it tastes good.\",\"In HK now crowds
      are the norm, and Disneyland is no exception. It was a weekday but was still
      very crowded, I hate to think what its like on the weekend.Some areas were unavailable
      due to remodeling works, which was sad, but some new areas had been opened since
      our last visit and these were quite good.There are lots of rides for  children
      \ of all ages, so enjoy yourself and have a good day.Buy your ticket before
      you arrive, saves time and some queues, and many times they are cheaper than
      at the gate.Easily accessible by the MRT from all over HK. Its not the biggest
      Disneyland in the world, but it made our little one smile all day.\",\"We went
      here w my family by invitation. Coming to Disneyland brings the child in you
      scream and enjoy fun times especially if you have kids w you in the trip. As
      usual, even on a Mondays, the queing for the long lines of activities will leave
      you to make ceratin choice events, rides, etc. We did get a roller coaster ride
      on Star Wars Hyperspace Mountain, photos taken w the Iron Man who was strutting
      around for poses w us, parades, store buys, etc. But what made the stay most
      memorable was the live presentation of Lion King musical wc made the final cut
      of our 'one day' experience @ Disney memorable!\",\"Nice and cute small Disney.
      Attractions do slowly expand, but most are just fun rollercoasters for family.
      Many smaller rides to enjoy with small kids. Bring your water bottle, drinks
      and food are expensive, not many choices. Jedi show is a must for younger ones,
      besides are the eateries worth going to.\",\"Not a very best disneyland but
      it   s still makes you happy to play there. Disneyland rides not as extreme
      as universal atudio because this build for all ages. Just enjoy your time and
      play!\",\"This is a smaller park than American Disneyland. My favourite part
      was the lion king show. It had great costumes acrobatics makeup and props. My
      grandson does not want to go to Theatre but changed his mind after this show.
      Staff were sometimes too busy talking to other staff to assist and sometimes
      abrupt. Overall though we had a great time. I think American Disneyland set
      a huge standard that was hard to match.\",\"Amazing  The shows  Everything was
      amazing  If u are a Disney fan you should visit   Is in fact a must and if u
      didnt do it then ur missing out\",\"Relatively small compared to Disney World.
      \ Well maintained, clean,  Admission fee the lowest  is $61  US dollars.\",\"I
      like shows.  Anaheim has no shows these days.  HK Disney is perfection.  My
      Chinese friend said,  I would be happy to sleep on that bathroom floor!\",\"Came
      here once with my parents some years ago. Came here again for another visit.
      The rides are okay but as usual, super crowded and busy, especially the lunch
      hours where the queue can be as long as 45 mins to an hour. Food is so so, especially
      for the Starliner restaurant that serves western food. Ticket came with a food
      coupon for purchase of meal up to $149HK. Bought the recommended value set to
      maximise it but the burger was so pathetic, small, flat and the meat was half.\",\"Spent
      whole day and coming early avoiding crowds. It   s good to buy tickets ahead
      and avoid public holidays. Weekend could be tough but week days better. Accessible
      by metro . You are in hot commercial and consumer ares when they are not many
      things possible to resist. Enjoy the artificial words and attraction.\",\"My
      husband and I love Disney and have visited quite a few of them. Hong Kong is
      a great park to visit! My favourite ride was the Mystic Manor   it has nothing
      to do with Disney, but a great little story which is a bit funny and has amazing
      detail in the ride. I believe it   s for HK only so really special. The run
      away train is quite deceiving, it starts of slow and you start to think it   s
      a bit rubbish...but it then surprises you. A winner with us. We got our tickets
      with Klook as this was by far the cheapest. It even came with the option for
      a meal deal which was did as it mean we didn   t have to worry about that. The
      food at Disney wasn   t great but ok. They are working on the castle at the
      moment and think it may take a while. At the moment it   s tiny! We found it
      so odd seeing the castle like this, but it   s because they didn   t have the
      money to build a bit castle. They do not so fireworks at the moment because
      of this but they are doing a light show at Main Street which was good. HK Disney
      has a toy story land, built before the one in Orlando. It   s really good but
      I love toy story.\",\"We lived in FL & CA and have been to Disney World and
      Disneyland on many occasions. Although this one is far smaller than the others,
      we're glad we went. There is a special train that takes you there. There is
      an obsession with Duffy at the park. We went on a week day and entered when
      the park first opened. The only lines we encountered were for the characters.
      Easy to do in 1 day. Lots of great food options that is not your typical Disney
      fare. We quite enjoyed the time spent there.\",\"It   s our first Disney experience.
      And I think it   s a great location to start. Ppl said HK Disneyland is smaller
      than one is Tokyo (which it is). It helps us not feel overwhelmed.A ride for
      each ride is not too long. Maybe because it was raining on the day. We didn
      \  t get to see many characters for the same reason.Unfortunately, the castle
      was under maintenance. So we didn   t get the full experience. But all in all,
      it was fun.\",\"It was incredible. We actually rode every attraction in the
      park, sometimes twice. Our longest wait   15 mins! We didn   t even use the
      Fast Pass or a Priority Pass. Compared to Disneyland in Anaheim, CA USA   If
      we had the opportunity; we would rather visit Hong Kong Disneyland. To save
      money, purchase your tickets and meals via the Klook app. (I do not have any
      relationship to Klook). Have Fun!\",\"As my husband and I had a free day before
      we flew back home , decided to visit here, being that as we are over the age
      of 64 we got entry of just under   10 each depending on the currency rate. This
      park does not open until 10.30am, but we arrived earlier as we decided to buy
      our ticket on the gate rather than do this by phone. Surprisingly enough it
      was a very easy and quick process, just had to show our passportsWe got on the
      metro from Hong Kong to Sunny Bay station, crossed the platform to catch the
      Disneyland train which was only one stop.Seeing that this was a Monday the amount
      of people waiting for the park to open was massive, bug bear is that nearly
      everyone is on their phones and then you have to put up with them doing a 101
      selfies. (please if you love yourself that much just get a mirror). Anyway the
      announcement was NOT TO RUN when they opened the gates, BUT WHAT did they all
      do RUN, no manners at all, push and shoved.This park is not a patch on the original
      Disney in Florida. There are very few rides and you can get round this park
      so quick. This is certainly not worth the   60 plus for adults .The atmosphere
      is certainly not here either, maybe because it was not very warm.\",\"Visited
      Disneyland Hong Kong today March 15, 2019. Poor experience. Very little there
      in the first place in terms of rides and other experiences. But most of it was
      closed for renovations (including the main Disney castle) or lots of stuff just
      not open anyway. Kids couldn't get pics with their fav characters as they kept
      disappearing for a break every 20 mins and queues were long already. All this
      missing and not even a reduction in the already expensive price. Pretty crappy
      day outSmall park, half open. Not worth the money.\",\"Not a trip to HK without
      swinging by Disneyland. A day will never be enough to check out all the attractions.
      The place is huge and  seems to always have something every time we visit.\",\"It
      is a relatively small park, cannot be compared to the ones in Florida for sure!
      Worse off, we hit the park when the castle was closed for upgrade and no fireworks
      offered.Most of the park staff we came across were unfriendly and not very helpful
      with the odd exceptions! In fact they have  Smile  stickers at the entrance
      turnstile...it must be there to remind park staff since most of us visiting
      Disney parks have inherent great expectations!\",\"Disneyland is really for
      kids. The rides are way too short in time compared with counterpart rides in
      Universal Studios.  Kids would love the 'Mickey and the Wondrous Book' and Lion
      King shows!!!\",\"Spent a few hours at Hong Kong Disneyland. Easy to get to
      on the MTR. The queues weren't long on this day, which was fabulous. The castle
      is not open at this time, it's being updated. It's Disney, so of course, everything
      is pricey. The main street parade was really good.\",\"I would say that this
      place is really good, had so much fun with my friends. But, I'm little sad because
      one day is not enough to try all their activities and rides. A good place to
      get rid of all the stress.\",\"On my daughter's bucket list is to visit every
      Disney, so not going to Disneyland was not an option. If you are familar with
      the Disney's in the US, this one is much smaller. It had a few of the larger
      rides, the Star Wars rollar coaster, Big Thunder Mountain and Mystic Mansion
      which is their version of the Haunted Mansion. Otherwise, the park is very kid
      friendly. We did get there when it opened and we stayed until it closed   which
      was a bit too long for me, but my daughter loved it.\",\"A must visit when in
      Hong Kong. Great for kids and big kids also. It was my first time to Disneyland.
      We got the 2 day pass as the weather wasn   t to great. It rained half way on
      our first day. If the weather forecast is sunny, buy the 1 day pass as we could
      of done it in the one if the weather fine.\",\"The place was very huge!  There
      are many fun activities that you can do with your family or friends!  I would
      recommend you to go to this place if you have children as it is child friendly.\",\"Disneyland
      is a perfect place to unwind and to be child again! I will always find a way
      to visit all disneyland all over the world!\",\"Magical, fun time at Disneyland.
      We had 2 wonderful days here. All staff make the visit extra special as they
      are so kind and patient.  Unfortunately we were disappointed to find the fireworks
      were cancelled both nights we were there. No warning or explanation.\",\"The
      rides are meant more for children except a few that are more thrilling. The
      decorations, however, were really detailed and brings out the Disney effect.
      It was nice to see that and really brings out the 'child' in me. Great atmosphere,
      great people! Overall, if you are going as a family with young children, you
      will definitely have a good time. However, if you are looking for thrill rides,
      better head to Ocean Park instead!\",\"Last month,my parents,my friends and
      I went to Hong Kong.We arrived in Hong Kong on February tenth.The weather was
      cool and sunny.We went to the hotel first,it was clean and the service is good.Almost
      everything was perfect,the only drawback was the rooms of the hotel were too
      small that I didn't have enough place to play.After we had a rest ,we went out
      to a restaurant.The food it's delicious .we had beef balls,roasted goose,shrimp
      ravioli and some herbal tea.While we were eating,my dad and I saw a store selling
      iPads next store and since then I had a new iPad.That's really fantastic.We
      went Disneyland the day after we arrived.We played many recreational events.There
      were many people there.We waited for a long time to play it.The Roller Coaster
      was really cool.If there were not too many people,I really wanted to try that
      again.After we played for a day,every one was tired,we took a small train back
      to the hotel.We played the rugby,on last day in Hong Kong.It's very interesting.I
      tried some times and can played very well.I won a match and I was awarded two
      white caps and two rugby balls.We need to go home.The trip was great ! I really
      didn't want leave.I promised I will came back sooner or later.\",\"Firstly,
      it   s Disneyland. It   s the happiest place on earth, and it   s great.It is
      a small park, at least by Anaheim and Tokyo standards, and can be easily covered
      in a few hours. This leaves plenty of time for shopping and hitting the rides
      you like multiple times.We came on a Tuesday in early March and arrived at park
      open. The weather was nice out, but the lines were, thankfully, almost non existent.
      Even after the usual busy times of 1 2pm, most lines were less than 15 mins.We
      bought a priority pass, but in hindsight it wasn   t at all required. In the
      end we just used it to get the value, but we were really just skipping 5 minute
      queues, so it was a waste of money on this particular occasion. Perhaps we got
      lucky and other days would make it worth the money but I am unsure.The RC car
      and Grizzly were my favourite rides, both extremely thrilling.Disneyland HK
      is a must see if you   re here, but not the best Disneyland in my experience.\",\"My
      journey started and ended with this magical sentence. Although HK Disneyland
      is not the biggest Disneyland in the world, no. of attractions and rides are
      adequate for you to spend a whole day here. Hearing from the news that HK Disneyland
      is now expanding attractions, adding Frozen land and Marvel land. I believe
      HK Disneyland will attract countless people in the future. At the same time,
      it is hoped that the dinning place can be increased because many people finds
      no place to eat in the park.\",\"HK Disneyland is not the biggest or the best
      Disneyland, but I am grateful it is there. There are enough rides and attractions
      to make the trip worthwhile, and it is very easily accessible by the MTR Trains.
      Main disappointment Wes that there were no characters strolling thru the park
      to mingle with visitors. That may be because of overcast and potentially rainy
      skies. In any case, the weather also kept lines for rides very short   5 to
      19 min max. No fast pass needed. I also like this Disneyland because you can
      still visit all the variety of parks paying one fee. In Orlando Florida, people
      have to buy a ticket for each of the four or five parks they want to visit,
      That gets really expensive.\",\"The magic starts with the MTR, Mickey shapped
      windows and handle bars, then a five minute walk into the park with fountains
      and posters feels like you are already inside. Characters walking around everwhere,
      fun rides and friendly helpful staff. The parades are amazing . Oh and my kids
      had a good time too ... second time in 5 years and looking forward to visiting
      again soon.\",\"Overcrowded with Chinese tourist who likes to take photos of
      cute young children without permission. The rides are fun but taking too long
      to queue. Food offering is good.\",\"Smaller than the original but still just
      as much fun.  Fair way to travel but can be reached by train from HK Central.\",\"It's
      Disneyland, what more can I say?We went there on Monday. The crowd was big but
      we were still able to get on many rides:Jungle River Cruise,Slinky Dog Spin,Toy
      Soldier Parachute Drop,Mystic Manor,Grizzly Mountain Runaway Mine Cars,Mickey's
      Philharmagic,Hyperspace Mountain,IronMan Experience (without fast pass).Special
      mention about the Mystic Manor. It's said that it's only available in Hong Kong,
      no other Mystic Manor in any other Disneyland. So we had to go there! Although
      it wasn't a thrilling ride, it was still fun & very amusing for us. The MM souvenirs
      were also very cute. We spent quite amount of money there, because no other
      MM souvenirs at any other Disneyland shop (not even at the shop at the Hong
      Kong Airport!). So if you go there & find something you like, BUY it. Don't
      hesitate The only downsides were the Sleeping Beauty Castle & the Winnie the
      Pooh ride was closed for maintenance.\",\"We went as a family group to Hong
      Kong Disneyland and had a wonderful time. Our grandchildren just loved it, as
      did we all. It is good value for money, clean and well laid out. Highly recommended
      for a fun day out for children and adults.\",\"Easy to get there, only need
      to take the subway, inside the subway there is also disney decoration so can
      take pictures while heading there. Very convenience and clean. Inside the disney
      park, there are lots of cute sounveir shops, area is clean, people are friendly.
      Lots of disney characters to take pic with, not that long line up, it depends
      on the time and month you go. Although its not a big disney but you can still
      spend a whole day there. If you like cute stuff, hongkong disney is a must go.
      You will buy lots there.\",\"I'm working my way to all the Disney parks around
      the world. I've already hit Orlando, Anaheim and Paris, this is my fourth location
      (Tokyo in 2020 and Shanghai 2021). Although this park is slightly larger than
      Anaheim it doesn't really feel like it. They have fewer attractions crammed
      into a small space like the original. Overall the park is clean, themed well
      and all the cast members we came into contact with were pleasant. I don't think
      you can compare Disney parks to each other, it's just not fair. I like the HK
      version although a lot of the attractions were mirror images (or very close)
      to rides in other Disney parks. Although they are branching out with the Iron
      Man Experience (think Star Tours with Iron Man) and the new Ant Man and Wasp
      attraction (which was not yet open when we went in February 2019.) Mystic Manor
      is HK's answer to the Haunted Mansion. It has a compelling story with a character
      (Albert the monkey) that draws you in and it has great effects. HK DL is almost
      worth it just for this one attraction, we rode it twice. Although not as big
      as FL and not as detailed as Paris, Hong Kong Disneyland is definitely worth
      a visit.\",\"One of the group had been to Disneyland in Japan and wanted to
      go to this one.I had been told was the staff are very friendly, welcoming and
      peppy plus the mascots milling about and very fun. Don   t know if upwelling
      went on a bad day or something but it was not a great experience. With the exception
      of two staff none of them smiled or made you feel welcome. As to for the mascots,
      finally saw them at the end of our day and only in the    town    part.Costumes
      were ruined by staff wearing black running shoes. OK they are on their feet
      and need to be comfortable but it was seriously jarring. Staff get a 2 10.Things
      like the recycling bin being loaded and taken away to be emptied but not one
      put in to replace. Tables not being cleared.Two of the restaurants were shut,
      a number of the rides were closed, the castle was shut.At HK$620 it was not
      worth the money. I was told Disneyland HK was loosing money and I am not surprised.We
      went on a number of rides and they all had positives. Loved the Ironman ride,
      Starwars and the roller coaster in the Gulch.\",\"If this is your first disneyland,
      you will love it. I visited other disney land as well, i found this one smaller
      as compared to others. Though, it still will give you a delightful experience.
      The rides are lesser but there's lots to do. IF you come first thing in morning,
      you will be occupied for the whole day.The biggest attraction is the Parade
      and don't miss the last parade in night   feast for your eyes. My family and
      my kid enjoyed it thoroughly\",\"HK Disney is the smallest of the Disney Parks
      and definitely something you can cover in a day. We contemplates doing a VIP
      tour as we had done in WDW, but left it too late to book and in the end glad
      that I didn't waste my money here as it just wasn't needed unless you were to
      go on one of the Chinese holidays.We stayed in HK central and took the train
      out which was easy to do with them running every few minutes, it really didn't
      matter if you missed one. Even the return at night despite all the people it
      was frequent enough that there was never a significant wait. The People are
      somewhat pushy though it's some form of FOMO(fear or missing out). The train
      doors open people push in and out. If you finish one ride it seems you need
      to run to the next one so you can get ahead of 2 people. Rope drop which would
      normally allow a flow of people into the park was more like the starting gun
      of the New York Marathon.That said, we loved the park. Favorite ride is Phantom
      Manor, similar type of ride to Ratatouille in France but with some magical effects.
      The light show at night is also worth staying to check out.As a tall person
      6' 4  I did find myself having to contort myself into seats to fit my legs in.
      Same thing with Tokyo, but you can fit. I found crossing my legs and moving
      my feet as far back in the seat as I could before sitting down made a difference.The
      Lion King show was amazing so I would put that down as a must!\",\"I   m a big
      Disney fan so was super excited to visit HK Disneyland. Although we had a fun
      day.. I can   t help but feel disappointed. The park was very small and I feel
      the price is extortionate when comparing it to Disneyland Paris   which is much
      larger and significantly cheaper. I found that it didn   t have the magic of
      Disney and it just felt like any old theme park. The staff were not particularly
      friendly and they didn   t engage with guests at all   in fact, I was ignored
      by a group of 3 staff members! Having said this.. mystic manor is quite possibly
      my new favourite Disney ride ever   you really have to go on it!!\",\"It was
      always a dream to visit a Disneyland and it came to true when we visited HK
      Disneyland. You can easily reach thro MTR station and this is the most convenient
      mode. We went around the park, train ride, boat ride, tarzan house, magic 5D
      show, winnie phoo etc. Amazing to witness the main street parade. Huge food
      court available inside the premises. Overall it was a relaxing day out\",\"We
      visited Hong Kong Disneyland as group of family on 1st January of 2019. We thought
      that the park will be packed since is the holiday season but luckily the park
      is moderately packed.My thought about this place is a great place to spend your
      day in your HK trip. The park is very nice and it was smaller than your typical
      Disney park. Compared to other Disney park I've ever visited, this theme park
      has shortest waiting time especially for thrill seeker attraction and of course
      no need to check all the fast pass.You can download the apps beforehand to check
      the schedule for the parade, map, and waiting time for each attraction. Unfortunately
      in our visit, the Sleeping Beauty castle is still under construction but we
      managed to enjoy Disney Christmas Celebration.In our visit, We managed to enjoy
      6 rides, 1 parade, 2 shows in our 4 hours of visit. If You're a thrill seeker,
      don't forget to enjoy the two attractions exclusive in HK Disneyland, Big Grizzly
      Mountain Runaway Mine Cars and Mystic Manor. For a magical time of great fun,
      you can   t go wrong with Hong Kong Disneyland!\",\"Great day out and it is
      so easy to do it in one day as it is so much smaller then other Disneyland around
      the world. Just be warned that currently the 8pm fireworks aren't on due to
      maintenance on the castle\",\"Disneyland never failed to amuse everyone  Excellent
      and friendly, park and attraction are great  Crews are great, speak english,
      and also nice hotels\",\"A great way to spend the day in Hong Kong. All the
      usual well run Disney facility's. Easy access to the venue we used the MTR all
      the way which was easy. Crowds were OK for mid week and winter. Cost HK619 for
      the day each adult. We ate in the explorers club restaurant and had an Asian
      curry which was OK although a bit bland to cater for all tastes. All in all
      e all had a fantastic day out.\",\"Awesome feeling and great experience. Really
      enjoyed a lot with family. Would love to visit the place again and again\",\"This
      is the first time we visited Hong Kong Disneyland.. We decided to go to Disneyland
      during chinese new year holiday.. It was so crowded and not really enjoy the
      attraction..\",\"Entering the HK Disneyland tend to bring back the child in
      you. While inside you'll forget your life's problems and if magically youre
      in a different world full of fun and fantasy. I love the rides but very few
      restaurants to choose from.\",\"I personally haven't gone to a Disneyland outside
      of California so I didnt know what to expect. The cultural ties to the Chinese
      culture that they implemented at the park was simply amazing. This is probably
      the only park where Mickey can speak Cantonese. The park is very clean, it was
      smaller than your typical Disney park. There are various shows you can watch
      throughout the park. The rides are similar to what you would find in California.
      I believe the Iron Man attraction might be unique to HK. The park was busy but
      not to the point where we had to wait hours for a ride. It averaged 30 minutes
      or so per ride. If you're looking to experience something different from Disney,
      this would be the place to go. We only went for the day and was able to go on
      everything we wanted to go on. Just keep in mind that this park is smaller.
      I would not recommend coming here during Chinese New Year or Golden Week.\",\"First
      time I've been to Disneyland, so I have no benchmark for comparison. Smaller
      than I expected, but big enough to fill a full day for two adults. Lots of fun
      to be had, though some of the rides are aimed at children, so don't be disappointed
      if you're too big to fit on them. The Disney train was very cool, and had a
      real air of excitement...Join Mickey and Minnie for the day and enjoy :)\",\"I
      \  ve visited every Disney park except Shanghai and this is perhaps my favorite
      for a toddler. It   s a close replica of the Anaheim Disneyland but smaller
      without some of the big kid rides. PROs:1) For a Disney park, it   s not very
      crowded. I love Tokyo Disney Sea but the crowds really kill the experience there.
      People in Hong Kong apparently do not wake up early even when the park opens
      at 930am. There   s really are no lines for the first couple hours. Even during
      the busiest hours, the lines are moderate. 2) I love the variety of foods from
      all different regions. I actually looked forward to meals. 3) When we were there,
      they were 6 different times for the Jedi training and it was never full. 4)
      Admission tickets are so much cheaper than any other Disney park in the world.
      You can use apps like Klook to buy discount tickets and discount meals. If your
      children are under 7, this really is the perfect Disney experience.\",\"There
      is some wonderful excitement built on the train ride to Disneyland with the
      cute Mickey themed carriage. We enjoyed Mickey waffles while there and the Lion
      King Show. Other than that the lines for rides were very long and I felt the
      experience was quite overrated. I MUCH preferred Ocean Park.\",\"Most of the
      staff members are friendly and accommodating. We were there on over chinese
      new year and the place was packed. The lines were a bit too long and a lot of
      people. During the parade, the Disney employees who were in charge to keep the
      crowd away from the floats were cranky and ill mannered. Disneyland is really
      a beautiful place. There were restaurants and food carts at every corner. The
      restrooms were all big and clean. The rides and attractions were enjoyable enough
      that you would want to see ride them again.\",\"It is a worth it experience.
      Enjoyed it together with my daughter and grandchildren's. Feels like young again.\",\"Magical
      as expected. Fairy tale! Some great themed rides, highlight for us was the Iron
      Man. Go for the slightly more expensive ticket that gets you priority pass,
      otherwise you will need to queue quite a bit.\",\"If you have a kid with you,
      you would have her or his eyes feast on all the attractions here. It isn't as
      big as Ocean park but it is good for those who have been wanting to see Micky
      Mouse in person. Sadly the time I was here is when the castle was renovated.\",\"Very
      crowded most of the time and long queue for rides. Food limited choice and quite
      pricey.  Kids can collect stickers given out by staffs all over the place. Just
      need to approach the staffs for free stickers\",\"As a family we have been to
      Disney Florida many times. HK Disney is smaller but still has all the charm
      of Disney Florida. My girls had a great day and even at the age og 16 would
      go back againn\",\"Stayed in Disney   s Hollywood hotel and spent 3 days in
      Disney Hong Kong with our 3 year old daughter   She had an amazing time with
      all the characters and princesses  Park is smaller than Florida and California
      but well worth a visit\",\"Small Disneyland compared to Paris and the attractions
      are espcially for kids and only some of them for adults. We came here after
      the Typhoon so some attractions were closed. The price is a bit high for what
      you get. Overall we had a great time and it took us about half day to finish
      all the park. If you are looking for thrill attractions for adults, Ocean park
      is much more better!\",\"I visited the Disney parks at LA as well as Florida
      but really impressed with Hong Kong Disneyland during the last visit. It was
      well connected, well organized, and the staff were very friendly and helpful.
      It's good for a full day visit but it needs some planning so that one must decide
      on what shows to watch and which fast passes to gather.\",\"It was a busy night
      at around 1900hrs at Royal Banquet Hall on Feb 20. Long queue for ordering food
      and most tables were occupied. However, there was a staff called Wilson. He
      was absolutely professional. He smiled all the time even when he was cleaning
      up all tables (non stop). It made us felt warm like home. Keep up your professional
      work and effort. Not many staff could smile like you. Beautiful smile.\",\"So
      much of the park is closed!! Very disappointing   only a few rides In the park.
      I do know there is an expansion planned, but so much was closed now, I don't
      know how they can afford to expand! I knew it was a small park before we went,
      but it is lacking the 'Disney' in every aspect... other than the cost! It is
      really easy to get to on the MTR and good for about 3hrs of entertainment If
      you are looking for something different to do while visiting HK.\",\"Had a great
      day here.  Lines get long very quickly, so was glad we got there early and huge
      crowds.  They have terrific souvenir shops of which prices were not to bad and
      the food was very good, especially the caramel popcorn   amazing.\",\"this was
      a very interesting park because although it was very crowded, the line ups were
      never too bad... we went in with a plan because we only had one day... but we
      did enjoy ourselves. i suggest going shopping early in the day because the people
      there were savages! the store workers couldnt even keep up with people throwing
      things on the floor and all over the shelves... what a mess!! it was a terrible
      store experience and i waited 45 mins just to pay! the park was fun   the space
      mountian was fantastic but the shopping was awful so just know that going in
      \  only need one day for this park\",\"Such a lovely place that really took
      me back to my childhood. Although queue can get long and the fast pass is not
      logical, the displays are great! The rides are great! A few good food options!
      Parade was great! Fireworks great! Great shows! Really enjoyable and can spend
      the whole day here. It   s a small Disney Land but really lovely.\",\"Fantastic
      experience. Enjoyed every step of our stay in this wonderful theme park. Thank
      you DisneyLand, Hongkong.\",\"No doubt people keep saying this is the happiest
      place on earth. To be honest, this place is quite far from the city, but don't
      worry you can reach here using MTR. I personally think the entry ticket is quite
      pricey, but it's all paid off with incredible attractions. It's truly magical!
      If you are family with kids, it's a must visit place, you can meet almost all
      Disney characters, and don't forget to capture your moments, there are so many
      beautiful photo spot to be captured. Suggestion: you'd better come in the morning,
      since the weather is not too hot and there will be more crowded in the afternoon.
      And if you are not in rush, be sure to see the parade or the fireworks show
      in the night (about 30 minutes before the closing time), that's really worth
      the wait, and I can say that's one of the best show I have ever seen.\",\"We
      never had went Tokyo Disneyland or Shanghai Disneyland. Hong Kong Disneyland
      was our first Disneyland. It was not crowded so we can enjoy 4 hour stay.\",\"Much
      smaller than the US versions and you can easily cover the entire park in one
      full day. They have some things you can't find in the US, so, it was fun to
      see those.  The mystic manor and space mountain were my two favorites.\",\"Easy
      to get to using the MTR. Change at Sunny Bay station onto the shuttle service
      out to the Disneyland Resort. As you   d expect lots of Disney themed stuff
      going on, the train with Mickey shaped windows, hanging hand grips Mickey shaped,
      various statues of characters in the carafes. We went in February on a damp
      day. Not overly busy, with queue times between 0 and 10 minutes without any
      kind of priority boarding ticket. Having been to Disney Land Paris and Walt
      Disney World in Florida I was still hugely impressed and couldn   t stop smiling
      for the whole visit. A real mixture of East and West themes going on, similar
      in so many ways but different enough to make it still feel new. There was some
      building work going on around the castle and as a result the train wasn   t
      working though that didn   t detract from the day. Log in to the Disney Land
      Wi Fi and we got a HK$10 voucher. Thoroughly enjoyed Toy Story Land. The classic
      area of Tomorrow Land rebranded as Star Wars & Marvel. I was in Hong King as
      part of a short break celebrating my birthday and would thoroughly recommend
      taking the time to visit. You   re never too old for Disney!\",\"Each visit
      is just as magical as the last. My son always enjoys meeting the characters
      and the food that's shaped like Mickey. Would only recommend that they have
      other food options other than the exiting ones as variety for those that visit
      frequently\",\"My kids love it. Lots of rides for children and adults. Food
      is good and lots of places to buy souveniors.\",\"The rides, views, and character
      actors were marvelous. I highly recommend the Lion King Festival (at least I
      think that   s the title of the show) as the music and dance is spectacular
      for anyone who enjoys enjoyed the movie. The night parade was a bit too crowded
      for my taste (I got slightly injured due to the immense number of people) but
      the parade was fun to watch. Getting on rides isn   t too difficult as the queues
      are usually only 20 30 min long.                                                                                                        .
      \                                                                               ...
      \                              (       3          )                          !
      \   **   ,    **                                                                                                                  .\",\"It
      is definitely the happiest place on earth. Start off your day with a photo op
      with the balloons. Then make sure to have a photo pass you could get great photos
      taken by pros. You can opt to have your daughter be a princess for a day. If
      you are staying at the hotel it is just near the restaurant. Make sure to catch
      both the day and night parades.\",\"Great place to visit if you are any age!
      Really clean and the workers do not allow line jumpers (which is good). It is
      a smaller park but this makes it easier to navigate and you don't have to keep
      going back to see thing you missed out on.\",\"Went with 2yrs old and 5yrs old.
      5yrs old had fun since he already know how to enjoy and knowing the characters.
      Crowded as usual as i went during a Sunday and its CNY period. Most rides are
      kids friendly.There's much more attractions compare to many years back during
      my first visit. Great for both kids & adults.\",\"A wholesome place to take
      the kids. Only gripe was that the Its A Small World Ride was closed due to upgrading.
      Love the food that caters many cuisines both Asian and Western. Don   t miss
      the Light Saber churros : )\",\"Sure, after Anaheim, this park is small. But
      so much fun. We travelled with our 3 year old and it was perfect for him. We
      enjoyed 3 days in the park. You can't quite see everything in 1 day   2 is perfect
      and 3 just gave us the luxury of time to see everything with time to spare.
      We were blown away by the shows   Mickey and the Wonderous Book and The Lion
      King are incredible. Skip Moana if you are on a schedule. Rides aren't that
      thrilling, but definitely good fun. Disney has this amazing knack for making
      kids rides that are fun for adults too! Toy Story Land's parachute drop is the
      best!! Make sure you get there at rope drop to maximise your time in the park.
      Food is expensive, but good enough. Choose week days for low crowds   we were
      there 2nd week of Jan and crowds were good. Take the train (MTR)   it's part
      of the experience and easy to do with some planning. Saved money by buying tickets
      on klook   easy to use. Often can get a discount vouchers for shops on main
      street between 10 and 10.30 while waiting for rope drop for rest of park. They
      can store your parcels and collect at end of day.Consider booking a character
      meal (e.g. breakfast at Disney hotel) to get those great character snaps  saves
      you needing to line up during that precious park time!\",\"My friend and I ended
      our Hong Kong trip at Disneyland since we had a late flight out that evening.
      We checked out of our hotel (purchased tickets through our concierge which included
      the bus ride there). We dropped off our luggage right before the entrance to
      Disneyland for a reasonable fee there is a special place at Disney to hold your
      luggage for the day. Small Disneyland compared to Anaheim and Florida but definitely
      fun to see and experience. The food inside the park was disappointing. Overall,
      if you have time to see this after you have experienced the rest of Hong Kong,
      it's worth the time. MTR station right at the exit, easy to catch it and then
      catch the Airport Express.\",\"very nice place. i love it so much. very big
      and spacious. the rides are very modern, the parade of disneyland figures is
      also very beautiful and nice. unfortunately when i was there, the disney castle
      was under renovation so i couldn't see the fireworks show.\",\"Everything are
      fun fun fun! But the food quality ahould be checked since uts really pricy and
      everyone are willing to pay\",\"Great day out .....granddaughter had an absolute
      ball.  great main street parade and rides for the kids  as expected food n drink
      a tad expensive   Pleant of spots for us oldies to sit and relax\",\"Went to
      Disneyland with my family and indeed, it   s the place for small boys and girls
      but also for adults. It brings back fun memories of being a child. Place is
      a bit small compared to the other Disneyland. Also, a lot of renovations are
      going on. A bit disappointment was the parade of lights since not all characters
      were present during the parade. Felt like we were cheated.Over all, it   s nice
      to experienced and see the difference from the other Disneyland places.\",\"Back
      to your childhood life, this theme park are full of imagination. It   s very
      attractive. Spend the the whole day, from morning to the evening. You   ll never
      get boring here because it shows a lot of attractions. Don   t forget to see
      the fireworks as a closing ceremony.\",\"Very small Disneyland compared to the
      other countries. Beautiful Disney themed train to reach the park. Big disappointment
      due to the Disney castle closed down and no fireworks, friendly staff and very
      helpful\",\"Visited on January 1st. Used MTR from Kowloon which was quick and
      easy 2 changes. Quirky Disney carriages on last one. Caught the 4pm parade   flights
      of fantasy and the 8pm Paint the Night parade also the 7pm we love Mickey projection
      show birthday edition. The magical twilight snowfall at 6:45 was fun to see.
      Some areas were closed for renovation but still plenty to see plenty of queues
      for the rides. Overall a great visit even for big kids.\",\"It was fun to go
      to HK Disneyland. We stayed at one of the Disney hotels and took the private
      bus there. We had pre purchased tickets   and be aware that there is a great
      senior discount!This was my first Disneyland in Asia, and my understanding is
      that Tokyo Disneyland is better. Disneyland HK is smaller than the two parks
      in the US. It was oddly similar, and yet oddly different. The park was clean.
      Small World was being refurbished when we were there, so we were not able to
      check it out. Some fun things to note:1. They have Star Wars chopsticks in the
      Star Wars shop! Wish I'd bought more. 2. We had Indian food for lunch, and it
      was spicy but good.3. They had the usual Disney signs with rules before you
      get on a ride, but I don't recall seeing  You should be sober  as part of the
      instructions in Anaheim or Orlando! Disneyland is out on Lantau Island. Although
      we had fun, I would probably spend my time doing other things next time.\",\"Disneyland
      is what it is. It makes people happy, not only kids but also adults like me.
      The parade is something to watch out. Although my advice is be early and get
      priority passes, if budget permits, to enjoy your day. We have 4 passes and
      this made a great deal in our experience.\",\"Although this is the smallest
      Disneyland in the world, it doesn   t discount on the value. It definitely worth
      a visit!\",\"Indeed a happiest place on earth! My kids enjoyed it a lot from
      my eldest (10years girl) ,6 years old boy, 4 years old boy and 1 year old girl.
      The light show, the parade are fantastic even the food!!!! Yum!\",\"We chose
      a Chinese National holiday to visit Disneyland so it was busy but as we were
      travelling with small kids we were too worried about going on a lot of rides.
      We had bought the meal deal tickets but found they weren   t good value as they
      limited our choices for lunch. The Moana show was great and the park was easily
      accessible for our 2 year old.\",\"It is really one of the happiest place on
      earth. The ambiance of the themed park will make you feel young and free. As
      for sure, you will enjoy the rides. Sadly, when we went there the castle is
      under construction so the disneyland trip isn   t complete.\",\"I've gone to
      both Disney parks in California and Orlando and while HK Disneyland is very
      small in comparison, I loved how this park won't have you exhausted by the end
      of the day and still allow for other activities after you've finished your time.
      This was how I scheduled my time with my friend. 11 am met a friend at Nam Cheong
      MTR and rode over to the Disneyland Line. A smart thing to do would be to buy
      your tickets on your phone as you are riding the MTR. (We didn't and wasted
      some time at the ticket gate)Once we were in we took our rounds of pictures.
      The first impression was,  Wow, that's the castle? How awful.  Though when I
      was there they blocked off the castle so they will be making a more robust castle
      soon from what I'm understanding.In other parks like Japan and the USA, it's
      all about looking for the snacks all around the park. (Here's looking at you
      Dole Whip) I need to get this out of the way, the food is awful at HK Disney.
      This fact really surprised me given that there's so much good food in HK but
      it really was pretty horrid. Friend and I had some bad lunch and then went along
      to other rides. Most rides were about a 20 minute wait which I thought was very
      acceptable. I think the longest wait we had was for Hyperspace Mountain and
      that was for 40 minutes.Checked out the parade and was actually hoping for Asian
      women dressed up as Cinderella or Snow White. Nope. God forbid Snow White is
      an Asian. But I suppose I get it. lolAfter some snack fails and a Philharmagic
      3D show we exited the park at around 6 pm. Took the MTR straight to Tsim Sha
      Tsui for a nice dinner at 7 pm. At 9 pm, friends and I were parked at a whisky
      bar and then by 11:30 pm I was home in bed.It was one of the most amazing days
      because this type of Disney excursion never happens in either California or
      Florida simply give the scale of the parks and also how awful public transportation
      is in either cities.I wouldn't recommend coming to HK for Disneyland, that would
      be a let down. However, if you're sightseeing in HK and have time for Disney,
      it's a no brainer to go.\",\"We were in Hong Kong in September. The park is
      smaller than the other three that we have previously visited but has all the
      expected rides and features. It was pretty quiet on the gay of our visit.\",\"Our
      3 year old daughter loves all of the Disney princesses so we had to take her
      to Disneyland. She had an absolute blast and probably loved the parade best
      because she got to see all the princesses.Unbeknownst to us we were in Hong
      Kong the week leading up to Chinese New Year so the city was packed but it didn
      \  t really affect our Disney trip in any way other than it was probably much
      busier for a Monday than it normally would be.Disneyland Hong Kong is now where
      near as big as the original or Disney World Orlando, we haven   t yet been to
      Paris or Tokyo Disney   s so we can   t compare to them. Even though the park
      isn   t as big as the two in America it   s not missing anything for our 3 year
      old but it would be lacking in rides and activities for older kids to teens.
      The classics are there such as It   s a Small World. All in all it was a great
      trip.\",\"We were lucky because the weather wasn't great when we went which
      meant it was quiet and we didn't wait for any rides. If you have been to any
      of the others you may be dissapointed but its still beautifully put together.
      The rides are small but still lots of fun. I would recommend it for an afternoon
