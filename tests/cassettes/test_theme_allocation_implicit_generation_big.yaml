      HK.Those who are commenting about how wonderful the time they had must have
      been paid by Disney or high with something. I would rather go to Ocean park
      which is much bigger and more things to see and do.Just to get to Disneyland
      you are paying US$ 15 20.\",\"Easy to get to via taxi (approx $130HKD from the
      airport). Lion King and mickey's storybook were the best shows in the park.fantastic
      parades and even adults feel included in the disney atmosphere! Food & drink
      is a little pricey.\",\"My first experience to Disneyland n it was great. Had
      so much fun with my partner. From space ship roller coaster, to andy toy story,
      tarzan tree house, cool mickey mouse show, until the unexpected backwards train
      ride. It was great n very challenging, well got me screamed a few times lol.
      Worth to come back !! For all age.. u r welcome\",\"I visited this superb amusement
      and theme park two times already. On this last visit , I took my 86 yr old father
      with me. He enjoyed like a child. The whole area is divided into 7 zones and
      each of the zones is uniquely planned and designed with the speciality of that
      zone in mind. Each zone has a ride, a show , an eatery for that area. I loved
      the Grizzly bears mining area with that stupendous ride!! The zone is planned
      with hot water geizers and rocky mountainous type. Excellent. Also the space
      ride area was too good. Starwars themed people were going around. The ride was
      great. I also liked the Little children's boat rides. The shows were a little
      less exciting for us. Because it's really for the small kids. There is a nice
      rail line around the park for easy travel. We bought the online tickets from
      the website. That made the enty super easy. Also I had the priority pass for
      us  that's free, my father had the senior ticket very cheap. The passes really
      helped us to see everything fast. U need to walk around a lot. But lots of resting
      places and refreshments are available to take it slow. Protect your head with
      hats.One day finishes like a sweet dream. Interested people can take the two
      day ticket if so inclined. There is also a hotel inside which can be included
      in the package. At designated times there are themed festivities, procession
      and fireworks which attracts lot of crowds. The journey from the city takes
      around 1 hr. Discounted tickets are available from klook dot com also. Overall,
      a lifetime dream came true for me. I have been dreaming of going to disneyland
      from the last 40 yrs minimum. I am very happy.\",\"Having visited Anahiem Disneyland
      many years ago, we were not expecting too much at HKDL. However, we thoroughly
      enjoyed our vist. A highlight is the Marvel Iron Man experience (unique to HKDL)
      and also Mystic Manor a twist on the Haunted Mansion. It was quite busy the
      first day we went (we opted for the two day pass) but it was still manageable
      and the only issue we had was finding a table to eat at.... and the queue at
      the Starbucks for a coffee.\",\"Great day out for the family. We had minimal
      ques and saw all of the park in one day. Going back for the second day to watch
      the shows. Easy train ride to the park.\",\"It's been a long time since last
      step into HK Disneyland. (Actually, less than 1 year ago, as I went for the
      HK Disneyland run that run thru the park...and I went for the 2018 edition again
      this time lol)So this time into the park direct to see the shows and some of
      the rides. (Frankly, the queue is scary; unless you go first thing in the morning,
      or buy  get the fastpass, 1 day is not enough to see ALL the shows  rides...
      ) Ok, certain things are under renovation   including the well loved Castle,
      and thus the fireworks at night though never stay that late.Stay for the new
      Mona show, Lion King show, the favorite Small World ride, the Pooh ride, ...and
      of course the well loved parade.As usual, magical at least for me to see Mickey
      and most of the Disney characters.\",\"We spent our daughter's birrhday in Disneyland.
      As per her this is dream come true! The shows, rides, shopping is the peefect
      gift you can give your children. You will also realize that there is a child
      in you as well. Myself and wife too enjoyed the day. Gegerally we get tired
      walking..but that day though we walked the whole day..the intermittent rest
      during meals and garden was a perfect way to enjoy the whole day.Highly recommend.\",\"A
      good day out which tired kids out, but unfortunately did not have time to do
      much due to queues and waiting around.  Been there, done it probably would not
      choose to go back, especially for the price(s).\",\"Visited from Australia.
      Enjoyed the rides, parades and shows. Disappointed the toy train ride was closed.
      Knew the castle would be under renovation. The biggest let down was that as
      we were leaving, we decided to pop by the gift shop to buy a Mickey and Mini
      Mouse plush toy (in the Chinese outfits) which was under the sign that said
      2 for HKD298. When we went to pay, the girl behind the counter said it was HKD168
      each. We took her colleague to show her the offer sign and she said it didn
      \  t apply for Mickey and Mini, but that it was for other plush toys (Duffy
      and friends toys only). The girl was very condescending and made us feel unpleasant.
      So we accepted and bought it for HKD336. When we left to Hong Kong airport 2
      days later, at the Disney store in the airport (we didn   t know there would
      be one there) we saw the same deal: 2 plush for HKD298 and we asked if it applied
      to the same Mickey and Mini mouse, and lo and behold the girl at that store
      said it did! that is, 2 for HKD298!! So how is it that at Disneyland park the
      store did not honour the offer when the other store did? We were very disappointed
      that the staff were very rude when we tried to enquire about the offer that
      was rightly given to everyone at the airport store, but did not give us this
      offer when it was clearly stated on the stand in the main Disneyland?!? This
      made what would have been a great day at Disneyland very unpleasant. We have
      discouraged our family & friends to visit Hong Kong Disneyland due to this unpleasant
      experience. Disney, we would like you to be more honest in your promotions and
      to honour what is stated in your pricing.\",\"Disneyland make you think happy
      thoughts & just enjoy the day! We had too much fun that we almost didn't realise
      it was almost closing time...will definitely come back here   real soon!\",\"What
      else could I possibly say about going to Disneyland that hasn't already been
      said. A truly magical place. A bit different from the original Disney California.
      Space Mountain is a combination of Space Mountain and Star Wars. Quite hysterical
      Hearing R2 D2in your ear while riding in the dark. The haunted house is a combination
