      music and decorations. The park felt magical and festive. Decorations were colorful
      and lively. The ambiance enhanced the experience.","Had a blast! Awesome day
      out! A truly unforgettable day. Not impressed with the variety of rides. Would
      come again."],"flatten":false,"fast":true}'
