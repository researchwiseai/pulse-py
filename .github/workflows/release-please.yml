name: Release Please

on:
  push:
    branches:
      - main

# Note: Using a PAT token instead of GITHUB_TOKEN to bypass branch protection rules
# and organization policies that may prevent GitHub Actions from creating PRs
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Use configuration files for settings
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          # Use a personal access token with repo permissions
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
