name: Publish to PyPI
on:
  # Trigger when Release Please creates a release
  release:
    types: [published]
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write  # Required to update GitHub releases
      id-token: write  # Required for OIDC authentication to PyPI
      attestations: write  # Required for build attestations
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history for reproducible builds
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install build tools and dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -r requirements.lock --no-deps --no-cache-dir
          pip install -e .
          # Install Syft for SBOM generation
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          # Install Cosign for signing
          curl -O -L "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64"
          sudo mv cosign-linux-amd64 /usr/local/bin/cosign
          sudo chmod +x /usr/local/bin/cosign

      - name: Build distributions
        run: python -m build --sdist --wheel

      - name: Generate single SBOM for all distributions
        run: |
          # Generate single CycloneDX SBOM covering both source and wheel distributions
          # Note: SBOM is NOT signed to reduce release asset clutter (per streamlined release process)
          syft dist/ -o cyclonedx-json=sbom.cyclonedx.json

      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Generate compliance artifacts
        run: |
          # Generate Apache 2.0 compliance artifacts
          python scripts/generate_compliance_artifacts.py

      - name: Pre-release validation checks
        run: |
          echo "🔍 Running pre-release validation checks..."

          # Validate required compliance documents exist in repository (Requirement 2.3, 4.5)
          echo "📋 Validating compliance documents..."
          required_docs=(
            "COMPLIANCE.md"
            "SECURITY.md"
            "LICENSE"
            "NOTICE"
            "THIRD-PARTY-ATTRIBUTIONS.md"
            "CHANGELOG.md"
          )

          missing_docs=()
          for doc in "${required_docs[@]}"; do
            if [[ ! -f "$doc" ]]; then
              missing_docs+=("$doc")
            else
              echo "✓ Found required document: $doc"
            fi
          done

          if [[ ${#missing_docs[@]} -gt 0 ]]; then
            echo "❌ Missing required compliance documents:"
            printf '  - %s\n' "${missing_docs[@]}"
            exit 1
          fi
          echo "✅ All required compliance documents found"

          # Validate SBOM format (CycloneDX compliance) (Requirement 4.5, 5.1)
          echo "🔐 Validating SBOM format..."
          if [[ ! -f "sbom.cyclonedx.json" ]]; then
            echo "❌ SBOM file 'sbom.cyclonedx.json' not found"
            exit 1
          fi

          # Validate JSON structure and CycloneDX format
          python3 -c "
          import json
          import sys

          try:
              with open('sbom.cyclonedx.json', 'r') as f:
                  sbom = json.load(f)

              # Validate required CycloneDX fields
              required_fields = ['bomFormat', 'specVersion', 'metadata']
              missing_fields = [field for field in required_fields if field not in sbom]

              if missing_fields:
                  print(f'❌ SBOM missing required CycloneDX fields: {missing_fields}')
                  sys.exit(1)

              if sbom.get('bomFormat') != 'CycloneDX':
                  print(f'❌ SBOM bomFormat must be \"CycloneDX\", got: {sbom.get(\"bomFormat\")}')
                  sys.exit(1)

              print('✓ SBOM has valid CycloneDX format')
              print(f'✓ SBOM version: {sbom.get(\"specVersion\")}')

              # Check for components
              components = sbom.get('components', [])
              print(f'✓ SBOM contains {len(components)} components')

          except json.JSONDecodeError as e:
              print(f'❌ SBOM is not valid JSON: {e}')
              sys.exit(1)
          except Exception as e:
              print(f'❌ SBOM validation failed: {e}')
              sys.exit(1)
          "
          echo "✅ SBOM format validation passed"

          # Validate distribution files exist (Requirement 2.3, 5.1)
          echo "📦 Validating distribution files..."
          wheel_files=(dist/*.whl)
          sdist_files=(dist/*.tar.gz)

          if [[ ! -e "${wheel_files[0]}" ]]; then
            echo "❌ No wheel (.whl) files found in dist/"
            exit 1
          fi

          if [[ ! -e "${sdist_files[0]}" ]]; then
            echo "❌ No source distribution (.tar.gz) files found in dist/"
            exit 1
          fi

          echo "✓ Found wheel files: ${wheel_files[*]##*/}"
          echo "✓ Found sdist files: ${sdist_files[*]##*/}"

          # Validate signature files exist for distributions only (Requirement 2.3, 5.1)
          echo "🔏 Validating signature files for distributions..."
          missing_sigs=()

          for file in dist/*.whl dist/*.tar.gz; do
            [[ -e "$file" ]] || continue
            filename=$(basename "$file")

            sig_file="signatures/${filename}.sig"
            crt_file="signatures/${filename}.crt"

            if [[ ! -f "$sig_file" ]]; then
              missing_sigs+=("$sig_file")
            else
              echo "✓ Found signature: $sig_file"
            fi

            if [[ ! -f "$crt_file" ]]; then
              missing_sigs+=("$crt_file")
            else
              echo "✓ Found certificate: $crt_file"
            fi
          done

          if [[ ${#missing_sigs[@]} -gt 0 ]]; then
            echo "❌ Missing signature files for distributions:"
            printf '  - %s\n' "${missing_sigs[@]}"
            exit 1
          fi
          echo "✅ All required signature files found for distributions"

          # Validate total artifact count (Requirement 4.5)
          echo "📊 Validating release asset count..."
          total_assets=0

          # Count distribution files
          dist_count=$(ls -1 dist/*.whl dist/*.tar.gz 2>/dev/null | wc -l)
          total_assets=$((total_assets + dist_count))

          # Count signature files (should be 2 per distribution: .sig and .crt)
          sig_count=$(ls -1 signatures/*.sig signatures/*.crt 2>/dev/null | wc -l)
          total_assets=$((total_assets + sig_count))

          # Count SBOM and provenance files
          [[ -f "sbom.cyclonedx.json" ]] && total_assets=$((total_assets + 1))
          [[ -f "build-provenance.json" ]] && total_assets=$((total_assets + 1))

          echo "📈 Asset count breakdown:"
          echo "  - Distribution files: $dist_count"
          echo "  - Signature files: $sig_count"
          echo "  - SBOM files: 1"
          echo "  - Provenance files: 1"
          echo "  - Total assets: $total_assets"

          if [[ $total_assets -ge 10 ]]; then
            echo "❌ Total release assets ($total_assets) exceeds limit of 10"
            exit 1
          fi
          echo "✅ Release asset count ($total_assets) is within limit (<10)"

          echo "🎉 All pre-release validation checks passed!"

      - name: Generate build provenance
        run: |
          # Create build provenance information
          cat > build-provenance.json << EOF
          {
            "buildType": "https://github.com/researchwiseai/pulse-py/.github/workflows/publish.yml@refs/heads/main",
            "builder": {
              "id": "https://github.com/actions/runner/github-hosted"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/researchwiseai/pulse-py@${{ github.sha }}",
                "digest": {
                  "sha1": "${{ github.sha }}"
                },
                "entryPoint": ".github/workflows/publish.yml"
              },
              "parameters": {
                "workflow_ref": "${{ github.workflow_ref }}",
                "workflow_sha": "${{ github.workflow_sha }}",
                "runner_environment": "github-hosted"
              }
            },
            "metadata": {
              "buildInvocationId": "${{ github.run_id }}-${{ github.run_attempt }}",
              "buildStartedOn": "${{ steps.date.outputs.date }}",
              "completeness": {
                "parameters": true,
                "environment": false,
                "materials": true
              },
              "reproducible": true
            },
            "materials": [
              {
                "uri": "git+https://github.com/researchwiseai/pulse-py@${{ github.sha }}",
                "digest": {
                  "sha1": "${{ github.sha }}"
                }
              }
            ]
          }
          EOF

      - name: Generate attestations for distributions
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*'

      - name: Sign distributions with Cosign (keyless)
        run: |
          # Create signatures directory to keep them separate from dist/
          mkdir -p signatures

          # Sign ONLY core distribution files (wheel and sdist) - compliance documents and SBOM files are intentionally NOT signed
          # to reduce release asset clutter per streamlined release process requirements (Requirements: 1.2, 2.3, 5.2)
          for file in dist/*.whl dist/*.tar.gz; do
            # Skip if no files match the pattern
            [[ -e "$file" ]] || continue

            filename=$(basename "$file")
            echo "Signing core distribution file: $file"
            cosign sign-blob --yes "$file" \
              --output-signature "signatures/${filename}.sig" \
              --output-certificate "signatures/${filename}.crt"
          done

          echo "Distribution signing complete. Only wheel and sdist files are signed."



      - name: Verify distribution signatures
        run: |
          # Verify signatures for ONLY core distribution files (wheel and sdist) - compliance documents and SBOM signatures are intentionally excluded
          # per streamlined release process requirements (Requirements: 1.2, 2.3, 5.2)
          echo "Verifying core distribution signatures only..."

          # Count expected distribution files
          dist_count=$(ls -1 dist/*.whl dist/*.tar.gz 2>/dev/null | wc -l)
          echo "Found $dist_count distribution files to verify"

          verified_count=0
          for file in dist/*.whl dist/*.tar.gz; do
            # Skip if no files match the pattern
            [[ -e "$file" ]] || continue

            filename=$(basename "$file")
            sig_file="signatures/${filename}.sig"
            crt_file="signatures/${filename}.crt"

            if [[ -f "$sig_file" && -f "$crt_file" ]]; then
              echo "✓ Verifying signature for core distribution file: $file"
              cosign verify-blob --certificate "$crt_file" --signature "$sig_file" \
                --certificate-identity-regexp "https://github.com/researchwiseai/pulse-py/.*" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                "$file"
              verified_count=$((verified_count + 1))
            else
              echo "✗ Missing signature files for core distribution: $file"
              exit 1
            fi
          done

          echo "Successfully verified $verified_count core distribution signatures"
          if [[ $verified_count -ne $dist_count ]]; then
            echo "✗ Signature verification count mismatch: expected $dist_count, verified $verified_count"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-artifacts
          path: |
            dist/
            signatures/
            sbom.cyclonedx.json
            build-provenance.json
          retention-days: 90

      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          attestations: true
          skip-existing: true

      - name: Create GitHub Release with Supply Chain Artifacts
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            signatures/*
            sbom.cyclonedx.json
            build-provenance.json
          body: |
            ## Changes

            This release includes changes automatically generated by Release Please based on conventional commits.

            For detailed change history, see [CHANGELOG.md](https://github.com/researchwiseai/pulse-py/blob/main/CHANGELOG.md).

            ## Installation
            ```bash
            pip install pulse-sdk==${{ github.ref_name }}
            ```

            ## Compliance & Verification

            ### 📋 Documentation
            - [Compliance Guide](https://github.com/researchwiseai/pulse-py/blob/main/COMPLIANCE.md)
            - [Security Policy](https://github.com/researchwiseai/pulse-py/blob/main/SECURITY.md)
            - [License Information](https://github.com/researchwiseai/pulse-py/blob/main/LICENSE)
            - [Third-Party Attributions](https://github.com/researchwiseai/pulse-py/blob/main/THIRD-PARTY-ATTRIBUTIONS.md)

            ### 🔐 Supply Chain Security
            - **SBOM**: `sbom.cyclonedx.json` (CycloneDX format)
            - **Build Provenance**: `build-provenance.json`
            - **Signatures**: Available for wheel and source distributions

            ### ✅ Verification
            ```bash
            # Verify package signature
            cosign verify-blob --certificate pulse_sdk-${{ github.ref_name }}-py3-none-any.whl.crt \\
              --signature pulse_sdk-${{ github.ref_name }}-py3-none-any.whl.sig \\
              --certificate-identity-regexp "https://github.com/researchwiseai/pulse-py/.*" \\
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \\
              pulse_sdk-${{ github.ref_name }}-py3-none-any.whl
            ```

            For detailed compliance information, see [COMPLIANCE.md](https://github.com/researchwiseai/pulse-py/blob/main/COMPLIANCE.md).
