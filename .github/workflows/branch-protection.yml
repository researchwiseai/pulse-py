name: Branch Protection Setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'update'
        type: choice
        options:
        - update
        - check

jobs:
  setup-branch-protection:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      administration: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Branch Protection Rules
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { owner, repo } = context.repo;

          // Define required status checks based on our CI workflow
          const requiredStatusChecks = [
            'test',  // The main CI job name
          ];

          const branchProtectionRules = {
            required_status_checks: {
              strict: true,
              contexts: requiredStatusChecks
            },
            enforce_admins: false,  // Allow admins to bypass for emergency fixes
            required_pull_request_reviews: {
              required_approving_review_count: 1,
              dismiss_stale_reviews: true,
              require_code_owner_reviews: false,
              require_last_push_approval: false
            },
            restrictions: null,  // No user/team restrictions
            allow_force_pushes: false,
            allow_deletions: false,
            block_creations: false,
            required_conversation_resolution: true
          };

          try {
            console.log('Updating branch protection rules for main branch...');

            await github.rest.repos.updateBranchProtection({
              owner,
              repo,
              branch: 'main',
              ...branchProtectionRules
            });

            console.log('✅ Branch protection rules updated successfully');
            console.log('Required status checks:', requiredStatusChecks);

          } catch (error) {
            console.error('❌ Failed to update branch protection rules:', error.message);

            // If we don't have admin permissions, just log the recommended settings
            if (error.status === 403) {
              console.log('ℹ️  Insufficient permissions to update branch protection rules');
              console.log('Please manually configure the following settings in GitHub:');
              console.log('1. Go to Settings > Branches');
              console.log('2. Add rule for main branch');
              console.log('3. Enable "Require status checks to pass before merging"');
              console.log('4. Add required status checks:', requiredStatusChecks.join(', '));
              console.log('5. Enable "Require branches to be up to date before merging"');
              console.log('6. Enable "Require pull request reviews before merging"');
              console.log('7. Enable "Dismiss stale pull request approvals when new commits are pushed"');
              console.log('8. Enable "Require conversation resolution before merging"');
            } else {
              throw error;
            }
          }
