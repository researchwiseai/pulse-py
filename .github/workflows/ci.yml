name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  # Gives the action the necessary permissions for publishing new
  # comments in pull requests.
  pull-requests: write
  # Gives the action the necessary permissions for pushing data to the
  # python-coverage-comment-action branch, and for editing existing
  # comments (to avoid publishing multiple comments in the same PR)
  contents: write
  # Required for uploading SARIF results to GitHub Security tab
  security-events: write
  # Required for checking out code and uploading artifacts
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    env:
      # Pulse client credentials from GitHub Secrets
      PULSE_CLIENT_ID: ${{ secrets.PULSE_CLIENT_ID }}
      PULSE_CLIENT_SECRET: ${{ secrets.PULSE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
          # Install bc for numerical comparisons in shell scripts
          sudo apt-get update && sudo apt-get install -y bc
      - name: Run tests with coverage
        run: |
          # Run tests with coverage, enforcing 60% threshold
          pytest
      - name: Black version
        run: black --version
      - name: Check Python formatting
        run: black --check .
      - name: Check Notebook formatting
        run: nbqa black --check .
      - name: Lint with Ruff
        run: ruff check pulse tests

      # Documentation testing
      - name: Install documentation dependencies
        run: |
          pip install requests markdown mkdocs mkdocs-material

      - name: Run Documentation Tests
        run: |
          echo "Running documentation validation..."

          # Run doctest validation on code examples
          python scripts/run_doctests.py --verbose

          # Validate quickstart guide completeness
          python scripts/validate_quickstart.py --verbose

          # Check links in documentation (skip external links in CI to avoid flakiness)
          python scripts/check_links.py --no-external --verbose

          # Validate documentation build
          python scripts/validate_docs.py --build-docs --verbose

          echo "✅ All documentation tests passed"

      - name: Validate Conventional Commits
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Configure the types of commits that are allowed
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Require a scope for certain types
          requireScope: false
          # Disable validation of the subject's case
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.

      # Security scanning using centralized action
      - name: Run Security Scans
        uses: ./.github/actions/security-scan
        with:
          severity-level: "medium"
          confidence-level: "medium"
          fail-on-high: "true"
          fail-on-critical-vulns: "true"

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.json
          retention-days: 30

      - name: Coverage Comment
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 70
          MINIMUM_ORANGE: 60

      - name: Upload Security Scan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-security-reports-${{ github.run_number }}
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 90

      # Final validation using centralized security analysis
      - name: Validate All Quality Gates
        run: |
          echo "🔍 Validating all quality gates..."

          # Use centralized security analysis script
          python scripts/security_config.py --fail-on-medium

          echo "✅ All quality gates passed!"
          echo "  - Code formatting: ✅"
          echo "  - Linting: ✅"
          echo "  - Security scanning: ✅"
          echo "  - Vulnerability scanning: ✅"
          echo "  - Test coverage: ✅"
          echo "  - Conventional commits: ✅"
