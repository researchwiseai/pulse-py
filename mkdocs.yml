site_name: Pulse SDK
repo_url: https://github.com/researchwiseai/pulse-py
docs_dir: docs
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - tables
nav:
  - Home: index.md
  - Core Client: core-client.md
  - Configuration: configuration.md
  - Authentication: authentication.md
  - Analyzer & Processes: analyzer.md
  - DSL Builder: dsl.md
  - Starters: starters.md
  - Data Models: models.md
  - Jobs & Errors: jobs-and-errors.md
